<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Isi - Analisis Bahasa Arab Al-Ushul At-Tsalatsah</title>
    
    <!-- Mengambil font Arab dari Google Fonts untuk tampilan Basmalah yang indah -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Dasar */
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f4f6f5; 
            color: #333; 
            margin: 0; 
            padding: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { 
            width: 100%;
            max-width: 800px; 
            margin: 20px; 
            padding: 40px; 
            background: #ffffff; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.08); 
            border-radius: 16px; 
            border-top: 6px solid #1a5632; /* Hijau Islami */
            box-sizing: border-box;
        }

        /* Bagian Header */
        .header { 
            text-align: center; 
            padding-bottom: 25px; 
            border-bottom: 2px dashed #d4af37; /* Aksen Emas */
            margin-bottom: 35px; 
        }

        .basmalah { 
            font-family: 'Amiri', serif; 
            font-size: 2.2rem; 
            color: #1a5632; 
            margin-bottom: 15px; 
            font-weight: 400;
        }

        .title { 
            font-size: 1.8rem; 
            color: #1a5632; 
            margin: 0; 
            font-weight: 600; 
            letter-spacing: 0.5px; 
        }

        .subtitle { 
            font-size: 1.1rem; 
            color: #666; 
            margin-top: 8px; 
        }

        /* Daftar Isi (List) */
        .list-container { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }

        .list-item { 
            margin-bottom: 16px; 
        }

        .list-link { 
            display: flex; 
            align-items: center; 
            padding: 16px 24px; 
            background: #fafafa; 
            border: 1px solid #eaeaea; 
            border-left: 5px solid #d4af37; 
            border-radius: 10px; 
            text-decoration: none; 
            color: #2c3e50; 
            font-weight: 600; 
            font-size: 1.1rem; 
            transition: all 0.3s ease; 
        }

        .list-link:hover { 
            transform: translateX(8px); 
            background: #f0f5f2; 
            border-left-color: #1a5632; 
            box-shadow: 0 5px 15px rgba(26, 86, 50, 0.1); 
            color: #1a5632; 
        }

        .icon { 
            margin-right: 15px; 
            font-size: 1.3rem; 
        }

        /* Bagian Footer */
        .footer { 
            text-align: center; 
            margin-top: 40px; 
            padding-top: 25px; 
            border-top: 1px solid #f0f0f0; 
        }

        .update-note { 
            font-weight: 600; 
            color: #d35400; 
            margin-bottom: 8px; 
            font-size: 1.05rem;
        }

        .doa { 
            font-style: italic; 
            color: #7f8c8d; 
            font-size: 0.95rem;
        }

        /* Responsivitas untuk layar HP */
        @media (max-width: 600px) {
            .container { 
                margin: 15px; 
                padding: 25px 20px; 
            }
            .title { font-size: 1.5rem; }
            .basmalah { font-size: 1.8rem; }
            .list-link { font-size: 1rem; padding: 14px 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="basmalah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
            <h1 class="title">Daftar Isi Analisis Bahasa Arab</h1>
            <p class="subtitle">Kitab Al-Ushul At-Tsalatsah</p>
        </div>

        <!-- Daftar Link -->
        <ul class="list-container">
            <li class="list-item">
                <a href="https://muin123-dr.github.io/Belajar/bhsArab/u-tsalasah001" class="list-link" target="_blank">
                    <span class="icon">📖</span> Kalimat 1
                </a>
            </li>
            <li class="list-item">
                <a href="https://muin123-dr.github.io/Belajar/bhsArab/u-tsalasah002" class="list-link" target="_blank">
                    <span class="icon">📖</span> Kalimat 2
                </a>
            </li>
            <li class="list-item">
                <a href="https://muin123-dr.github.io/Belajar/bhsArab/u-tsalasah003" class="list-link" target="_blank">
                    <span class="icon">📖</span> Kalimat 3
                </a>
            </li>
            <li class="list-item">
                <a href="https://muin123-dr.github.io/Belajar/bhsArab/u-tsalasah004" class="list-link" target="_blank">
                    <span class="icon">📖</span> Kalimat 4
                </a>
            </li>
            <li class="list-item">
                <a href="https://muin123-dr.github.io/Belajar/bhsArab/u-tsalasah005" class="list-link" target="_blank">
                    <span class="icon">📖</span> Kalimat 5
                </a>
            </li>
        </ul>

        <!-- Footer -->
        <div class="footer">
            <p class="update-note">⏳ Nantikan update selanjutnya...</p>
            <p class="doa">Semoga Alloh memudahkan.</p>
        </div>
    </div>

</body>
</html>
