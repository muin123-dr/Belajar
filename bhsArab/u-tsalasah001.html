<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis كِتَابُ ثَلَاثَةِ الْأُصُوْلِ - Lengkap</title>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fefaf2;
            --card-bg: #ffffff;
            --text: #3d2e1c;
            --accent: #2d6a4f;
            --gold: #b8860b;
            --gold-light: #fff8e7;
            --border: #e0d5c1;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
            --radius: 14px;
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
            --font-arabic: 'Scheherazade New', 'Traditional Arabic', 'Times New Roman', serif;
            --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
            line-height: 1.7;
            min-height: 100vh;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .header {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 22px 24px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid var(--border);
            position: relative;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2d6a4f, #b8860b, #2d6a4f);
            border-radius: 4px 4px 0 0;
        }
        .header h1 {
            font-size: 2.2rem;
            color: #2d6a4f;
            font-family: var(--font-arabic);
            font-weight: 700;
            margin-bottom: 4px;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: #6b5e4a;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .section-label {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #8b7355;
            margin-bottom: 10px;
            font-weight: 600;
            background: #f5efe4;
            padding: 4px 14px;
            border-radius: 20px;
        }
        .arabic-text {
            font-family: var(--font-arabic);
            font-size: 2.2rem;
            line-height: 2.4;
            text-align: center;
            color: #2c2416;
            direction: rtl;
            unicode-bidi: embed;
            word-spacing: 4px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            gap: 8px;
        }
        .word-unit {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 0 2px;
        }
        .word-arab {
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            font-family: var(--font-arabic);
            font-size: inherit;
            line-height: inherit;
            color: inherit;
            background: transparent;
        }
        .word-arab:hover {
            background: #fdf3d6;
            border-bottom-color: #b8860b;
            color: #5c3d0e;
        }
        .word-arab.active {
            background: #fde8b0;
            border-bottom-color: #b8860b;
            font-weight: 700;
            color: #3d2606;
            box-shadow: 0 0 0 4px rgba(184,134,11,0.15);
            border-radius: 8px;
        }
        .word-makna {
            font-size: 0.8rem;
            color: #5c4a2e;
            font-family: var(--font-ui);
            background: #fef9ef;
            border-radius: 4px;
            padding: 2px 6px;
            white-space: nowrap;
            margin-top: 2px;
            display: none;
            line-height: 1.3;
        }
        .show-makna .word-makna {
            display: inline-block;
        }
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border: 1.5px solid var(--border);
            background: #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: #4a3f2f;
            transition: var(--transition);
            font-family: var(--font-ui);
            user-select: none;
            white-space: nowrap;
        }
        .btn:hover {
            background: #faf6ef;
            border-color: #b8860b;
            color: #5c3d0e;
        }
        .btn.active-btn {
            background: #2d6a4f;
            color: #fff;
            border-color: #2d6a4f;
        }
        .analysis-panel,
        .translation-box,
        .structural-box {
            display: none;
            margin-top: 16px;
            background: #fdfcf9;
            border: 1.5px solid #e0d5c1;
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow-lg);
            animation: fadeSlide 0.3s ease;
            direction: ltr;
            text-align: left;
        }
        .analysis-panel.visible,
        .translation-box.visible,
        .structural-box.visible {
            display: block;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .analyzed-word {
            font-family: var(--font-arabic);
            font-size: 2.2rem;
            color: #2d6a4f;
            text-align: center;
            direction: rtl;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .makna-box {
            background: linear-gradient(135deg, #fff8e7, #fef3d0);
            border: 1px solid #e5d5a0;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 14px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #5c3d0e;
        }
        .makna-box .makna-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #a08040;
            display: block;
            margin-bottom: 3px;
            font-family: var(--font-ui);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        table th,
        table td {
            padding: 10px 12px;
            border: 1px solid #e8ddd0;
            vertical-align: top;
        }
        table th {
            background: #faf5eb;
            font-weight: 700;
            color: #5c4520;
            white-space: nowrap;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .close-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 18px;
            background: #f5efe4;
            border: 1px solid #d5c8b0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: #5c4520;
            transition: var(--transition);
        }
        .close-btn:hover { background: #e8ddd0; }
        .hint {
            font-size: 0.8rem;
            color: #a09080;
            text-align: center;
            margin-top: 8px;
            font-style: italic;
        }
        .structural-box {
            max-height: 70vh;
            overflow-y: auto;
            padding: 20px;
            line-height: 1.8;
        }
        .structural-box h2 {
            color: #2d6a4f;
            margin: 20px 0 10px;
            font-size: 1.3rem;
        }
        .structural-box h3 {
            color: #2d6a4f;
            margin: 16px 0 6px;
            font-size: 1.1rem;
        }
        .structural-box h4 {
            color: #5c4520;
            margin: 12px 0 4px;
        }
        .structural-box p,
        .structural-box li {
            margin-bottom: 10px;
        }
        .structural-box ul,
        .structural-box ol {
            padding-left: 20px;
            margin-bottom: 12px;
        }
        .structural-box strong {
            color: #5c3d0e;
        }
        .structural-box em {
            font-style: italic;
            color: #3d2e1c;
        }

        @media (max-width: 600px) {
            .arabic-text { font-size: 1.6rem; gap: 4px; }
            .btn { padding: 8px 14px; font-size: 0.8rem; }
            .analyzed-word { font-size: 1.8rem; }
            table { font-size: 0.8rem; }
            table th, table td { padding: 6px 8px; }
            .structural-box { max-height: 60vh; padding: 15px; }
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="header">
        <h1>كِتَابُ ثَلَاثَةِ الْأُصُوْلِ</h1>
        <p class="subtitle">Analisis Nahwu, Sharaf, I'rob & Balaghah</p>
    </div>

    <div class="card" id="mainCard">
        <span class="section-label">📜 Teks Arab</span>
        <div class="arabic-text" id="arabicText"></div>
        <p class="hint">👆 Klik/tap setiap kata untuk melihat makna & analisis lengkap</p>

        <div class="btn-row">
            <button class="btn" id="btnMakna" onclick="toggleMakna()">📝 Makna Perkata</button>
            <button class="btn" id="btnTranslation" onclick="toggleTranslation()">🌐 Terjemahan</button>
            <button class="btn" id="btnStructural" onclick="toggleStructural()">📚 Penjelasan Struktural & Balaghah</button>
            <button class="btn" id="btnReset" onclick="resetAll()">🔄 Reset</button>
        </div>

        <!-- Panel Analisis Kata -->
        <div class="analysis-panel" id="analysisPanel">
            <div class="analyzed-word" id="analyzedWordDisplay"></div>
            <div class="makna-box">
                <span class="makna-label">📌 Makna</span>
                <span id="maknaText"></span>
            </div>
            <div id="analysisContent"></div>
            <button class="close-btn" onclick="closeAnalysis()">✕ Tutup Analisis</button>
        </div>

        <!-- Panel Terjemahan -->
        <div class="translation-box" id="translationBox">
            <strong>📝 Terjemahan:</strong><br><br>
            <span style="font-size:1.5rem;font-family:var(--font-arabic);">كِتَابُ ثَلَاثَةِ الْأُصُوْلِ</span><br><br>
            <em>"Kitab Tiga Landasan"</em> atau <em>"Kitab Tiga Pokok"</em>.
        </div>

        <!-- Panel Penjelasan Struktural & Balaghah -->
        <div class="structural-box" id="structuralBox"></div>
    </div>
</div>

<script>
    // Data analisis per kata
    const analysisData = {
        'k_kitab': {
            word: 'كِتَابُ',
            makna: 'Kitab / Buku',
            sharaf: 'Isim Jāmid (kata benda konkret), mudzakkar, mufrad. Akar: ك-ت-ب. Wazan: <strong>فِعَالٌ</strong> (fi‘ālun). Meskipun historisnya dari mashdar, kini menjadi nama benda (isim dzāt).',
            irob: 'Marfū‘ (dhammah ẓāhirah). Tidak bertanwin karena sebagai Mudhāf.',
            nahwu: '<strong>Khabar</strong> dari Mubtada’ mahdzūf (taqdīr: هٰذَا). Sekaligus <strong>Mudhāf</strong>.'
        },
        'k_tsalatsah': {
            word: 'ثَلَاثَةِ',
            makna: 'Tiga (bilangan)',
            sharaf: 'Isim ‘Adad (bilangan pokok), <strong>mu’annats</strong> (feminin) ditandai Ta’ Marbuthah. Akar: ث-ل-ث. Wazan: فَعَالَةٌ (fa‘ālatun).',
            irob: 'Majrūr (kasrah ẓāhirah). Tanpa tanwin dan tanpa Alif-Lam karena menjadi Mudhāf.',
            nahwu: '<strong>Mudhāf Ilaih</strong> dari كِتَابُ, sekaligus <strong>Mudhāf</strong> bagi الْأُصُوْلِ.'
        },
        'k_ushul': {
            word: 'الْأُصُوْلِ',
            makna: 'Landasan-landasan',
            sharaf: 'Jamak taksīr dari أَصْل (mudzakkar). Akar: أ-ص-ل. Wazan jamak: <strong>فُعُوْلٌ</strong> (fu‘ūlun). Makrifat dengan Alif-Lam.',
            irob: 'Majrūr (kasrah ẓāhirah).',
            nahwu: '<strong>Mudhāf Ilaih</strong> dari ثَلَاثَةِ, serta berstatus sebagai <strong>Ma‘dūd</strong> (benda yang dihitung).'
        }
    };

    const arabicWords = [
        { id: 'k_kitab', text: 'كِتَابُ', spacerAfter: ' ' },
        { id: 'k_tsalatsah', text: 'ثَلَاثَةِ', spacerAfter: ' ' },
        { id: 'k_ushul', text: 'الْأُصُوْلِ', spacerAfter: '' }
    ];

    let showMakna = false;
    let currentlyActiveSpan = null;

    function renderArabicText() {
        const container = document.getElementById('arabicText');
        container.innerHTML = '';
        if (showMakna) {
            container.classList.add('show-makna');
        } else {
            container.classList.remove('show-makna');
        }
        arabicWords.forEach(item => {
            const unit = document.createElement('span');
            unit.className = 'word-unit';

            const wordSpan = document.createElement('span');
            wordSpan.className = 'word-arab';
            wordSpan.textContent = item.text;
            wordSpan.dataset.analysisId = item.id;
            wordSpan.addEventListener('click', function(e) {
                e.stopPropagation();
                showAnalysis(item.id, wordSpan);
            });
            wordSpan.title = 'Klik untuk analisis';

            const maknaSpan = document.createElement('span');
            maknaSpan.className = 'word-makna';
            maknaSpan.textContent = analysisData[item.id]?.makna || '—';

            unit.appendChild(wordSpan);
            unit.appendChild(maknaSpan);
            container.appendChild(unit);

            if (item.spacerAfter) {
                container.appendChild(document.createTextNode(item.spacerAfter));
            }
        });
    }

    function toggleMakna() {
        showMakna = !showMakna;
        const btn = document.getElementById('btnMakna');
        if (showMakna) {
            btn.classList.add('active-btn');
            btn.innerHTML = '📝 Sembunyikan Makna';
        } else {
            btn.classList.remove('active-btn');
            btn.innerHTML = '📝 Makna Perkata';
        }
        renderArabicText();
        if (document.getElementById('analysisPanel').classList.contains('visible')) {
            closeAnalysis();
        }
    }

    function showAnalysis(id, spanEl) {
        const data = analysisData[id];
        if (!data) return;
        if (currentlyActiveSpan) {
            currentlyActiveSpan.classList.remove('active');
        }
        spanEl.classList.add('active');
        currentlyActiveSpan = spanEl;

        document.getElementById('analyzedWordDisplay').textContent = data.word;
        document.getElementById('maknaText').textContent = data.makna;
        document.getElementById('analysisContent').innerHTML = `
            <table>
                <tr><th>📐 Sharaf (Bentuk Kata)</th><td>${data.sharaf}</td></tr>
                <tr><th>📏 I'rob (Kondisi Akhir)</th><td>${data.irob}</td></tr>
                <tr><th>🧩 Nahwu (Fungsi)</th><td>${data.nahwu}</td></tr>
            </table>
        `;
        const panel = document.getElementById('analysisPanel');
        panel.classList.add('visible');
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closeAnalysis() {
        document.getElementById('analysisPanel').classList.remove('visible');
        if (currentlyActiveSpan) {
            currentlyActiveSpan.classList.remove('active');
            currentlyActiveSpan = null;
        }
        document.getElementById('analyzedWordDisplay').textContent = '';
        document.getElementById('maknaText').textContent = '';
        document.getElementById('analysisContent').innerHTML = '<p style="text-align:center;color:#999;">Klik kata di atas untuk analisis.</p>';
    }

    function toggleTranslation() {
        const box = document.getElementById('translationBox');
        const btn = document.getElementById('btnTranslation');
        box.classList.toggle('visible');
        btn.classList.toggle('active-btn');
        if (box.classList.contains('visible')) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function toggleStructural() {
        const box = document.getElementById('structuralBox');
        const btn = document.getElementById('btnStructural');
        box.classList.toggle('visible');
        btn.classList.toggle('active-btn');
        if (box.classList.contains('visible')) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function resetAll() {
        closeAnalysis();
        document.getElementById('translationBox').classList.remove('visible');
        document.getElementById('btnTranslation').classList.remove('active-btn');
        document.getElementById('structuralBox').classList.remove('visible');
        document.getElementById('btnStructural').classList.remove('active-btn');
        if (showMakna) {
            toggleMakna();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Muat konten artikel struktural (lengkap dengan Balaghah sesuai teks baru)
    function loadStructuralContent() {
        const box = document.getElementById('structuralBox');
        box.innerHTML = `
        <h2>Analisis كِتَابُ ثَلَاثَةِ الْأُصُوْلِ</h2>
        
        <h3>Pendahuluan</h3>
        <p>Di antara judul kitab yang paling dikenal dalam khazanah Islam adalah <strong>كِتَابُ ثَلَاثَةِ الْأُصُوْلِ</strong> (<em>Kitābu Tsalātsati al-Uṣūl</em>) karya Syaikhul Islam Muhammad bin Abdul Wahhab <em>raḥimahullāh</em>.</p>
        <p>Sekilas, judul ini hanya terdiri atas tiga kata. Akan tetapi, apabila ditinjau dari ilmu <strong>Nahwu</strong>, <strong>Sharaf</strong>, <strong>Balaghah</strong>, dan <strong>kaidah bilangan</strong> (<em>al-‘adad wa al-ma‘dūd</em>), ternyata setiap katanya menyimpan pelajaran yang sangat kaya. Bahkan, melalui tiga kata ini seorang pelajar dapat mempelajari berbagai bab penting dalam tata bahasa Arab sekaligus, seperti:</p>
        <ul>
            <li>Analisis morfologi (Sharaf)</li>
            <li>Analisis i‘rāb (Nahwu)</li>
            <li>Idhāfah bertingkat</li>
            <li>Status ma‘rifah dan nakirah</li>
            <li>Kaidah bilangan 3–10</li>
            <li>Perbedaan Idhāfah dan Na‘at-Man‘ūt</li>
            <li>Analisis judul kitab dalam bahasa Arab</li>
            <li>Nuansa makna (Balaghah)</li>
        </ul>
        <p>Artikel ini berusaha menghimpun seluruh pembahasan tersebut secara sistematis sehingga mudah dipahami oleh pemula sekaligus tetap memiliki kedalaman ilmiah.</p>

        <h3>I. Makna Frasa Secara Keseluruhan</h3>
        <p><strong>كِتَابُ ثَلَاثَةِ الْأُصُوْلِ</strong> secara harfiah berarti <strong>“Kitab Tiga Landasan”</strong> atau lebih tepat dipahami sebagai <strong>“Kitab yang membahas tiga landasan pokok.”</strong></p>
        <p>Yang dimaksud tiga landasan tersebut ialah:</p>
        <ol>
            <li>Mengenal Allah (<em>ma‘rifatullāh</em>)</li>
            <li>Mengenal Nabi Muhammad ﷺ (<em>ma‘rifat an-nabiyy</em>)</li>
            <li>Mengenal agama Islam beserta dalil-dalilnya (<em>ma‘rifat dīn al-Islām bi al-adillah</em>)</li>
        </ol>
        <p>Ketiga perkara inilah yang menjadi fondasi keimanan seorang muslim.</p>

        <h3>II. Analisis Per Kata</h3>
        <h4>1. كِتَابُ</h4>
        <p><strong>⭐ Makna:</strong> Kitab, buku, kumpulan tulisan.</p>
        <p><strong>⭐ Analisis Sharaf:</strong><br>
        🔹 Jenis kata: Isim Jāmid (اسم جامد). <br>Artinya, pada pemakaiannya sekarang kata ini telah menjadi nama benda yang berdiri sendiri. Memang secara historis ia berasal dari akar kata ك-ت-ب yang berarti “menulis”. <br>Namun dalam penggunaannya sekarang ia bukan lagi menunjukkan aktivitas menulis, melainkan benda konkret berupa buku. Oleh karena itu ia digolongkan sebagai <em>isim jāmid</em>.<br>
        🔹 Akar kata: ك-ت-ب<br>
        🔹 Wazan: <strong>فِعَالٌ</strong> (fi‘āl), <strong>bukan</strong> فَعَال. Ini merupakan koreksi penting karena masih sering terjadi kekeliruan. Contoh lain dengan pola yang sama: حِسَاب، سِلَاح، كِتَاب.</p>
        <p><strong>⭐ I‘rāb:</strong> Marfū‘ (tanda rafa‘: <em>ḍammah ẓāhirah</em> — كِتَابُ).</p>
        <p><strong>⭐ Kedudukan Nahwu:</strong> Memiliki dua kedudukan sekaligus. Pertama, <strong>Khabar</strong> bagi mubtada’ yang dibuang (taqdīr: هٰذَا). Kedua, <strong>Mudhāf</strong> karena disandarkan kepada kata sesudahnya.</p>

        <h4>2. ثَلَاثَةِ</h4>
        <p><strong>⭐ Makna:</strong> Tiga.</p>
        <p><strong>⭐ Analisis Sharaf:</strong><br>
        🔹 Jenis kata: Isim ‘Adad (kata bilangan).<br>
        🔹 Akar kata: ث-ل-ث<br>
        🔹 Berjenis: <strong>Muannats</strong> (feminin), ditandai dengan adanya <strong>ة</strong> (tā’ marbūṭah).<br>
        🔹 Wazan: Secara umum mengikuti pola <strong>فَعَالَة</strong> (fa‘ālah), walaupun kata bilangan memiliki karakteristik tersendiri dan tidak dibahas sebagaimana mashdar biasa.</p>
        <p><strong>Mengapa Berbentuk Muannats?</strong> Karena <em>ma‘dūd</em>-nya adalah <strong>أَصْل</strong> yang berjenis <em>mudzakkar</em>. Dalam kaidah angka 3–10 berlaku hukum terkenal: <strong>العدد يخالف المعدود</strong> (<em>“Bilangan harus berbeda jenis dengan benda yang dihitung.”</em>) Karena <strong>أَصْل</strong> adalah <em>mudzakkar</em>, maka angkanya harus berbentuk <em>muannats</em>: ثَلَاثَة.</p>
        <p><strong>⭐ I‘rāb:</strong> Majrūr dengan <em>kasrah</em>. Mengapa? Karena menjadi <em>Mudhāf Ilaih</em> dari <strong>كِتَاب</strong>.</p>
        <p><strong>⭐ Kedudukan Nahwu:</strong> Sangat menarik karena memiliki dua jabatan sekaligus: Sebagai <strong>Mudhāf Ilaih</strong> bagi كِتَاب, dan sekaligus menjadi <strong>Mudhāf</strong> bagi الْأُصُوْل.</p>

        <h4>3. الْأُصُوْلِ</h4>
        <p><strong>⭐ Makna:</strong> Pokok-pokok, landasan-landasan, fondasi-fondasi.</p>
        <p><strong>⭐ Analisis Sharaf:</strong><br>
        🔹 Merupakan <strong>Jamak Taksīr</strong> dari <strong>أَصْل</strong>.<br>
        🔹 Akar kata: أ-ص-ل<br>
        🔹 Wazan jamak: <strong>فُعُوْل</strong> (fu‘ūl). Contoh serupa: فَلْس ← فُلُوْس، دَرْس ← دُرُوْس، أَصْل ← أُصُوْل.<br>
        🔹 Status: Isim, jamak taksīr, mudzakkar, <strong>ma‘rifah</strong> karena memakai <strong>ال</strong>.</p>
        <p><strong>⭐ I‘rāb:</strong> Majrūr dengan <em>kasrah</em>, karena menjadi <em>Mudhāf Ilaih</em> dari <strong>ثَلَاثَة</strong>. Sekaligus berfungsi sebagai <strong>Ma‘dūd</strong> (benda yang dihitung).</p>

        <h3>III. Analisis Nahwu Keseluruhan</h3>
        <h4>A. Idhāfah Bertingkat (Tadākhul al-Iḍāfah)</h4>
        <p>Susunan lengkapnya adalah: <strong>كِتَابُ ← ثَلَاثَةِ ← الْأُصُوْلِ</strong>. <br>Terdapat <strong>dua idhāfah</strong> yang saling bertingkat: Idhāfah pertama (كِتَاب + ثَلَاثَةِ الْأُصُوْلِ) dan Idhāfah kedua (ثَلَاثَة + الْأُصُوْلِ). Karena itulah struktur ini dinamakan <strong>Idhāfah Bertingkat</strong> (<em>tadākhul al-iḍāfah</em>).</p>

        <h4>B. Mengapa كِتَابُ Dibaca Marfū‘?</h4>
        <p>Banyak pelajar mengira <strong>كِتَابُ</strong> adalah <em>mubtada’</em>. Padahal bukan. <br>Judul kitab bukanlah <em>jumlah sempurna</em> (kalimat utuh). Kalau hanya mengatakan “Kitab Tiga Landasan”, pendengar belum memperoleh kalimat lengkap. Karena itu ulama Nahwu menetapkan adanya <em>mubtada’</em> yang dibuang (<em>mahdhūf</em>). <strong>Taqdīr-nya</strong> ialah: <strong>هٰذَا كِتَابُ ثَلَاثَةِ الْأُصُوْلِ</strong> (“Ini adalah Kitab Tiga Landasan”). Dengan demikian: <strong>هٰذَا</strong> adalah Mubtada’ (subjek) dan <strong>كِتَابُ</strong> adalah Khabar (predikat). Inilah sebabnya <strong>كِتَابُ</strong> dibaca <em>marfū‘</em>.</p>

        <h4>C. Mengapa Tidak Bertanwin?</h4>
        <p>Normalnya kata tersebut adalah <strong>كِتَابٌ</strong> (dengan tanwin). <br>Namun karena menjadi <strong>Mudhāf</strong>, tanwin wajib dihilangkan. Demikian pula <strong>ثَلَاثَةِ</strong> — seharusnya bisa menjadi ثَلَاثَةٌ / ثَلَاثَةً / ثَلَاثَةٍ, tetapi karena juga menjadi <strong>Mudhāf</strong>, tanwinnya dihapus. Kaidahnya: <strong>كل مضاف يمتنع من التنوين</strong> (<em>“Setiap mudhāf tidak boleh bertanwin.”</em>)</p>

        <h4>D. Mengapa Tidak Memakai Alif-Lam (ال)?</h4>
        <p>Mengapa tidak ditulis <strong>الْكِتَابُ الثَّلَاثَةُ الْأُصُوْلِ</strong> atau <strong>كِتَابُ الثَّلَاثَةِ الْأُصُوْلِ</strong>? <br>Karena dalam idhāfah berlaku kaidah: Mudhāf tidak boleh memakai <em>alif-lām</em> apabila kemakrifatannya diperoleh melalui idhāfah. Kata tengah dalam rantai idhāfah juga tidak boleh memakai <em>alif-lām</em>. Oleh sebab itu bentuk yang benar adalah <strong>كِتَابُ ثَلَاثَةِ الْأُصُوْلِ</strong>, bukan <strong>كِتَابُ الثَّلَاثَةِ الْأُصُوْلِ</strong>.</p>

        <h4>E. Status Makrifat Seluruh Frasa</h4>
        <p>Ini termasuk pembahasan yang sering terlupakan. Pada asalnya: <strong>كِتَابُ</strong> adalah nakirah, <strong>ثَلَاثَةِ</strong> adalah nakirah. Yang makrifat hanyalah <strong>الْأُصُوْلِ</strong> karena memakai <em>alif-lām</em>. <br>Namun dalam idhāfah berlaku kaidah:<br> <strong>الإضافة إلى المعرفة تفيد التعريف</strong> <br>(<em>“Menyandarkan kata nakirah kepada kata makrifat akan menjadikannya ikut makrifat.”</em>) Kemakrifatan mengalir dari belakang ke depan: <strong>الْأُصُوْلِ</strong> (↓) <strong>ثَلَاثَةِ</strong> (↓) <strong>كِتَابُ</strong>. Akibatnya <strong>seluruh frasa menjadi makrifat</strong>. Artinya frasa ini tidak lagi bermakna “sebuah kitab tentang tiga landasan”, melainkan <strong>“Kitab Tiga Landasan”</strong> — yakni nama sebuah kitab tertentu.</p>

        <h4>F. Kaidah Bilangan 3–10 dalam Susunan Idhāfah</h4>
        <p>Frasa <strong>ثَلَاثَةِ الْأُصُوْلِ</strong> menerapkan dua hukum penting: <br>(1) Bilangan harus berbeda jenis dengan ma‘dūd. Karena <strong>أَصْل</strong> (mufrad) adalah <em>mudzakkar</em>, maka digunakan <strong>ثَلَاثَة</strong> yang <em>muannats</em>. <br>(2) Ma‘dūd harus jamak dan majrūr. Karena itu digunakan <strong>الْأُصُوْلِ</strong> (jamak, majrūr), bukan <em>al-aṣl</em> (tunggal) dan bukan <em>al-uṣūlu</em> (marfū‘). Inilah bentuk baku bilangan 3–10 ketika angka disebut di depan.</p>

        <h4>G. Mengapa Disusun Sebagai Idhāfah dan Bukan Na‘at?</h4>
        <p>Secara tata bahasa, <strong>keduanya benar</strong>. Namun masing-masing memiliki karakteristik berbeda: <strong>ثَلَاثَةُ الْأُصُوْلِ</strong> (Idhāfah) angka di depan, fokus pada kuantitas, lebih ringkas, padat, menyatu, dan lazim dipakai dalam judul kitab klasik. <strong>الْأُصُوْلُ الثَّلَاثَةُ</strong> (Na‘at-Man‘ūt) benda di depan, fokus pada esensi benda, angka sebagai sifat mengikuti i‘rāb dan kemakrifatan benda. Pemilihan idhāfah menjadikan judul terdengar lebih formal, khas tradisi <em>turāts</em>, dan “Tiga Landasan” pun segera terpatri sebagai satu kesatuan konsep.</p>

        <h3>IV. Analisis Balaghah Frasa كِتَابُ ثَلَاثَةِ الْأُصُوْلِ</h3>
        <p><strong>Pendahuluan</strong></p>
        <p>Balaghah adalah ilmu yang membahas bagaimana suatu makna disampaikan dengan ungkapan yang paling tepat, indah, dan efektif sesuai dengan tujuan pembicara. Dalam balaghah, sebuah susunan kata dinilai bukan hanya dari benar atau salah menurut kaidah Nahwu dan Sharaf, tetapi juga dari nilai retorika (بلاغة), keindahan (جمال), penekanan makna (توكيد), dan kesesuaian dengan konteks (مقتضى الحال).</p>
        <p>Judul كِتَابُ ثَلَاثَةِ الْأُصُولِ merupakan contoh yang menarik. Walaupun hanya terdiri dari tiga kata, penyusunannya mengandung beberapa aspek balaghah yang membuatnya ringkas, kuat, mudah diingat, dan sarat makna.</p>

        <h4>I. Ijaz (الإيجاز): Ringkas tetapi Padat Makna</h4>
        <p>Aspek balaghah yang paling menonjol pada judul ini adalah Ijaz, yaitu menyampaikan makna yang luas dengan lafaz yang sedikit. Hanya dengan tiga kata: <strong>كِتَابُ ثَلَاثَةِ الْأُصُولِ</strong> pembaca langsung memahami bahwa kitab tersebut membahas tiga pokok utama agama. Padahal apabila dijelaskan secara lengkap, maknanya dapat berbunyi: <em>هذا كتاب يشتمل على بيان الأصول الثلاثة التي يجب على كل مسلم معرفتها.</em> ("Ini adalah sebuah kitab yang berisi penjelasan tentang tiga landasan yang wajib diketahui oleh setiap muslim.") Kalimat lengkap tersebut terdiri atas banyak kata. Namun pengarang cukup menulis tiga kata saja tanpa mengurangi pemahaman pembaca. Inilah hakikat Ijaz.</p>

        <h4>II. Hadzf (الحذف): Keindahan melalui Penghilangan</h4>
        <p>Balaghah sangat menghargai penghilangan kata apabila maknanya tetap dapat dipahami. Pada judul ini terdapat beberapa bentuk hadzf.<br>
        1. <strong>Penghilangan Mubtada'</strong>. Secara nahwu ditakdirkan: <strong>هٰذَا كِتَابُ ثَلَاثَةِ الْأُصُولِ</strong>. Namun kata هٰذَا tidak ditulis. Penghilangan ini membuat judul menjadi lebih singkat dan lebih elegan.<br>
        2. <strong>Penghilangan Huruf Jar</strong>. Makna sebenarnya bukan sekadar "Kitab tiga landasan", melainkan "Kitab tentang tiga landasan". Huruf jar seperti <strong>في</strong> atau <strong>في بيان</strong> tidak disebutkan. Pembaca otomatis memahaminya.<br>
        3. <strong>Penghilangan Keterangan yang Panjang</strong>. Judul ini tidak menjelaskan: tiga landasan apa, mengapa tiga, siapa yang harus mempelajarinya, apa manfaatnya. Semua itu sengaja tidak disebutkan karena akan diterangkan di dalam isi kitab. Ini merupakan salah satu bentuk ijaz yang sangat indah.</p>

        <h4>III. Idhafah Memberikan Hubungan yang Sangat Erat</h4>
        <p>Dalam balaghah, idhafah bukan sekadar hubungan kepemilikan. Idhafah sering menunjukkan hubungan yang sangat kuat antara dua kata. Pada frasa <strong>ثَلَاثَةِ الْأُصُولِ</strong> angka "tiga" bukan hanya menunjukkan jumlah. Ia menjadi bagian dari identitas pokok tersebut. Karena itu pembaca tidak menangkap makna: "Landasan yang kebetulan jumlahnya tiga." melainkan "Tiga landasan yang merupakan satu konsep utuh." Angka "tiga" telah menyatu dengan istilah "ushul".</p>

        <h4>IV. Mengapa Tidak Menggunakan Na'at?</h4>
        <p>Misalnya ditulis <strong>الْأُصُولُ الثَّلَاثَةُ</strong>. Secara nahwu juga benar. Namun dari sisi balaghah terdapat sedikit perbedaan. Jika menggunakan Idhafah <strong>ثَلَاثَةُ الْأُصُولِ</strong> kesannya lebih menyatu. "Tiga Landasan" dipahami sebagai satu istilah. Jika menggunakan Na'at <strong>الْأُصُولُ الثَّلَاثَةُ</strong> kesannya lebih deskriptif. Artinya menjadi: "Landasan-landasan yang berjumlah tiga." Secara makna memang sama. Namun idhafah lebih mudah berubah menjadi nama atau istilah. Karena itulah banyak judul kitab menggunakan idhafah.</p>

        <h4>V. Taqdim wa Ta'khir (تقديم وتأخير)</h4>
        <p>Mengapa angka diletakkan di depan? Mengapa tidak: <strong>الأصول الثلاثة</strong>? Padahal secara bahasa keduanya boleh. Dalam balaghah, mendahulukan suatu unsur biasanya menunjukkan perhatian khusus terhadap unsur tersebut. Dengan menulis <strong>ثلاثة الأصول</strong> pembaca sejak awal langsung mengetahui bahwa kitab ini membahas tiga pokok. Jumlahnya menjadi perhatian pertama. Sedangkan bila ditulis <strong>الأصول الثلاثة</strong> yang lebih dahulu menjadi perhatian adalah kata "ushul". Dengan demikian, urutan kata ikut memengaruhi titik fokus pembaca.</p>

        <h4>VI. Kemakrifatan Bertingkat</h4>
        <p>Dalam ilmu Nahwu dijelaskan bahwa kemakrifatan mengalir melalui idhafah. Namun dari sisi balaghah, hal ini juga menghasilkan efek retoris. Kata <strong>الأصول</strong> yang sudah makrifat menjadikan <strong>ثلاثة</strong> ikut makrifat. Kemudian <strong>كتاب</strong> juga menjadi makrifat. Akibatnya seluruh frasa berubah menjadi sebuah nama yang spesifik. Pembaca tidak lagi memahami: "Sebuah kitab" tetapi langsung memahami: "Kitab yang terkenal itu." Dengan kata lain, idhafah mengubah frasa biasa menjadi sebuah judul resmi.</p>

        <h4>VII. Kekuatan Lafaz "أصول"</h4>
        <p>Mengapa pengarang memilih kata <strong>أصول</strong> dan bukan <strong>أساس</strong> atau <strong>دعائم</strong>? Padahal semuanya dapat diterjemahkan sebagai "dasar". Dari sisi balaghah terdapat perbedaan makna. <strong>أصل</strong> berarti akar, pangkal, fondasi yang menjadi asal segala sesuatu. <strong>أساس</strong> lebih dekat kepada fondasi bangunan. <strong>دعامة</strong> lebih dekat kepada tiang penyangga. Kata <strong>أصول</strong> lebih luas maknanya. Ia mencakup: akar, sumber, pangkal, dasar, fondasi. Karena itulah istilah <strong>أصول الفقه، أصول الدين، أصول الحديث</strong> menggunakan kata <strong>أصول</strong>, bukan <strong>أساس</strong>. Pilihan diksi ini memberikan keluasan makna yang tidak dimiliki sinonim lainnya.</p>

        <h4>VIII. Kesesuaian Bunyi (الفاصلة الصوتية)</h4>
        <p>Walaupun bukan syair, susunan ini mempunyai irama yang ringan. Perhatikan bunyinya: <strong>كِتَابُ – ثَلَاثَةِ – الْأُصُولِ</strong>. Setiap kata terdiri atas suku kata yang seimbang. Perpindahan harakatnya juga lembut. Tidak ada rangkaian huruf yang berat diucapkan. Akibatnya judul mudah dihafal. Hal ini merupakan salah satu bentuk keindahan fonetis (الجمال الصوتي).</p>

        <h4>IX. Kesan Psikologis Angka Tiga</h4>
        <p>Dalam retorika Arab, angka kecil sering digunakan untuk menunjukkan bahwa sesuatu mudah dipelajari dan tidak memberatkan. Ketika seseorang membaca <strong>ثلاثة الأصول</strong> ia segera memperoleh kesan: "Hanya ada tiga pokok." Secara psikologis, hal ini mendorong minat untuk mempelajarinya. Andaikan judulnya berbunyi: <strong>خمسون أصلاً</strong> (Lima puluh landasan) kesan pertama yang muncul adalah materi yang berat. Pemilihan angka tiga menjadikan judul terasa sederhana, terjangkau, dan mudah diingat.</p>

        <h4>X. Judul Sebagai Nama Ilmiah</h4>
        <p>Dalam balaghah terdapat perbedaan antara: judul yang bersifat deskriptif, dan judul yang berubah menjadi nama ilmiah (علم بالغلبة). Karena penggunaan yang sangat luas selama berabad-abad, frasa <strong>ثلاثة الأصول</strong> bahkan <strong>كتاب ثلاثة الأصول</strong> tidak lagi dipahami sekadar sebagai "kitab yang membahas tiga landasan", tetapi telah menjadi nama khusus sebuah karya ilmiah yang langsung mengingatkan para penuntut ilmu kepada kitab karya Syaikh Muhammad bin Abdul Wahhab. Fenomena seperti ini disebut oleh para ulama sebagai 'alam bi al-ghalabah, yaitu suatu ungkapan yang karena sangat masyhur akhirnya berfungsi sebagai nama diri.</p>

        <h4>XI. Kesimpulan Balaghah</h4>
        <p>Frasa كِتَابُ ثَلَاثَةِ الْأُصُولِ merupakan contoh susunan yang sangat indah dari sisi balaghah. Keindahannya tampak pada beberapa aspek sekaligus:</p>
        <ul>
            <li><strong>Ijaz (الإيجاز):</strong> hanya tiga kata, tetapi mengandung makna yang sangat luas.</li>
            <li><strong>Hadzf (الحذف):</strong> beberapa unsur sengaja dihilangkan tanpa mengurangi pemahaman.</li>
            <li><strong>Idhafah (الإضافة):</strong> menjadikan "Tiga Landasan" sebagai satu konsep yang utuh dan mudah berubah menjadi istilah.</li>
            <li><strong>Taqdim (التقديم):</strong> mendahulukan angka memberi penekanan bahwa jumlah landasan itu hanya tiga.</li>
            <li><strong>Kemakrifatan bertingkat:</strong> seluruh frasa menjadi nama yang spesifik melalui rantai idhafah.</li>
            <li><strong>Ketepatan diksi:</strong> pemilihan kata أصول memberikan makna yang lebih luas dan lebih ilmiah daripada sinonim-sinonimnya.</li>
            <li><strong>Keindahan bunyi:</strong> susunan kata memiliki irama yang ringan sehingga mudah diucapkan dan dihafal.</li>
            <li><strong>Efek psikologis:</strong> angka tiga memberi kesan ringkas, mendasar, dan mudah dipelajari.</li>
        </ul>
        <p>Seluruh aspek tersebut menunjukkan bahwa judul كِتَابُ ثَلَاثَةِ الْأُصُولِ bukan sekadar susunan yang benar menurut kaidah Nahwu dan Sharaf, tetapi juga merupakan susunan yang sangat efektif, elegan, dan kaya nilai retorika. Hal ini mencerminkan salah satu ciri khas bahasa Arab klasik: pemilihan kata yang singkat, tetapi mampu memuat makna yang luas dan mendalam.</p>

        <h3>Penutup</h3>
        <p>Melalui analisis di atas, kita dapat melihat betapa kayanya bahasa Arab dalam menuangkan makna yang dalam hanya melalui tiga kata. Judul <strong>كِتَابُ ثَلَاثَةِ الْأُصُوْلِ</strong> tidak hanya menyampaikan informasi, tetapi juga mengandung keindahan struktur, ketepatan diksi, dan kekuatan retorika yang membuatnya abadi dalam khazanah keilmuan Islam. Semoga analisis ini bermanfaat bagi para pelajar yang ingin mendalami bahasa Arab secara lebih komprehensif.</p>
