<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Quiz TKA Bahasa Indonesia - Evaluasi & Apresiasi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

  :root {
    --primary: #6C63FF;
    --primary-light: #8B85FF;
    --success: #00C853;
    --success-bg: #E8F5E9;
    --danger: #FF5252;
    --danger-bg: #FFEBEE;
    --warning: #FFB300;
    --bg: #F0F2FF;
    --card: #FFFFFF;
    --text: #2D3436;
    --text-light: #636E72;
    --border: #E0E0E0;
    --shadow: 0 4px 20px rgba(108,99,255,0.10);
    --radius: 18px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, #6C63FF 0%, #A78BFA 50%, #F472B6 100%);
    color: white;
    text-align: center;
    padding: 30px 20px 40px;
    position: relative;
    overflow: hidden;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    right: 0;
    height: 30px;
    background: var(--bg);
    border-radius: 50% 50% 0 0;
  }

  .header h1 {
    font-size: clamp(1.3rem, 4vw, 2rem);
    font-weight: 900;
    margin-bottom: 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .header p {
    font-size: clamp(0.85rem, 2.5vw, 1.05rem);
    opacity: 0.95;
    font-weight: 600;
  }

  .score-bar {
    max-width: 750px;
    margin: -15px auto 20px;
    background: var(--card);
    border-radius: 50px;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow);
    position: relative;
    z-index: 2;
    flex-wrap: wrap;
    gap: 8px;
  }

  .score-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 0.95rem;
  }

  .score-item .emoji { font-size: 1.3rem; }

  .progress-container {
    max-width: 750px;
    margin: 0 auto 25px;
    padding: 0 20px;
  }

  .progress-track {
    background: #E0E0E0;
    border-radius: 50px;
    height: 14px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6C63FF, #A78BFA, #F472B6);
    border-radius: 50px;
    width: 0%;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }

  .progress-text {
    text-align: center;
    font-size: 0.82rem;
    color: var(--text-light);
    margin-top: 6px;
    font-weight: 700;
  }

  .container {
    max-width: 750px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }

  .bab-label {
    display: inline-block;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    padding: 6px 18px;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 800;
    margin: 25px 0 15px;
    letter-spacing: 0.5px;
  }

  .bab-label.bab12 {
    background: linear-gradient(135deg, #00B894, #55EFC4);
  }

  .bab-label.bab13 {
    background: linear-gradient(135deg, #E17055, #FDCB6E);
  }

  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px 22px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    border: 2px solid transparent;
    transition: border-color 0.3s;
  }

  .question-card.answered-correct {
    border-color: var(--success);
  }

  .question-card.answered-wrong {
    border-color: var(--danger);
  }

  .q-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    border-radius: 50%;
    font-weight: 900;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }

  .q-text {
    font-size: clamp(0.92rem, 2.5vw, 1.02rem);
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
  }

  .q-context {
    background: #F8F9FF;
    border-left: 4px solid var(--primary);
    padding: 12px 16px;
    border-radius: 0 12px 12px 0;
    margin-bottom: 16px;
    font-size: 0.9rem;
    color: #444;
    line-height: 1.7;
    font-style: italic;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #E8E8F0;
    border-radius: 14px;
    background: #FAFAFE;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text);
    text-align: left;
    transition: all 0.2s;
    line-height: 1.5;
  }

  .option-btn:hover:not(.disabled) {
    border-color: var(--primary);
    background: #F0EEFF;
    transform: translateY(-1px);
  }

  .option-btn:active:not(.disabled) {
    transform: scale(0.985);
  }

  .option-btn .opt-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #E8E8F0;
    font-weight: 800;
    font-size: 0.82rem;
    color: var(--primary);
    flex-shrink: 0;
    margin-top: 1px;
  }

  .option-btn.correct {
    border-color: var(--success);
    background: var(--success-bg);
  }

  .option-btn.correct .opt-letter {
    background: var(--success);
    color: white;
  }

  .option-btn.wrong {
    border-color: var(--danger);
    background: var(--danger-bg);
  }

  .option-btn.wrong .opt-letter {
    background: var(--danger);
    color: white;
  }

  .option-btn.disabled {
    cursor: default;
    opacity: 0.7;
  }

  .option-btn.disabled.correct {
    opacity: 1;
  }

  .notification {
    display: none;
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 1rem;
    text-align: center;
    animation: popIn 0.4s cubic-bezier(.4,0,.2,1);
  }

  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .notification.correct {
    background: var(--success-bg);
    color: #1B5E20;
    border: 2px solid #A5D6A7;
  }

  .notification.wrong {
    background: var(--danger-bg);
    color: #B71C1C;
    border: 2px solid #EF9A9A;
  }

  .explanation {
    display: none;
    margin-top: 14px;
    padding: 16px 18px;
    background: #FFFDE7;
    border: 2px solid #FFF176;
    border-radius: 14px;
    font-size: 0.9rem;
    line-height: 1.7;
    animation: slideDown 0.4s ease;
  }

  @keyframes slideDown {
    0% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .explanation .exp-title {
    font-weight: 800;
    color: #F57F17;
    margin-bottom: 6px;
    font-size: 0.92rem;
  }

  .explanation .exp-text {
    color: #555;
  }

  .explanation .exp-answer {
    display: inline-block;
    background: var(--success);
    color: white;
    padding: 2px 12px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 0.85rem;
    margin-top: 6px;
  }

  .footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-light);
    font-size: 0.82rem;
    font-weight: 600;
  }

  .reset-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    padding: 14px 32px;
    background: linear-gradient(135deg, var(--primary), #A78BFA);
    color: white;
    border: none;
    border-radius: 50px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(108,99,255,0.3);
    transition: all 0.2s;
  }

  .reset-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(108,99,255,0.4);
  }

  .result-banner {
    display: none;
    max-width: 750px;
    margin: 0 auto 25px;
    padding: 24px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-align: center;
    animation: popIn 0.5s ease;
  }

  .result-banner h2 {
    font-size: 1.4rem;
    margin-bottom: 8px;
  }

  .result-banner .result-score {
    font-size: 2.5rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary), #F472B6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-banner .result-msg {
    font-size: 1rem;
    color: var(--text-light);
    font-weight: 600;
    margin-top: 6px;
  }

  @media (max-width: 480px) {
    .header { padding: 22px 16px 35px; }
    .question-card { padding: 18px 16px; }
    .option-btn { padding: 12px 14px; font-size: 0.88rem; }
    .score-bar { padding: 10px 16px; }
    .q-context { padding: 10px 14px; }
  }
</style>
</head>

let correctTotal = 0;
let wrongTotal = 0;
let answeredTotal = 0;

function buildQuiz() {
  const container = document.getElementById('quizContainer');
  let html = '';
  let currentBab = '';

  quizData.forEach((item, i) => {
    if (item.bab !== currentBab) {
      currentBab = item.bab;
      html += `<div class="bab-label ${item.babClass}">${item.bab}</div>`;
    }

    html += `<div class="question-card" id="card-${i}">`;
    html += `<div class="q-number">${i + 1}</div>`;
    html += `<div class="q-text">${item.q}</div>`;

    if (item.context) {
      html += `<div class="q-context">${item.context}</div>`;
    }

    html += `<div class="options">`;
    const letters = ['A', 'B', 'C', 'D'];
    item.options.forEach((opt, j) => {
      html += `<button class="option-btn" id="opt-${i}-${j}" onclick="checkAnswer(${i}, ${j})">
        <span class="opt-letter">${letters[j]}</span>
        <span>${opt}</span>
      </button>`;
    });
    html += `</div>`;

    html += `<div class="notification" id="notif-${i}"></div>`;
    html += `<div class="explanation" id="exp-${i}">
      <div class="exp-title">💡 Pembahasan:</div>
      <div class="exp-text">${item.explanation}</div>
      <div class="exp-answer">Jawaban: ${letters[item.answer]}</div>
    </div>`;

    html += `</div>`;
  });

  container.innerHTML = html;
}

function checkAnswer(qIndex, selected) {
  const item = quizData[qIndex];
  const card = document.getElementById(`card-${qIndex}`);
  const notif = document.getElementById(`notif-${qIndex}`);
  const exp = document.getElementById(`exp-${qIndex}`);

  if (card.classList.contains('answered-correct') || card.classList.contains('answered-wrong')) return;

  const isCorrect = selected === item.answer;
  const letters = ['A', 'B', 'C', 'D'];

  // Disable all options
  item.options.forEach((_, j) => {
    const btn = document.getElementById(`opt-${qIndex}-${j}`);
    btn.classList.add('disabled');
    if (j === item.answer) btn.classList.add('correct');
    if (j === selected && !isCorrect) btn.classList.add('wrong');
  });

  // Show notification
  if (isCorrect) {
    card.classList.add('answered-correct');
    notif.className = 'notification correct';
    notif.innerHTML = '🎉 BENAR! Hebat sekali!';
    correctTotal++;
  } else {
    card.classList.add('answered-wrong');
    notif.className = 'notification wrong';
    notif.innerHTML = `😅 SALAH. Jawaban yang benar: <b>${letters[item.answer]}</b>`;
    wrongTotal++;
  }
  notif.style.display = 'block';

  // Show explanation
  exp.style.display = 'block';

  // Update scores
  answeredTotal++;
  document.getElementById('correctCount').textContent = correctTotal;
  document.getElementById('wrongCount').textContent = wrongTotal;
  document.getElementById('answeredCount').textContent = answeredTotal;

  const pct = Math.round((answeredTotal / quizData.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '% selesai';

  // Check if all answered
  if (answeredTotal === quizData.length) {
    showResult();
  }
}

function showResult() {
  const banner = document.getElementById('resultBanner');
  const pct = Math.round((correctTotal / quizData.length) * 100);
  let title, msg;

  if (pct === 100) {
    title = '🏆 SEMPURNA!';
    msg = 'Luar biasa! Kamu menguasai semua materi!';
  } else if (pct >= 80) {
    title = '🌟 HEBAT!';
    msg = 'Kamu sudah sangat paham materinya!';
  } else if (pct >= 60) {
    title = '👍 BAGUS!';
    msg = 'Terus belajar, kamu sudah di jalan yang benar!';
  } else if (pct >= 40) {
    title = '💪 SEMANGAT!';
    msg = 'Coba pelajari lagi pembahasannya ya!';
  } else {
    title = '📖 AYO BELAJAR LAGI!';
    msg = 'Baca ulang materinya dan coba lagi, pasti bisa!';
  }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = correctTotal + ' / ' + quizData.length;
  document.getElementById('resultMsg').textContent = msg;
  banner.style.display = 'block';
  banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetQuiz() {
  correctTotal = 0;
  wrongTotal = 0;
  answeredTotal = 0;
  document.getElementById('correctCount').textContent = '0';
  document.getElementById('wrongCount').textContent = '0';
  document.getElementById('answeredCount').textContent = '0';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressText').textContent = '0% selesai';
  document.getElementById('resultBanner').style.display = 'none';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
