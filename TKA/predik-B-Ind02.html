    kutipan: `(1) Escherichia coli (E. coli) adalah bakteri yang hidup di dalam usus manusia untuk menjaga kesehatan sistem pencernaan. (2) Bakteri ini umumnya tidak berbahaya. (3) Keberadaan bakteri E. coli di dalam tubuh manusia merupakan hal yang wajar karena bakteri ini turut berperan menjaga kesehatan saluran pencernaan. (4) Namun, ada jenis E. coli yang menghasilkan racun dan menyebabkan diare parah. (5) Sebagian besar diare disebabkan oleh bakteri jenis STEC. (6) Bakteri ini memproduksi racun yang dapat merusak lapisan usus kecil sehingga menyebabkan BAB berdarah. (7) Gejala infeksi E. coli dapat berbeda pada setiap orang. (8) Namun, infeksi ini sering kali ditandai dengan diare, yang umumnya muncul 3-4 hari setelah terpapar bakteri. (9) Diare yang tidak membaik setelah 4 hari pada orang dewasa atau selama 2 hari pada anak-anak. (10) Muntah-muntah selama lebih dari 12 jam. (11) Muncul gejala dehidrasi, seperti menurunnya jumlah urine, sangat haus, atau pusing. (12) Tinja yang dikeluarkan bercampur dengan nanah atau darah (disentri). (13) Nah, Bila kondisi ini terjadi, Anda harus segera memeriksakan diri ke dokter.`,
    text: 'Manakah kalimat yang penggunaan tanda bacanya tidak tepat?',
    options: ['A. Kalimat 3', 'B. Kalimat 8', 'C. Kalimat 12', 'D. Kalimat 13', 'E. Kalimat 5'],
    correct:3,
    explanation: 'Kalimat 13: "Nah, Bila kondisi ini terjadi..." Kesalahan terletak pada huruf kapital "Bila" setelah tanda koma. Seharusnya ditulis "Nah, bila kondisi ini terjadi..." karena "bila" adalah lanjutan kalimat, bukan awal kalimat baru. Jawaban D.'
},{
    id:8, tipe:'pgk',
    kutipan: `Pagi itu Pelabuhan Samudra Arunika dipenuhi suara mesin kapal, tumpukan peti logistik, dan para nelayan yang bersiap melaut. Di tengah keramaian itu, sebuah kapal tua bernama "Bintang Laut" tampak paling mencolok. Kapal tersebut telah menghubungkan pulau-pulau kecil di kawasan Arunika selama hampir tiga puluh tahun. Banyak warga menganggapnya sebagai simbol kehidupan pesisir yang sederhana sekaligus penuh harapan. Namun dalam dua tahun terakhir, kondisi kapal semakin memprihatinkan. Mesin utamanya sering mati mendadak, dek kayu mulai lapuk, dan lambung kapal beberapa kali mengalami kebocoran kecil. Para pedagang mengeluhkan keterlambatan pengiriman barang yang memengaruhi pendapatan mereka. Meski demikian, kapal tetap beroperasi karena belum ada kapal pengganti. Bagi warga, keberadaan kapal ini sangat penting untuk memenuhi kebutuhan pokok, mengirim hasil panen, dan menjaga hubungan antar wilayah. Pemerintah daerah sebenarnya telah mengusulkan pengadaan armada baru, tetapi pengesahan anggaran tertunda karena perdebatan internal. Sementara itu, para nelayan, pedagang, dan warga hanya bisa berharap agar Bintang Laut tetap bertahan sembari menunggu kehadiran kapal baru yang lebih aman.`,
    text: 'Berdasarkan teks tersebut, ide pokok yang tepat adalah ... (Pilih lebih dari satu)',
    options: [
        'A. Kapal Bintang Laut menjadi tumpuan warga meski kondisinya memburuk.',
        'B. Pemerintah daerah mempercepat pengadaan armada baru demi keselamatan warga.',
        'C. Kerusakan kapal mengganggu perdagangan dan aktivitas ekonomi.',
        'D. Jalur pelayaran antar-pulau tidak lagi penting bagi warga pesisir.',
        'E. Kapal Bintang Laut memiliki nilai emosional bagi masyarakat.'
    ],
    correct:[0,4],
    explanation: 'A (benar) — Ini adalah ide pokok yang paling komprehensif. Teks membahas kondisi kapal yang buruk tetapi sekaligus menekankan bahwa kapal ini sangat penting dan menjadi tumpuan hidup warga. E (benar) — Teks menyebut kapal sebagai "simbol kehidupan pesisir". B (salah) — Teks menyatakan pengesahan anggaran tertunda, jadi tidak mempercepat. C (benar) — Ini poin penting pendukung, bukan ide pokok utama. D (salah) — Bertentangan dengan isi teks. Jawaban A dan E.'
},{
    id:9, tipe:'pgk',
    kutipan: `Dalam beberapa bulan terakhir, banyak lembaga publik mulai mengampanyekan gerakan "Kurangi Sampah Plastik". Namun, sejumlah materi kampanye yang beredar di media sosial justru dinilai kurang efektif karena menggunakan pilihan kata yang berlebihan atau ambigu. Misalnya, dalam salah satu poster tertulis: "Mari kita menginisiasi gerakan pengurangan sampah plastik demi keberlangsungan ekosistem yang terstimulasi oleh tindakan masyarakat yang progresif". Kalimat tersebut dianggap terlalu rumit dan tidak komunikatif, sehingga pesan inti sulit dipahami masyarakat umum. Selain itu, dalam sebuah video kampanye terdapat narasi: "Buanglah sampah pada tempatnya agar tidak menciptakan bahaya yang memakan korban manusia yang tidak berhati-hati." Struktur kalimat tersebut membingungkan karena frasa "yang tidak berhati-hati" dapat merujuk pada "bahaya" ataupun "manusia". Kondisi ini menunjukkan pentingnya memperhatikan kejelasan struktur kalimat, kesesuaian diksi, dan efektivitas bahasa saat menyampaikan pesan publik.`,
    text: 'Pernyataan yang tepat mengenai penggunaan bahasa pada teks tersebut adalah ... (Pilih lebih dari satu)',
    options: [
        'A. Kalimat pada poster terlalu kompleks sehingga pesan utamanya tidak tersampaikan dengan jelas.',
        'B. Ambiguitas pada video kampanye muncul karena penggunaan istilah teknis yang berlebihan.',
        'C. Kesalahan diksi tidak berpengaruh terhadap kejelasan pesan kampanye publik.',
        'D. Pesan publik akan lebih efektif jika menggunakan bahasa yang sederhana dan komunikatif.',
        'E. Kalimat rumit pada poster justru membuat pesan kampanye lebih persuasif.'
    ],
    correct:[0,3],
    explanation: 'A (benar) — Sesuai dengan kalimat di teks: "Kalimat tersebut dianggap terlalu rumit... sehingga pesan inti sulit dipahami". D (benar) — Tersirat dari kritik teks terhadap kalimat rumit dan ambigu. B (salah) — Ambiguitas disebabkan struktur kalimat, bukan istilah teknis. C (salah) — Bertentangan dengan teks. E (salah) — Bertentangan dengan teks. Jawaban A dan D.'
},{
    id:10, tipe:'pgk',
    kutipan: `Raga adalah siswa yang dikenal suka menolong siapa pun yang membutuhkan. Setiap pagi, ia datang lebih awal ke sekolah untuk membantu penjaga sekolah menyusun bangku di aula. Suatu sore, ketika perjalanan pulang, ia melihat kepulan asap tipis dari gudang kecil dekat lapangan bola. Tanpa menunggu orang dewasa datang, Raga segera mengambil ember berisi air dan mencoba memadamkan api kecil yang mulai menjalar pada tumpukan kardus. Setelah api padam, beberapa warga datang menghampiri dan memuji keberaniannya. Namun, Raga justru terlihat ketakutan setelah mengetahui bahwa penyebab kebakaran masih belum jelas. Ia kemudian melaporkan kejadian tersebut kepada ketua RT agar dilakukan pemeriksaan lebih lanjut.`,
    text: 'Manakah pernyataan berikut yang tepat menilai isi teks? (Pilih lebih dari satu)',
    options: [
        'A. Bagian yang menunjukkan Raga datang lebih awal ke sekolah menggambarkan bahwa ia rajin dan suka membantu.',
        'B. Tindakan Raga memadamkan api sendirian menunjukkan bahwa ia berani dan peduli terhadap orang lain.',
        'C. Reaksi Raga yang ketakutan setelah kejadian menunjukkan bahwa ia tidak bertanggung jawab.',
        'D. Latar tempat di gudang dekat lapangan bola memperkuat kesan suasana yang aman dan terkendali.',
        'E. Peristiwa kepulan asap mempengaruhi pengembangan karakter Raga sebagai sosok yang bertanggung jawab.'
    ],
    correct:[0,1,4],
    explanation: 'A (benar) — Datang lebih awal ke sekolah menunjukkan rajin dan suka membantu. B (benar) — Memadamkan api sendirian menunjukkan berani dan peduli. E (benar) — Setelah kejadian dia melaporkan (tanggung jawab). C (salah) — Reaksi ketakutan tidak berarti tidak bertanggung jawab. D (salah) — Ada kebakaran, bukan suasana aman. Jawaban A, B, E.'
},{
    id:11, tipe:'pg',
    kutipan: `Di SMK Mandala Jaya, sebuah aturan baru diterapkan: semua siswa wajib mengenakan seragam lengkap setiap hari, termasuk topi dan dasi. Aturan ini dibuat karena banyak siswa yang sebelumnya berpenampilan tidak rapi. Namun, beberapa siswa mengeluhkan aturan tersebut karena merasa topi dan dasi tidak nyaman digunakan saat cuaca panas. Guru-guru mendukung aturan baru ini demi meningkatkan kedisiplinan. Sebaliknya, sebagian orang tua menilai bahwa aturan itu terlalu ketat dan tidak mempertimbangkan kenyamanan siswa. Pihak kesiswaan berencana mendiskusikan ulang aturan tersebut dalam rapat bersama komite sekolah.`,
    text: 'Konflik yang muncul dalam teks adalah ... (Pilih lebih dari satu)',
    options: [
        'A. Konflik antara siswa dan guru mengenai kewajiban memakai seragam lengkap.',
        'B. Konflik antara guru dan kepala sekolah mengenai efektivitas aturan baru.',
        'C. Konflik antara orang tua dan pihak sekolah mengenai kenyamanan siswa.',
        'D. Konflik antara sekolah dan komite sekolah mengenai bentuk seragam yang dipilih.',
        'E. Konflik antara siswa dan penjaga sekolah mengenai penggunaan topi.'
    ],
    correct:[0,2],
    explanation: 'A (benar) — Terdapat pertentangan antara siswa (tidak nyaman) dengan guru (mendukung aturan). C (benar) — Orang tua menilai aturan terlalu ketat, pihak sekolah (guru) mendukung. B (salah) — Tidak ada informasi konflik guru-kepala sekolah. D (salah) — Tidak ada konflik tentang bentuk seragam. E (salah) — Tidak ada informasi tentang penjaga sekolah. Jawaban A dan C.'

    id:12, tipe:'pgk',
    kutipan: `Dalam sebuah pentas seni sekolah, tiga pertunjukan ditampilkan. Pertama, sebuah puisi berjudul "Ruang Tanpa Pintu" dibacakan dengan suara lirih dan tempo lambat. Puisi tersebut menggambarkan rasa kehilangan seseorang yang ditinggal sahabatnya. Penonton tampak diam, beberapa terlihat memejamkan mata seakan merasakan kesedihan itu. Kedua, sebuah cerpen berjudul "Jejak di Atas Tanah Basah" dibacakan oleh narator. Cerita ini menampilkan perjalanan seorang anak yang mencari ayahnya yang hilang saat banjir bandang. Suasana tegang dan gelisah tampak dari raut wajah penonton. Ketiga, drama komedi singkat berjudul "Tiga Kursi Kosong" membuat seluruh penonton tertawa karena dialog lucu dan tingkah kocak para pemain.`,

    correct:[0,3],

    id:13, tipe:'pgk',
    kutipan: `"Langit yang Pulang" — Di bawah cahaya jingga, aku melihat langit kembali ke tempat ia pernah singgah—di sela ranting dan ingatan. Ada desir angin yang membawa kabar tentang perjalanan panjang yang tak sempat kuceritakan. Dan ketika malam tiba, aku belajar untuk tidak lagi mengejar, karena beberapa hal hanya bisa kita biarkan kembali dengan sendirinya.`,

    id:16, tipe:'pgk-kategori',

    id:18, tipe:'pgk-kategori',

    id:19, tipe:'pgk-kategori',
    kutipan: `"Di perpustakaan sekolah, Anisa duduk sambil memeriksa hasil ulangan matematika yang baru diterimanya. Nilainya belum memuaskan, membuat hatinya terasa berat. Ia menatap catatan-catatan yang sudah dibuat sebelumnya, mencoba menemukan kesalahan yang menyebabkan nilainya rendah. Tiba-tiba, ia teringat kata-kata guru: 'Belajar itu proses, setiap kesalahan adalah pelajaran.' Anisa menarik napas panjang, menenangkan diri, dan mulai menyusun strategi belajar agar hasil berikutnya lebih baik. Ia membuat jadwal belajar, menandai bagian materi yang perlu diulang, dan menyiapkan catatan tambahan untuk latihan soal. Suasana perpustakaan yang tenang, suara halaman buku yang dibalik, serta sinar matahari yang menembus jendela membuatnya merasa lebih fokus. Ia merasa bahwa kegagalan hari ini hanyalah bagian dari proses menuju kesuksesan, dan semangat barunya mulai tumbuh perlahan."`,
    text: 'Perhatikan tabel berikut! Tentukan Sesuai atau Tidak Sesuai untuk setiap pernyataan.',
    pernyataan: [
        'Respons emosional Anisa adalah campuran kecewa dan semangat baru untuk memperbaiki belajar.',
        'Anisa merasa marah kepada teman-temannya karena nilai ulangan buruk.',
        'Tarikan napas panjang menunjukkan usaha Anisa menenangkan diri dan fokus kembali.'
    ],
    jawaban: [true, false, true],
    alasan: [
        'Ia kecewa dengan nilai, lalu termotivasi setelah mengingat pesan guru.',
        'Tidak ada bagian yang menyebut ia marah kepada teman.',
        'Kalimat menggambarkan ia menenangkan diri sebelum mulai menyusun strategi belajar.'
    ]
},{
    id:20, tipe:'pgk-kategori',
    kutipan: `"Di balik jendela pagi, cahaya perlahan tumbuh, Menembus tirai tipis yang masih basah oleh embun. Seorang gadis kecil menatap langit yang pucat, Mengingat mimpi-mimpi yang semalam hilang sebelum sempat digenggam. Ia menarik napas lirih, antara sedih dan berharap, Mencoba merangkai kembali keberanian yang retak. Di halaman sekolah nanti, ia akan melangkah pelan, Membawa doa sederhana agar hari ini lebih ramah padanya."`,
    text: 'Perhatikan tabel berikut! Tentukan Sesuai atau Tidak Sesuai untuk setiap pernyataan.',
    pernyataan: [
        'Gadis kecil dalam puisi mengalami perasaan campuran antara sedih dan harapan.',
        'Puisi menggambarkan suasana malam yang gelap dan menegangkan.',
        'Tarikan napas lirih menunjukkan gadis itu sedang berusaha menguatkan diri.'
    ],
    jawaban: [true, false, true],
    alasan: [
        'Teks menyebut "antara sedih dan berharap", menunjukkan perasaan campuran tersebut.',
        'Puisi menggambarkan pagi ("Di balik jendela pagi"), suasananya lembut, bukan gelap/tegang.',
        'Bagian "mencoba merangkai kembali keberanian yang retak" menggambarkan usaha menguatkan diri.'
    ]
}];

// ============================================================
//  RENDER & LOGIC
// ============================================================
const container = document.getElementById('quizContainer');
const scoreSpan = document.getElementById('scoreDisplay');
const totalSpan = document.getElementById('totalSoal');
totalSpan.textContent = questions.length;

let answered = {};
let selectedAnswers = {};
let pernyataanAnswers = {};

function render() {
    let html = '';
    let correctCount = 0;

    questions.forEach((q, idx) => {
        const isAnswered = answered[idx] || false;
        const isCorrect = isAnswered && checkAnswer(idx);
        if (isAnswered && isCorrect) correctCount++;

        let cardClass = 'soal-card';
        if (isAnswered) {
            cardClass += isCorrect ? ' correct' : ' wrong';
        }

        const tipeLabel = q.tipe === 'pg' ? 'PG Biasa' :
                          (q.tipe === 'pgk' ? 'PGK (Pilih >1)' : 'PGK Kategori');
        let tipeClass = 'tipe';
        if (q.tipe === 'pgk') tipeClass += ' pgk';
        else if (q.tipe === 'pgk-kategori') tipeClass += ' pgk-kategori';

        html += `<div class="${cardClass}" id="soal-${idx}">`;
        html += `<div class="header-soal">
                    <span class="nomor">Soal ${idx+1}</span>
                    <span class="${tipeClass}">${tipeLabel}</span>
                </div>`;

        if (q.kutipan) {
            html += `<div class="kutipan">${q.kutipan.replace(/\n/g, '<br>')}</div>`;
        }

        html += `<div class="soal-text">${q.text}</div>`;

        if (q.tipe === 'pg') {
            html += renderPG(idx, q);
        } else if (q.tipe === 'pgk') {
            html += renderPGK(idx, q);
        } else if (q.tipe === 'pgk-kategori') {
            html += renderPGKKategori(idx, q);
        }

        let feedbackClass = 'feedback-box';
        let feedbackHtml = '';
        if (isAnswered) {
            feedbackClass += ' show';
            feedbackClass += isCorrect ? ' correct' : ' wrong';
            const icon = isCorrect ? '✅' : '❌';
            const status = isCorrect ? 'Jawaban Benar!' : 'Jawaban Salah';
            const correctText = getCorrectText(q);
            feedbackHtml = `
                <div class="${feedbackClass}">
                    <strong>${icon} ${status}</strong>
                    <div class="explain">💡 ${q.explanation}</div>
                    <div style="margin-top:4px;font-size:0.9rem;">Kunci Jawaban: <strong>${correctText}</strong></div>
                </div>
            `;
        } else {
            feedbackHtml = `<div class="feedback-box"></div>`;
        }
        html += feedbackHtml;

        html += `</div>`;
    });

    container.innerHTML = html;
    scoreSpan.textContent = correctCount;
    attachEvents();
}

function renderPG(idx, q) {
    let html = `<div class="options">`;
    q.options.forEach((opt, optIdx) => {
        const isAnswered = answered[idx] || false;
        const selected = selectedAnswers[idx];
        let labelClass = '';
        let disabled = '';
        let checked = '';
        if (isAnswered) {
            disabled = 'disabled';
            if (optIdx === q.correct) labelClass += ' correct-answer';
            if (optIdx === selected && optIdx !== q.correct) labelClass += ' wrong-answer';
            if (optIdx === selected) checked = 'checked';
        }
        html += `
            <label class="${labelClass} ${disabled}">
                <input type="radio" name="q${idx}" value="${optIdx}" ${checked} ${disabled}>
                <span>${opt}</span>
            </label>
        `;
    });
    html += `</div>`;
    return html;
}

function renderPGK(idx, q) {
    let html = `<div class="options">`;
    q.options.forEach((opt, optIdx) => {
        const isAnswered = answered[idx] || false;
        const selected = selectedAnswers[idx] || [];
        let labelClass = '';
        let disabled = '';
        let checked = '';
        if (isAnswered) {
            disabled = 'disabled';
            if (q.correct.includes(optIdx)) labelClass += ' correct-answer';
            if (selected.includes(optIdx) && !q.correct.includes(optIdx)) labelClass += ' wrong-answer';
            if (selected.includes(optIdx)) checked = 'checked';
        }
        html += `
            <label class="${labelClass} ${disabled}">
                <input type="checkbox" name="q${idx}" value="${optIdx}" ${checked} ${disabled}>
                <span>${opt}</span>
            </label>
        `;
    });
    html += `</div>`;
    if (!answered[idx]) {
        html += `<button class="btn-cek" id="cek-${idx}">🔍 Cek Jawaban</button>`;
    }
    return html;
}

function renderPGKKategori(idx, q) {
    let html = `<table class="table-pernyataan">`;
    const isAnswered = answered[idx] || false;
    const answers = pernyataanAnswers[idx] || [];

    q.pernyataan.forEach((pernyataanText, pIdx) => {
        const val = answers[pIdx];
        const isCorrect = isAnswered && (val === q.jawaban[pIdx]);

        html += `<tr>`;
        html += `<td class="pernyataan-text">${pernyataanText}</td>`;
        html += `<td>`;
        html += `<div class="opsi-group">`;

        const options = q.tipe === 'pgk-kategori' ?
            [{ label: 'Setuju', value: true }, { label: 'Tidak Setuju', value: false }] :
            [{ label: 'Sesuai', value: true }, { label: 'Tidak Sesuai', value: false }];

        options.forEach(opt => {
            const checked = (isAnswered && val === opt.value) ? 'checked' : '';
            const disabled = isAnswered ? 'disabled' : '';
            let labelClass = '';
            if (isAnswered) {
                if (opt.value === q.jawaban[pIdx]) labelClass += ' correct-answer';
                if (val === opt.value && opt.value !== q.jawaban[pIdx]) labelClass += ' wrong-answer';
            }
            html += `
                <label class="${labelClass} ${disabled}" style="display:inline-flex; align-items:center; gap:4px; padding:2px 8px; background:transparent; border:none; cursor:${isAnswered?'default':'pointer'}; font-weight:${(isAnswered && opt.value === q.jawaban[pIdx])?'600':'normal'};">
                    <input type="radio" name="pernyataan_${idx}_${pIdx}" value="${opt.value}" ${checked} ${disabled}>
                    ${opt.label}
                </label>
            `;
        });

        html += `</div>`;

        if (isAnswered) {
            const fbClass = isCorrect ? 'benar' : 'salah';
            const icon = isCorrect ? '✅' : '❌';
            const status = isCorrect ? 'Benar' : 'Salah';
            html += `
                <div class="feedback-pernyataan show ${fbClass}">
                    ${icon} ${status} — ${q.alasan[pIdx]}
                </div>
            `;
        }

        html += `</td>`;
        html += `</tr>`;
    });

    html += `</table>`;

    if (!answered[idx]) {
        html += `<button class="btn-cek" id="cek-${idx}">🔍 Cek Jawaban</button>`;
    }

    return html;
}

function getCorrectText(q) {
    if (q.tipe === 'pg') {
        return q.options[q.correct];
    } else if (q.tipe === 'pgk') {
        return q.correct.map(i => q.options[i]).join('; ');
    } else if (q.tipe === 'pgk-kategori') {
        return q.pernyataan.map((p, i) => {
            const label = q.jawaban[i] ? 'Setuju/Sesuai' : 'Tidak Setuju/Tidak Sesuai';
            return `(${i+1}) ${label}`;
        }).join('; ');
    }
    return '';
}

function checkAnswer(idx) {
    const q = questions[idx];
    if (q.tipe === 'pg') {
        return selectedAnswers[idx] === q.correct;
    } else if (q.tipe === 'pgk') {
        const sel = selectedAnswers[idx] || [];
        const sortedSel = [...sel].sort();
        const sortedCorr = [...q.correct].sort();
        return JSON.stringify(sortedSel) === JSON.stringify(sortedCorr);
    } else if (q.tipe === 'pgk-kategori') {
        const ans = pernyataanAnswers[idx] || [];
        return ans.every((v, i) => v === q.jawaban[i]);
    }
    return false;
}

function attachEvents() {
    document.querySelectorAll('.soal-card input[type="radio"]:not([name^="pernyataan_"])').forEach(input => {
        input.addEventListener('change', function() {
            const name = this.name;
            const idx = parseInt(name.replace('q', ''));
            if (answered[idx]) return;
            selectedAnswers[idx] = parseInt(this.value);
            answered[idx] = true;
            render();
            document.getElementById(`soal-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    });

    document.querySelectorAll('.btn-cek').forEach(btn => {
        btn.addEventListener('click', function() {
            const idx = parseInt(this.id.replace('cek-', ''));
            const q = questions[idx];

            if (q.tipe === 'pgk') {
                const checkboxes = document.querySelectorAll(`#soal-${idx} input[type="checkbox"]`);
                const selected = [];
                checkboxes.forEach(cb => {
                    if (cb.checked) selected.push(parseInt(cb.value));
                });
                if (selected.length === 0) {
                    alert('Pilih minimal satu pilihan!');
                    return;
                }
                selectedAnswers[idx] = selected;
                answered[idx] = true;
                render();
                document.getElementById(`soal-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (q.tipe === 'pgk-kategori') {
                const allAnswered = q.pernyataan.every((_, pIdx) => {
                    const radios = document.querySelectorAll(`input[name="pernyataan_${idx}_${pIdx}"]`);
                    let checked = false;
                    radios.forEach(r => { if (r.checked) checked = true; });
                    return checked;
                });
                if (!allAnswered) {
                    alert('Jawab semua pernyataan terlebih dahulu!');
                    return;
                }
                const answers = [];
                q.pernyataan.forEach((_, pIdx) => {
                    const radios = document.querySelectorAll(`input[name="pernyataan_${idx}_${pIdx}"]`);
                    radios.forEach(r => {
                        if (r.checked) {
                            answers[pIdx] = (r.value === 'true');
                        }
                    });
                });
                pernyataanAnswers[idx] = answers;
                answered[idx] = true;
                render();
                document.getElementById(`soal-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    });
}

function resetQuiz() {
    answered = {};
    selectedAnswers = {};
    pernyataanAnswers = {};
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('resetBtn').addEventListener('click', resetQuiz);
render();
</script>
</body>
</html>
