    // --- BACAAN 1 (Ali Wardhana) untuk soal 1-3 ---
    const baca1 = `Ali Wardhana, Penyelamat Ekonomi Indonesia

Indonesia pernah mengalami peristiwa hiperinflasi pada masa kepemimpinan Presiden Ir. Sukarno. Keadaan tersebut mengakibatkan hancurnya daya beli masyarakat. Indonesia terbitut utang hingga US$2,4 miliar. Perencanaan finansial yang buruk membuat Indonesia menghadapi defisit APBN dan neraca perdagangan. Keadaan diperparah dengan kebijakan pencetakan uang yang menyebabkan peredaran uang di publik meningkat. Sosok yang menyelamatkan keadaan ekonomi saat itu adalah Ali Wardhana. Ali Wardhana diangkat sebagai bendahara negara pada masa pemerintahan Presiden Suharto. Dengan upaya yang efektif, ia menghentikan segala pengeluaran negara yang dirasa tidak mendesak.

Ali Wardhana merupakan lulusan Fakultas Ekonomi Universitas Indonesia. Ia melanjutkan studi di University of California, Berkeley, Amerika Serikat, hingga memperoleh gelar doktor pada 1962. Dengan latar belakang tersebut, Ali Wardhana dikenal sebagai ekonom yang mumpuni. Ia pun dipercaya untuk mengatasi masalah defisit ekonomi Indonesia. Ali Wardhana bekerja sama dengan kelompok negara Barat melalui Official Development Aid (ODA) untuk memperoleh pinjaman yang sangat lunak. ODA juga memberi bantuan tenaga ahli yang sangat dibutuhkan Indonesia saat itu.

Ali Wardhana pun melakukan restrukturisasi terhadap berbagai utang yang jatuh tempo. Bersama Widjojo Nitisastro, ia melakukan negosiasi utang dengan Paris Club. Negosiasi tersebut menghasilkan putusan penundaan pembayaran utang hingga empat dasawarsa tanpa bunga. Selain itu, ia berkoordinasi dengan Bank Indonesia untuk menghentikan pencetakan uang. Berkat kebijakan tersebut, tingkat inflasi berhasil ditekan hingga sekitar 10 persen pada 1969.

Kemampuan Ali Wardhana dalam bidang ekonomi membuatnya dipercaya sebagai Menteri Keuangan selama 15 tahun (1968–1983). Setelah itu, ia diangkat menjadi Menteri Koordinator Ekonomi, Industri, dan Pengawasan Pembangunan (1983–1988). Setelah turun dari kementerian, ia menjadi tempat konsultasi para ekonomi junior. Karena keikhianannya inilah, ia menjadi panutan bagi banyak menteri keuangan setelahnya. Keahlian dan kontribusinya dalam perekonomian Indonesia menjadi faktor utama Ali Wardhana dihormati. Ia dikenal sebagai salah satu tokoh ekonomi yang berpengaruh di Indonesia.

Sumber: Pieter Rafael Johansz, Good News From Indonesia, 2026`;

    soalData.push({
        id: 1, tipe: 'Pilihan Ganda', bacaan: baca1,
        teks: 'Berdasarkan teks, simpulan paling tepat mengenai faktor keberhasilan Ali Wardhana dalam menurunkan tingkat inflasi di Indonesia adalah . . .',

            'A. Keputusan sigap untuk melakukan restrukturisasi utang dan melakukan koordinasi kebijakan bersama Bank Indonesia.',

    // --- BACAAN 2 (Podcast) untuk soal 4-6 ---
    const baca2 = `Popularitas Podcast pada Era Digital

Pada era digital yang serbacepat ini, cara konsumsi informasi terus berkembang. Salah satu fenomena yang paling menonjol adalah perkembangan podcast. Podcast muncul sebagai bentuk evolusi media siaran konvensional. Kini, podcast telah menjadi media yang memiliki potensi komersial yang besar. Podcast berkembang karena menawarkan cara baru untuk mendapatkan cerita dan informasi.

Faktor utama penyebab podcast menjadi populer dalam beberapa tahun terakhir adalah fleksibilitas. Kemudahan akses internet memungkinkan podcast untuk didengarkan kapan dan di mana saja. Kondisi ini disebabkan oleh efisiensi transmisi data audio yang lebih ringan dibanding video. Kemudahan lainnya adalah pendengar dapat memegang kendali penuh atas informasi yang ingin dikonsumsi. Kondisi ini berbeda dengan radio konvensional yang terikat jadwal.

Podcast berkembang menjadi media populer karena banyaknya manfaat yang dirasakan pendengar. Podcast menyajikan berbagai macam konten: Pendengar dapat menggunakan podcast, baik sebagai media hiburan maupun edukasi. Selain itu, popularitas podcast berdampak pada terbentuknya ruang komunitas baru. Komunitas tersebut terbentuk dari para pendengar yang memiliki kesamaan minat. Di sisi lain, proses mendengarkan audio yang dilakukan pendengar meningkatkan kemampuan mekanis. Media audio menuntut pendengar podcast melatih kemampuan mendengarkan dan memahami informasi yang didengarkan.

Podcast menyajikan cara yang unik dan menarik untuk berbagi cerita, menyampaikan informasi, dan membangun komunitas. Dengan kenyamanan, variasi konten, dan sifatnya yang intim, podcast kemungkinan akan menjadi bagian penting dari lanskap media pada tahun-tahun mendatang. Baik bagi seorang pendengar yang ingin belajar hal-hal baru atau membuat konten yang ingin berbagi informasi.

Kemudahan akses secara umum membuat fenomena meluasnya podcast terjadi. Fenomena ini diperkirakan akan terus terjadi seiring perkembangan teknologi. Kecanggihan teknologi akan membuat penyebaran podcast terus berekspansi secara global. Dengan demikian, popularitas podcast mendalami pergeseran cara masyarakat dalam mengonsumsi media.

Sumber: Denny tebe, Media Indonesia, 2025`;

    soalData.push({

Laut harus dijaga karena laut berperan penting bagi kelangsungan hidup manusia. Kerusakan laut secara langsung berdampak negatif bagi banyak aspek kehidupan. Asupan makanan terancam, sumber mata pencarian terguncang, dan kemampuan bumi menyerap karbon melemah. Menyelamatkan laut adalah cara untuk menyelamatkan masa depan umat manusia.

Menurut Staf Khusus Menko Perekonomian Bidang Pangan, 54 persen lebih kebutuhan protein kita dipenuhi sektor perikanan. Fakta menunjukkan bahwa laut menyediakan lebih dari separuh asupan protein hewani bagi masyarakat Indonesia. Artinya, keberlangsungan hidup jutaan orang sangat bergantung pada ekosistem laut yang sehat. Namun, stabilitas laut terancam karena adanya pihak yang memandang laut hanya sebagai sumber eksploitasi. Keadaan tersebut diperparah dengan adanya polusi dan perubahan iklim. Jika eksploitasi terus dilakukan secara berlebihan dan regulasi tidak diperlukan, ekosistem laut terancam. Krisis pangan bisa terjadi secara masif dan mata pencarian jutaan nelayan terganggu. Laut seharusnya menjadi pilar pertumbuhan ekonomi yang inklusif. Oleh karena itu, laut harus dikelola secara bijak melalui sektor ekonomi biru.

Secara ekologis, kesehatan laut menentukan kesehatan iklim. Maka dari itu, melindungi laut berarti juga melindungi kestabilan iklim. Jika laut rusak, komunitas pesisir dan perempuan menjadi kelompok yang paling terdampak. Oleh karena itu, diperlukan komitmen global seperti target 30x30. Target tersebut ialah melindungi 30 persen wilayah laut dunia pada tahun 2030. Target ini sulit tercapai jika ketimpangan pengelolaan dan lemahnya penegakan hukum masih terjadi. Nasib manusia memang tidak sepenuhnya ditentukan oleh laut. Akan tetapi, tanpa laut yang sehat, masa depan manusia akan sangat suram. Jadi, kolaborasi lintas sektor antara pemerintah, masyarakat lokal, swasta, dan internasional harus diperkuat.

    const baca6 = `Istano Basa Pagaruyung, Ikon Sejarah dan Arsitektur Minangkabau

Istano Basa Pagaruyung mengabadikan kemegahan arsitektur dari pusat pemerintahan kerajaan. Istano Basa Pagaruyung juga menjadi kediaman Raja Alam. Istana yang berdiri saat ini merupakan replika. Bangunan yang asli telah dibakar oleh Belanda pada 1804. Bangunan istana berbentuk rumah panggung besar dengan atap khas arsitektur tradisional Minangkabau. Istana ini memiliki tiga tingkat dengan 72 tonggak yang menjadi penyangga utamanya. Terdapat 11 gongon atau pucuk atap yang menghias bagian atas bangunan ini. Seluruh dinding bangunan ini dihiasi ornamen ukiran berwarna-warni. Total ada sekitar 58 jenis motif yang digunakan.

Di dalam istana kerajaan, tiap-tiap tingkat dalam bangunan memiliki fungsi yang berbeda-beda. Tingkat paling bawah merupakan tempat aktivitas utama pemerintahan. Tingkat kedua merupakan ruang aktivitas bagi para putri raja yang belum menikah. Ruangan paling atas menjadi tempat raja dan permaisurinya bersantai sambil melihat kondisi sekitar istana. Ruangan ini disebut anjung peranginan, posisinya terletak di bawah atap gongjong di tengah bangunan. Di ruangan ini terdapat sejumlah koleksi senjata pusaka asli kerajaan yang masih tersisa. Bangunan asli istana ini awalnya berlokasi di Bukit Batu Patah. Setelah insiden 1804, istana ini didirikan kembali. Namun, pada 1966, istana ini terbakar habis kembali. Istana kemudian dibangun kembali dengan memperhatikan arsitektur aslinya di lokasi yang baru.

    let jawabanPengguna = {};

    function renderSoal(index) {
        const soal = soalData[index];
        if (!soal) return;

        let html = `<div class="soal aktif" id="soal-${soal.id}">`;
        html += `<div class="soal-header">
                    <span class="soal-nomor">Soal ${soal.id}</span>
                    <span class="soal-tipe">${soal.tipe}</span>
                </div>`;
        if (soal.bacaan) {
            html += `<div class="bacaan">${soal.bacaan.replace(/\n/g, '<br>')}</div>`;
        }
        html += `<div class="soal-teks">${soal.teks}</div>`;

        if (soal.tipe === 'Pilihan Ganda' || soal.tipe === 'Multiple') {
            const isMultiple = soal.tipe === 'Multiple';
            const inputType = isMultiple ? 'checkbox' : 'radio';
            const nameAttr = `q${soal.id}`;
            html += `<div class="opsi">`;
            soal.opsi.forEach((op, idx) => {
                const checked = (jawabanPengguna[soal.id] || []).includes(idx) ? 'checked' : '';
                const disabled = sudahDiperiksa[soal.id] ? 'disabled' : '';
                const kelasTambahan = sudahDiperiksa[soal.id] ? getKelasOpsi(soal, idx) : '';
                html += `<label class="${kelasTambahan} ${sudahDiperiksa[soal.id] ? 'disabled' : ''}">
                            <input type="${inputType}" name="${nameAttr}" value="${idx}" ${checked} ${disabled}>
                            <span>${op}</span>
                        </label>`;
            });
            html += `</div>`;
        } else if (soal.tipe === 'Tabel') {
            html += `<div class="tabel-container"><table>`;
            html += `<thead><tr><th>${soal.tabel.header[0]}</th>`;
            for (let i = 1; i < soal.tabel.header.length; i++) {
                html += `<th style="text-align:center;min-width:80px;">${soal.tabel.header[i]}</th>`;
            }
            html += `</tr></thead><tbody>`;
            const rows = soal.tabel.rows;

                html += `<tr><td class="pernyataan">${row.pernyataan}</td>`;
                const cols = soal.tabel.header.length - 1;
                for (let c = 0; c < cols; c++) {
                    const isChecked = (jawabanPengguna[soal.id] || [])[rowIdx] === c;
                    const disabled = sudahDiperiksa[soal.id] ? 'disabled' : '';
                    html += `<td style="text-align:center;">
                                <label style="cursor:${sudahDiperiksa[soal.id]?'default':'pointer'};">
                                    <input type="radio" name="tbl_${soal.id}_${rowIdx}" value="${c}" 
                                           ${isChecked?'checked':''} ${disabled}
                                           style="accent-color:#3b82f6;width:16px;height:16px;">

                html += `</tr>`;

            html += `</tbody></table></div>`;

        html += `</div>`;
        html += `</div>`;

        if (soal.tipe === 'Pilihan Ganda' || soal.tipe === 'Multiple') {
            const inputs = container.querySelectorAll(`input[name="q${soal.id}"]`);
            inputs.forEach(inp => {
                inp.addEventListener('change', function() {
                    if (sudahDiperiksa[soal.id]) return;
                    const key = soal.id;
                    if (soal.tipe === 'Multiple') {
                        const checked = [...container.querySelectorAll(`input[name="q${key}"]:checked`)].map(
                            el => parseInt(el.value));
                        jawabanPengguna[key] = checked;
                    } else {
                        const val = parseInt(this.value);
                        jawabanPengguna[key] = [val];

        } else if (soal.tipe === 'Tabel') {
            const radios = container.querySelectorAll('input[type="radio"]');

    function getKelasOpsi(soal, idx) {

        const isBenar = benar.includes(idx);

        if (isDipilih && !isBenar) return 'salah';
        return 'tidak-dipilih';
    }

    function formatJawaban(soal) {
        if (soal.tipe === 'Pilihan Ganda') {
            const idx = soal.jawaban[0];
            return soal.opsi[idx] ? soal.opsi[idx].substring(0, 3) : '—';
        } else if (soal.tipe === 'Multiple') {
            return soal.jawaban.map(i => soal.opsi[i] ? soal.opsi[i].substring(0, 3) : '').join(', ');
        } else if (soal.tipe === 'Tabel') {
            const header = soal.tabel.header.slice(1);
            return soal.jawaban.map(v => header[v] || '—').join(' | ');
        }
        return '—';
    }

    function updateProgress() {
        let terjawab = 0;
        soalData.forEach(s => {
            const user = jawabanPengguna[s.id] || [];
            if (s.tipe === 'Tabel') {
                const totalRow = s.tabel.rows.length;
                let filled = 0;
                for (let i = 0; i < totalRow; i++) {
                    if (user[i] !== undefined && user[i] !== null && user[i] !== '') filled++;
                }
                if (filled === totalRow) terjawab++;
            } else {
                if (user.length > 0) terjawab++;
            }
        });
        const total = soalData.length; // 25
        const pct = Math.round((terjawab / total) * 100);
        progressBar.style.width = pct + '%';
        progressText.textContent = `${terjawab} / ${total} terjawab`;
    }

    function updateNavButtons(index) {
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === soalData.length - 1;
    }

    function goTo(index) {
        if (index < 0 || index >= soalData.length) return;
        currentIndex = index;
        renderSoal(index);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
    nextBtn.addEventListener('click', () => goTo(currentIndex + 1));

    periksaBtn.addEventListener('click', function() {
        const soal = soalData[currentIndex];
        if (!soal) return;
        const user = jawabanPengguna[soal.id] || [];
        if (soal.tipe === 'Tabel') {
            const totalRow = soal.tabel.rows.length;
            let filled = 0;
            for (let i = 0; i < totalRow; i++) {
                if (user[i] !== undefined && user[i] !== null && user[i] !== '') filled++;
            }
            if (filled < totalRow) {
                alert('Silakan isi semua pilihan pada tabel terlebih dahulu.');
                return;
            }
        } else {
            if (user.length === 0) {
                alert('Silakan pilih jawaban terlebih dahulu.');
                return;
            }
        }
        sudahDiperiksa[soal.id] = true;
        renderSoal(currentIndex);
        const box = document.getElementById(`jawabanBox-${soal.id}`);
        if (box) box.classList.add('muncul');
        updateProgress();
    });

    resetBtn.addEventListener('click', function() {
        if (!confirm('Reset semua jawaban untuk soal ini?')) return;
        const soal = soalData[currentIndex];
        delete jawabanPengguna[soal.id];
        delete sudahDiperiksa[soal.id];
        renderSoal(currentIndex);
        updateProgress();
    });

    renderSoal(0);
    updateProgress();
</script>
</body>
</html>
