            max-width: 750px;
            width: 100%;
            position: relative;
        }

        }
        .difficulty-badge {

            color: white;

        }
        .diff-sedang { background-color: #f59e0b; }
        .diff-sulit { background-color: #dc2626; }
        
        .question-text {
            font-size: 1.1em;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            background-color: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1em;
        }
        .option:hover:not(.disabled) {
            background-color: #eff6ff;
            border-color: #93c5fd;
        }
        .option.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #14532d;
            font-weight: 600;
        }
        .option.incorrect {
            background-color: #fee2e2;
            border-color: var(--danger);
            color: #7f1d1d;
        }
        .option.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .explanation-box {
            display: none;
            margin-top: 25px;
            padding: 15px 20px;
            background-color: #fffbeb;
            border-left: 5px solid #f59e0b;
            border-radius: 4px;
            font-size: 0.95em;
            line-height: 1.6;
            animation: fadeIn 0.5s;
        }
        .btn-next {
            display: none;
            margin-top: 25px;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05em;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-next:hover {
            background-color: var(--primary-hover);
        }
        .result-container {
            text-align: center;
            display: none;
        }
        .result-container h3 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 10px;
        }
        .score-display {
            font-size: 3em;
            font-weight: bold;
            color: var(--success);
            margin: 20px 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

</head>

            question: "Berbagai kampanye pengurangan sampah plastik terus digaungkan secara masif di media sosial. ..., data lapangan menunjukkan penggunaan kantong kresek di pasar tradisional tidak mengalami penurunan. ..., pemerintah dituntut tidak hanya mengedukasi, tetapi juga mulai menerapkan cukai plastik yang ketat.<br><br>Konjungsi antarkalimat yang paling tepat adalah...",
            options: [
                "A. Meskipun demikian, Selanjutnya",
                "B. Akan tetapi, Oleh sebab itu",
                "C. Sebaliknya, Bahkan",
                "D. Padahal, Dengan demikian",
                "E. Namun, Sementara itu"
            ],
            correct: 1,
            explanation: "<b>Jawaban: B</b><br>Kalimat kedua bertentangan dengan kalimat pertama (kampanye masif VS tidak ada penurunan di lapangan) → <i>Akan tetapi / Namun</i>.<br>Kalimat ketiga adalah solusi tegas atas kebuntuan di kalimat kedua → <i>Oleh sebab itu / Karena itu</i>."
        },
        {
            level: "Sulit",
            type: "Melengkapi Kalimat",
            question: "(1) Pemanasan global menyebabkan suhu rata-rata permukaan laut terus mengalami peningkatan tajam. (2) Kenaikan suhu ekstrem ini memicu pencairan lapisan es abadi di kawasan kutub secara masif. (3) ... (4) Jika kondisi ini dibiarkan, banyak pulau kecil dan daratan rendah terancam tenggelam. (5) Jutaan penduduk pesisir di seluruh dunia pun harus bersiap menghadapi krisis tempat tinggal.<br><br>Pilihlah kalimat yang paling tepat untuk mengisi bagian rumpang (3)!",
            options: [
                "A. Beruang kutub mulai kehilangan habitat alami mereka untuk berburu.",
                "B. Emisi gas rumah kaca adalah penyumbang terbesar pemanasan global.",
                "C. Volume air laut yang melimpah akhirnya menaikkan tinggi permukaan laut global.",
                "D. Akibatnya, cuaca di berbagai belahan dunia menjadi tidak dapat diprediksi.",
                "E. Banyak aktivis lingkungan yang menuntut pengurangan bahan bakar fosil."
            ],
            correct: 2,
            explanation: "<b>Jawaban: C</b><br>Soal ini membutuhkan jembatan logis (sebab-akibat). Es kutub mencair (2) mengakibatkan ancaman pulau tenggelam (4). Apa proses penghubungnya? Tentu saja <b>volume air laut naik</b> (Opsi C)."
        },
        {
            level: "Sulit",
            type: "Kalimat Tidak Padu",
            question: "(1) Keberhasilan sebuah *startup* tidak melulu ditentukan oleh ide bisnis yang cemerlang di awal pendirian. (2) Eksekusi yang konsisten dan karakter tim yang solid justru memainkan peran jauh lebih krusial. (3) Investor berpengalaman biasanya akan menelisik rekam jejak para pendiri sebelum menyuntikkan dana. (4) Banyak karyawan generasi Z sering melakukan *job-hopping* (kutu loncat) demi mengejar kenaikan gaji yang instan. (5) Tanpa fondasi tim inti yang saling percaya, ide sebrilian apa pun umumnya akan berujung pada kegagalan.<br><br>Kalimat sumbang ditunjukkan oleh...",
            options: [
                "A. (1)",
                "B. (2)",
                "C. (3)",
                "D. (4)",
                "E. (5)"
            ],
            correct: 3,
            explanation: "<b>Jawaban: D. (4)</b><br>Ide pokok paragraf ini adalah <b>faktor penentu kesuksesan startup (eksekusi dan tim/founder inti)</b>. Kalimat (5) merujuk kembali ke gagasan tim. Kalimat (4) yang menyinggung fenomena karyawan Gen Z pindah-pindah kerja demi gaji merusak koherensi makna paragraf."
        },
        {
            level: "Sulit",
            type: "Menyusun Kalimat",
            question: "Susun kalimat berikut menjadi paragraf padu yang membahas fungsi psikologis sebuah aktivitas!<br><br>(1) Hal ini membuktikan bahwa seni memiliki fungsi terapeutik yang mendalam.<br>(2) Melukis sering dijadikan medium oleh seseorang untuk mengekspresikan emosi yang terpendam.<br>(3) Tanpa disadari, beban pikiran yang berat perlahan luruh seiring tangan menorehkan warna di kanvas.<br>(4) Warna-warna yang dipilih tersebut biasanya merepresentasikan suasana batin pelukisnya secara jujur.<br>(5) Oleh karena itu, pendekatan terapi seni mulai banyak diadopsi di berbagai klinik psikologi modern.",
            options: [
                "A. (2)-(4)-(3)-(1)-(5)",
                "B. (2)-(3)-(4)-(1)-(5)",
                "C. (1)-(2)-(4)-(3)-(5)",
                "D. (2)-(4)-(1)-(3)-(5)",
                "E. (2)-(1)-(4)-(3)-(5)"
            ],
            correct: 0,
            explanation: "<b>Jawaban: A</b><br>(2) Ide pembuka: melukis sbg ekspresi emosi.<br>(4) Menjelaskan lebih lanjut elemen melukis (warna = suasana batin).<br>(3) Proses melepaskan emosi (beban pikiran luruh).<br>(1) Simpulan dari fenomena (1-3) bahwa seni punya fungsi terapeutik (<i>Hal ini membuktikan...</i>).<br>(5) Simpulan/tindakan akhir (<i>Oleh karena itu...</i> terapi seni diadopsi)."
        },
        {
            level: "Sulit",
            type: "Melengkapi Konjungsi",
            question: "Kurikulum pendidikan nasional mutlak perlu dievaluasi secara berkala ... tetap relevan dengan cepatnya perubahan zaman. ..., pembaruan kurikulum ini harus diiringi secara paralel dengan peningkatan kualitas pedagogik guru. ..., sehebat apa pun rancangan silabus di atas kertas, target belajar tak akan tercapai jika sang pengajar belum siap beradaptasi.<br><br>Kata hubung intrakalimat dan antarkalimat yang paling tepat berturut-turut adalah...",
            options: [
                "A. karena, Akan tetapi, Bahkan",
                "B. agar, Selain itu, Sebab",
                "C. sehingga, Sebaliknya, Namun",
                "D. untuk, Kemudian, Oleh karena itu",
                "E. supaya, Meskipun demikian, Akibatnya"
            ],
            correct: 1,
            explanation: "<b>Jawaban: B</b><br>Rumpang 1 intrakalimat: Menyatakan tujuan (<i>agar/supaya</i> tetap relevan).<br>Rumpang 2 antarkalimat: Menambahkan syarat sejajar yang tak kalah penting (<i>Selain itu</i>).<br>Rumpang 3 antarkalimat: Menyatakan alasan/kausalitas logis mengapa kualitas guru itu penting (<i>Sebab / Karena</i>)."
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;

    // DOM Elements
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const explanationBox = document.getElementById('explanation-box');
    const btnNext = document.getElementById('btn-next');
    const progressText = document.getElementById('progress-text');
    const difficultyBadge = document.getElementById('difficulty-badge');
    const scoreText = document.getElementById('score-text');
    const feedbackText = document.getElementById('feedback-text');

    function loadQuestion() {
        const q = quizData[currentQuestionIndex];
        
        // Reset state
        isAnswered = false;
        explanationBox.style.display = 'none';
        btnNext.style.display = 'none';
        optionsContainer.innerHTML = '';
        
        // Update header info
        progressText.innerText = `Soal ${currentQuestionIndex + 1} dari ${quizData.length}`;
        
        // Setup difficulty badge
        difficultyBadge.innerText = `Tingkat: ${q.level}`;
        if(q.level === 'Sedang') {
            difficultyBadge.className = 'difficulty-badge diff-sedang';
        } else {
            difficultyBadge.className = 'difficulty-badge diff-sulit';
        }

        // Setup Question Text
        questionText.innerHTML = `<b>[${q.type}]</b><br><br>${q.question}`;

        // Create Options
        q.options.forEach((optText, i) => {
            const optDiv = document.createElement('div');
            optDiv.className = 'option';
            optDiv.innerHTML = optText;
            optDiv.onclick = () => selectOption(i, optDiv);
            optionsContainer.appendChild(optDiv);
        });
    }

    function selectOption(selectedIndex, selectedDiv) {
        if (isAnswered) return; // Prevent multiple clicks
        isAnswered = true;

        const q = quizData[currentQuestionIndex];
        const allOptions = optionsContainer.children;

        // Disable all options
        for(let i = 0; i < allOptions.length; i++) {
            allOptions[i].classList.add('disabled');
        }

        // Check Correct/Incorrect
        if (selectedIndex === q.correct) {
            selectedDiv.classList.add('correct');
            score++;
        } else {
            selectedDiv.classList.add('incorrect');
            allOptions[q.correct].classList.add('correct'); // Reveal true answer
        }

        // Show Explanation
        explanationBox.innerHTML = q.explanation;
        explanationBox.style.display = 'block';

        // Show Next Button
        btnNext.style.display = 'block';
        if (currentQuestionIndex === quizData.length - 1) {
            btnNext.innerText = 'Lihat Hasil Akhir';
        } else {
            btnNext.innerText = 'Soal Selanjutnya';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';
        scoreText.innerText = `${score} / ${quizData.length}`;
        
        let percentage = (score / quizData.length) * 100;
        if (percentage >= 85) {
            feedbackText.innerHTML = "🎯 <b>Luar Biasa!</b> Logika dan pemahaman struktur kalimatmu sudah di level dewa. Kamu sangat siap menghadapi TKA!";
            feedbackText.style.color = "var(--success)";
        } else if (percentage >= 60) {
            feedbackText.innerHTML = "👍 <b>Kerja Bagus!</b> Pemahamanmu sudah kuat. Tinggal pertajam lagi analisis soal tipe Sulit (Pronomina & Konjungsi).";
            feedbackText.style.color = "#d97706";
        } else {
            feedbackText.innerHTML = "💪 <b>Terus Semangat!</b> Jangan menyerah. Baca kembali materi konjungsi dan repetisi kalimat sebelum mencoba kuis ini lagi.";
            feedbackText.style.color = "var(--danger)";
        }
    }

    // Initialize Quiz
    loadQuestion();
</script>
