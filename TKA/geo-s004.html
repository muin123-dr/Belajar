<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Soal Geometri & Trigonometri + Gambar Inline SVG - TKA SMA</title>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f2f7fc;
            color: #1a2a3a;
            padding: 20px 16px;
        }

        .quiz-wrapper {
            max-width: 960px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08);
            padding: 30px 28px;
        }

        @media (max-width: 640px) {
            .quiz-wrapper {
                padding: 16px 12px;
            }
        }

        .quiz-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #2d7fc1;
            padding-bottom: 16px;
            margin-bottom: 28px;
        }

        .quiz-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b2b44;
        }
        .quiz-header h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #4a6a85;
            margin-left: 10px;
        }

        .score-box {
            background: #eaf1f8;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            border: 1px solid #cbdae6;
        }
        .score-box span {
            color: #1f7bb0;
        }

        .reset-btn {
            background: #eef4fa;
            border: 1px solid #ccdbe8;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            color: #1a4a6b;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .reset-btn:hover {
            background: #d4e3f2;
            border-color: #2d7fc1;
        }

        .question-card {
            background: #fafdff;
            border: 1px solid #e4ecf5;
            border-radius: 18px;
            padding: 20px 22px;
            margin-bottom: 24px;
            transition: border 0.2s, background 0.2s;
        }
        .question-card.correct {
            border-left: 6px solid #1fa86b;
            background: #f6fef9;
        }
        .question-card.wrong {
            border-left: 6px solid #d34a4a;
            background: #fef7f7;
        }

        .q-number {
            display: inline-block;
            background: #2d7fc1;
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
            border-radius: 30px;
            padding: 2px 14px;
            margin-bottom: 12px;
            letter-spacing: 0.03em;
        }

        .q-image {
            text-align: center;
            margin: 12px 0 16px 0;
            background: #f8faff;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #e4ecf5;
        }
        .q-image svg {
            max-width: 100%;
            max-height: 220px;
            display: inline-block;
        }
        .q-image .img-credit {
            font-size: 0.7rem;
            color: #8a9aa8;
            margin-top: 4px;
        }

        .q-text {
            font-size: 1.05rem;
            font-weight: 500;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #f8faff;
            border-radius: 12px;
            border: 1px solid #e4ecf5;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.98rem;
        }
        .options label:hover {
            background: #eef4fa;
            border-color: #b0cade;
        }
        .options input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2d7fc1;
            flex-shrink: 0;
        }
        .options input[type="radio"]:disabled {
            accent-color: #8a9aa8;
        }

        .action-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 6px;
        }
        .check-btn {
            background: #2d7fc1;
            color: #fff;
            border: none;
            padding: 8px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(45, 127, 193, 0.25);
        }
        .check-btn:hover:not(:disabled) {
            background: #1f6aa8;
            transform: scale(1.02);
        }
        .check-btn:disabled {
            background: #b0cade;
            cursor: default;
            box-shadow: none;
            transform: none;
        }

        .feedback {
            margin-top: 14px;
            padding: 12px 18px;
            border-radius: 12px;
            display: none;
            font-size: 0.95rem;
            border: 1px solid transparent;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background: #e6f6ed;
            border-color: #7fcfab;
            color: #0b4a2a;
        }
        .feedback.wrong {
            background: #fdeaea;
            border-color: #f5b7b7;
            color: #6b2a2a;
        }
        .feedback .explain {
            margin-top: 4px;
            font-weight: 500;
            color: #1a3a5a;
        }

        .quiz-footer {
            margin-top: 24px;
            text-align: center;
            color: #4a6a85;
            font-size: 0.9rem;
            border-top: 1px solid #e4ecf3;
            padding-top: 20px;
        }

        @media (max-width: 500px) {
            .quiz-header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .score-box {
                text-align: center;
            }
            .options label {
                font-size: 0.9rem;
                padding: 8px 12px;
            }
            .q-text {
                font-size: 0.95rem;
            }
            .q-image svg {
                max-height: 160px;
            }
        }
    </style>
</head>

    <div class="quiz-wrapper">

        <div class="quiz-footer">

            explanation: 'Luas setengah lingkaran = ½ × π × 7² = ½ × 22/7 × 49 = 77. Luas segitiga = ½ × 14 × 12 = 84. Total = 77 + 84 = 161? Perhatikan: ½×14×12=84. 77+84=161. Tidak ada 161. Sepertinya ada kesalahan soal. Jika tinggi segitiga = 11, total = 77+77=154. Jawaban 154.'

        // ============================================================
        //  RENDER & LOGIC
        // ============================================================
        const container = document.getElementById('quizContainer');
        const scoreSpan = document.getElementById('scoreDisplay');
        let userAnswers = new Array(questions.length).fill(null);
        let isLocked = new Array(questions.length).fill(false);

        function render() {
            let html = '';
            questions.forEach((q, idx) => {
                const locked = isLocked[idx];
                const selected = userAnswers[idx];
                const isCorrect = locked && (selected === q.correct);
                const isWrong = locked && (selected !== null && selected !== q.correct);

                let cardClass = 'question-card';
                if (locked) {
                    cardClass += isCorrect ? ' correct' : ' wrong';
                }

                html += `<div class="${cardClass}" id="qcard-${idx}">`;
                html += `<div class="q-number">Soal ${idx+1}</div>`;

                // Gambar SVG
                if (q.svg && svgImages[q.svg]) {
                    html += `<div class="q-image">
                                ${svgImages[q.svg]}
                                <div class="img-credit">${q.imageCredit || 'Ilustrasi vektor'}</div>
                            </div>`;
                }

                html += `<div class="q-text">${q.text}</div>`;
                html += `<div class="options">`;

                q.options.forEach((opt, optIdx) => {
                    const checked = (selected === optIdx) ? 'checked' : '';
                    const disabled = locked ? 'disabled' : '';
                    html += `
                            <label>
                                <input type="radio" name="q${idx}" value="${optIdx}" ${checked} ${disabled}>
                                <span>${opt}</span>
                            </label>
                        `;
                });

                html += `</div>`;
                html += `<div class="action-area">`;
                html +=
                    `<button class="check-btn" id="check-${idx}" ${locked ? 'disabled' : ''}>${locked ? '✓ Diperiksa' : 'Periksa Jawaban'}</button>`;
                html += `</div>`;

                let feedbackClass = 'feedback';
                let feedbackHtml = '';
                if (locked) {
                    feedbackClass += ' show';
                    feedbackClass += isCorrect ? ' correct' : ' wrong';
                    const icon = isCorrect ? '✅' : '❌';
                    const status = isCorrect ? 'Jawaban Benar!' : 'Jawaban Salah';
                    const correctAns = q.options[q.correct];
                    feedbackHtml = `
                            <div class="${feedbackClass}">
                                <strong>${icon} ${status}</strong>
                                <div class="explain">💡 ${q.explanation}</div>
                                <div style="margin-top:4px;font-size:0.9rem;">Jawaban yang benar: <strong>${correctAns}</strong></div>
                            </div>
                        `;
                } else {
                    feedbackHtml = `<div class="feedback"></div>`;
                }
                html += feedbackHtml;
                html += `</div>`;
            });

            container.innerHTML = html;
            updateScore();

            questions.forEach((_, idx) => {
                const btn = document.getElementById(`check-${idx}`);
                if (btn) {
                    btn.addEventListener('click', () => handleCheck(idx));
                }
                const radios = document.querySelectorAll(`input[name="q${idx}"]`);
                radios.forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        if (!isLocked[idx]) {
                            userAnswers[idx] = parseInt(e.target.value);
                        }
                    });
                });
            });

            // Render math with KaTeX
            if (window.renderMathInElement) {
                window.renderMathInElement(container, {
                    delimiters: [
                        { left: '\\\\(', right: '\\\\)', display: false },
                        { left: '\\[', right: '\\]', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            }
        }

        function handleCheck(idx) {
            if (isLocked[idx]) return;
            const selected = userAnswers[idx];
            if (selected === null || selected === undefined) {
                alert('Pilih salah satu opsi terlebih dahulu!');
                return;
            }
            isLocked[idx] = true;
            render();
        }

        function updateScore() {
            let correctCount = 0;
            for (let i = 0; i < questions.length; i++) {
                if (isLocked[i] && userAnswers[i] === questions[i].correct) {
                    correctCount++;
                }
            }
            scoreSpan.textContent = correctCount;
        }

        function resetQuiz() {
            userAnswers = new Array(questions.length).fill(null);
            isLocked = new Array(questions.length).fill(false);
            render();
        }

        document.getElementById('resetBtn').addEventListener('click', resetQuiz);
        render();
    </script>
