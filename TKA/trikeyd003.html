    }

      gap: 10px;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fbbf24;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #fbbf24, #f59e0b);
      border-radius: 10px;
      transition: width 0.3s;
    }

      display: inline-block;

      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-sedang {
      background: #fbbf24;
      color: #0f172a;
    }
    .badge-tinggi {
      background: #ef4444;
      color: #fff;
    }
    .sentence-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .sentence-text {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.5;
      word-break: break-word;
      margin-bottom: 16px;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }
    .btn-true {
      background: #22c55e;
      color: #fff;
    }
    .btn-true:hover {
      background: #16a34a;
    }
    .btn-false {
      background: #ef4444;
      color: #fff;
    }
    .btn-false:hover {
      background: #dc2626;
    }
    .btn-next {
      background: #fbbf24;
      color: #0f172a;
      border: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 16px rgba(251,191,36,0.5);
    }
    .btn-next:hover {
      background: #fcd34d;
    }
    .analysis-box {
      margin-top: 20px;
      animation: fadeSlide 0.3s ease;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .feedback {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .verdict.correct {
      color: #4ade80;
    }
    .verdict.incorrect {
      color: #f87171;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }

      background: rgba(251,191,36,0.2);

    td {

    .fail {

    }

      border-radius: 10px;
      padding: 12px 16px;

          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: true,
        alasan: "Kalimat ini sudah benar menurut EYD.",
        perbaikan: "Kalimat sudah benar."
      },
      {
        difficulty: "tinggi",
        kalimat: "Rumah itu di jual dengan harga murah.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "Tidak ada." },
          { nama: "Tanda koma", status: true, detail: "Tidak ada." },
          { nama: "Penulisan \"di\"", status: false, detail: "'di jual' harus 'dijual' (imbuhan pasif, serangkai)." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: false,
        alasan: "Penulisan 'di' pasif salah.",
        perbaikan: "Rumah itu dijual dengan harga murah."
      },
      {
        difficulty: "tinggi",
        kalimat: "Bapak dan Ibu sedang berkunjung kerumah saudara.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "'Bapak' dan 'Ibu' di sini sebagai sapaan, kapital diperbolehkan." },
          { nama: "Tanda koma", status: true, detail: "Tidak ada." },
          { nama: "Penulisan \"di\"", status: false, detail: "'kerumah' seharusnya 'ke rumah' (kata depan tempat)." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: false,
        alasan: "Kata depan 'ke' ditulis serangkai.",
        perbaikan: "Bapak dan Ibu sedang berkunjung ke rumah saudara."
      },
      {
        difficulty: "tinggi",
        kalimat: "Kami berolahraga setiap jum'at sore.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: false, detail: "'jum'at' harus 'Jumat' (tanpa apostrof, kapital)." },
          { nama: "Tanda koma", status: true, detail: "Tidak ada." },
          { nama: "Penulisan \"di\"", status: true, detail: "Tidak ada." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: false,
        alasan: "Penulisan hari 'Jumat' tidak tepat, gunakan tanpa apostrof dan kapital.",
        perbaikan: "Kami berolahraga setiap Jumat sore."
      },
      {
        difficulty: "tinggi",
        kalimat: "Dimana kamu menyimpan buku itu?",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "Tidak ada." },
          { nama: "Tanda koma", status: true, detail: "Tidak ada." },
          { nama: "Penulisan \"di\"", status: false, detail: "'Dimana' harus 'Di mana' (kata depan + tanya, terpisah)." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: false,
        alasan: "Kata tanya 'di mana' ditulis terpisah.",
        perbaikan: "Di mana kamu menyimpan buku itu?"
      }
    ];

    const app = document.getElementById('app');
    let currentIndex = 0;
    let answered = false;

    function renderSoal(index) {
      const item = exercises[index];
      const total = exercises.length;
      const progressPercent = ((index) / total) * 100;
      answered = false;

      const diffBadge = item.difficulty === 'sedang' ? 'badge-sedang' : 'badge-tinggi';
      const diffLabel = item.difficulty === 'sedang' ? 'SEDANG' : 'TINGGI';

      let html = `
        <h1>🔎 Identifikasi Kalimat EYD</h1>
        <div class="subtitle">Soal ${index+1} dari ${total} • <span class="difficulty-badge ${diffBadge}">${diffLabel}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${progressPercent}%;"></div></div>
        <div class="progress">Soal ${index+1}/${total}</div>
        <div class="sentence-card" id="sentenceCard">
          <div class="sentence-text">${index+1}. ${item.kalimat}</div>
          <div id="actionArea">
            <div class="action-buttons">
              <button class="btn btn-true" id="btnBenar">✅ Benar</button>
              <button class="btn btn-false" id="btnSalah">❌ Salah</button>
            </div>
          </div>
          <div id="analysisArea" style="display:none;"></div>
        </div>
        <div class="nav-buttons" id="navButtons">
          <button class="btn-outline" id="prevBtn" ${index === 0 ? 'disabled' : ''}>◀ Sebelumnya</button>
          <span style="color:#94a3b8;">${index+1}/${total}</span>
          <button class="btn-outline" id="nextBtn" disabled>Selanjutnya ▶</button>
        </div>
      `;

      app.innerHTML = html;

      document.getElementById('btnBenar')?.addEventListener('click', () => handleAnswer(true));
      document.getElementById('btnSalah')?.addEventListener('click', () => handleAnswer(false));
      document.getElementById('prevBtn')?.addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex--;
          renderSoal(currentIndex);
        }
      });
      document.getElementById('nextBtn')?.addEventListener('click', goToNext);
    }

    function handleAnswer(userChoice) {
      if (answered) return;
      answered = true;
      const item = exercises[currentIndex];
      const sebenarnya = item.kesimpulan;

      document.getElementById('actionArea').style.display = 'none';
      const analysisArea = document.getElementById('analysisArea');
      analysisArea.style.display = 'block';

      const isCorrect = (userChoice === sebenarnya);
      const feedbackText = isCorrect ? "✅ Jawaban Anda tepat!" : "❌ Jawaban Anda kurang tepat.";

      let trikRows = '';
      item.trik.forEach(t => {
        trikRows += `
          <tr>
            <td>${t.nama}</td>
            <td class="status-icon ${t.status ? 'pass' : 'fail'}">${t.status ? '✔' : '✘'}</td>
            <td>${t.detail}</td>
          </tr>
        `;
      });

      const kesimpulanLabel = sebenarnya ? "<span class='correct'>BENAR</span>" : "<span class='incorrect'>SALAH</span>";

      analysisArea.innerHTML = `
        <div class="feedback">${feedbackText} Kalimat ini seharusnya dinilai <strong>${kesimpulanLabel}</strong>.</div>
        <div class="verdict ${sebenarnya ? 'correct' : 'incorrect'}">
          Status: ${sebenarnya ? '✅ BENAR' : '❌ SALAH'} — ${item.alasan}
        </div>
        <table>
          <thead><tr><th>Trik</th><th>Status</th><th>Keterangan</th></tr></thead>
          <tbody>${trikRows}</tbody>
        </table>
        <div class="perbaikan-box">
          <strong>📝 Perbaikan:</strong> ${item.perbaikan}
        </div>
      `;

      document.getElementById('nextBtn').disabled = false;
    }

    function goToNext() {
      if (currentIndex < exercises.length - 1) {
        currentIndex++;
        renderSoal(currentIndex);
      } else {
        app.innerHTML = `
          <div style="text-align:center; padding:2rem 1rem;">
            <div style="font-size:4rem;">🎉</div>
            <h2 style="margin:16px 0; color:#fbbf24;">Latihan Selesai!</h2>
            <p style="color:#cbd5e1; margin-bottom:24px;">Kamu telah menyelesaikan 25 soal identifikasi kalimat EYD.</p>
            <button class="btn btn-next" id="restartBtn">🔄 Ulangi Latihan</button>
          </div>
        `;
        document.getElementById('restartBtn')?.addEventListener('click', () => {
          currentIndex = 0;
          renderSoal(currentIndex);
        });
      }
    }

    renderSoal(0);
  })();
</script>
</body>
</html>
