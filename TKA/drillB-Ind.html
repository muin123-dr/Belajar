    correct:0,

},{
    id:3, tipe:'pg',
    kutipan: `Sebagian besar bahan alami yang dijadikan obat herbal memang aman untuk dikonsumsi. Meski begitu, obat herbal tetap berpotensi menyebabkan efek samping. Informasi mengenai efek samping yang mungkin terjadi biasanya tertera pada kemasan produk obat herbal. Agar terhindar dari efek samping yang berbahaya, ikutilah tips-tips berikut ini saat mengonsumsi obat herbal: • Pastikan produk herbal telah terdaftar di BPOM RI. • Periksa tanggal kedaluwarsa produk. • Ikuti petunjuk pemakaian dan dosis yang tercantum di kemasan. • Hubungi layanan konsumen produk herbal jika Anda ingin mengetahui lebih jelas mengenai produk mereka. • Konsultasi dulu ke dokter sebelum mengonsumsi obat herbal. • Hentikan penggunaan obat herbal apabila gejala tidak membaik atau justru semakin parah.`,

},{
    id:4, tipe:'pg',
    kutipan: `Tidak semua orang juga boleh mengonsumsi obat herbal. Ada beberapa kelompok yang perlu menghindari konsumsi obat herbal, yaitu: Ibu hamil dan menyusui; Orang yang akan menjalani operasi; Orang dengan kondisi medis tertentu, seperti gangguan fungsi hati, gangguan fungsi ginjal, atau penyakit autoimun. Selain itu, obat herbal tidak bisa dikonsumsi bersama obat-obatan tertentu, seperti obat penurun tekanan darah, obat pengencer darah, dan obat untuk diabetes, karena dapat menimbulkan interaksi obat dan efek samping yang serius.`,

},{
    id:5, tipe:'pg',

},{
    id:6, tipe:'pg',
    kutipan: `Tidak semua orang juga boleh mengonsumsi obat herbal. Ada beberapa kelompok yang perlu menghindari konsumsi obat herbal, yaitu: Ibu hamil dan menyusui; Orang yang akan menjalani operasi; Orang dengan kondisi medis tertentu...`,

},{
    id:8, tipe:'pgk',
    kutipan: `Pagi itu pelabuhan Tanjung Permai dipenuhi hiruk pikuk pedagang, nelayan, dan penumpang yang bersiap melakukan perjalanan. Di tengah keramaian itu, sebuah kapal kecil bermesin tua bernama Sinar Laut menjadi perhatian banyak orang. Kapal itu telah melayani perjalanan antar-pulau selama puluhan tahun dan dianggap sebagai saksi hidup perubahan ekonomi masyarakat pesisir. Namun, sejak beberapa bulan terakhir, kondisi mesin kapal sering bermasalah. Suara mesin terdengar tersengal-sengal, dan asap hitam tebal kerap keluar dari knalpotnya. Banyak warga mulai mengeluhkan keamanan perjalanan karena beberapa kali Sinar Laut hampir terlambat tiba akibat kerusakan mendadak. Meskipun demikian, kapal itu masih tetap beroperasi karena belum ada pengganti yang memadai, dan jalur pelayaran antar-pulau menjadi sangat vital bagi perdagangan ikan, hasil kebun, serta kebutuhan sehari-hari warga. Pemerintah daerah sebenarnya telah mengusulkan program peremajaan armada kapal kecil, tetapi prosesnya terhambat oleh birokrasi dan anggaran yang belum disetujui. Sementara itu, para nelayan dan pedagang hanya bisa berharap agar Sinar Laut tetap mampu bertahan, setidaknya sampai kapal baru tersedia. Bagi mereka, kapal itu bukan hanya alat transportasi, tetapi juga simbol harapan dan penghubung utama kehidupan ekonomi pesisir.`,

},{
    id:9, tipe:'pgk',
    kutipan: `Perkembangan teknologi informasi membawa perubahan besar dalam pola komunikasi masyarakat. Namun, tidak semua perubahan tersebut berdampak positif. Dalam beberapa tahun terakhir, marak ditemukan unggahan media sosial yang menggunakan bahasa secara berlebihan, tidak efektif, bahkan tidak sesuai dengan konteks komunikasi publik. Misalnya, penggunaan istilah asing yang tidak perlu dalam kalimat sederhana, seperti “Let’s improve our daily habit agar hidup lebih produktif!” Penggunaan campur kode tersebut memang tidak sepenuhnya salah, tetapi menjadi kurang tepat bila disampaikan dalam konteks kampanye kesehatan nasional yang menekankan penggunaan bahasa Indonesia yang baik dan benar. Selain itu, masih sering dijumpai kesalahan logika kalimat akibat ketidaktepatan diksi. Contohnya dalam sebuah brosur kesehatan tertulis: “Masyarakat diharapkan untuk tidak membuang sampah di sungai agar tidak terjadi banjir yang dapat mengancam keselamatan hidup manusia yang tidak bertanggung jawab.” Kalimat tersebut tidak jelas subjeknya dan menimbulkan ambiguitas, karena bagian “yang tidak bertanggung jawab” dapat merujuk pada “manusia” ataupun “banjir”. Ketidaktepatan struktur kalimat semacam ini dapat menurunkan efektivitas pesan informasi. Untuk mencapai komunikasi publik yang baik, penggunaan bahasa harus memperhatikan konteks, struktur kalimat yang jelas, pilihan kata yang tepat, dan kesesuaian antara tujuan komunikasi dengan medium yang digunakan.`,
    text: 'Berdasarkan teks di atas, manakah pernyataan berikut yang menunjukkan penilaian ketepatan dan kesesuaian penggunaan bahasa dalam teks? (Pilih lebih dari satu)',
    options: ['A. Penggunaan istilah asing dalam kalimat sederhana menjadi tidak tepat ketika konteks komunikasi menuntut bahasa Indonesia yang baku.','B. Kalimat pada brosur kesehatan dapat membingungkan karena struktur kalimatnya menimbulkan ambiguitas makna.','C. Campur kode dalam media sosial harus dihilangkan sepenuhnya agar masyarakat terbiasa menggunakan bahasa Indonesia baku.','D. Ketidaktepatan diksi dapat mempengaruhi kejelasan informasi dalam komunikasi publik.','E. Penggunaan kalimat panjang otomatis membuat informasi menjadi lebih efektif dan mudah dipahami.'],
    correct:[0,1,3],
    explanation: 'A (benar) — sesuai dengan penjelasan teks tentang kampanye kesehatan nasional yang menekankan bahasa Indonesia baik dan benar. B (benar) — sesuai dengan analisis teks tentang kalimat brosur yang tidak jelas subjeknya. D (benar) — sesuai dengan penjelasan teks tentang kesalahan logika kalimat akibat ketidaktepatan diksi. C (salah) — teks tidak menyatakan harus dihilangkan sepenuhnya, hanya “kurang tepat” dalam konteks tertentu. E (salah) — bertentangan dengan teks yang justru mengkritik kalimat panjang yang tidak efektif.'

    id:10, tipe:'pgk',
    kutipan: `Di sebuah desa yang dikelilingi hutan pinus, hiduplah seorang remaja bernama Darma, yang dikenal pendiam namun cermat memperhatikan keadaan sekelilingnya. Setiap sore ia berjalan menuju bukit kecil di belakang rumahnya untuk mencatat perubahan warna langit dan arah angin dalam buku catatannya. Menurut ibunya, kebiasaan itu muncul sejak Darma menemukan burung elang yang terluka dua tahun lalu; sejak saat itu, ia merasa bertanggung jawab menjaga keseimbangan alam di sekitar desa. Suatu hari, desa mereka diguncang rumor mengenai suara raungan yang terdengar dari dalam hutan pada malam hari. Banyak warga menduga suara itu berasal dari hewan liar besar yang kelaparan. Namun, Darma meyakini ada hal lain yang terjadi. Dalam salah satu catatannya, ia menemukan pola bahwa raungan tersebut hanya muncul ketika angin bertiup dari arah utara, tepat dari wilayah yang sejak lama dianggap angker oleh penduduk desa. Pada malam berikutnya, Darma memberanikan diri memasuki hutan ditemani senter kecil dan buku catatannya. Ia menemukan bekas–bekas tapak kaki yang tidak menyerupai jejak hewan mana pun yang pernah ia kenal. Tapak itu besar, seolah milik makhluk setinggi manusia, namun bentuknya lebih menyerupai cakar. Darma menyimpulkan bahwa ada sesuatu yang tidak biasa sedang terjadi, dan ia bertekad mengungkapnya meskipun nyawanya berisiko.`,
    text: 'Berdasarkan teks di atas, manakah pernyataan berikut yang paling tepat menilai kesesuaian bagian teks dalam menggambarkan karakter, peristiwa, atau latar? (Pilih lebih dari satu)',
    options: ['A. Bagian yang menceritakan kebiasaan Darma mencatat perubahan alam menunjukkan bahwa ia adalah sosok yang teliti dan peduli lingkungan.','B. Deskripsi adanya raungan dari arah utara memperkuat latar desa yang dipenuhi misteri dan kepercayaan masyarakat.','C. Tindakan Darma memasuki hutan seorang diri dengan senter kecil menunjukkan bahwa ia memiliki sifat pengecut dan mudah menyerah.','D. Bagian teks yang menjelaskan jejak misterius di hutan menggambarkan peristiwa yang menegangkan dan penuh tanda bahaya.','E. Penjelasan mengenai burung elang terluka tidak relevan dalam menggambarkan karakter Darma karena tidak berhubungan dengan kepribadiannya.'],
    correct:[0,1,3],
    explanation: 'A (benar) — sesuai dengan deskripsi Darma yang “cermat” dan merasa “bertanggung jawab menjaga keseimbangan alam”. B (benar) — sesuai dengan teks tentang wilayah yang “dianggap angker oleh penduduk desa”. D (benar) — sesuai dengan deskripsi jejak tidak biasa dan pernyataan “nyawanya berisiko”. C (salah) — justru menunjukkan keberanian, bukan pengecut. E (salah) — sangat relevan karena menjelaskan asal mula kepedulian Darma pada alam.'

    id:11, tipe:'pg',
    kutipan: `Pada awal tahun ajaran baru, SMP Harapan Bangsa menetapkan aturan baru mengenai penggunaan telepon genggam di lingkungan sekolah. Pihak sekolah mengumumkan bahwa siswa tidak diperbolehkan membawa gawai ke kelas kecuali untuk kebutuhan pembelajaran yang diawasi guru. Aturan ini memicu perdebatan antara siswa, orang tua, dan pihak sekolah. Beberapa siswa merasa aturan tersebut terlalu membatasi, terutama karena mereka membutuhkan telepon untuk komunikasi dengan orang tua setelah pulang sekolah. Sebaliknya, para guru menilai bahwa penggunaan gawai selama ini telah menurunkan konsentrasi belajar dan meningkatkan kasus pelanggaran seperti penggunaan media sosial saat pelajaran berlangsung. Situasi semakin rumit ketika sejumlah orang tua mengirimkan surat keberatan kepada kepala sekolah. Mereka menilai bahwa aturan itu tidak mempertimbangkan kebutuhan keamanan anak-anak mereka, terutama bagi siswa yang pulang sendiri. Sementara itu, komite sekolah berpendapat bahwa aturan tersebut penting untuk menciptakan lingkungan belajar yang lebih disiplin. Kepala sekolah kemudian berencana mengadakan pertemuan untuk meredakan ketegangan dan mencari solusi yang bisa diterima semua pihak.`,
    text: 'Apa saja konflik yang muncul dalam bacaan tersebut? (Pilih lebih dari satu)',
    options: ['A. Konflik antara siswa dan sekolah mengenai aturan pembatasan gawai.','B. Konflik antara orang tua dan komite sekolah terkait keamanan anak.','C. Konflik antara guru dan orang tua tentang dampak penggunaan gawai.','D. Konflik antara siswa dan guru mengenai disiplin belajar.','E. Konflik antara kepala sekolah dan komite sekolah terkait keputusan final aturan gawai.'],
    correct:[0,2,3],
    explanation: 'A (benar) — siswa merasa aturan terlalu membatasi, sekolah membuat aturan. C (benar) — guru menilai gawai menurunkan konsentrasi, orang tua khawatir soal keamanan. D (benar) — guru menilai gawai mengganggu konsentrasi, siswa merasa dibatasi. B (salah) — orang tua berkonflik dengan sekolah, bukan langsung dengan komite sekolah. E (salah) — tidak ada indikasi konflik antara kepala sekolah dan komite sekolah.'

    id:12, tipe:'pgk',
    kutipan: `Pada sebuah acara malam sastra di aula sekolah, tiga karya ditampilkan secara berurutan. Pertama, seorang siswi membacakan puisi berjudul “Lilin di Beranda”. Puisi itu menggambarkan seorang anak yang menunggu ibunya pulang bekerja pada malam hujan. Imaji tetesan air, aroma tanah basah, dan cahaya lilin yang bergetar membuat suasana terasa hening, rapuh, dan penuh kerinduan. Beberapa penonton tampak menunduk, seolah ikut merasakan kesepian sang tokoh liris. Selanjutnya, dibacakan sebuah potongan prosa dari cerpen "Langkah Pamit" yang menggambarkan seorang pemuda yang harus meninggalkan kampung halamannya setelah terjadi pertikaian keluarga. Narasi tentang perjalanan malam, rasa bersalah, dan bayangan wajah neneknya yang menangis menimbulkan suasana muram, namun sekaligus menunjukkan harapan bahwa suatu saat konflik akan mereda. Penonton tampak terdiam lama setelah pembacaan selesai. Terakhir, sebuah adegan drama singkat ditampilkan. Adegan tersebut memperlihatkan dua sahabat yang saling menyalahkan setelah kesalahpahaman besar terjadi. Suara mereka meningkat, gerak tubuh tegang, dan jeda panjang di antara dialog menciptakan atmosfer emosional yang intens. Pada bagian ketika salah satu tokoh akhirnya menangis dan meminta maaf, beberapa penonton terdenar menarik napas panjang, sementara yang lain tampak memalingkan wajah karena terharu.`,
    text: 'Berdasarkan teks di atas, manakah pernyataan berikut yang menggambarkan respons emosional yang dapat disimpulkan dari penonton terhadap unsur puisi, prosa, dan drama? (Pilih lebih dari satu)',
    options: ['A. Penonton merasakan kesesakan emosional dan kerinduan saat mendengarkan puisi “Lilin di Beranda.”','B. Pembacaan prosa “Langkah Pamit” membangkitkan rasa hampa dan ketidakpedulian dalam diri penonton.','C. Adegan drama membuat penonton ikut tegang dan tersentuh oleh konflik yang diperlihatkan kedua tokoh.','D. Suasana muram dalam cerpen menciptakan keheningan sebagai tanda empati dan penghayatan penonton.','E. Puisi yang dibacakan tidak memunculkan reaksi emosional karena isinya terlalu deskriptif dan tidak menyentuh.'],
    correct:[0,2,3],
    explanation: 'A (benar) — sesuai dengan deskripsi “hening, rapuh, dan penuh kerinduan” serta penonton “ikut merasakan kesepian”. C (benar) — sesuai dengan deskripsi “atmosfer emosional yang intens” dan penonton “terharu”. D (benar) — sesuai dengan “penonton tampak terdiam lama setelah pembacaan selesai”. B (salah) — bertentangan dengan teks yang menyebut penonton “terdiam lama” sebagai bentuk empati. E (salah) — bertentangan dengan teks yang menunjukkan penonton “ikut merasakan kesepian”.'

    pernyataan: [
        'Respons emosional Ikal dalam kutipan dapat disimpulkan sebagai campuran rasa kecewa dan munculnya kembali harapan setelah mengingat nasihat gurunya.',
        'Kutipan menunjukkan bahwa Ikal merasa marah kepada teman-temannya karena meneritawakannya ketika ia mendapat nilai buruk.',
        'Bagian yang menggambarkan Ikal menarik napas panjang menunjukkan usahanya untuk tenang dan menguatkan dirinya kembali.'
    ],
    jawaban: [true, false, true],
    alasan: [
        'Ia sedih karena nilai buruk, lalu teringat nasihat Bu Muslimah → muncul harapan.',
        'Teman-teman hanya tertawa di lapangan, tidak meneritawakan Ikal.',
        'Menarik napas panjang biasa dilakukan untuk menguatkan diri dan menata perasaan.'
    ]
}];

// ============================================================
//  RENDER & LOGIC
// ============================================================
const container = document.getElementById('quizContainer');
const scoreSpan = document.getElementById('scoreDisplay');
const totalSpan = document.getElementById('totalSoal');
totalSpan.textContent = questions.length;

let answered = {};
let selectedAnswers = {};
let pernyataanAnswers = {};
let pgkChecked = {};

function render() {
    let html = '';
    let correctCount = 0;

    questions.forEach((q, idx) => {
        const isAnswered = answered[idx] || false;
        const isCorrect = isAnswered && checkAnswer(idx);
        if (isAnswered && isCorrect) correctCount++;

        let cardClass = 'soal-card';
        if (isAnswered) {
            cardClass += isCorrect ? ' correct' : ' wrong';
        }

        const tipeLabel = q.tipe === 'pg' ? 'PG Biasa' :
                          (q.tipe === 'pgk' ? 'PGK (Pilih >1)' : 'PGK Kategori');
        let tipeClass = 'tipe';
        if (q.tipe === 'pgk') tipeClass += ' pgk';
        else if (q.tipe === 'pgk-kategori') tipeClass += ' pgk-kategori';

        html += `<div class="${cardClass}" id="soal-${idx}">`;
        html += `<div class="header-soal">
                    <span class="nomor">Soal ${idx+1}</span>
                    <span class="${tipeClass}">${tipeLabel}</span>
                </div>`;

        // Tampilkan kutipan jika ada
        if (q.kutipan) {
            html += `<div class="kutipan">${q.kutipan.replace(/\n/g, '<br>')}</div>`;
        }

        html += `<div class="soal-text">${q.text}</div>`;

        // Render berdasarkan tipe
        if (q.tipe === 'pg') {
            html += renderPG(idx, q);
        } else if (q.tipe === 'pgk') {
            html += renderPGK(idx, q);
        } else if (q.tipe === 'pgk-kategori') {
            html += renderPGKKategori(idx, q);
        }

        // Feedback
        let feedbackClass = 'feedback-box';
        let feedbackHtml = '';
        if (isAnswered) {
            feedbackClass += ' show';
            feedbackClass += isCorrect ? ' correct' : ' wrong';
            const icon = isCorrect ? '✅' : '❌';
            const status = isCorrect ? 'Jawaban Benar!' : 'Jawaban Salah';
            const correctText = getCorrectText(q);
            feedbackHtml = `
                <div class="${feedbackClass}">
                    <strong>${icon} ${status}</strong>
                    <div class="explain">💡 ${q.explanation}</div>
                    <div style="margin-top:4px;font-size:0.9rem;">Kunci Jawaban: <strong>${correctText}</strong></div>
                </div>
            `;
        } else {
            feedbackHtml = `<div class="feedback-box"></div>`;
        }
        html += feedbackHtml;

        html += `</div>`;
    });

    container.innerHTML = html;
    scoreSpan.textContent = correctCount;

    // Attach events
    attachEvents();
}

function renderPG(idx, q) {
    let html = `<div class="options">`;
    q.options.forEach((opt, optIdx) => {
        const isAnswered = answered[idx] || false;
        const selected = selectedAnswers[idx];
        let labelClass = '';
        let disabled = '';
        let checked = '';
        if (isAnswered) {
            disabled = 'disabled';
            if (optIdx === q.correct) labelClass += ' correct-answer';
            if (optIdx === selected && optIdx !== q.correct) labelClass += ' wrong-answer';
            if (optIdx === selected) checked = 'checked';
        }
        html += `
            <label class="${labelClass} ${disabled}">
                <input type="radio" name="q${idx}" value="${optIdx}" ${checked} ${disabled}>
                <span>${opt}</span>
            </label>
        `;
    });
    html += `</div>`;
    return html;
}

function renderPGK(idx, q) {
    let html = `<div class="options">`;
    q.options.forEach((opt, optIdx) => {
        const isAnswered = answered[idx] || false;
        const selected = selectedAnswers[idx] || [];
        let labelClass = '';
        let disabled = '';
        let checked = '';
        if (isAnswered) {
            disabled = 'disabled';
            if (q.correct.includes(optIdx)) labelClass += ' correct-answer';
            if (selected.includes(optIdx) && !q.correct.includes(optIdx)) labelClass += ' wrong-answer';
            if (selected.includes(optIdx)) checked = 'checked';
        }
        html += `
            <label class="${labelClass} ${disabled}">
                <input type="checkbox" name="q${idx}" value="${optIdx}" ${checked} ${disabled}>
                <span>${opt}</span>
            </label>
        `;
    });
    html += `</div>`;
    // Tombol Cek Jawaban (hanya tampil jika belum dijawab)
    if (!answered[idx]) {
        html += `<button class="btn-cek" id="cek-${idx}">🔍 Cek Jawaban</button>`;
    }
    return html;
}

function renderPGKKategori(idx, q) {
    let html = `<table class="table-pernyataan">`;
    const isAnswered = answered[idx] || false;
    const answers = pernyataanAnswers[idx] || [];

    q.pernyataan.forEach((pernyataanText, pIdx) => {
        const val = answers[pIdx];
        const isCorrect = isAnswered && (val === q.jawaban[pIdx]);

        html += `<tr>`;
        html += `<td class="pernyataan-text">${pernyataanText}</td>`;
        html += `<td>`;
        html += `<div class="opsi-group">`;

        const options = q.tipe === 'pgk-kategori' ?
            [{ label: 'Setuju', value: true }, { label: 'Tidak Setuju', value: false }] :
            [{ label: 'Sesuai', value: true }, { label: 'Tidak Sesuai', value: false }];

        options.forEach(opt => {
            const checked = (isAnswered && val === opt.value) ? 'checked' : '';
            const disabled = isAnswered ? 'disabled' : '';
            let labelClass = '';
            if (isAnswered) {
                if (opt.value === q.jawaban[pIdx]) labelClass += ' correct-answer';
                if (val === opt.value && opt.value !== q.jawaban[pIdx]) labelClass += ' wrong-answer';
            }
            html += `
                <label class="${labelClass} ${disabled}" style="display:inline-flex; align-items:center; gap:4px; padding:2px 8px; background:transparent; border:none; cursor:${isAnswered?'default':'pointer'}; font-weight:${(isAnswered && opt.value === q.jawaban[pIdx])?'600':'normal'};">
                    <input type="radio" name="pernyataan_${idx}_${pIdx}" value="${opt.value}" ${checked} ${disabled}>
                    ${opt.label}
                </label>
            `;
        });

        html += `</div>`;

        if (isAnswered) {
            const fbClass = isCorrect ? 'benar' : 'salah';
            const icon = isCorrect ? '✅' : '❌';
            const status = isCorrect ? 'Benar' : 'Salah';
            html += `
                <div class="feedback-pernyataan show ${fbClass}">
                    ${icon} ${status} — ${q.alasan[pIdx]}
                </div>
            `;
        }

        html += `</td>`;
        html += `</tr>`;
    });

    html += `</table>`;

    if (!answered[idx]) {
        html += `<button class="btn-cek" id="cek-${idx}">🔍 Cek Jawaban</button>`;
    }

    return html;
}

function getCorrectText(q) {
    if (q.tipe === 'pg') {
        return q.options[q.correct];
    } else if (q.tipe === 'pgk') {
        return q.correct.map(i => q.options[i]).join('; ');
    } else if (q.tipe === 'pgk-kategori') {
        return q.pernyataan.map((p, i) => {
            const label = q.jawaban[i] ? 'Setuju/Sesuai' : 'Tidak Setuju/Tidak Sesuai';
            return `(${i+1}) ${label}`;
        }).join('; ');
    }
    return '';
}

function checkAnswer(idx) {
    const q = questions[idx];
    if (q.tipe === 'pg') {
        return selectedAnswers[idx] === q.correct;
    } else if (q.tipe === 'pgk') {
        const sel = selectedAnswers[idx] || [];
        const sortedSel = [...sel].sort();
        const sortedCorr = [...q.correct].sort();
        return JSON.stringify(sortedSel) === JSON.stringify(sortedCorr);
    } else if (q.tipe === 'pgk-kategori') {
        const ans = pernyataanAnswers[idx] || [];
        return ans.every((v, i) => v === q.jawaban[i]);
    }
    return false;
}

function attachEvents() {
    // PG radio
    document.querySelectorAll('.soal-card input[type="radio"]:not([name^="pernyataan_"])').forEach(input => {
        input.addEventListener('change', function() {
            const name = this.name;
            const idx = parseInt(name.replace('q', ''));
            if (answered[idx]) return;
            selectedAnswers[idx] = parseInt(this.value);
            answered[idx] = true;
            render();
            document.getElementById(`soal-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    });

    // PGK checkbox and Kategori radio - handled by "Cek Jawaban" button
    document.querySelectorAll('.btn-cek').forEach(btn => {
        btn.addEventListener('click', function() {
            const idx = parseInt(this.id.replace('cek-', ''));
            const q = questions[idx];

            if (q.tipe === 'pgk') {
                // Get selected checkboxes
                const checkboxes = document.querySelectorAll(`#soal-${idx} input[type="checkbox"]`);
                const selected = [];
                checkboxes.forEach(cb => {
                    if (cb.checked) selected.push(parseInt(cb.value));
                });
                if (selected.length === 0) {
                    alert('Pilih minimal satu pilihan!');
                    return;
                }
                selectedAnswers[idx] = selected;
                answered[idx] = true;
                render();
                document.getElementById(`soal-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (q.tipe === 'pgk-kategori') {
                // Check if all pernyataan have been answered
                const allAnswered = q.pernyataan.every((_, pIdx) => {
                    const radios = document.querySelectorAll(`input[name="pernyataan_${idx}_${pIdx}"]`);
                    let checked = false;
                    radios.forEach(r => { if (r.checked) checked = true; });
                    return checked;
                });
                if (!allAnswered) {
                    alert('Jawab semua pernyataan terlebih dahulu!');
                    return;
                }
                const answers = [];
                q.pernyataan.forEach((_, pIdx) => {
                    const radios = document.querySelectorAll(`input[name="pernyataan_${idx}_${pIdx}"]`);
                    radios.forEach(r => {
                        if (r.checked) {
                            answers[pIdx] = (r.value === 'true');
                        }
                    });
                });
                pernyataanAnswers[idx] = answers;
                answered[idx] = true;
                render();
                document.getElementById(`soal-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    });
}

function resetQuiz() {
    answered = {};
    selectedAnswers = {};
    pernyataanAnswers = {};
    pgkChecked = {};
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('resetBtn').addEventListener('click', resetQuiz);

// Initial render
render();
</script>
</body>
</html>
