      {
        type: "konjungsi",
        text: "Kota A telah menerapkan sistem transportasi cerdas. … kemacetan masih terjadi pada jam sibuk. … jumlah kendaraan pribadi terus bertambah pesat.",
        options: [
          "a. Walaupun demikian, Karena",
          "b. Namun, Sebab",
          "c. Meskipun, Padahal",
          "d. Akan tetapi, Jadi",
          "e. Sementara itu, Oleh karena itu"
        ],
        answer: "b",
        explanation: "'Namun' kontras, 'Sebab' menjelaskan penyebab kemacetan."
      }
    ];

    // --- STATE ---
    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let userAnswers = new Array(questions.length).fill(null); // menyimpan jawaban user

    // DOM elements
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const explanationArea = document.getElementById('explanationArea');
    const progressFill = document.getElementById('progressFill');
    const questionCounter = document.getElementById('questionCounter');
    const scoreDisplay = document.getElementById('scoreDisplay');

    function renderQuestion(index) {
      const q = questions[index];
      questionText.innerText = q.text;
      // Buat opsi
      optionsContainer.innerHTML = '';
      q.options.forEach((opt, i) => {
        const letter = String.fromCharCode(97 + i); // a,b,c,d,e
        const optionDiv = document.createElement('div');
        optionDiv.className = 'option-item';
        optionDiv.innerHTML = `
          <input type="radio" name="quizOption" id="opt${i}" value="${letter}">
          <span class="option-letter">${letter}.</span> ${opt.substring(3)} 
        `;
        // styling label
        const radio = optionDiv.querySelector('input');
        radio.addEventListener('change', () => {
          if (!answered) {
            submitBtn.disabled = false;
          }
        });
        // jika sudah dijawab, tampilkan jawaban user
        if (userAnswers[index] === letter) {
          radio.checked = true;
          if (!answered) submitBtn.disabled = false;
        }
        optionsContainer.appendChild(optionDiv);
      });

      // Reset tampilan pembahasan
      explanationArea.innerHTML = '';
      submitBtn.style.display = 'inline-block';
      nextBtn.style.display = 'none';
      submitBtn.disabled = true;

      // Jika sudah menjawab sebelumnya, tampilkan status terjawab & pembahasan
      if (userAnswers[index] !== null) {
        answered = true;
        submitBtn.style.display = 'none';
        nextBtn.style.display = 'inline-block';
        // tandai opsi benar/salah
        const correct = q.answer;
        const selected = userAnswers[index];
        const allOptions = document.querySelectorAll('.option-item');
        allOptions.forEach((optDiv, idx) => {
          const letter = String.fromCharCode(97 + idx);
          const radioEl = optDiv.querySelector('input');
          radioEl.disabled = true;
          if (letter === correct) {
            optDiv.style.borderColor = '#2ecc71';
            optDiv.style.backgroundColor = 'rgba(46,204,113,0.15)';
          } else if (letter === selected && selected !== correct) {
            optDiv.style.borderColor = '#e74c3c';
            optDiv.style.backgroundColor = 'rgba(231,76,60,0.2)';
          }
          optDiv.style.cursor = 'default';
        });
        explanationArea.innerHTML = `<div class="explanation-box"><strong>✅ Jawaban: ${q.answer.toUpperCase()}</strong><br>📌 ${q.explanation}</div>`;
        updateProgressAndScore();
      } else {
        answered = false;
        submitBtn.style.display = 'inline-block';
        nextBtn.style.display = 'none';
        // enable radio
        document.querySelectorAll('.option-item').forEach(opt => opt.style.cursor = 'pointer');
      }

      updateProgressAndScore();
      questionCounter.innerText = `Soal ${index+1}/${questions.length}`;
      progressFill.style.width = ((index+1)/questions.length)*100 + '%';
    }

    function updateProgressAndScore() {
      let correctCount = 0;
      for (let i = 0; i < questions.length; i++) {
        if (userAnswers[i] === questions[i].answer) correctCount++;
      }
      score = correctCount;
      scoreDisplay.innerText = `Skor: ${score}/${questions.length}`;
    }

    function handleSubmit() {
      if (answered) return;
      const selectedRadio = document.querySelector('input[name="quizOption"]:checked');
      if (!selectedRadio) return;
      const userAns = selectedRadio.value;
      userAnswers[currentIndex] = userAns;
      answered = true;

      const q = questions[currentIndex];
      const correct = q.answer;
      // Tampilkan pembahasan
      explanationArea.innerHTML = `<div class="explanation-box"><strong>${userAns === correct ? '✅ Benar!' : '❌ Kurang Tepat'}</strong> Jawaban: ${correct.toUpperCase()}<br>📌 ${q.explanation}</div>`;

      // Highlight opsi
      const allOptions = document.querySelectorAll('.option-item');
      allOptions.forEach((optDiv, idx) => {
        const letter = String.fromCharCode(97 + idx);
        const radioEl = optDiv.querySelector('input');
        radioEl.disabled = true;
        if (letter === correct) {
          optDiv.style.borderColor = '#2ecc71';
          optDiv.style.backgroundColor = 'rgba(46,204,113,0.15)';
        } else if (letter === userAns && userAns !== correct) {
          optDiv.style.borderColor = '#e74c3c';
          optDiv.style.backgroundColor = 'rgba(231,76,60,0.2)';
        }
        optDiv.style.cursor = 'default';
      });

      submitBtn.style.display = 'none';
      nextBtn.style.display = 'inline-block';
      updateProgressAndScore();

      // Jika soal terakhir, ubah tombol lanjut menjadi "Lihat Hasil"
      if (currentIndex === questions.length - 1) {
        nextBtn.innerText = '🏁 Lihat Hasil';
      } else {
        nextBtn.innerText = 'Lanjut ➡️';
      }
    }

    function handleNext() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        answered = false;
        renderQuestion(currentIndex);
      } else {
        // Tampilkan hasil akhir
        showResultScreen();
      }
    }

    function showResultScreen() {
      let correctCount = 0;
      userAnswers.forEach((ans, i) => {
        if (ans === questions[i].answer) correctCount++;
      });
      const total = questions.length;
      const percent = Math.round((correctCount/total)*100);
      document.getElementById('questionCard').innerHTML = `
        <div class="result-screen">
          <h2 style="color:white; margin-bottom:0.8rem;">📊 Hasil Kuis</h2>
          <div class="score-circle" style="--score-percent:${percent};">${correctCount}/${total}</div>
          <p style="font-size:1.3rem; margin:1rem 0;">Kamu menjawab <strong>${correctCount}</strong> dari <strong>${total}</strong> soal dengan benar.</p>
          <p style="color:#b0cbff;">Persentase: ${percent}%</p>
          <button class="btn btn-success" id="restartBtn" style="margin-top:1.5rem;">🔁 Ulangi Kuis</button>
        </div>
      `;
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('explanationArea').innerHTML = '';
      progressFill.style.width = '100%';
      questionCounter.innerText = `Selesai`;
      scoreDisplay.innerText = `Skor: ${correctCount}/${total}`;
      
      document.getElementById('restartBtn').addEventListener('click', restartQuiz);
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      answered = false;
      userAnswers = new Array(questions.length).fill(null);
      document.getElementById('submitBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').style.display = 'none';
      renderQuestion(0);
      updateProgressAndScore();
    }

    // Event listeners
    submitBtn.addEventListener('click', handleSubmit);
    nextBtn.addEventListener('click', handleNext);

    // Init
    renderQuestion(0);
  })();
</script>
</body>
</html>
