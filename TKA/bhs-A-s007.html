let correctCount = 0;
let wrongCount = 0;
let answeredCount = 0;
let userSelections = {};

function renderQuiz() {
  const content = document.getElementById('quizContent');
  content.innerHTML = '';
  
  questions.forEach((q, idx) => {
    userSelections[idx] = [];
    
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-card-${idx}`;
    
    let optionsHtml = '';
    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, oIdx) => {
      optionsHtml += `
        <div class="option" id="opt-${idx}-${oIdx}" onclick="toggleOption(${idx}, ${oIdx}, ${q.multi})">
          <span class="option-marker">${letters[oIdx]}</span>
          <span>${opt}</span>
        </div>
      `;
    });

    const checkBtn = q.multi ? `<button class="check-btn" id="check-btn-${idx}" onclick="checkMultiAnswer(${idx})">Periksa Jawaban</button>` : '';

    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">Soal ${idx + 1}</span>
        ${q.multi ? '<span class="q-badge">Pilih Lebih dari 1</span>' : ''}
      </div>
      <div class="arabic-text">${q.text}</div>
      <div class="question-instruction">${q.instruction}</div>
      <div class="options-grid">${optionsHtml}</div>
      ${checkBtn}
      <div class="notification" id="notif-${idx}"></div>
      <div class="explanation" id="exp-${idx}">
        <strong>💡 Pembahasan:</strong>
        ${q.explanation}
      </div>
    `;
    content.appendChild(card);
  });
}

function toggleOption(qIdx, oIdx, isMulti) {
  const card = document.getElementById(`q-card-${qIdx}`);
  if (card.classList.contains('answered-correct') || card.classList.contains('answered-wrong')) return;

  const optionEl = document.getElementById(`opt-${qIdx}-${oIdx}`);
  
  if (!isMulti) {
    // Single choice: immediate check
    const correct = questions[qIdx].answer[0];
    const isCorrect = oIdx === correct;
    
    // Disable all options
    questions[qIdx].options.forEach((_, i) => {
      document.getElementById(`opt-${qIdx}-${i}`).classList.add('disabled');
      if (i === correct) document.getElementById(`opt-${qIdx}-${i}`).classList.add('correct');
    });
    
    if (!isCorrect) {
      optionEl.classList.add('wrong');
    }
    
    showResult(qIdx, isCorrect, isCorrect);
  } else {
    // Multi choice: toggle selection
    if (userSelections[qIdx].includes(oIdx)) {
      userSelections[qIdx] = userSelections[qIdx].filter(id => id !== oIdx);
      optionEl.classList.remove('selected');
    } else {
      userSelections[qIdx].push(oIdx);
      optionEl.classList.add('selected');
    }
    
    // Show check button if at least one is selected
    const btn = document.getElementById(`check-btn-${qIdx}`);
    btn.style.display = userSelections[qIdx].length > 0 ? 'block' : 'none';
  }
}

function checkMultiAnswer(qIdx) {
  const q = questions[qIdx];
  const selected = userSelections[qIdx].sort();
  const correct = q.answer.sort();
  
  // Check if arrays are equal
  const isFullyCorrect = JSON.stringify(selected) === JSON.stringify(correct);
  const isPartiallyCorrect = selected.length > 0 && selected.every(val => correct.includes(val));
  
  // Disable all options and button
  q.options.forEach((_, i) => {
    const optEl = document.getElementById(`opt-${qIdx}-${i}`);
    optEl.classList.add('disabled');
    if (correct.includes(i)) {
      optEl.classList.add('correct');
    } else if (selected.includes(i) && !correct.includes(i)) {
      optEl.classList.add('wrong');
    }
  });
  
  document.getElementById(`check-btn-${qIdx}`).style.display = 'none';
  
  if (isFullyCorrect) {
    showResult(qIdx, true, true);
  } else if (isPartiallyCorrect) {
    showResult(qIdx, false, false, true);
  } else {
    showResult(qIdx, false, false);
  }
}

function showResult(qIdx, isCorrect, fullyCorrect, isPartial = false) {
  const card = document.getElementById(`q-card-${qIdx}`);
  const notif = document.getElementById(`notif-${qIdx}`);
  
  answeredCount++;
  
  if (fullyCorrect) {
    card.classList.add('answered-correct');
    notif.className = 'notification correct';
    notif.innerHTML = '✅ <b>BENAR!</b> Jawaban Anda tepat.';
    correctCount++;
  } else if (isPartial) {
    card.classList.add('answered-wrong');
    notif.className = 'notification partial';
    notif.innerHTML = '⚠️ <b>SEBAGIAN BENAR.</b> Ada jawaban yang terlewat atau salah. Lihat pembahasan di bawah.';
    wrongCount++;
  } else {
    card.classList.add('answered-wrong');
    notif.className = 'notification wrong';
    notif.innerHTML = '❌ <b>SALAH.</b> Jawaban yang benar ditandai dengan warna hijau.';
    wrongCount++;
  }
  
  document.getElementById(`exp-${qIdx}`).classList.add('show');
  updateScore();
}

function updateScore() {
  document.getElementById('answered').textContent = `${answeredCount}/30`;
  document.getElementById('correct').textContent = correctCount;
  document.getElementById('wrong').textContent = wrongCount;
  const score = Math.round((correctCount / 30) * 100);
  document.getElementById('score').textContent = score;
}

function resetQuiz() {
  correctCount = 0;
  wrongCount = 0;
  answeredCount = 0;
  userSelections = {};
  updateScore();
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize
renderQuiz();
</script>
</body>
