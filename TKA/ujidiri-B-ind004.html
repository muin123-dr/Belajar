        .kategori-row.wrong-row { border-color: var(--danger); background: #fff5f5; }

        .answer-key .icon-info { color: var(--primary); font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 0.95rem; z-index: 9999; box-shadow: 0 6px 20px rgba(0,0,0,0.2); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.3s; opacity: 0; pointer-events: none; letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.correct { background: var(--success); color: white; }
        .toast.wrong { background: var(--danger); color: white; }
        .toast.info { background: var(--primary); color: white; }

        @media (max-width: 600px) { body { padding: 8px; } .card { padding: 16px 14px; } .header { padding: 20px 14px; } .question-text { font-size: 0.98rem; } .option { padding: 10px 12px; font-size: 0.9rem; gap: 8px; } .option-letter { min-width: 24px; height: 24px; font-size: 0.7rem; } .kategori-btn { padding: 6px 14px; font-size: 0.8rem; min-width: 70px; } .toast { font-size: 0.85rem; padding: 10px 18px; top: 10px; } .text-excerpt { max-height: 200px; font-size: 0.85rem; padding: 10px 12px; } }

            21: {
                title: 'Kutipan Novel Sitti Nurbaya',
                content: 'Pada keesokan harinya, pukul lima pagi. Samsulbahri terperanjat bangun dari tidurnya, karena mendengar bunyi lonceng jam yang ada di rumahnya, lima kali memukul. Dengan segera diangkatnya kepalanya lalu menoleh ke celah-celah dinding biliknya, akan melihat, sudah adakah cahaya matahari yang masuk ke dalam rumahnya atau belum. Rupanya ia takut kesiangan. Akan tetapi, walaupun ia menoleh ke sana kemari dan mendengar hati-hati, kalau-kalau ada suara orang, tiadalah lain yang dilihatnya daripada sinar lampu biliknya sendiri. Sekaliannya masih sunyi; orang yang telah meninggalkan tempat tidurnya, belum ada. Hanya dari jauh kedengaran olehnya kokok ayam jantan bersahut-sahutan di segala pihak, sebagai orang bersorak berganti-ganti, karena berbesar hati menyambut kedatangan fajar. Dari sebelah timur, kedengaran bunyi puput kereta api di Stasiun Padang sekali-sekali, sebagai hendak memberi ingat kepada mereka yang hendak menumpang dan berangkat pagi-pagi. Dari sebelah barat kedengaran ombak yang memecah di tepi pantai, sebagai guruh pagi hari, yang menyatakan hari akan hujan sehingga kecil lah hati Samsu mendengar bunyi ini, takut kalau-kalau maksudnya, akan bermain-main ke Gunung Padang, tiada dapat disampaikannya. Dari surau yang dekat di sana, kedengaran orang bang, memberi ingat kepada sekalian yang hendak berbuat ibadat kepada Allah subhanahu wataala, bahwa subuh telah ada.\n\nOleh sebab nyata oleh Samsu, bahwa hari baru pukul lima pagi, direbahkannyalah kembali badannya ke atas tilamnya; bukannya hendak tidur pula, melainkan sekadar berbaring-baring, menunggu hari siang. Akan tetapi, ia gelisah, karena pikirannya telah digoda oleh kenang-kenangan akan pergi bersuka-sukaan itu. Sebentar-bentar berbaliklah ia ke kanan dan ke kiri, sebagai berduri tempat tidurnya. Akhirnya, karena tak dapat menahan hati, bangunlah ia dari tempat tidurnya, lalu dibukanya pintu biliknya perlahan-lahan, karena kuatir kalau-kalau ayahnya yang sedang tidur, terbangun pula.'
            },
            24: {
                title: 'Kutipan Drama "Ayahku Pulang"',
                content: 'Maimun: Lama menunggu aku?\nGunarto: Ah, aku juga baru kembali.\nIbu: Agak terlambat hari ini, Mun?\nMaimun: Kerja lembur, Bu. Tapi biarlah, buat perkawinan Mintarsih. Mana dia, Bu?\nIbu: Mengantarkan barang jahitan. Tapi makanan sudah sedia. Makanlah dahulu, mandinya nanti saja.\nMaimun: (duduk di meja makan) Mas Narto, ada kabar aneh. Tadi pagi aku berjumpa Pak Tirto. Katanya dia bertemu dengan seorang tua. Katanya agak serupa dengan ayah.\nGunarto: (tidak peduli, mulai makan).... Begitu....?\nMaimun: Waktu Pak Tirto belanja di pasar gudeg, ia tiba-tiba berhadapan dengan seorang tua, kira-kira berumur enam puluh tahun. Ia agak kaget juga, karena orang tua itu seperti sudah dikenalnya. Katanya agak serupa dengan Raden Saleh. Tapi orang tua itu menyingkir di tengah-tengah orang ramai.\nIbu: (teringat) Pak Tirto kawan ayahmu waktu kecil. Mereka sama-sama sekolah dahulu. Mereka sudah lama tak bertemu, sudah 20 tahun. Boleh jadi ia salah lihat.\nMaimun: Pak Tirto mengaku juga, boleh jadi ia salah lihat. Katanya 20 tahun. Memang masa yang lama dalam kehidupan manusia. Tetapi katanya pula ia kenal benar pada ayah, jadi …\nGunarto: Mana bisa ia ada di sini.\nIbu: (diam sejurus) Memang, aku kira ia sudah meninggal. Atau ke luar negeri. Sudah dua puluhan tahun ia pergi. Pada malam Lebaran seperti ini.'
            }
        };

        const questions = [
            { id: 1, type: 'pg', readingId: 1, question: 'Berdasarkan teks, manakah pernyataan yang menjadi ide pendukung untuk memperkuat pentingnya literasi digital bagi generasi muda?', options: [ { label: 'A', text: 'Pemanfaatan teknologi memerlukan pemahaman tentang etika komunikasi dan keamanan siber.' }, { label: 'B', text: 'Literasi digital membantu memahami informasi secara cermat dan berinteraksi secara bertanggung jawab.' }, { label: 'C', text: 'Teknologi digital telah mengubah pola kehidupan masyarakat modern dalam berbagai aktivitas sehari-hari.' }, { label: 'D', text: 'Kemajuan teknologi menyediakan akses luas terhadap pengetahuan dan layanan melalui jaringan internet.' }, { label: 'E', text: 'Informasi di ruang digital tersebar sangat cepat melalui berbagai platform, seperti berita, opini, dan promosi.' } ], key: 'A', explanation: 'Ide pendukung adalah kalimat yang memperkuat gagasan utama. Gagasan utama: pentingnya literasi digital. Opsi A menambahkan aspek penting lain (etika dan keamanan) sebagai alasan mengapa literasi digital diperlukan, sehingga menjadi pendukung yang tepat.' },
            { id: 2, type: 'pg', readingId: 1, question: 'Apa makna kata produktivitas dalam teks tersebut?', options: [ { label: 'A', text: 'Kemampuan bekerja keras tanpa mengenal lelah demi target yang ditentukan.' }, { label: 'B', text: 'Kemampuan menghasilkan banyak karya dalam waktu yang cepat dan singkat.' }, { label: 'C', text: 'Kemampuan memanfaatkan waktu dan sumber daya untuk hasil yang optimal.' }, { label: 'D', text: 'Kemampuan menghasilkan sesuatu secara efisien dan efektif untuk mencapai target.' }, { label: 'E', text: 'Kemampuan menyelesaikan pekerjaan dengan cepat dengan berbagai macam cara.' } ], key: 'D', explanation: 'Produktivitas berarti kemampuan menghasilkan sesuatu secara efisien dan efektif. Dalam konteks teks, generasi muda dapat meningkatkan produktivitas melalui pelatihan berbasis teknologi, artinya menghasilkan karya dengan lebih baik dan tepat sasaran.' },
            { id: 3, type: 'kategori_bs', readingId: 1, question: 'Dalam teks tersebut terdapat hubungan sebab akibat antarkalimat. Tentukan Benar atau Salah untuk setiap pernyataan berikut!', statements: [ 'Informasi tersebar sangat cepat di ruang digital sebab pengguna perlu menilai ketepatan informasi sebelum memercayainya.', 'Penyebaran disinformasi dapat memengaruhi keharmonisan sosial sehingga kemampuan berpikir kritis harus dikembangkan.', 'Generasi muda dapat mengikuti pelatihan berbasis teknologi sehingga kesempatan tersebut memperluas wawasan dan meningkatkan produktivitas.' ], keys: ['Salah', 'Benar', 'Benar'], explanation: 'Pernyataan 1: hubungan sebab akibat terbalik; seharusnya karena informasi cepat maka perlu menilai. Pernyataan 2: benar, sebab (disinformasi memengaruhi keharmonisan) akibat (harus berpikir kritis). Pernyataan 3: benar, sebab (pelatihan teknologi) akibat (memperluas wawasan dan produktivitas).' },
            { id: 4, type: 'pg', readingId: 4, question: 'Berdasarkan gagasan pokok yang kamu temukan, kerangka tulisan teks eksplanasi tersebut adalah...', options: [ { label: 'A', text: 'Definisi mikroplastik → proses penemuan mikroplastik di atmosfer → dampak mikroplastik terhadap pembentukan awan dan perubahan iklim → proses terjadinya hujan plastik → solusi mengatasi pencemaran mikroplastik.' }, { label: 'B', text: 'Definisi mikroplastik + proses penemuan mikroplastik di atmosfer → proses terjadinya hujan plastik → dampak mikroplastik terhadap pembentukan awan dan perubahan iklim + solusi mengatasi pencemaran mikroplastik.' }, { label: 'C', text: 'Karakteristik mikroplastik → proses penemuan mikroplastik di atmosfer → dampak mikroplastik terhadap pembentukan awan dan perubahan iklim → proses terjadinya hujan plastik → solusi mengatasi pencemaran mikroplastik.' }, { label: 'D', text: 'Karakteristik mikroplastik → proses terjadinya hujan plastik → proses penemuan mikroplastik di atmosfer → dampak mikroplastik terhadap pembentukan awan dan perubahan iklim → solusi mengatasi pencemaran mikroplastik.' }, { label: 'E', text: 'Definisi mikroplastik → proses pembentukan mikroplastik dari plastik sekali pakai → penyebaran mikroplastik melalui air laut → penemuan mikroplastik di awan oleh para ilmuwan → solusi pengurangan penggunaan plastik sekali pakai.' } ], key: 'A', explanation: 'Urutan paragraf: 1 definisi dan karakteristik, 2 penemuan di atmosfer, 3 dampak pembentukan awan dan iklim, 4 hujan plastik, 5 solusi. Opsi A mengikuti urutan tersebut.' },
            { id: 5, type: 'pg', readingId: 4, question: 'Manakah bagan alur informasi yang sesuai isi teks tersebut?', options: [ { label: 'A', text: 'Definisi Mikroplastik → Sumber Mikroplastik (limbah tekstil, plastik sekali pakai, produk perawatan pribadi) → Dampak di Laut → Penemuan di Atmosfer → Perubahan iklim' }, { label: 'B', text: 'Karakteristik Mikroplastik (ukuran kecil, mudah menyebar) → Penelitian Universitas Waseda (sampel air awan) → Hasil Temuan (9 polimer + karet sintetis) → Dampak (pembentukan awan dan pemanasan global) → Hujan Plastik' }, { label: 'C', text: 'Sumber Mikroplastik (limbah industri) → Proses di Laut (percikan ombak) → Perjalanan ke Atmosfer → Penelitian di Jepang → Dampak Kesehatan Manusia → Solusi Daur Ulang' }, { label: 'D', text: 'Definisi Mikroplastik → Mikroplastik di Laut → Penelitian Okochi → Temuan Polimer di Awan → Proses Hujan Plastik (laut atmosfer awan hujan) → Pencemaran Rantai Makanan → Larangan Plastik Global' }, { label: 'E', text: 'Mikroplastik di Laut → Degradasi Plastik → Emisi Gas Rumah Kaca → Pemanasan Global → Penelitian Universitas Waseda → Identifikasi Karet Sintetis → Solusi Pengurangan Plastik' } ], key: 'B', explanation: 'Alur B sesuai urutan teks: karakteristik mikroplastik, penelitian Waseda, hasil temuan, dampak, hujan plastik.' },
            { id: 6, type: 'kategori_tt', readingId: 4, question: 'Cermati pilihan kata yang digunakan dalam teks tersebut. Tentukan Tepat atau Tidak Tepat untuk setiap pernyataan berikut berdasarkan penggunaan kata baku dan tidak baku sesuai konteks penggunaannya!', statements: [ 'Kata atmosfer tidak baku. Kata ini semestinya diperbaiki menjadi atmosfir agar maknanya sesuai dengan konteks kalimat, yaitu "lapisan udara yang menyelimuti bumi".', 'Kata semakin tidak baku. Kata ini semestinya diperbaiki menjadi makin agar maknanya sesuai dengan konteks kalimat, yaitu "menyatakan tingkat perbandingan yang bertambah".', 'Kata sistesis tidak baku. Kata ini semestinya diperbaiki menjadi sintetik agar maknanya sesuai dengan konteks kalimat, yaitu "sesuatu yang dibuat melalui proses tiruan atau buatan".' ], keys: ['Tidak Tepat', 'Tidak Tepat', 'Tidak Tepat'], explanation: 'Semua pernyataan salah: atmosfer sudah baku, semakin sudah baku, dan kata yang digunakan dalam teks adalah sintetis (bukan sistesis) yang sudah benar.' },
            { id: 7, type: 'pg', readingId: 4, question: 'Mikroplastik di atmosfer menimbulkan beberapa dampak bagi lingkungan. Dari fenomena tersebut, apa penyebab utama sehingga terjadinya kerusakan lingkungan?', options: [ { label: 'A', text: 'Ukuran mikroplastik sangat halus sehingga mikroplastik dapat lolos dari penyaringan air biasa.' }, { label: 'B', text: 'Mikroplastik menjadi inti pengembunan uap air sehingga awan lebih mudah terbentuk di atmosfer.' }, { label: 'C', text: 'Pencemaran mikroplastik terus dibiarkan sehingga ekosistem alam mengalami gangguan permanen yang memprihatinkan.' }, { label: 'D', text: 'Laut melepaskan jutaan ton mikroplastik melalui percikan ombak sehingga partikel itu terbawa angin menuju lapisan udara tinggi.' }, { label: 'E', text: 'Plastik yang terurai melepaskan gas rumah kaca berbahaya sehingga gas tersebut memerangkap panas dan meningkatkan suhu global.' } ], key: 'E', explanation: 'Penyebab utama kerusakan lingkungan adalah pelepasan gas rumah kaca dari plastik yang terurai, yang mempercepat perubahan iklim. Ini efek paling serius dan disebutkan sebagai akibat langsung.' },
            { id: 8, type: 'mcma', readingId: 8, question: 'Berdasarkan kutipan cerpen, manakah penggambaran tepat terkait karakter tokoh Kak Fani? Pilihlah jawaban yang benar! Jawaban benar lebih dari satu.', options: [ { label: 'A', text: 'Tokoh Kak Fani digambarkan sebagai atasan yang lembut dan tidak suka menekan karena ia hanya menduga-duga penyebab keterlambatan tokoh Raul tanpa memaksanya.' }, { label: 'B', text: 'Tokoh Kak Fani digambarkan sebagai atasan yang peduli dan berusaha memahami masalah bawahannya karena ia menawarkan tokoh Raul untuk menceritakan masalahnya.' }, { label: 'C', text: 'Tokoh Kak Fani digambarkan sebagai atasan yang tegas dan objektif karena ia menyampaikan ketidakyakinannya terhadap janji tokoh Raul secara terus terang.' }, { label: 'D', text: 'Tokoh Kak Fani digambarkan sebagai atasan yang kurang peka karena ia lebih dahulu menyalahkan kelelahan tokoh Raul tanpa mengetahui penyebab sebenarnya.' }, { label: 'E', text: 'Tokoh Kak Fani digambarkan sebagai atasan yang pesimistis dan mudah ragu karena ia mengaku tidak yakin dengan kemampuan bawahannya sendiri.' } ], key: ['B', 'C'], explanation: 'Kak Fani menunjukkan kepedulian (menawarkan bercerita) dan ketegasan/objektivitas (menyatakan ketidakyakinan). A tidak sepenuhnya karena ia tetap menyampaikan kekhawatiran, D salah karena ia tidak menyalahkan, E berlebihan.' },
            { id: 9, type: 'pg', readingId: 8, question: 'Peristiwa utama yang digambarkan dalam kutipan cerpen tersebut adalah...', options: [ { label: 'A', text: 'Tokoh Raul mengeluhkan pekerjaannya yang berlangsung 24 jam sehari dan tujuh hari seminggu.' }, { label: 'B', text: 'Tokoh Kak Fani menawarkan tokoh Raul untuk menceritakan masalahnya agar hatinya merasa lapang.' }, { label: 'C', text: 'Tokoh Kak Fani menyatakan ketidakyakinannya terhadap janji tokoh Raul yang akan menyelesaikan suplemen besok.' }, { label: 'D', text: 'Tokoh Raul merasa tertekan karena suplemen empat halaman baru separuh yang selesai, sementara tenggat tinggal tiga hari.' }, { label: 'E', text: 'Tokoh Raul dipanggil tokoh Kak Fani untuk membahas keterlambatan dan tekanan pekerjaan, tetapi tokoh Raul memendam masalahnya.' } ], key: 'E', explanation: 'Peristiwa utama adalah pertemuan antara Raul dan Kak Fani membahas masalah keterlambatan dan pekerjaan, dengan Raul yang tidak terbuka tentang perasaannya. Ini mencakup seluruh inti cerita.' },
            { id: 10, type: 'mcma', readingId: 8, question: 'Berdasarkan kutipan cerpen, manakah prediksi logis terhadap kejadian atau akhir cerita yang akan dialami tokoh Raul? Pilihlah jawaban yang benar! Jawaban benar lebih dari satu.', options: [ { label: 'A', text: 'Tokoh Raul akan segera menyelesaikan suplemennya tepat waktu karena tekanan dari tokoh Kak Fani makin kuat dan ia tidak mau mengecewakan atasan.' }, { label: 'B', text: 'Tokoh Raul akan makin tertekan dan mengalami penurunan kinerja karena ia terus memendam masalahnya tanpa mau menceritakan kepada siapapun.' }, { label: 'C', text: 'Tokoh Raul akan menceritakan seluruh masalahnya kepada tokoh Kak Fani setelah menyadari bahwa tawaran tokoh Kak Fani tulus dan bisa membantunya.' }, { label: 'D', text: 'Tokoh Raul akan mengalami krisis eksistensial atau kejenuhan batin yang mendalam karena ia merasakan kekosongan di hati meskipun dikelilingi banyak orang.' }, { label: 'E', text: 'Tokoh Raul akan terus bekerja dengan kondisi tertekan tanpa perubahan signifikan karena ia tidak mampu mengubah situasi ataupun membuka diri.' } ], key: ['B', 'D', 'E'], explanation: 'Raul digambarkan memendam masalah, merasa kosong, dan tidak yakin bisa menyelesaikan pekerjaan. Prediksi B, D, E paling logis. A tidak realistis karena ia tidak termotivasi, C tidak didukung teks.' },
            { id: 11, type: 'pg', readingId: 11, question: 'Makna kata nasib dalam puisi tersebut adalah.....', options: [ { label: 'A', text: 'harapan yang akan datang' }, { label: 'B', text: 'perjalanan hidup yang panjang' }, { label: 'C', text: 'takdir atau ketentuan dari Tuhan' }, { label: 'D', text: 'masa depan yang masih belum pasti' }, { label: 'E', text: 'keberuntungan yang diterima seseorang' } ], key: 'D', explanation: 'Dalam konteks puisi "Waktu jalan. Aku tidak tahu apa nasib waktu", nasib diartikan sebagai masa depan yang belum pasti, sesuai dengan suasana ketidakpastian.' },
            { id: 12, type: 'kategori_tt', readingId: 11, question: 'Tentukan Tepat atau Tidak Tepat untuk setiap pernyataan berikut terkait penggunaan latar dalam puisi!', statements: [ 'Penggunaan latar malam mampu membangkitkan rasa cemas yang dialami para pejuang yang tidak tahu nasib masa depannya.', 'Penggambaran "daerah yang mati" sebagai latar tempat melambangkan semangat juang yang membara meskipun dalam kondisi terdesak.', 'Perpaduan antara malam dan suasana gelisah mampu memperkuat tema puisi secara harmonis karena malam sering dikaitkan dengan ketidakpastian.' ], keys: ['Tepat', 'Tidak Tepat', 'Tepat'], explanation: 'Pernyataan 1 tepat; malam menimbulkan suasana mencekam dan cemas. Pernyataan 2 tidak tepat; "daerah yang mati" justru melambangkan kepasrahan atau keheningan, bukan semangat membara. Pernyataan 3 tepat; malam identik dengan ketidakpastian.' },
            { id: 13, type: 'pg', readingId: 13, question: 'Hubungan makna yang paling tepat antara paragraf kedua terhadap paragraf pertama adalah...', options: [ { label: 'A', text: 'Paragraf kedua menjelaskan berbagai dampak negatif penerapan pendidikan inklusif yang dibahas di paragraf pertama.' }, { label: 'B', text: 'Paragraf kedua menjelaskan kendala-kendala penerapan pendidikan inklusif yang sudah dipaparkan di paragraf pertama.' }, { label: 'C', text: 'Paragraf kedua menjelaskan berbagai macam masalah dari penerapan pendidikan inklusif yang dibahas di paragraf pertama.' }, { label: 'D', text: 'Paragraf kedua menjelaskan tantangan dari salah satu kendala penerapan pendidikan inklusif yang disebutkan di paragraf pertama.' }, { label: 'E', text: 'Paragraf kedua menjelaskan penyebab spesifik salah satu kendala penerapan pendidikan inklusif yang disebutkan di paragraf pertama.' } ], key: 'E', explanation: 'Paragraf pertama menyebutkan "masih menghadapi berbagai kendala serius". Paragraf kedua mempersempit dengan membahas salah satu kendala: keterbatasan tenaga pendidik khusus. Jadi E tepat.' },
            { id: 14, type: 'pg', readingId: 13, question: 'Berdasarkan isi teks, prediksi yang akan terjadi pada masa depan jika berbagai hambatan dalam pelaksanaan pendidikan inklusif tidak segera diatasi adalah...', options: [ { label: 'A', text: 'Sekolah akan makin bergantung pada inisiatif internal dalam memenuhi kebutuhan murid berkebutuhan khusus.' }, { label: 'B', text: 'Kesenjangan layanan pendidikan akan makin besar karena kebutuhan murid belum dapat terpenuhi secara optimal.' }, { label: 'C', text: 'Pelaksanaan pendidikan inklusif akan menunjukkan hasil beragam sesuai dengan kesiapan sumber daya di tiap sekolah.' }, { label: 'D', text: 'Kualitas layanan pendidikan inklusif akan sulit berkembang secara merata meskipun berbagai kebijakan telah ditetapkan.' }, { label: 'E', text: 'Pemerataan pendidikan akan berlangsung lebih lambat karena masih terdapat perbedaan kualitas layanan antarsekolah.' } ], key: 'B', explanation: 'Teks menyebutkan hambatan dana, fasilitas, SDM menyebabkan kebutuhan murid terabaikan. Prediksi paling tepat adalah kesenjangan layanan makin besar.' },
            { id: 15, type: 'pg', readingId: 13, question: 'Makna kata optimal yang sesuai dengan teks tersebut adalah...', options: [ { label: 'A', text: 'Menerapkan prinsip inklusivitas dengan hasil terbaik sesuai kemampuan yang ada.' }, { label: 'B', text: 'Melakukan pemerataan pendidikan secara menyeluruh tanpa terkendala apa pun.' }, { label: 'C', text: 'Memberikan kesempatan belajar yang sama bagi semua murid tanpa terkecuali.' }, { label: 'D', text: 'Mengatasi berbagai kendala serius yang menghambat pelaksanaan pendidikan.' }, { label: 'E', text: 'Mencapai target pendidikan tanpa memerlukan bantuan dari pihak mana pun.' } ], key: 'A', explanation: 'Optimal berarti kondisi terbaik yang dapat dicapai. Dalam konteks teks, menerapkan prinsip inklusivitas secara optimal berarti dengan hasil terbaik sesuai kemampuan.' },
            { id: 16, type: 'kategori_bs', readingId: 13, question: 'Tentukan Benar atau Salah untuk setiap pernyataan berikut terkait keakuratan setiap pernyataan dengan isi teks!', statements: [ 'Pendidikan inklusif bertujuan memberikan kesempatan belajar bagi semua murid secara setara.', 'Tenaga pendidik yang paham kebutuhan murid difabel sangat dibutuhkan dalam penerapan pembelajaran inklusif.', 'Meskipun masih terbatas, fasilitas pendukung pendidikan inklusif sudah tersedia di hampir semua sekolah.' ], keys: ['Benar', 'Benar', 'Salah'], explanation: 'Pernyataan 1 dan 2 sesuai teks. Pernyataan 3 salah karena teks menyebut banyak sekolah belum menyediakan sarana aksesibel.' },
            { id: 17, type: 'pg', readingId: 17, question: 'Berdasarkan teks, tokoh Karsa digambarkan sebagai sosok yang', options: [ { label: 'A', text: 'tegas dan supel' }, { label: 'B', text: 'tegas dan kreatif' }, { label: 'C', text: 'kreatif dan supel' }, { label: 'D', text: 'tegas dan baik hati' }, { label: 'E', text: 'kreatif dan bijaksana' } ], key: 'B', explanation: 'Karsa digambarkan sebagai komandan yang tegas (gerak jarinya instruksi) dan kreatif (menciptakan atmosfer magis, detail kecil diperhatikan).' },
            { id: 18, type: 'pg', readingId: 17, question: 'Manakah pernyataan yang sesuai dengan istilah mise-en-scène dalam teks tersebut?', options: [ { label: 'A', text: 'Seluruh unsur visual yang tampak di atas panggung.' }, { label: 'B', text: 'Rias wajah dan kostum yang dikenakan para pemain.' }, { label: 'C', text: 'Dialog antaraktor yang diucapkan selama pertunjukan.' }, { label: 'D', text: 'Pengaturan posisi dan pergerakan aktor di atas panggung.' }, { label: 'E', text: 'Tata suara dan musik yang mengiringi jalannya pertunjukan.' } ], key: 'A', explanation: 'Teks menyebut "Maknanya mencakup seluruh unsur yang tampak di panggung". Jadi A.' },
            { id: 19, type: 'mcma', readingId: 17, question: 'Menurut penilaianmu, manakah pernyataan yang paling tepat mengenai penggunaan gaya bahasa dalam teks tersebut terhadap pembaca? Pilihlah jawaban yang benar! Jawaban benar lebih dari satu.', options: [ { label: 'A', text: 'Gaya bahasa repetisi pada kalimat "cepat, tetapi membekas" yang diulang dua kali justru melemahkan pesan karena terkesan berlebihan dan membosankan bagi pembaca.' }, { label: 'B', text: 'Gaya bahasa simile pada kalimat "Lampu sorot tampak seperti pedang yang siap terhunus" membuat pembaca membayangkan suasana panggung yang keras dan penuh ketegangan seperti medan perang.' }, { label: 'C', text: 'Gaya bahasa simile pada kalimat "Senyum kecil muncul sesaat-cepat, tetapi membekas, Seperti kilat: cepat, tetapi membekas" membantu pembaca memahami bahwa kesan dari senyum Karsa bersifat singkat tetapi mendalam.' }, { label: 'D', text: 'Gaya bahasa metafora pada kalimat "Lampu sorot tampak seperti pedang yang siap terhunus" kurang efektif karena pembaca akan bingung membayangkan lampu sorot sebagai pedang yang tidak mungkin muncul di panggung teater.' }, { label: 'E', text: 'Gaya bahasa antitesis pada kalimat "Mereka bergerak seperti mesin yang sangat terlatih. Namun, kebebasan jiwa mereka tetap terasa hidup" menimbulkan respons pembaca berupa rasa penasaran tentang cara aktor bisa menjadi patuh sekaligus merdeka.' } ], key: ['B', 'C', 'E'], explanation: 'Pernyataan B, C, E tepat menggambarkan efek gaya bahasa terhadap pembaca. A salah karena repetisi justru memperkuat kesan. D salah karena metafora justru efektif.' },
            { id: 20, type: 'pg', readingId: 17, question: 'Penilaian paling tepat terhadap penggunaan konjungsi dalam teks tersebut adalah...', options: [ { label: 'A', text: 'Penggunaan konjungsi bahkan pada paragraf akhir dinilai kurang tepat karena konjungsi tersebut tidak biasa digunakan sebagai penutup cerita.' }, { label: 'B', text: 'Penggunaan konjungsi namun dan tetapi secara berulang dinilai kurang efektif karena membuat alur berpikir pembaca menjadi terputus-putus.' }, { label: 'C', text: 'Penggunaan konjungsi tetapi dan namun dinilai sangat membantu karena menunjukkan hubungan pertentangan yang dialami tokoh Karsa.' }, { label: 'D', text: 'Penggunaan konjungsi maka dan bahkan dinilai kurang sesuai karena kedua konjungsi tersebut untuk menyatakan sesuatu yang dilebih-lebihkan.' }, { label: 'E', text: 'Penggunaan konjungsi maka dan sehingga dinilai cukup tepat karena hubungan sebab akibat membantu pembaca memahami penyebab tindakan tokoh Karsa.' } ], key: 'C', explanation: 'Konjungsi tetapi dan namun sering muncul untuk menunjukkan kontras antara ketegasan dan kegelisahan Karsa. Itu sangat membantu pembaca memahami pertentangan batinnya.' },
            { id: 21, type: 'pg', readingId: 21, question: 'Ide pokok kutipan novel tersebut adalah.', options: [ { label: 'A', text: 'Tokoh Samsulbahri mendengar berbagai bunyi dari alam sekitar seperti ombak dan suara azan subuh.' }, { label: 'B', text: 'Tokoh Samsulbahri takut ayahnya terbangun sehingga ia membuka pintu biliknya dengan perlahan-lahan.' }, { label: 'C', text: 'Tokoh Samsulbahri merasa gelisah dan tidak sabar menunggu waktu berangkat untuk pergi bersuka-sukaan.' }, { label: 'D', text: 'Tokoh Samsulbahri bangun pagi karena mendengar suara kokok ayam dan bunyi kereta api dari Stasiun Padang.' }, { label: 'E', text: 'Tokoh Samsulbahri terbangun pada pukul lima pagi lalu memutuskan untuk berbaring-baring santai di tempat tidurnya.' } ], key: 'C', explanation: 'Paragraf menunjukkan kegelisahan dan ketidaksabaran Samsu menunggu siang untuk pergi ke Gunung Padang. Ini ide pokok utama.' },
            { id: 22, type: 'pg', readingId: 21, question: 'Latar suasana dalam kutipan novel tersebut adalah..', options: [ { label: 'A', text: 'hening' }, { label: 'B', text: 'sunyi' }, { label: 'C', text: 'resah' }, { label: 'D', text: 'damai' }, { label: 'E', text: 'tegang' } ], key: 'C', explanation: 'Tokoh merasa gelisah, tidak sabar, dan tidak bisa tidur. Suasana resah paling sesuai.' },
            { id: 23, type: 'mcma', readingId: 21, question: 'Apa konflik yang dialami tokoh Samsulbahri? Pilihlah jawaban yang benar! Jawaban benar lebih dari satu.', options: [ { label: 'A', text: 'Konflik dengan ayahnya yang melarangnya pergi bersuka-sukaan ke Gunung Padang.' }, { label: 'B', text: 'Konflik batin antara rasa tidak sabar dengan kesadarannya untuk tetap bersikap sabar.' }, { label: 'C', text: 'Konflik dengan teman-temannya yang tidak kunjung datang menjemput untuk pergi bersama.' }, { label: 'D', text: 'Konflik antara keinginan untuk segera bangun dengan kekhawatiran membangunkan ayahnya.' }, { label: 'E', text: 'Konflik antara keinginan untuk segera berangkat dengan kenyataan bahwa hari masih pagi dan gelap.' } ], key: ['B', 'D', 'E'], explanation: 'Konflik utama adalah batin: tidak sabar vs sabar, takut membangunkan ayah, dan keinginan berangkat vs hari masih pagi. A tidak ada larangan, C tidak disebut.' },
            { id: 24, type: 'mcma', readingId: 24, question: 'Berdasarkan kutipan drama, manakah pernyataan yang masih relevan dengan kehidupan sehari-hari? Pilihlah jawaban yang benar! Jawaban benar lebih dari satu.', options: [ { label: 'A', text: 'Mencari kebenaran atas kabar keluarga yang hilang adalah kewajiban moral yang tidak bisa ditawar.' }, { label: 'B', text: 'Bekerja lembur di tengah masalah keluarga menunjukkan kurangnya kepekaan terhadap situasi rumah.' }, { label: 'C', text: 'Menyediakan makanan untuk keluarga meskipun sedang bersedih mencerminkan ketangguhan seorang ibu.' }, { label: 'D', text: 'Merespons kabar penting dengan antusiasme berlebihan justru dapat menimbulkan kekecewaan yang lebih besar.' }, { label: 'E', text: 'Keyakinan bahwa seseorang yang sudah lama pergi tidak mungkin kembali adalah sikap realistis dalam kehidupan.' } ], key: ['A', 'C'], explanation: 'A dan C relevan dengan nilai kehidupan. B, D, E tidak selalu tepat atau berlebihan.' },
            { id: 25, type: 'kategori_bs', readingId: 24, question: 'Berdasarkan kutipan drama, tentukan Benar atau Salah untuk setiap pernyataan terkait respons emosional pembaca berikut!', statements: [ 'Pembaca akan merasa ikut penasaran bersama tokoh Maimun tentang kebenaran kabar sosok mirip sang ayah yang dilihat oleh tokoh Pak Tirto.', 'Pembaca akan merasa jengkel terhadap sikap tokoh Gunarto yang acuh tak acuh ketika mendengar kabar kemungkinan ayahnya masih hidup.', 'Pembaca akan merasa lega ketika tokoh Ibu menyatakan keyakinannya bahwa suaminya sudah lama meninggal atau pergi ke luar negeri.' ], keys: ['Benar', 'Benar', 'Salah'], explanation: 'Pernyataan 1 dan 2 sesuai: pembaca penasaran dan jengkel. Pernyataan 3 salah: justru pembaca merasa sedih, bukan lega.' }
        ];

        let totalScore = 0;
        let totalAnswered = 0;
        let answeredQuestions = new Set();

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast';
            if (type === 'correct') toast.classList.add('correct', 'show');
            else if (type === 'wrong') toast.classList.add('wrong', 'show');
            else toast.classList.add('info', 'show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.className = 'toast', 300);
            }, 2200);
        }

        function updateScore() {
            document.getElementById('scoreDisplay').textContent = 'Skor: ' + totalScore + ' / ' + totalAnswered;
        }

        function showKey(questionId) {
            const keyEl = document.getElementById('key-' + questionId);
            if (keyEl) keyEl.classList.add('visible');
        }

        function markAnswered(questionId) {
            if (!answeredQuestions.has(questionId)) {
                answeredQuestions.add(questionId);
                totalAnswered++;
                updateScore();
            }
        }

        function selectPG(qid, selectedOption) {
            const card = document.getElementById('q' + qid);
            const correctKey = card.dataset.key;
            const options = document.querySelectorAll('#q' + qid + ' .option');
            let isCorrect = selectedOption === correctKey;
            options.forEach(opt => {
                opt.classList.add('disabled');
                const optLetter = opt.dataset.option;
                if (optLetter === correctKey) opt.classList.add('selected-correct');
                if (optLetter === selectedOption && !isCorrect) opt.classList.add('selected-wrong');
            });
            if (isCorrect) showToast('✅ Benar! Jawaban Anda tepat.', 'correct');
            else showToast('❌ Salah! Kunci jawaban: ' + correctKey, 'wrong');
            markAnswered(qid);
            if (isCorrect) totalScore++;
            updateScore();
            showKey(qid);
        }

        function selectMCMA(qid, selectedOption) {
            const card = document.getElementById('q' + qid);
            let correctKeys = JSON.parse(card.dataset.key);
            const optionEl = card.querySelector('.option[data-option="' + selectedOption + '"]');
            const isKey = correctKeys.includes(selectedOption);
            if (optionEl.classList.contains('selected-correct') || optionEl.classList.contains('selected-wrong')) return;
            if (isKey) {
                optionEl.classList.add('selected-correct');
                showToast('✅ Benar! Pilihan ini adalah kunci jawaban.', 'correct');
            } else {
                optionEl.classList.add('selected-wrong');
                showToast('❌ Salah! Pilihan ini bukan kunci jawaban.', 'wrong');
            }
            markAnswered(qid);
            const allCorrectSelected = correctKeys.every(key => {
                const opt = card.querySelector('.option[data-option="' + key + '"]');
                return opt && opt.classList.contains('selected-correct');
            });
            if (allCorrectSelected) {
                totalScore++;
                updateScore();
                showToast('🎉 Semua kunci jawaban ditemukan!', 'correct');
            }
            showKey(qid);
        }

        function selectKategori(qid, rowIndex, selectedValue) {
            const card = document.getElementById('q' + qid);
            let keys = JSON.parse(card.dataset.keys);
            const rows = card.querySelectorAll('.kategori-row');
            const targetRow = rows[rowIndex];
            const buttons = targetRow.querySelectorAll('.kategori-btn');
            if (targetRow.dataset.answered === 'true') return;
            const correctValue = keys[rowIndex];
            const isCorrect = selectedValue === correctValue;
            buttons.forEach(btn => {
                btn.classList.add('disabled');
                if (btn.dataset.value === correctValue) btn.classList.add('selected-correct');
                if (btn.dataset.value === selectedValue && !isCorrect) btn.classList.add('selected-wrong');
            });
            if (isCorrect) {
                targetRow.classList.add('correct-row');
                showToast('✅ Benar! Pernyataan ini tepat.', 'correct');
            } else {
                targetRow.classList.add('wrong-row');
                showToast('❌ Salah! Kunci: ' + correctValue, 'wrong');
            }
            targetRow.dataset.answered = 'true';
            markAnswered(qid);
            const allCorrect = Array.from(rows).every((row, idx) => {
                return row.dataset.answered === 'true' && keys[idx] === getSelectedValue(row);
            });
            if (allCorrect) {
                totalScore++;
                updateScore();
                showToast('🎉 Semua pernyataan terjawab dengan benar!', 'correct');
            }
            showKey(qid);
        }

        function getSelectedValue(row) {
            const selectedBtn = row.querySelector('.kategori-btn.selected-correct');
            return selectedBtn ? selectedBtn.dataset.value : null;
        }

        function renderQuestions() {
            const container = document.getElementById('quizContainer');
            questions.forEach(q => {
                let card = document.createElement('div');
                card.className = 'card';
                card.id = 'q' + q.id;
                card.dataset.type = q.type;

                let typeLabel = '';
                if (q.type === 'pg') typeLabel = 'PG';
                else if (q.type === 'mcma') typeLabel = 'PGK MCMA';
                else if (q.type === 'kategori_bs') typeLabel = 'PGK Kategori (Benar/Salah)';
                else if (q.type === 'kategori_tt') typeLabel = 'PGK Kategori (Tepat/Tidak Tepat)';

                let html = '';
                if (q.readingId && readingTexts[q.readingId]) {
                    const rt = readingTexts[q.readingId];
                    html += `<div class="text-excerpt"><strong>${rt.title}</strong><br>${rt.content}</div>`;
                }
                html += `<span class="question-number">Soal ${q.id}</span><span class="question-type">${typeLabel}</span>`;
                html += `<p class="question-text">${q.question}</p>`;

                if (q.type === 'pg') {
                    html += `<div class="options">`;
                    q.options.forEach(opt => {
                        html += `<div class="option" data-option="${opt.label}" onclick="selectPG(${q.id},'${opt.label}')"><span class="option-letter">${opt.label}</span><span class="option-text">${opt.text}</span></div>`;
                    });
                    html += `</div>`;
                    card.dataset.key = q.key;
                } else if (q.type === 'mcma') {
                    html += `<div class="options mcma">`;
                    q.options.forEach(opt => {
                        html += `<div class="option" data-option="${opt.label}" onclick="selectMCMA(${q.id},'${opt.label}')"><span class="option-letter">${opt.label}</span><span class="option-text">${opt.text}</span></div>`;
                    });
                    html += `</div>`;
                    card.dataset.key = JSON.stringify(q.key);
                } else {
                    html += `<div class="kategori-table">`;
                    q.statements.forEach((stmt, idx) => {
                        html += `<div class="kategori-row" data-row="${idx}"><div class="statement-text">${stmt}</div><div class="kategori-buttons">`;
                        if (q.type === 'kategori_bs') {
                            html += `<button class="kategori-btn" data-value="Benar" onclick="selectKategori(${q.id},${idx},'Benar')">Benar</button>`;
                            html += `<button class="kategori-btn" data-value="Salah" onclick="selectKategori(${q.id},${idx},'Salah')">Salah</button>`;
                        } else {
                            html += `<button class="kategori-btn" data-value="Tepat" onclick="selectKategori(${q.id},${idx},'Tepat')">Tepat</button>`;
                            html += `<button class="kategori-btn" data-value="Tidak Tepat" onclick="selectKategori(${q.id},${idx},'Tidak Tepat')">Tidak Tepat</button>`;
                        }
                        html += `</div></div>`;
                    });
                    html += `</div>`;
                    card.dataset.keys = JSON.stringify(q.keys);
                }

                html += `<div class="answer-key" id="key-${q.id}"><div class="key-label"><span class="icon-check">✔</span> Kunci Jawaban: ${formatKey(q)}</div><div class="key-answer">${formatAnswer(q)}</div><div class="key-explanation"><strong>Pembahasan & Trik:</strong> ${q.explanation}</div></div>`;
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function formatKey(q) {
            if (q.type === 'pg') return q.key;
            if (q.type === 'mcma') return q.key.join(', ');
            if (q.type === 'kategori_bs' || q.type === 'kategori_tt') {
                return q.keys.join(' • ');
            }
            return '';
        }

        function formatAnswer(q) {
            if (q.type === 'pg') {
                const opt = q.options.find(o => o.label === q.key);
                return opt ? `${q.key}. ${opt.text}` : q.key;
            }
            if (q.type === 'mcma') {
                return q.key.map(k => {
                    const opt = q.options.find(o => o.label === k);
                    return opt ? `${k}. ${opt.text}` : k;
                }).join('<br>');
            }
            if (q.type === 'kategori_bs' || q.type === 'kategori_tt') {
                return q.statements.map((s, i) => `${i+1}. ${s} → <strong>${q.keys[i]}</strong>`).join('<br>');
            }
            return '';
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderQuestions();
            document.querySelectorAll('.answer-key').forEach(k => k.classList.remove('visible'));
        });
    </script>
</body>
</html>
