<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKA Sosiologi SMA - Quiz Interaktif 30 Soal</title>
    <style>
        :root {
            --primary: #5b4bc4;
            --primary-dark: #3a2f8f;
            --primary-light: #e8e5f9;
            --accent: #f39c12;
            --accent-light: #fef3e2;
            --success: #27ae60;
            --success-light: #eafaf1;
            --danger: #e74c3c;
            --danger-light: #fdf2f2;
            --dark: #2c3e50;
            --gray: #7f8c8d;
            --light-gray: #ecf0f1;
            --white: #ffffff;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            line-height: 1.6;
            color: var(--dark);
        }

        .quiz-container {
            width: 100%;
            max-width: 820px;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            transition: var(--transition);
        }

        /* Header */
        .quiz-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 50%, #6c5ce7 100%);
            color: var(--white);
            padding: 28px 32px 20px;
            position: relative;
            overflow: hidden;
        }

        .quiz-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            pointer-events: none;
        }

        .quiz-header::before {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            pointer-events: none;
        }

        .quiz-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quiz-title .icon {
            font-size: 2rem;
        }
        .quiz-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 6px;
            position: relative;
            z-index: 1;
            font-weight: 400;
        }

        .progress-section {
            margin-top: 18px;
            position: relative;
            z-index: 1;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            opacity: 0.95;
        }
        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            background: var(--accent);
            height: 100%;
            border-radius: 20px;
            transition: width 0.5s ease;
            width: 0%;
            position: relative;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        /* Question Body */
        .quiz-body {
            padding: 28px 32px 20px;
            min-height: 420px;
        }

        .question-number-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .question-type-badge {
            display: inline-block;
            background: var(--accent-light);
            color: #b9770e;
            font-weight: 600;
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 14px;
            margin-left: 8px;
            letter-spacing: 0.3px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.7;
            margin-bottom: 20px;
            color: var(--dark);
        }

        .question-context {
            background: var(--light-gray);
            border-left: 4px solid var(--primary);
            padding: 16px 20px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #444;
            line-height: 1.7;
        }

        /* Options */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 18px;
            border: 2px solid var(--light-gray);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            background: var(--white);
            position: relative;
            user-select: none;
        }
        .option-item:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateX(4px);
        }
        .option-item.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .option-item.correct {
            border-color: var(--success);
            background: var(--success-light);
        }
        .option-item.incorrect {
            border-color: var(--danger);
            background: var(--danger-light);
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }

        .option-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .option-item.selected .option-letter,
        .option-item.correct .option-letter {
            background: var(--primary);
            color: var(--white);
        }
        .option-item.incorrect .option-letter {
            background: var(--danger);
            color: var(--white);
        }
        .option-item.correct .option-letter {
            background: var(--success);
        }
        .option-text {
            font-size: 0.95rem;
            color: #333;
            line-height: 1.5;
            padding-top: 3px;
        }

        /* Feedback */
        .feedback-container {
            margin-top: 16px;
            padding: 18px 20px;
            border-radius: var(--radius-sm);
            display: none;
            animation: fadeInUp 0.4s ease;
        }
        .feedback-container.show {
            display: block;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .feedback-correct {
            background: var(--success-light);
            border-left: 4px solid var(--success);
        }
        .feedback-incorrect {
            background: var(--danger-light);
            border-left: 4px solid var(--danger);
        }
        .feedback-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feedback-correct .feedback-title {
            color: var(--success);
        }
        .feedback-incorrect .feedback-title {
            color: var(--danger);
        }
        .feedback-explanation {
            font-size: 0.9rem;
            color: #444;
            line-height: 1.7;
        }
        .feedback-key {
            font-weight: 600;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #555;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: var(--radius-xs);
            display: inline-block;
        }

        /* PGK Kategori Table */
        .pgk-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .pgk-table th {
            background: var(--primary);
            color: var(--white);
            font-weight: 600;
            padding: 12px 14px;
            text-align: left;
            font-size: 0.85rem;
        }
        .pgk-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--light-gray);
            background: var(--white);
            vertical-align: middle;
        }
        .pgk-table tr:last-child td {
            border-bottom: none;
        }
        .pgk-statement {
            font-weight: 500;
            color: #333;
            line-height: 1.5;
        }
        .pgk-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .pgk-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid var(--light-gray);
            background: var(--white);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
            color: #555;
        }
        .pgk-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }
        .pgk-btn.selected-correct {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
        }
        .pgk-btn.selected-incorrect {
            border-color: var(--danger);
            background: var(--danger-light);
            color: var(--danger);
            animation: shake 0.4s ease;
        }
        .pgk-btn.disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        .pgk-row-feedback {
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 4px;
        }
        .pgk-row-feedback.correct-text {
            color: var(--success);
        }
        .pgk-row-feedback.incorrect-text {
            color: var(--danger);
        }

        /* MCMA Checkbox */
        .mcma-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        .mcma-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 2px solid var(--light-gray);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
        }
        .mcma-item:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .mcma-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }
        .mcma-item.checked {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .mcma-item.correct-answer {
            border-color: var(--success);
            background: var(--success-light);
        }
        .mcma-item.wrong-answer {
            border-color: var(--danger);
            background: var(--danger-light);
            animation: shake 0.4s ease;
        }
        .mcma-item.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        /* Buttons */
        .btn {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(91, 75, 196, 0.35);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(91, 75, 196, 0.45);
        }
        .btn-accent {
            background: var(--accent);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.35);
        }
        .btn-accent:hover {
            background: #e08e0b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.45);
        }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-nav {
            padding: 10px 20px;
            font-size: 0.85rem;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .nav-buttons .spacer {
            flex: 1;
        }

        /* Score Summary */
        .score-summary {
            text-align: center;
            padding: 40px 30px;
            display: none;
            animation: fadeInUp 0.6s ease;
        }
        .score-summary.show {
            display: block;
        }
        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 2.5rem;
            font-weight: 800;
            box-shadow: 0 10px 40px rgba(91, 75, 196, 0.4);
        }
        .score-circle span {
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0.9;
        }
        .score-details {
            font-size: 1rem;
            color: #555;
            margin-bottom: 20px;
        }
        .score-breakdown {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .score-stat {
            padding: 14px 22px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            text-align: center;
            min-width: 100px;
        }
        .score-stat.correct-stat {
            background: var(--success-light);
            color: var(--success);
        }
        .score-stat.incorrect-stat {
            background: var(--danger-light);
            color: var(--danger);
        }
        .score-stat.unanswered-stat {
            background: var(--light-gray);
            color: var(--gray);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
            .quiz-header {
                padding: 20px 18px 16px;
            }
            .quiz-title {
                font-size: 1.2rem;
            }
            .quiz-body {
                padding: 20px 16px 16px;
            }
            .question-text {
                font-size: 1rem;
            }
            .option-item {
                padding: 10px 14px;
                gap: 10px;
            }
            .option-letter {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
            }
            .option-text {
                font-size: 0.88rem;
            }
            .pgk-table th,
            .pgk-table td {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            .pgk-btn {
                padding: 4px 10px;
                font-size: 0.72rem;
            }
            .btn {
                padding: 10px 20px;
                font-size: 0.82rem;
            }
            .nav-buttons {
                gap: 8px;
            }
            .score-circle {
                width: 110px;
                height: 110px;
                font-size: 2rem;
            }
            .score-breakdown {
                gap: 8px;
            }
            .score-stat {
                padding: 10px 14px;
                min-width: 80px;
                font-size: 0.85rem;
            }
        }
        @media (max-width: 400px) {
            .quiz-header {
                padding: 16px 12px 12px;
            }
            .quiz-body {
                padding: 16px 12px 12px;
            }
            .question-text {
                font-size: 0.92rem;
            }
            .option-text {
                font-size: 0.82rem;
            }
            .btn-nav {
                padding: 8px 14px;
                font-size: 0.75rem;
            }
            .pgk-table {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container" id="quizContainer">
        <!-- Header -->
        <div class="quiz-header">
            <div class="quiz-title">
                <span class="icon">📚</span> TKA Sosiologi SMA
            </div>
            <div class="quiz-subtitle">Kuis Interaktif · 30 Soal · Irisan Kurikulum 2013 & Merdeka</div>
            <div class="progress-section">
                <div class="progress-info">
                    <span id="progressText">Soal 1 dari 30</span>
                    <span id="scoreText">Skor: 0</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>
        </div>

        <!-- Body -->
        <div class="quiz-body" id="quizBody">
            <!-- Questions rendered by JS -->
        </div>

        <!-- Score Summary -->
        <div class="score-summary" id="scoreSummary">
            <div class="score-circle" id="finalScore">0<span>dari 30</span></div>
            <h2 style="margin-bottom:8px;color:var(--dark);">Hasil Akhir</h2>
            <p class="score-details" id="scoreMessage">Kerjakan semua soal untuk melihat hasil!</p>
            <div class="score-breakdown">
                <div class="score-stat correct-stat" id="statCorrect">✅ Benar: 0</div>
                <div class="score-stat incorrect-stat" id="statIncorrect">❌ Salah: 0</div>
                <div class="score-stat unanswered-stat" id="statUnanswered">⏭️ Belum: 0</div>
            </div>
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 Ulangi Kuis</button>
        </div>
    </div>

    <script>
        // ==================== DATA SOAL ====================
        const questions = [
            // ===== BAB 1: SOSIOLOGI SEBAGAI ILMU (5 soal) =====
            {
                type: 'pg',
                topic: 'Sosiologi sebagai Ilmu',
                subtopic: 'Ciri-ciri sosiologi',
                number: 1,
                question: 'Sekelompok mahasiswa melakukan penelitian tentang fenomena flexing di media sosial. Mereka membaca berbagai jurnal dan menemukan bahwa teori-teori tentang perilaku konsumtif terus mengalami penyempurnaan dari masa ke masa. Para sosiolog kontemporer terus mengembangkan teori lama agar relevan dengan era digital saat ini. Manakah ciri sosiologi yang paling tepat berdasarkan ilustrasi tersebut?',
                options: [
                    'A. Teoritis - karena berusaha menyusun abstraksi dari hasil pengamatan',
                    'B. Nonetis - karena tidak menilai baik buruknya perilaku flexing',
                    'C. Empiris - karena berdasarkan observasi lapangan yang nyata',
                    'D. Objektif - karena tidak dipengaruhi oleh subjektivitas peneliti',
                    'E. Kumulatif - karena teori terus berkembang dan disempurnakan'
                ],
                correct: 4,
                explanation: 'Ciri kumulatif berarti teori-teori sosiologi dibangun dari teori-teori yang sudah ada sebelumnya dan terus mengalami penyempurnaan. Ilustrasi soal menekankan bahwa "teori-teori terus mengalami penyempurnaan" dan "para sosiolog kontemporer terus mengembangkan teori lama" yang merupakan karakteristik dari ciri kumulatif.'
            }, {
                type: 'pg',
                topic: 'Sosiologi sebagai Ilmu',
                subtopic: 'Objek kajian sosiologi',
                number: 2,
                question: 'Perhatikan pernyataan berikut! Objek kajian sosiologi memiliki karakteristik yang berbeda dibandingkan dengan cabang ilmu lainnya. Berdasarkan pernyataan berikut, manakah yang PALING TEPAT menggambarkan objek kajian sosiologi?',
                options: [
                    'A. Gempa bumi berkekuatan 6,8 yang terjadi di Jawa Barat sebagai akibat pergeseran lempeng bumi',
                    'B. Kecanduan media sosial di kalangan remaja yang mengubah pola interaksi dan komunikasi dalam keluarga',
                    'C. Long COVID yang menyebabkan gangguan kesehatan fisik dan mental selama berbulan-bulan',
                    'D. Aktivitas vulkanik yang menyebabkan kerusakan infrastruktur dan memaksa warga mengungsi',
                    'E. Penyebaran virus baru yang menimbulkan krisis kesehatan global'
                ],
                correct: 1,
                explanation: 'Objek kajian sosiologi selalu berkaitan dengan manusia, interaksi sosial, dan fenomena yang terjadi dalam masyarakat. Kecanduan media sosial yang mengubah pola interaksi dalam keluarga merupakan fenomena sosial karena melibatkan hubungan antar manusia. Pilihan lain (gempa, COVID, vulkanik, virus) adalah fenomena alam atau kesehatan, bukan kajian utama sosiologi.'
            }, {
                type: 'pgk',
                topic: 'Sosiologi sebagai Ilmu',
                subtopic: 'Peran sosiologi dalam kehidupan',
                number: 3,
                question: 'Perhatikan infografis berikut tentang kerusakan lingkungan hidup. Tentukan Sesuai atau Tidak Sesuai pada peran ilmu sosiologi untuk menyikapi kasus tersebut!',
                pgkStatements: [
                    'Meneliti dampak kerusakan lingkungan terhadap terjadinya perubahan perilaku sosial masyarakat.',
                    'Menganalisis proses peluruhan gas rumah kaca di atmosfer untuk mengurangi pemanasan global.',
                    'Mendorong pemberdayaan masyarakat di bidang pengelolaan sampah melalui komunitas bank sampah.'
                ],

        // ==================== RENDER FUNCTIONS ====================
        function renderQuestion() {
            if (quizCompleted) return;
            const q = questions[currentQuestion];
            const isAnswered = answers[currentQuestion] !== undefined;

            let html = '';
            html += `<div class="question-number-badge">Soal ${currentQuestion + 1}</div>`;

                html += `</div>`;

                q.pgkStatements.forEach((stmt, idx) => {

                    html += `<tr>

                                <button class="pgk-btn ${isAnswered && answers[currentQuestion].selected && answers[currentQuestion].selected[idx] === 'tidak' ? (answers[currentQuestion].selected[idx] === q.pgkCorrect[idx] ? 'selected-correct' : 'selected-incorrect') : ''} ${isAnswered ? 'disabled' : ''}" onclick="handlePGKClick(${idx}, 'tidak')" id="pgk_${idx}_tidak">Tidak Sesuai</button>
                            </div>
                            ${rowFb}
                        </td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            } else if (q.type === 'mcma') {
                html += `<div class="mcma-options" id="mcmaOptions">`;

                        } else if (q.correct.includes(idx)) {
                            cls += ' correct-answer';
                        }

                    html += `<label class="${cls}" id="mcma_${idx}">

            quizBody.innerHTML = html;
            updateProgress();

            scoreText.textContent = `Skor: ${score} | Benar: ${answered} | Belum: ${total - answered}`;
        }

        function handlePGClick(idx) {
            if (answers[currentQuestion] !== undefined) return;
            const q = questions[currentQuestion];
            const isCorrect = idx === q.correct;
            if (isCorrect) score++;
            answers[currentQuestion] = { answered: true, correct: isCorrect, selected: [idx] };
            renderQuestion();
        }

        function handlePGKClick(idx, value) {
            if (answers[currentQuestion] !== undefined) return;
            const q = questions[currentQuestion];
            if (!answers[currentQuestion]) {
                answers[currentQuestion] = { answered: false, correct: false, selected: [] };
            }
            if (!answers[currentQuestion].selected) answers[currentQuestion].selected = [];
            // Record the selection for this row
            while (answers[currentQuestion].selected.length < q.pgkStatements.length) {
                answers[currentQuestion].selected.push(undefined);
            }
            answers[currentQuestion].selected[idx] = value;

            // Check if all rows answered
            const allAnswered = answers[currentQuestion].selected.every(s => s !== undefined);
            if (allAnswered) {
                // Evaluate
                let allCorrect = true;
                for (let i = 0; i < q.pgkStatements.length; i++) {
                    if (answers[currentQuestion].selected[i] !== q.pgkCorrect[i]) {
                        allCorrect = false;
                        break;
                    }
                }
                answers[currentQuestion].answered = true;
                answers[currentQuestion].correct = allCorrect;
                if (allCorrect) score++;
                renderQuestion();
            } else {
                // Re-render to show current selections
                renderQuestion();
            }
        }

        function handleMCMACheck(idx, checked) {
            if (answers[currentQuestion] !== undefined) return;
            if (!answers[currentQuestion]) {
                answers[currentQuestion] = { answered: false, correct: false, selected: [] };
            }
            if (!answers[currentQuestion].selected) answers[currentQuestion].selected = [];
            if (checked) {
                if (!answers[currentQuestion].selected.includes(idx)) {
                    answers[currentQuestion].selected.push(idx);
                }
            } else {
                answers[currentQuestion].selected = answers[currentQuestion].selected.filter(i => i !== idx);
            }
            // Update UI
            const label = document.getElementById(`mcma_${idx}`);
            if (label) {
                if (checked) label.classList.add('checked');
                else label.classList.remove('checked');
            }
        }

        function handleMCMASubmit() {
            if (answers[currentQuestion] !== undefined && answers[currentQuestion].answered) return;
            const q = questions[currentQuestion];
            const sel = (answers[currentQuestion] && answers[currentQuestion].selected) || [];
            if (sel.length === 0) {
                alert('⚠️ Pilih minimal satu jawaban terlebih dahulu!');
                return;
            }
            // Check if selected match correct
            const sortedSel = [...sel].sort();
            const sortedCorrect = [...q.correct].sort();
            const isCorrect = JSON.stringify(sortedSel) === JSON.stringify(sortedCorrect);
            answers[currentQuestion] = { answered: true, correct: isCorrect, selected: sel };
            if (isCorrect) score++;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function finishQuiz() {
            if (!quizCompleted) {
                quizCompleted = true;
                showScoreSummary();
            }
        }

        function showScoreSummary() {
            const total = questions.length;
            const answered = Object.keys(answers).length;
            const correct = score;
            const incorrect = answered - correct;
            const unanswered = total - answered;

            document.getElementById('finalScore').innerHTML = `${correct}<span>dari ${total}</span>`;

            let message = '';
            const pct = (correct / total) * 100;
            if (pct >= 90) message = '🏆 LUAR BIASA! Anda menguasai materi Sosiologi dengan sangat baik!';
            else if (pct >= 75) message = '🎉 HEBAT! Pemahaman Anda sangat baik!';
            else if (pct >= 60) message = '👍 BAGUS! Anda sudah cukup menguasai materi.';
            else if (pct >= 40) message = '📖 CUKUP. Perlu belajar lebih banyak lagi.';
            else message = '💪 SEMANGAT! Terus belajar dan berlatih!';
            document.getElementById('scoreMessage').textContent = message;

            document.getElementById('statCorrect').textContent = `✅ Benar: ${correct}`;
            document.getElementById('statIncorrect').textContent = `❌ Salah: ${incorrect}`;
            document.getElementById('statUnanswered').textContent = `⏭️ Belum: ${unanswered}`;

            scoreSummary.classList.add('show');
            quizBody.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answers = {};
            quizCompleted = false;
            scoreSummary.classList.remove('show');
            quizBody.style.display = 'block';
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==================== INIT ====================
        renderQuestion();
    </script>
</body>
</html>
