<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Master TKA: Bahasa Indonesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #E5E7EB;
        }

        .header h1 {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .progress {
            font-weight: 600;
            color: var(--text-muted);
            background: #E0E7FF;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .reading-text {
            background-color: #F8FAFC;
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px 8px 8px 4px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #374151;
        }

        .question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background-color: #FFFFFF;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            padding: 15px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option:hover:not(.disabled) {
            border-color: var(--primary);
            background-color: #EEF2FF;
        }

        .option.correct {
            border-color: var(--success);
            background-color: #D1FAE5;
            color: #065F46;
            font-weight: 600;
        }

        .option.wrong {
            border-color: var(--danger);
            background-color: #FEE2E2;
            color: #991B1B;
        }

        .option.disabled {
            cursor: not-allowed;
            pointer-events: none;
        }

        .option-letter {
            font-weight: bold;
            margin-right: 15px;
            background: #F3F4F6;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .correct .option-letter { background: var(--success); color: white; }
        .wrong .option-letter { background: var(--danger); color: white; }

        .explanation {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.5s;
        }

        .explanation.show {
            display: block;
        }

        .explanation.correct-exp { background-color: #D1FAE5; border-left: 5px solid var(--success); }
        .explanation.wrong-exp { background-color: #FEF2F2; border-left: 5px solid var(--danger); }

        .explanation h3 { margin-bottom: 10px; font-size: 1.1rem; }
        .explanation p { font-size: 0.95rem; line-height: 1.5; }

        .btn-next {
            margin-top: 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background 0.3s;
        }

        .btn-next:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .result-container h2 { font-size: 2rem; color: var(--primary); margin-bottom: 10px; }
        .result-container p { font-size: 1.1rem; margin-bottom: 20px; color: var(--text-muted); }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--success) 0%, #E5E7EB 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .btn-restart {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .quiz-container { padding: 20px; }
            .header { flex-direction: column; gap: 10px; text-align: center; }
            .option { padding: 12px 15px; font-size: 0.95rem; }
        }
    </style>
</head>

        let currentQuestionIndex = 0;
        let score = 0;

        const readingTextEl = document.getElementById('reading-text');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const explanationEl = document.getElementById('explanation');
        const expTitle = document.getElementById('exp-title');
        const expText = document.getElementById('exp-text');
        const btnNext = document.getElementById('btn-next');
        const progressText = document.getElementById('progress-text');
        const quizContent = document.getElementById('quiz-content');
        const resultContainer = document.getElementById('result-container');

        function loadQuestion() {
            // Reset state
            explanationEl.className = 'explanation';
            btnNext.style.display = 'none';
            
            const currentData = quizData[currentQuestionIndex];
            
            // Update Text & Question
            progressText.innerText = `Soal ${currentQuestionIndex + 1} / ${quizData.length}`;
            readingTextEl.innerHTML = currentData.text;
            questionEl.innerText = currentData.question;
            
            // Render Options
            optionsEl.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];
            currentData.options.forEach((opt, index) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option';
                optDiv.innerHTML = `<span class="option-letter">${labels[index]}</span> <span>${opt}</span>`;
                optDiv.onclick = () => checkAnswer(index, optDiv);
                optionsEl.appendChild(optDiv);
            });
        }

        function checkAnswer(selectedIndex, selectedDiv) {
            const currentData = quizData[currentQuestionIndex];
            const allOptions = optionsEl.querySelectorAll('.option');
            
            // Disable all options
            allOptions.forEach(opt => opt.classList.add('disabled'));

            if(selectedIndex === currentData.correct) {
                selectedDiv.classList.add('correct');
                score++;
                showExplanation(true, currentData.explanation);
            } else {
                selectedDiv.classList.add('wrong');
                // Highlight correct option
                allOptions[currentData.correct].classList.add('correct');
                showExplanation(false, currentData.explanation);
            }
            
            btnNext.style.display = 'block';
            if(currentQuestionIndex === quizData.length - 1) {
                btnNext.innerText = "Lihat Hasil Akhir 🏁";
            }
        }

        function showExplanation(isCorrect, text) {
            explanationEl.classList.add('show');
            if(isCorrect) {
                explanationEl.classList.add('correct-exp');
                expTitle.innerHTML = '✅ Tepat Sekali!';
                expTitle.style.color = 'var(--success)';
            } else {
                explanationEl.classList.add('wrong-exp');
                expTitle.innerHTML = '❌ Kurang Tepat!';
                expTitle.style.color = 'var(--danger)';
            }
            expText.innerText = text;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if(currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContent.style.display = 'none';
            resultContainer.style.display = 'block';
            
            const percentage = Math.round((score / quizData.length) * 100);
            const scoreText = document.getElementById('score-text');
            const scoreCircle = document.getElementById('score-circle');
            const scoreMsg = document.getElementById('score-message');
            
            scoreText.innerText = percentage + '%';
            
            let color = 'var(--success)';
            if(percentage < 50) color = 'var(--danger)';
            else if(percentage < 80) color = '#F59E0B'; // yellow/orange

            scoreCircle.style.background = `conic-gradient(${color} ${percentage}%, #E5E7EB 0%)`;
            scoreText.style.color = color;

            if(percentage >= 80) {
                scoreMsg.innerText = "Luar Biasa! Kamu sudah menguasai materi PBM UTBK! 🚀";
            } else if (percentage >= 50) {
                scoreMsg.innerText = "Bagus! Tinggal asah sedikit lagi Logika Membacanya! 👍";
            } else {
                scoreMsg.innerText = "Jangan menyerah! Yuk, baca ulang materi dasarnya dan coba lagi. 💪";
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultContainer.style.display = 'none';
            quizContent.style.display = 'block';
            btnNext.innerText = "Soal Selanjutnya ➡️";
            loadQuestion();
        }

        // Init Kuis
        loadQuestion();
    </script>
