    id:3, tipe:'pg',
    kutipan: `At SMP Harapan Bangsa, students from different cultural backgrounds often found it difficult to understand each other's customs and perspectives. Misunderstanding during group projects or events became common, and tensions sometimes rose. Seeing this, the school launched a "Cultural Exchange Week" program. Every class had to create a cultural presentation that included food, traditional games, and stories from different regions in Indonesia. But instead of just working with their own classmates, students were grouped randomly with others from different grades and backgrounds. At first, the process was messy. Some students preferred to stick with their friends and had trouble collaborating. However, over time, the mixed groups began to share ideas more openly. One group even created a bilingual play based on folklore from East Kalimantan, combining elements from each member's background. The week ended with a festival full of laughter, performances, and food-tasting sessions. Students reflected that they not only learned about others, but they also learned how to listen deeply, compromise, and express ideas respectfully.`,

    id:5, tipe:'pg',

    id:8, tipe:'pgk',
    kutipan: `For the past three months, the residents of Lakeview Village have experienced frequent power outages, especially during the evening. The local electricity company explained that the sudden increase in electricity usage—mostly due to the installation of new electric heaters during the unusually cold season—has placed heavy pressure on the old distribution cables. Some cables overheated, triggering automatic shutdowns to prevent fires. After receiving complaints, the village council held a community meeting to discuss possible solutions. Several experts suggested replacing the outdated cables and encouraging residents to reduce electricity use during peak hours. As a temporary measure, the council distributed guidelines on how to use heaters more efficiently, including lowering temperature settings and turning off unused appliances. Within a few weeks, residents noticed that the outages became less frequent. The electricity company confirmed that reduced usage during peak times helped stabilize the system while repairs were being planned.`,

// ============================================================
//  RENDER & LOGIC
// ============================================================
const container = document.getElementById('quizContainer');
const scoreSpan = document.getElementById('scoreDisplay');
const totalSpan = document.getElementById('totalSoal');
totalSpan.textContent = questions.length;

let answered = {};
let selectedAnswers = {};
let pernyataanAnswers = {};

function render() {
    let html = '';
    let correctCount = 0;

    questions.forEach((q, idx) => {
        const isAnswered = answered[idx] || false;
        const isCorrect = isAnswered && checkAnswer(idx);
        if (isAnswered && isCorrect) correctCount++;

        let cardClass = 'soal-card';
        if (isAnswered) {
            cardClass += isCorrect ? ' correct' : ' wrong';
        }

        const tipeLabel = q.tipe === 'pg' ? 'PG Biasa' :
                          (q.tipe === 'pgk' ? 'PGK (Pilih >1)' : 'PGK Kategori');
        let tipeClass = 'tipe';
        if (q.tipe === 'pgk') tipeClass += ' pgk';
        else if (q.tipe === 'pgk-kategori') tipeClass += ' pgk-kategori';

        html += `<div class="${cardClass}" id="soal-${idx}">`;
        html += `<div class="header-soal">
                    <span class="nomor">Soal ${idx+1}</span>
                    <span class="${tipeClass}">${tipeLabel}</span>
                </div>`;

        if (q.kutipan) {
            html += `<div class="kutipan">${q.kutipan.replace(/\n/g, '<br>')}</div>`;
        }

        html += `<div class="soal-text">${q.text}</div>`;

        if (q.tipe === 'pg') {
            html += renderPG(idx, q);
        } else if (q.tipe === 'pgk') {
            html += renderPGK(idx, q);
        } else if (q.tipe === 'pgk-kategori') {
            html += renderPGKKategori(idx, q);
        }

        let feedbackClass = 'feedback-box';
        let feedbackHtml = '';
        if (isAnswered) {
            feedbackClass += ' show';
            feedbackClass += isCorrect ? ' correct' : ' wrong';
            const icon = isCorrect ? '✅' : '❌';
            const status = isCorrect ? 'Jawaban Benar!' : 'Jawaban Salah';
            const correctText = getCorrectText(q);
            feedbackHtml = `
                <div class="${feedbackClass}">
                    <strong>${icon} ${status}</strong>
                    <div class="explain">💡 ${q.explanation}</div>
                    <div style="margin-top:4px;font-size:0.9rem;">Kunci Jawaban: <strong>${correctText}</strong></div>
                </div>
            `;
        } else {
            feedbackHtml = `<div class="feedback-box"></div>`;
        }
        html += feedbackHtml;

        html += `</div>`;
    });

    container.innerHTML = html;
    scoreSpan.textContent = correctCount;
    attachEvents();
}

function renderPG(idx, q) {
    let html = `<div class="options">`;
    q.options.forEach((opt, optIdx) => {
        const isAnswered = answered[idx] || false;
        const selected = selectedAnswers[idx];
        let labelClass = '';
        let disabled = '';
        let checked = '';
        if (isAnswered) {
            disabled = 'disabled';
            if (optIdx === q.correct) labelClass += ' correct-answer';
            if (optIdx === selected && optIdx !== q.correct) labelClass += ' wrong-answer';
            if (optIdx === selected) checked = 'checked';
        }
        html += `
            <label class="${labelClass} ${disabled}">
                <input type="radio" name="q${idx}" value="${optIdx}" ${checked} ${disabled}>
                <span>${opt}</span>
            </label>
        `;
    });
    html += `</div>`;
    return html;
}

function renderPGK(idx, q) {
    let html = `<div class="options">`;
    q.options.forEach((opt, optIdx) => {
        const isAnswered = answered[idx] || false;
        const selected = selectedAnswers[idx] || [];
        let labelClass = '';
        let disabled = '';
        let checked = '';
        if (isAnswered) {
            disabled = 'disabled';
            if (q.correct.includes(optIdx)) labelClass += ' correct-answer';
            if (selected.includes(optIdx) && !q.correct.includes(optIdx)) labelClass += ' wrong-answer';
            if (selected.includes(optIdx)) checked = 'checked';
        }
        html += `
            <label class="${labelClass} ${disabled}">
                <input type="checkbox" name="q${idx}" value="${optIdx}" ${checked} ${disabled}>
                <span>${opt}</span>
            </label>
        `;
    });
    html += `</div>`;
    if (!answered[idx]) {
        html += `<button class="btn-cek" id="cek-${idx}">🔍 Cek Jawaban</button>`;
    }
    return html;
}

function renderPGKKategori(idx, q) {
    let html = `<table class="table-pernyataan">`;
    const isAnswered = answered[idx] || false;
    const answers = pernyataanAnswers[idx] || [];

    q.pernyataan.forEach((pernyataanText, pIdx) => {
        const val = answers[pIdx];
        const isCorrect = isAnswered && (val === q.jawaban[pIdx]);

        html += `<tr>`;
        html += `<td class="pernyataan-text">${pernyataanText}</td>`;
        html += `<td>`;
        html += `<div class="opsi-group">`;

        const options = q.tipe === 'pgk-kategori' ?
            [{ label: 'Agree', value: true }, { label: 'Not Agree', value: false }] :
            [{ label: 'Sesuai', value: true }, { label: 'Tidak Sesuai', value: false }];

        options.forEach(opt => {
            const checked = (isAnswered && val === opt.value) ? 'checked' : '';
            const disabled = isAnswered ? 'disabled' : '';
            let labelClass = '';
            if (isAnswered) {
                if (opt.value === q.jawaban[pIdx]) labelClass += ' correct-answer';
                if (val === opt.value && opt.value !== q.jawaban[pIdx]) labelClass += ' wrong-answer';
            }
            html += `
                <label class="${labelClass} ${disabled}" style="display:inline-flex; align-items:center; gap:4px; padding:2px 8px; background:transparent; border:none; cursor:${isAnswered?'default':'pointer'}; font-weight:${(isAnswered && opt.value === q.jawaban[pIdx])?'600':'normal'};">
                    <input type="radio" name="pernyataan_${idx}_${pIdx}" value="${opt.value}" ${checked} ${disabled}>
                    ${opt.label}
                </label>
            `;
        });

        html += `</div>`;

        if (isAnswered) {
            const fbClass = isCorrect ? 'benar' : 'salah';
            const icon = isCorrect ? '✅' : '❌';
            const status = isCorrect ? 'Benar' : 'Salah';
            html += `
                <div class="feedback-pernyataan show ${fbClass}">
                    ${icon} ${status} — ${q.alasan[pIdx]}
                </div>
            `;
        }

        html += `</td>`;
        html += `</tr>`;
    });

    html += `</table>`;

    if (!answered[idx]) {
        html += `<button class="btn-cek" id="cek-${idx}">🔍 Cek Jawaban</button>`;
    }

    return html;
}

function getCorrectText(q) {
    if (q.tipe === 'pg') {
        return q.options[q.correct];
    } else if (q.tipe === 'pgk') {
        return q.correct.map(i => q.options[i]).join('; ');
    } else if (q.tipe === 'pgk-kategori') {
        return q.pernyataan.map((p, i) => {
            const label = q.jawaban[i] ? 'Agree' : 'Not Agree';
            return `(${i+1}) ${label}`;
        }).join('; ');
    }
    return '';
}

function checkAnswer(idx) {
    const q = questions[idx];
    if (q.tipe === 'pg') {
        return selectedAnswers[idx] === q.correct;
    } else if (q.tipe === 'pgk') {
        const sel = selectedAnswers[idx] || [];
        const sortedSel = [...sel].sort();
        const sortedCorr = [...q.correct].sort();
        return JSON.stringify(sortedSel) === JSON.stringify(sortedCorr);
    } else if (q.tipe === 'pgk-kategori') {
        const ans = pernyataanAnswers[idx] || [];
        return ans.every((v, i) => v === q.jawaban[i]);
    }
    return false;
}

function attachEvents() {
    document.querySelectorAll('.soal-card input[type="radio"]:not([name^="pernyataan_"])').forEach(input => {
        input.addEventListener('change', function() {
            const name = this.name;
            const idx = parseInt(name.replace('q', ''));
            if (answered[idx]) return;
            selectedAnswers[idx] = parseInt(this.value);
            answered[idx] = true;
            render();
            document.getElementById(`soal-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    });

    document.querySelectorAll('.btn-cek').forEach(btn => {
        btn.addEventListener('click', function() {
            const idx = parseInt(this.id.replace('cek-', ''));
            const q = questions[idx];

            if (q.tipe === 'pgk') {
                const checkboxes = document.querySelectorAll(`#soal-${idx} input[type="checkbox"]`);
                const selected = [];
                checkboxes.forEach(cb => {
                    if (cb.checked) selected.push(parseInt(cb.value));
                });
                if (selected.length === 0) {
                    alert('Pilih minimal satu pilihan!');
                    return;
                }
                selectedAnswers[idx] = selected;
                answered[idx] = true;
                render();
                document.getElementById(`soal-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (q.tipe === 'pgk-kategori') {
                const allAnswered = q.pernyataan.every((_, pIdx) => {
                    const radios = document.querySelectorAll(`input[name="pernyataan_${idx}_${pIdx}"]`);
                    let checked = false;
                    radios.forEach(r => { if (r.checked) checked = true; });
                    return checked;
                });
                if (!allAnswered) {
                    alert('Jawab semua pernyataan terlebih dahulu!');
                    return;
                }
                const answers = [];
                q.pernyataan.forEach((_, pIdx) => {
                    const radios = document.querySelectorAll(`input[name="pernyataan_${idx}_${pIdx}"]`);
                    radios.forEach(r => {
                        if (r.checked) {
                            answers[pIdx] = (r.value === 'true');
                        }
                    });
                });
                pernyataanAnswers[idx] = answers;
                answered[idx] = true;
                render();
                document.getElementById(`soal-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    });
}

function resetQuiz() {
    answered = {};
    selectedAnswers = {};
    pernyataanAnswers = {};
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('resetBtn').addEventListener('click', resetQuiz);
render();
</script>
</body>
</html>
