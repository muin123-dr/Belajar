<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>TKA Bahasa Indonesia 2025 - Simulasi 28 Soal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      background: #eef2f6;
      color: #1e293b;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 1.2rem;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Header TKA */
    .header {
      background: #0b2d5c;
      color: white;
      border-radius: 0.8rem;
      padding: 0.9rem 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo {
      background: #f59e0b;
      color: #0b2d5c;
      font-weight: 900;
      font-size: 1.4rem;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.6rem;
    }
    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .header-title span {
      font-size: 0.8rem;
      opacity: 0.85;
      font-weight: 500;
    }
    .timer {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.4rem;
      border-radius: 2.5rem;
      font-weight: 700;
      font-size: 1.2rem;
      font-variant-numeric: tabular-nums;
      border: 1px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 0.5px;
    }
    .timer.warning {
      background: #fecaca;
      color: #7f1d1d;
      border-color: #f87171;
      animation: pulse 0.85s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Number navigation */
    .number-nav {
      background: white;
      border-radius: 0.7rem;
      padding: 0.7rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      justify-content: center;
      border: 1px solid #dce1e8;
    }
    .num-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      background: white;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
      color: #475569;
    }
    .num-btn:hover { background: #eef2ff; border-color: #3b82f6; }
    .num-btn.active { background: #1d4ed8; color: white; border-color: #1d4ed8; transform: scale(1.08); }
    .num-btn.answered { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .num-btn.active.answered { background: #1d4ed8; color: white; border-color: #1d4ed8; }

    /* Progress bar */
    .progress-wrap {
      background: white;
      border-radius: 0.7rem;
      padding: 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border: 1px solid #dce1e8;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      font-size: 0.85rem;
      font-weight: 500;
      color: #334155;
    }
    .progress-bar {
      flex: 1;
      height: 7px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 10px;
      transition: width 0.3s;
    }

    /* Card soal */
    .card {
      background: white;
      border-radius: 1rem;
      padding: 1.8rem 2rem;
      box-shadow: 0 8px 22px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      min-height: 340px;
    }
    .reading-box {
      background: #f8fafc;
      border-left: 5px solid #1e40af;
      padding: 1.2rem 1.5rem;
      border-radius: 0.7rem;
      margin-bottom: 1.6rem;
      font-size: 0.9rem;
      white-space: pre-line;
      max-height: 340px;
      overflow-y: auto;
      color: #1e293b;
      line-height: 1.75;
    }
    .reading-box h4 {
      color: #1e3a8a;
      margin-bottom: 0.5rem;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }
    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      color: #0f172a;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .option {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.75rem 1.1rem;
      border: 2px solid #e2e8f0;
      border-radius: 0.6rem;
      cursor: pointer;
      transition: 0.15s;
      background: #fafbfc;
      font-weight: 500;
    }
    .option:hover { border-color: #93c5fd; background: #eff6ff; }
    .option.selected { border-color: #2563eb; background: #eef2ff; }
    .option.correct { border-color: #16a34a; background: #f0fdf4; }
    .option.incorrect { border-color: #dc2626; background: #fef2f2; }
    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      background: white;
      flex-shrink: 0;
    }
    .option.selected .option-letter { background: #2563eb; color: white; border-color: #2563eb; }
    .option.correct .option-letter { background: #16a34a; color: white; border-color: #16a34a; }
    .option.incorrect .option-letter { background: #dc2626; color: white; border-color: #dc2626; }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.7rem 2rem;
      border-radius: 2.5rem;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 0.3px;
    }
    .btn-primary { background: #1d4ed8; color: white; }
    .btn-primary:hover { background: #1e3a8a; }
    .btn-outline { background: white; border: 2px solid #1d4ed8; color: #1d4ed8; }
    .btn-outline:hover { background: #eef2ff; }
    .btn-submit { background: #b91c1c; color: white; }
    .btn-submit:hover { background: #991b1b; }
    .btn:disabled { opacity: 0.4; pointer-events: none; }

    /* Result */
    .result-box {
      background: white;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
      text-align: center;
    }
    .score {
      font-size: 4.2rem;
      font-weight: 800;
      color: #1e3a8a;
      line-height: 1;
    }
    .review-item {
      background: #f8fafc;
      border-radius: 0.5rem;
      padding: 1rem;
      margin: 0.5rem 0;
      text-align: left;
      border-left: 5px solid #94a3b8;
    }
    .review-item.correct { border-left-color: #16a34a; }
    .review-item.wrong { border-left-color: #dc2626; }

    @media (max-width: 650px) {
      .header { flex-direction: column; align-items: flex-start; }
      .card { padding: 1rem; }
      .num-btn { width: 30px; height: 30px; font-size: 0.7rem; }
    }
  </style>
</head>

</div>

    { id:16, bacaan:"wisata", tanya:"Kalimat yang dapat menjadi kelanjutan teks tersebut adalah...", opsi:["Oleh karena itu, pemerintah harus menutup semua destinasi wisata.","Dengan demikian, pengembangan pariwisata perlu fokus pada kuantitas.","Ke depan, kolaborasi semua pemangku kepentingan menjadi kunci keberhasilan pariwisata berkelanjutan.","Masyarakat sebaiknya menolak semua proyek wisata di daerahnya.","Pada akhirnya, pariwisata hanya akan merusak lingkungan."], jawab:2 },
    // 17-20: bahasa
    { id:17, bacaan:"bahasa", tanya:"Makna kata 'punah' dalam konteks teks adalah...", opsi:["Berkurang jumlahnya","Tidak digunakan lagi sama sekali","Bergabung dengan bahasa lain","Hanya digunakan oleh orang tua","Dipelajari di sekolah"], jawab:1 },

    { id:19, bacaan:"bahasa", tanya:"Hubungan antara paragraf 2 dan 3 adalah...", opsi:["Paragraf 2 menjelaskan pentingnya bahasa daerah, paragraf 3 cara pelestariannya.","Paragraf 2 penyebab, paragraf 3 akibat.","Paragraf 2 dan 3 saling bertentangan.","Paragraf 2 tentang data, paragraf 3 tentang opini.","Paragraf 2 dan 3 membahas contoh bahasa daerah."], jawab:0 },
    { id:20, bacaan:"bahasa", tanya:"Kesimpulan yang tepat untuk teks tersebut adalah...", opsi:["Bahasa daerah harus diganti dengan bahasa Indonesia.","Hanya pemerintah yang bertanggung jawab melestarikan bahasa daerah.","Pelestarian bahasa daerah memerlukan sinergi berbagai pihak dan inovasi.","Bahasa daerah akan punah dalam beberapa tahun.","Generasi muda tidak perlu mempelajari bahasa daerah."], jawab:2 },
    // 21-24: pantai2
    { id:21, bacaan:"pantai2", tanya:"Latar tempat cerita tersebut adalah...", opsi:["Pegunungan yang asri","Pantai yang ramai wisatawan","Hutan lindung","Perkebunan teh","Sungai besar"], jawab:1 },
    { id:22, bacaan:"pantai2", tanya:"Penyebab konflik batin yang dialami Pak Usman adalah...", opsi:["Keinginan Arman bekerja di hotel.","Suara mesin jet ski mengusir ikan.","Tradisi melaut mulai tergerus pariwisata modern.","Penyu tersangkut jaring.","Wisatawan mengambil foto tanpa menolong."], jawab:2 },

    { id:24, bacaan:"pantai2", tanya:"Apa yang akan terjadi selanjutnya sesuai dengan perubahan sikap Arman?", opsi:["Arman tetap melamar di hotel.","Arman pergi merantau ke kota.","Arman bersama Pak Usman menjaga kelestarian laut.","Arman membeli jet ski.","Arman membuka restoran mewah."], jawab:2 },

    { id:25, bacaan:"pangan", tanya:"Makna kata 'swasembada' dalam teks adalah...", opsi:["Ketergantungan pada impor","Kemampuan mencukupi kebutuhan sendiri","Produksi pangan berlebih untuk ekspor","Sistem irigasi modern","Diversifikasi pangan"], jawab:1 },

    { id:27, bacaan:"pangan", tanya:"Hubungan makna paragraf 1 dan 2 adalah...", opsi:["Paragraf 1 menjelaskan solusi, paragraf 2 menjelaskan penyebab.","Paragraf 1 menjelaskan masalah, paragraf 2 menjelaskan penyebab.","Paragraf 1 fakta, paragraf 2 opini tanpa dasar.","Paragraf 1 dan 2 saling tidak berhubungan.","Paragraf 1 dan 2 sama-sama menjelaskan food estate."], jawab:1 },
    { id:28, bacaan:"pangan", tanya:"Kesimpulan yang paling tepat untuk teks tersebut adalah...", opsi:["Indonesia sudah berhasil mencapai swasembada pangan.","Kedaulatan pangan tidak penting bagi Indonesia.","Pemerintah tidak perlu ikut campur dalam masalah pangan.","Upaya sistematis dan berpihak pada petani kecil diperlukan untuk mewujudkan kedaulatan pangan.","Food estate adalah solusi terbaik tanpa kekurangan."], jawab:3 }
  ];

  const TOTAL = 28;
  const TOTAL_TIME = 45 * 60; // 45 menit
  let currentIdx = 0;
  let userAns = Array(TOTAL).fill(null);
  let waktu = TOTAL_TIME;
  let timerInterval = null;
  let selesai = false;

  // DOM
  const $timerBox = document.getElementById('timerBox');
  const $timerDisp = document.getElementById('timerDisplay');
  const $progressFill = document.getElementById('progressFill');
  const $progressText = document.getElementById('progressText');
  const $numberNav = document.getElementById('numberNav');
  const $card = document.getElementById('cardSoal');
  const $btnPrev = document.getElementById('btnPrev');
  const $btnNext = document.getElementById('btnNext');
  const $btnSubmit = document.getElementById('btnSubmit');
  const $btnRow = document.getElementById('btnRow');
  const $resultCont = document.getElementById('resultContainer');

  function formatTime(detik) {
    const m = Math.floor(detik/60), s = detik%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  function updateTimer() {
    $timerDisp.textContent = formatTime(waktu);
    $timerBox.classList.toggle('warning', waktu <= 300);
  }
  function updateProgress() {
    const done = userAns.filter(a=>a!==null).length;
    $progressFill.style.width = (done/TOTAL*100)+'%';
    $progressText.textContent = done+'/'+TOTAL;
  }
  function renderNav() {
    let html = '';
    for(let i=0;i<TOTAL;i++){
      let cls = 'num-btn';
      if(i===currentIdx) cls += ' active';
      if(userAns[i]!==null) cls += ' answered';
      html += `<button class="${cls}" onclick="app.goTo(${i})">${i+1}</button>`;
    }
    $numberNav.innerHTML = html;
  }
  function renderSoal() {
    if(selesai) return;
    const s = soalList[currentIdx];
    let html = '';
    if(s.bacaan && bacaanDB[s.bacaan]){
      html += `<div class="reading-box"><h4>📖 ${bacaanDB[s.bacaan].judul}</h4>${bacaanDB[s.bacaan].teks}</div>`;
    }
    html += `<div class="question-text">Soal ${s.id}. ${s.tanya.replace(/\n/g,'<br>')}</div><div class="options">`;
    const labels = ['A','B','C','D','E'];
    for(let i=0;i<s.opsi.length;i++){
      let cls = 'option';
      if(userAns[currentIdx]===i) cls += ' selected';
      html += `<div class="${cls}" id="opt${i}" onclick="app.pilih(${i})">
        <div class="option-letter">${labels[i]}</div>
        <span>${s.opsi[i]}</span>
      </div>`;
    }
    html += '</div>';
    $card.innerHTML = html;
    $btnPrev.disabled = (currentIdx===0);
    if(currentIdx===TOTAL-1){
      $btnNext.style.display='none';
      $btnSubmit.style.display='inline-flex';
    } else {
      $btnNext.style.display='inline-flex';
      $btnSubmit.style.display='none';
    }
    renderNav();
    updateProgress();
  }
  function pilihJawaban(opsiIdx) {
    if(selesai) return;
    userAns[currentIdx] = opsiIdx;
    document.querySelectorAll('.option').forEach((el,i)=>{
      el.classList.toggle('selected', i===opsiIdx);
    });
    renderNav();
    updateProgress();
  }
  function goTo(idx) {
    if(selesai) return;
    currentIdx = idx;
    renderSoal();
  }
  function next() { if(currentIdx<TOTAL-1){ currentIdx++; renderSoal(); } }
  function prev() { if(currentIdx>0){ currentIdx--; renderSoal(); } }
  function submit() {
    if(selesai) return;
    if(!confirm('Yakin ingin mengumpulkan jawaban? Soal yang belum dijawab akan dianggap salah.')) return;
    selesai = true;
    clearInterval(timerInterval);
    let benar = 0;
    const review = [];
    for(let i=0;i<TOTAL;i++){
      const s = soalList[i];
      const ua = userAns[i];
      const isTrue = (ua===s.jawab);
      if(isTrue) benar++;
      review.push({ soal:s, user:ua, benar:isTrue });
    }
    const skor = Math.round((benar/TOTAL)*100);
    let html = `<div class="result-box"><h2>Hasil TKA Bahasa Indonesia</h2>
      <div class="score">${skor}</div><p>Benar ${benar} dari ${TOTAL} soal</p>`;
    html += `<div style="text-align:left; margin-top:1.5rem;">`;
    const labels = ['A','B','C','D','E'];
    review.forEach((r,i)=>{
      const s = r.soal;
      const icon = r.benar?'✅':'❌';
      const warna = r.benar?'correct':'wrong';
      html += `<div class="review-item ${warna}"><strong>${icon} Soal ${s.id}</strong><br>
        Jawaban Anda: ${r.user!==null?labels[r.user]:'—'} | Kunci: ${labels[s.jawab]}<br>
        <small>${s.tanya.substring(0,70)}...</small></div>`;
    });
    html += `</div><button class="btn btn-primary" onclick="location.reload()">🔄 Ulangi Kuis</button></div>`;
    $card.style.display='none';
    $btnRow.style.display='none';
    $numberNav.style.display='none';
    document.querySelector('.progress-wrap').style.display='none';
    $resultCont.style.display='block';
    $resultCont.innerHTML = html;
  }

  function startTimer() {
    updateTimer();
    timerInterval = setInterval(()=>{
      waktu--;
      updateTimer();
      if(waktu<=0){
        clearInterval(timerInterval);
        alert('Waktu habis! Jawaban akan dikumpulkan otomatis.');
        submit();
      }
    },1000);
  }

  window.app = { pilih: pilihJawaban, goTo, next, prev, submit };
  document.getElementById('btnNext').addEventListener('click', next);
  document.getElementById('btnPrev').addEventListener('click', prev);
  document.getElementById('btnSubmit').addEventListener('click', submit);

  renderSoal();
  startTimer();
})();
</script>
</body>
</html>
