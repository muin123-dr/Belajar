<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastering EYD: 25 Soal (5 Trik Analisis)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-text: #166534;
            --wrong-bg: #fee2e2;
            --wrong-text: #991b1b;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 800px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .difficulty-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .diff-sedang { background-color: #fef08a; color: #854d0e; }
        .diff-tinggi { background-color: #fecaca; color: #991b1b; }

        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .question-box {
            background-color: #f8fafc;
            padding: 25px;
            border-radius: 12px;
            border-left: 6px solid var(--primary);
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #0f172a;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-answer {
            flex: 1;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: bold;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .btn-answer:hover:not(:disabled) {
            background-color: #f1f5f9;
        }

        .btn-answer:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-answer.selected-correct {
            background-color: var(--correct-bg);
            border-color: #16a34a;
            color: var(--correct-text);
        }

        .btn-answer.selected-wrong {
            background-color: var(--wrong-bg);
            border-color: #ef4444;
            color: var(--wrong-text);
        }

        .analysis-container {
            display: none;
            animation: fadeIn 0.4s ease;
            margin-top: 10px;
        }

        .analysis-container.show {
            display: block;
        }

        .analysis-title {
            font-weight: bold;
            font-size: 1.15rem;
            margin-bottom: 15px;
            color: #0f172a;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .trick-item {
            display: flex;
            margin-bottom: 12px;
            padding: 12px 15px;
            border-radius: 8px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .trick-item.aman {
            border-left: 5px solid #10b981;
        }

        .trick-item.bermasalah {
            border-left: 5px solid #ef4444;
            background-color: #fef2f2;
        }

        .trick-icon {
            margin-right: 15px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
        }

        .trick-content strong {
            display: block;
            margin-bottom: 4px;
            color: #1e293b;
            font-size: 1rem;
        }

        .trick-content p {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.5;
        }

        .correction-box {
            margin-top: 15px;
            padding: 15px 20px;
            background-color: #e0f2fe;
            border: 1px solid #bae6fd;
            border-radius: 10px;
            color: #0369a1;
            font-weight: 500;
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .next-btn {
            margin-top: 25px;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 18px;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        .result-screen {
            display: none;
            text-align: center;
            padding: 50px 20px;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background-color: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: bold;
            margin: 0 auto 25px auto;
        }

        .restart-btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .question-box { font-size: 1.15rem; padding: 15px; }
            .btn-group { flex-direction: column; }
            .btn-answer { font-size: 1.05rem; padding: 14px; }
            .trick-item { padding: 10px; flex-direction: column; }
            .trick-icon { margin-bottom: 5px; }
        }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <div class="header">
        <h1>Simulasi TKA: Analisis 5 Trik EYD</h1>
        <p>Waktu persis 6 bulan lagi. Mari asah ketajaman instingmu. Bedah kalimat ini dan tentukan: <strong>Benar atau Salah?</strong></p>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="status-bar">
        <span id="question-count">Soal 1 / 25</span>
        <span id="score-tracker">Skor Sementara: 0</span>
    </div>

    <div id="difficulty-badge" class="difficulty-badge"></div>
    <div class="question-box" id="question-text">Memuat pertanyaan...</div>

    <div class="btn-group" id="answer-buttons">
        <button class="btn-answer" id="btn-benar" onclick="checkAnswer(true)">✅ BENAR</button>
        <button class="btn-answer" id="btn-salah" onclick="checkAnswer(false)">❌ SALAH</button>
    </div>

    <div class="analysis-container" id="analysis-box">
        <div class="analysis-title">Hasil Bedah 5 Trik EYD:</div>
        <div id="tricks-list"></div>
        <div class="correction-box" id="correction-text"></div>
        <button class="next-btn" onclick="nextQuestion()">Lanjut ke Soal Berikutnya</button>
    </div>
</div>

<div class="container result-screen" id="result-screen">
    <h2 style="color: var(--primary); font-size: 2.2rem; margin-bottom: 10px;">Latihan Selesai!</h2>
    <p style="color: var(--text-muted); font-size: 1.2rem; margin-bottom: 30px;">Inilah hasil analisismu:</p>
    
    <div class="score-circle" id="final-score">100</div>
    
    <p id="result-message" style="font-size: 1.1rem; line-height: 1.6; color: var(--text-main); font-weight: 500;"></p>
    
    <button class="restart-btn" onclick="location.reload()">Ulangi Try Out</button>
</div>

    ];

    let currentQ = 0;
    let score = 0;
    let isAnswered = false;

    const qText = document.getElementById("question-text");
    const qCount = document.getElementById("question-count");
    const scoreTracker = document.getElementById("score-tracker");
    const diffBadge = document.getElementById("difficulty-badge");
    const btnBenar = document.getElementById("btn-benar");
    const btnSalah = document.getElementById("btn-salah");
    const analysisBox = document.getElementById("analysis-box");
    const tricksList = document.getElementById("tricks-list");
    const correctionText = document.getElementById("correction-text");
    const progressBar = document.getElementById("progress");

    function loadQuestion() {
        isAnswered = false;
        const q = questions[currentQ];
        qText.innerText = `"${q.text}"`;
        qCount.innerText = `Soal ${currentQ + 1} / ${questions.length}`;
        progressBar.style.width = `${(currentQ / questions.length) * 100}%`;
        
        diffBadge.innerText = `Tingkat: ${q.level}`;
        diffBadge.className = `difficulty-badge ${q.level === 'Sedang' ? 'diff-sedang' : 'diff-tinggi'}`;
        
        btnBenar.disabled = false;
        btnSalah.disabled = false;
        btnBenar.className = "btn-answer";
        btnSalah.className = "btn-answer";
        
        analysisBox.classList.remove("show");
    }

    function checkAnswer(userSaysCorrect) {
        if (isAnswered) return;
        isAnswered = true;

        const q = questions[currentQ];
        btnBenar.disabled = true;
        btnSalah.disabled = true;

        if (userSaysCorrect === q.isCorrect) {
            score++;
            scoreTracker.innerText = `Skor Sementara: ${score}`;
            if(userSaysCorrect) btnBenar.classList.add("selected-correct");
            else btnSalah.classList.add("selected-correct");
        } else {
            if(userSaysCorrect) {
                btnBenar.classList.add("selected-wrong");
                btnSalah.classList.add("selected-correct");
            } else {
                btnSalah.classList.add("selected-wrong");
                btnBenar.classList.add("selected-correct");
            }
        }

        renderAnalysis(q);
    }

    function renderAnalysis(q) {
        tricksList.innerHTML = "";
        
        q.tricks.forEach(t => {
            const isAman = t.status === "aman";
            const icon = isAman ? "✅" : "❌";
            
            tricksList.innerHTML += `
                <div class="trick-item ${t.status}">
                    <div class="trick-icon">${icon}</div>
                    <div class="trick-content">
                        <strong>${t.name}</strong>
                        <p>${t.detail}</p>
                    </div>
                </div>
            `;
        });

        correctionText.innerHTML = `<strong>Perbaikan/Hasil:</strong><br>${q.correction}`;
        analysisBox.classList.add("show");
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            progressBar.style.width = `100%`;
            document.getElementById("quiz-container").style.display = "none";
            document.getElementById("result-screen").style.display = "block";
            
            const finalScore = Math.round((score / questions.length) * 100);
            document.getElementById("final-score").innerText = finalScore;
            
            const msgEl = document.getElementById("result-message");
            if (finalScore >= 80) {
                msgEl.innerText = "Luar biasa! Ketelitianmu membaca 5 trik sangat tinggi. Kamu sudah sangat siap menghadapi jebakan soal TKA Bahasa Indonesia UTBK yang sesungguhnya!";
            } else if (finalScore >= 50) {
                msgEl.innerText = "Cukup baik. Kamu sudah paham dasar-dasar 5 trik, namun masih sering terjebak di soal tingkat 'Tinggi'. Terus berlatih membedah kalimat di 6 bulan ke depan!";
            } else {
                msgEl.innerText = "Jangan menyerah. Waktu 6 bulan sangat cukup. Mulai biasakan membaca kalimat secara struktural (awal, kapital, koma, kata baku) pelan-pelan ya!";
            }
        }
    }

    // Init
    loadQuestion();
</script>
