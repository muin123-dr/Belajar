function renderQuiz() {
    const container = document.getElementById('quiz-container');
    
    quizData.forEach((q, i) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${i}`;

        let passageHTML = q.passage ? `<div class="arabic-text">${q.passage}</div>` : '';

        let optionsHTML = q.options.map((opt, optIdx) => `
            <button class="opt-btn ${q.isLatin ? 'latin' : ''}" onclick="checkAnswer(${i}, ${optIdx})">
                ${opt}
            </button>
        `).join('');

        card.innerHTML = `
            <span class="q-badge">Soal Nomor ${i + 1}</span>
            ${passageHTML}
            <div class="question-text">${q.question}</div>
            <div class="options-list">${optionsHTML}</div>
            <div class="feedback-box" id="fb-${i}">
                <div class="fb-status" id="status-${i}"></div>
                <div><b>Kunci & Pembahasan:</b> ${q.exp}</div>
            </div>
        `;

        container.appendChild(card);
    });
}

function checkAnswer(qIdx, selectedOpt) {
    const q = quizData[qIdx];
    const card = document.getElementById(`card-${qIdx}`);
    const btns = card.querySelectorAll('.opt-btn');
    const fb = document.getElementById(`fb-${qIdx}`);
    const status = document.getElementById(`status-${qIdx}`);

    btns.forEach(b => b.disabled = true);

    if (selectedOpt === q.ans) {
        btns[selectedOpt].classList.add('correct');
        fb.className = 'feedback-box correct';
        status.innerHTML = '✔ BENAR!';
    } else {
        btns[selectedOpt].classList.add('wrong');
        btns[q.ans].classList.add('correct');
        fb.className = 'feedback-box wrong';
        status.innerHTML = '✖ SALAH!';
    }

    fb.style.display = 'block';
}

window.onload = renderQuiz;
