const restartBtn = document.getElementById("restart-btn");
const questionTracker = document.getElementById("question-tracker");
const scoreTracker = document.getElementById("score-tracker");
const progressBar = document.getElementById("progress-bar");

function loadQuiz() {
    answered = false;
    feedbackBox.classList.add("hidden");
    nextBtn.classList.add("hidden");
    optionsContainer.innerHTML = "";

    const currentQuiz = quizData[currentQuestionIndex];
    questionText.innerHTML = currentQuiz.q;
    
    // Update trackers
    questionTracker.innerText = `Soal ${currentQuestionIndex + 1} dari ${quizData.length}`;
    progressBar.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;

    // Render options
    const letters = ['A', 'B', 'C', 'D', 'E'];
    currentQuiz.o.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn w-full text-left bg-white border border-gray-200 text-gray-700 py-3 px-4 rounded-xl hover:bg-indigo-50 hover:border-indigo-200 focus:outline-none flex items-start";
        
        btn.innerHTML = `
            <span class="font-bold mr-3 text-indigo-500 shrink-0">${letters[index]}.</span>
            <span class="leading-relaxed">${opt}</span>
        `;
        
        btn.onclick = () => selectOption(btn, index);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(selectedBtn, selectedIndex) {
    if (answered) return; // Prevent multiple clicks
    answered = true;

    const currentQuiz = quizData[currentQuestionIndex];
    const isCorrect = selectedIndex === currentQuiz.a;
    const allButtons = optionsContainer.children;
    const letters = ['A', 'B', 'C', 'D', 'E'];

    // Disable all buttons and show colors
    for (let i = 0; i < allButtons.length; i++) {
        allButtons[i].classList.add("disabled");
        if (i === currentQuiz.a) {
            allButtons[i].classList.add("correct-ans");
        } else if (i === selectedIndex && !isCorrect) {
            allButtons[i].classList.add("wrong-ans");
        }
    }

    // Update Score
    if (isCorrect) {
        score++;
        scoreTracker.innerText = `Skor: ${score}`;
        feedbackStatus.innerHTML = `
            <svg class="w-6 h-6 text-green-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="font-bold text-green-700 text-lg">BENAR!</span>`;
        feedbackBox.className = "mt-6 p-5 rounded-xl border border-green-200 bg-green-50 fade-in block";
    } else {
        feedbackStatus.innerHTML = `
            <svg class="w-6 h-6 text-red-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="font-bold text-red-700 text-lg">SALAH!</span>`;
        feedbackBox.className = "mt-6 p-5 rounded-xl border border-red-200 bg-red-50 fade-in block";
    }

    // Show Key & Explanation
    correctKey.innerText = `${letters[currentQuiz.a]}. ${currentQuiz.o[currentQuiz.a]}`;
    explanationText.innerHTML = `<strong>Penjelasan:</strong> ${currentQuiz.e}`;
    
    // Auto-scroll to feedback
    setTimeout(() => {
        document.getElementById("quiz-container").scrollTop = document.getElementById("quiz-container").scrollHeight;
    }, 100);

    // Show Next Button
    if (currentQuestionIndex < quizData.length - 1) {
        nextBtn.classList.remove("hidden");
    } else {
        restartBtn.classList.remove("hidden");
        feedbackBox.innerHTML += `<div class="mt-4 pt-4 border-t border-gray-300 text-center font-bold text-lg text-indigo-700">Skor Akhir Kamu: ${score} / ${quizData.length}</div>`;
    }
}

nextBtn.addEventListener("click", () => {
    currentQuestionIndex++;
    loadQuiz();
});

restartBtn.addEventListener("click", () => {
    currentQuestionIndex = 0;
    score = 0;
    scoreTracker.innerText = `Skor: 0`;
    restartBtn.classList.add("hidden");
    loadQuiz();
});

// Initialize first question
loadQuiz();
</script>
</body>
</html>
