<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Simulasi TKA SMA - Bahasa Indonesia</title>
    <style>
        :root {
            --primary-bg: #e0e7ed;
            --header-bg: #1c4e80;
            --text-color: #333;
            --border-color: #ccc;
            --btn-bg: #2980b9;
            --btn-hover: #1f618d;
            --answered-bg: #27ae60;
            --current-bg: #f39c12;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--primary-bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background-color: var(--header-bg); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 1.1em; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
        .timer { font-weight: bold; background: #c0392b; padding: 5px 15px; border-radius: 5px; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .content-area { flex: 3; display: flex; flex-direction: row; background: white; margin: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
        .passage-section { flex: 1; padding: 20px; overflow-y: auto; border-right: 2px solid var(--border-color); background: #fdfdfd; line-height: 1.6; font-size: 15px;}
        .passage-section p { margin-bottom: 12px; text-align: justify; }
        .question-section { flex: 1; padding: 20px; overflow-y: auto; position: relative; display: flex; flex-direction: column; font-size: 15px;}
        
        .q-text { font-weight: bold; margin-bottom: 20px; font-size: 16px; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-label { display: flex; align-items: flex-start; padding: 10px 15px; border: 1px solid var(--border-color); border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        .option-label:hover { background: #f0f4f8; }
        .option-label input { margin-top: 4px; margin-right: 15px; cursor: pointer; }
        
        .sidebar { flex: 1; max-width: 300px; background: white; margin: 15px 15px 15px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; }
        .sidebar-title { text-align: center; font-weight: bold; margin-bottom: 15px; color: var(--header-bg); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; overflow-y: auto; flex: 1; align-content: start; }
        .grid-item { padding: 10px 0; text-align: center; background: white; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .grid-item.answered { background: var(--answered-bg); color: white; border-color: var(--answered-bg); }
        .grid-item.current { background: var(--current-bg); color: white; border-color: var(--current-bg); }
        
        .navigation-btns { margin-top: auto; display: flex; justify-content: space-between; padding-top: 15px; border-top: 1px solid var(--border-color); }
        .nav-btn { padding: 10px 20px; background: var(--btn-bg); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .nav-btn:disabled { background: #95a5a6; cursor: not-allowed; }
        .submit-btn { margin-top: 20px; padding: 12px; background: #c0392b; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        
        #result-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        .result-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center; max-width: 500px; }
        .result-box h2 { color: var(--header-bg); margin-bottom: 20px; }
        .score-display { font-size: 48px; font-weight: bold; color: #27ae60; margin-bottom: 20px; }
        .review-btn { padding: 10px 20px; background: var(--btn-bg); color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div>SIMULASI CBT UTBK/SNBT - LITERASI BAHASA INDONESIA</div>

</header>

            passage: `<h3>Estetika Alam dan Realita Pendaki Instan</h3>
            <p>Jalur pendakian Gunung Pangrango pagi itu dipenuhi embun. Di pos 3, tampak beberapa pendaki sedang menikmati seduhan kopi sambil mengabadikan momen. Mereka adalah rombongan pendaki dari kota yang membawa peralatan mahal dengan merek ternama. Pakaian mereka sangat modis, sangat siap untuk difoto dan diunggah ke media sosial dengan tagar pelestarian alam.</p>
            <p>Seorang petugas relawan kebersihan gunung, Kang Asep, sedang memunguti botol oksigen kaleng dan bungkus mi instan yang berserakan tidak jauh dari tenda rombongan tersebut.</p>

    let currentQuestionIndex = 0;
    const flatQuestions = [];
    const answers = new Array(28).fill(null);

    database.forEach(section => {
        section.questions.forEach(q => {
            flatQuestions.push({
                passage: section.passage,
                question: q.q,
                options: q.options,
                ans: q.ans
            });
        });
    });

    function init() {
        renderGrid();
        if (flatQuestions.length > 0) {
            loadQuestion(0);
            startTimer();
        } else {
            console.error("Database soal kosong atau gagal dimuat.");
        }
    }

    function renderGrid() {
        const grid = document.getElementById('question-grid');
        grid.innerHTML = '';
        for (let i = 0; i < flatQuestions.length; i++) {
            const box = document.createElement('div');
            box.className = 'grid-item';
            box.innerText = (i + 1);
            if (answers[i]) box.classList.add('answered');
            if (i === currentQuestionIndex) box.classList.add('current');
            
            box.onclick = () => loadQuestion(i);
            grid.appendChild(box);
        }
    }

    function loadQuestion(index) {
        currentQuestionIndex = index;
        const qData = flatQuestions[index];
        
        document.getElementById('passage-container').innerHTML = qData.passage;
        document.getElementById('question-text').innerHTML = qData.question;
        
        const optContainer = document.getElementById('options-container');
        optContainer.innerHTML = '';
        
        const labels = ['A', 'B', 'C', 'D', 'E'];
        
        qData.options.forEach((optText, idx) => {
            const letter = labels[idx];
            const label = document.createElement('label');
            label.className = 'option-label';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'q_option';
            radio.value = letter;
            if (answers[index] === letter) {
                radio.checked = true;
            }
            
            radio.onchange = () => {
                answers[index] = letter;
                renderGrid();
            };
            
            label.appendChild(radio);
            const textNode = document.createElement('span');
            textNode.innerHTML = optText;
            label.appendChild(textNode);
            
            optContainer.appendChild(label);
        });

        document.getElementById('btn-prev').disabled = index === 0;
        document.getElementById('btn-next').disabled = index === flatQuestions.length - 1;
        
        renderGrid();
    }

    function changeQuestion(step) {
        let newIndex = currentQuestionIndex + step;
        if (newIndex >= 0 && newIndex < flatQuestions.length) {
            loadQuestion(newIndex);
        }
    }

    function submitTest() {
        if(confirm("Apakah Anda yakin ingin menyelesaikan ujian?")) {
            let score = 0;
            flatQuestions.forEach((q, i) => {
                if (answers[i] === q.ans) score++;
            });
            const finalValue = Math.round((score / flatQuestions.length) * 1000);
            
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('final-score').innerText = finalValue;
        }
    }

    let timeInSeconds = 3600;
    function startTimer() {
        setInterval(() => {
            if(timeInSeconds > 0) {
                timeInSeconds--;
                let h = Math.floor(timeInSeconds / 3600).toString().padStart(2, '0');
                let m = Math.floor((timeInSeconds % 3600) / 60).toString().padStart(2, '0');
                let s = (timeInSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = h + ":" + m + ":" + s;
            } else {
                submitTest();
            }
        }, 1000);
    }

    window.onload = init;
</script>
