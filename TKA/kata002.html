<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Latihan TKA SMA: Kata, Makna, dan Diksi | 25 Soal Interaktif</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f3e9d2 0%, #e6d5b8 100%);
      font-family: 'Segoe UI', 'Inter', 'Poppins', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      margin: 0;
      color: #2c2416;
    }

    .container {
      max-width: 950px;
      width: 100%;
      background: rgba(255, 250, 240, 0.9);
      backdrop-filter: blur(18px);
      background: #fef9ed;
      border-radius: 3rem 3rem 2.5rem 2.5rem;
      box-shadow: 0 30px 50px rgba(100, 70, 40, 0.25), 0 10px 25px rgba(0,0,0,0.1);
      padding: 2.5rem 2.2rem;
      border: 1px solid #dbc7a0;
      transition: all 0.2s ease;
    }

    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 2.4rem;
      font-weight: 700;
      color: #4b3a26;
      text-align: center;
      margin-bottom: 0.4rem;
      letter-spacing: -0.5px;
      background: #f7eedb;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      box-shadow: 0 8px 0 #cbb186;
      border: 2px solid #b5966e;
    }

    h1 span {
      background: #b48b5a;
      color: #fff5e6;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-size: 1.9rem;
      box-shadow: inset 0 -4px 0 #6b4f32;
    }

    .subhead {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 500;
      color: #5e4630;
      background: #efe3cd;
      padding: 0.6rem 1.8rem;
      margin: 1rem auto 1.8rem;
      border-radius: 30px;
      display: inline-block;
      width: fit-content;
      border: 1px dashed #b39264;
    }

    .progress-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      background: #ede0cd;
      border-radius: 40px;
      padding: 0.8rem 2rem;
      margin-bottom: 2.2rem;
      font-weight: 600;
      color: #4b3621;
      border: 1px solid #c6aa7a;
    }

    .progress-bar-bg {
      background: #dac29c;
      height: 14px;
      flex: 1;
      border-radius: 20px;
      overflow: hidden;
      margin: 0 1rem;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #9c7a4d, #c49a6c);
      border-radius: 20px;
      transition: width 0.35s ease;
      box-shadow: 0 0 10px #e0b884;
    }

    .score-badge {
      background: #fff1d6;
      padding: 0.4rem 1.4rem;
      border-radius: 2rem;
      font-weight: 700;
      color: #5c3e1f;
      border: 1px solid #b49460;
    }

    .quiz-panel {
      background: #ffffff;
      border-radius: 2.5rem;
      padding: 2rem 2rem 1.8rem;
      box-shadow: inset 0 0 0 2px #f5e7d3, 0 15px 25px rgba(120, 80, 40, 0.15);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.2rem;
      font-weight: 600;
      font-size: 1rem;
      color: #7a5c3e;
      border-bottom: 2px dotted #cfb991;
      padding-bottom: 0.7rem;
    }

    .context-text {
      background: #f9f2e3;
      padding: 1.2rem 1.5rem;
      border-radius: 1.5rem;
      font-style: italic;
      color: #3b2e1d;
      margin-bottom: 1.8rem;
      border-left: 6px solid #b48b4e;
      font-size: 1.05rem;
      line-height: 1.6;
      box-shadow: 0 6px 12px rgba(0,0,0,0.04);
    }

    .question-text {
      font-weight: 700;
      font-size: 1.3rem;
      margin-bottom: 1.6rem;
      color: #2f2416;
      background: #fff7eb;
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      display: inline-block;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin: 1.8rem 0 2rem;
    }

    .option-item {
      background: #fcf8f0;
      border: 2px solid #e0cba5;
      border-radius: 2rem;
      padding: 0.8rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: all 0.2s;
      cursor: pointer;
      font-weight: 500;
      color: #4a3822;
      box-shadow: 0 3px 6px rgba(0,0,0,0.03);
    }

    .option-item:hover {
      background: #f5e5ce;
      border-color: #b39058;
      transform: translateY(-2px);
      box-shadow: 0 10px 15px rgba(160, 120, 60, 0.2);
    }

    .option-item input[type="radio"] {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #b3925a;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      background: white;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .option-item input[type="radio"]:checked {
      background: #b48b4e;
      border-color: #5e3a1a;
      box-shadow: inset 0 0 0 4px white, 0 0 0 2px #b48b4e;
    }

    .selected-option {
      background: #e7d6bb;
      border-color: #8b6d4b;
      font-weight: 600;
    }

    .correct-feedback {
      background: #d4edda;
      border-color: #2d6a4f;
      color: #1e4620;
    }

    .incorrect-feedback {
      background: #f8d7da;
      border-color: #b0474c;
      color: #71242a;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-top: 1.2rem;
    }

    .btn {
      background: #e5d0b0;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 3rem;
      font-weight: 700;
      font-size: 1rem;
      color: #3f2e18;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border: 2px solid #b59560;
      transition: 0.2s;
      box-shadow: 0 5px 0 #b49258;
      letter-spacing: 0.3px;
    }

    .btn:hover {
      background: #dbbc7c;
      border-color: #7b5d36;
      box-shadow: 0 5px 0 #7b5d36;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #7b5d36;
    }

    .btn:disabled {
      opacity: 0.6;
      pointer-events: none;
      box-shadow: 0 3px 0 #b49258;
      transform: none;
    }

    .explanation-box {
      background: #fef7e9;
      border-radius: 1.8rem;
      padding: 1.3rem 1.5rem;
      margin-top: 1.8rem;
      border: 1px solid #debf88;
      color: #4d3a1e;
      font-weight: 500;
      display: none;
      box-shadow: 0 6px 14px rgba(100, 70, 20, 0.1);
    }

    .explanation-box.show {
      display: block;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .reset-btn {
      background: #f8efe0;
      border-color: #c3a074;
      color: #4f3a20;
    }

    .result-summary {
      background: #f1e3ca;
      border-radius: 2rem;
      padding: 1.8rem;
      margin-top: 2rem;
      text-align: center;
      font-weight: 700;
      font-size: 1.3rem;
      color: #4b3112;
    }

    @media (max-width: 600px) {
      .container {
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>
    📖 <span>25 SOAL</span> TKA
  </h1>
  <div class="subhead">Kata • Makna • Diksi | Sinonim, Antonim, Denotatif, Konotatif, Gramatikal</div>

  <div class="progress-section">
    <span id="questionCounter">Soal 1/25</span>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>
    <span class="score-badge" id="scoreDisplay">Skor: 0</span>
  </div>

  <div class="quiz-panel" id="quizContainer">
    <!-- Dynamic question rendered via JS -->
  </div>

  <div class="nav-buttons">
    <button class="btn reset-btn" id="resetBtn">↺ Ulangi Latihan</button>
    <button class="btn" id="nextBtn" disabled>Selanjutnya →</button>
  </div>
  <div class="result-summary" id="finalSummary" style="display: none;"></div>
</div>

<script>
  (function() {
    // --- SOAL BANK (25 soal) berdasarkan materi lengkap ---
    const questions = [
      {
        context: "Indonesia memiliki kekayaan alam yang melimpah sehingga berpotensi meningkatkan kesejahteraan masyarakat.",
        question: "Kata <strong>melimpah</strong> paling tepat disamakan dengan ....",
        options: ["sedikit", "banyak", "sempit", "kosong", "terbatas"],
        correct: 1,
        explanation: "Melimpah berarti berjumlah banyak atau berlimpah. Dalam konteks kekayaan alam, padanan yang tepat adalah 'banyak'."
      },
      {
        context: "Para ilmuwan terus melakukan penelitian mengenai perubahan iklim.",
        question: "Sinonim kata <strong>penelitian</strong> adalah ....",
        options: ["pengamatan", "penyelidikan", "pembelajaran", "hafalan", "permainan"],
        correct: 1,
        explanation: "Penelitian merupakan proses penyelidikan ilmiah. Maka sinonim paling tepat adalah 'penyelidikan'."
      },
      {
        context: "Polisi sedang melihat rekaman CCTV untuk mencari bukti.",
        question: "Sinonim kata <strong>melihat</strong> yang tepat sesuai konteks kalimat adalah ....",
        options: ["memandang", "menyaksikan", "menatap", "melirik", "mengintip"],
        correct: 1,
        explanation: "Melihat rekaman CCTV bermakna menyaksikan atau mengamati dengan saksama. 'Menyaksikan' paling cocok."
      },
      {
        context: "Harga bahan pokok mengalami kenaikan menjelang hari raya.",
        question: "Antonim kata <strong>kenaikan</strong> dalam kalimat tersebut adalah ....",
        options: ["penurunan", "peningkatan", "perkembangan", "perubahan", "kemajuan"],
        correct: 0,
        explanation: "Lawan dari kenaikan adalah penurunan. Pilihan lain justru bersinonim atau tidak berlawanan."
      },
      {
        context: "Tugas sekolah ini terasa ringan bagi Rina karena ia sudah terbiasa belajar.",
        question: "Antonim kata <strong>ringan</strong> dalam kalimat di atas adalah ....",
        options: ["mudah", "berat", "cepat", "sulit", "gampang"],
        correct: 1,
        explanation: "Ringan dalam konteks tugas bermakna tidak berat, sehingga antonimnya 'berat'."
      },
      {
        context: "Pemerintah mengajak masyarakat untuk lebih hemat menggunakan energi listrik.",
        question: "Antonim kata <strong>hemat</strong> adalah ....",
        options: ["efisien", "bijaksana", "boros", "cermat", "sederhana"],
        correct: 2,
        explanation: "Hemat berarti tidak boros. Lawan kata yang tepat adalah 'boros'."
      },
      {
        context: "Adik membeli kambing hitam untuk kurban.",
        question: "Makna kata <strong>kambing hitam</strong> pada kalimat di atas adalah ....",
        options: ["kambing berwarna hitam (denotatif)", "orang yang dipersalahkan", "hewan kurban", "simbol kejahatan", "kambing istimewa"],
        correct: 0,
        explanation: "Kalimat tersebut menggunakan makna denotatif (sebenarnya) karena menyebut hewan kambing berwarna hitam secara harfiah."
      },
      {
        context: "Dia sering dijadikan kambing hitam dalam setiap masalah di kantor.",
        question: "Kata <strong>kambing hitam</strong> pada kalimat di atas bermakna ....",
        options: ["hewan kurban", "orang yang disalahkan (konotatif)", "kambing warna gelap", "pelaku utama", "saksi kunci"],
        correct: 1,
        explanation: "Dalam konteks ini, kambing hitam adalah ungkapan konotatif yang berarti orang yang dipersalahkan."
      },
      {
        context: "Ayah menjadi tulang punggung keluarga dengan bekerja keras setiap hari.",
        question: "Makna konotatif <strong>tulang punggung</strong> dalam kalimat tersebut adalah ....",
        options: ["bagian tubuh manusia", "pencari nafkah utama", "orang yang kuat", "tulang belakang", "penopang fisik"],
        correct: 1,
        explanation: "Tulang punggung secara konotatif berarti pencari nafkah utama atau andalan keluarga."
      },
      {
        context: "Setelah bertahun-tahun bekerja keras, akhirnya ia menjadi buah bibir di kampungnya.",
        question: "Kata <strong>buah bibir</strong> bermakna ....",
        options: ["makanan khas", "bahan pembicaraan banyak orang", "hasil panen", "hadiah", "buah impor"],
        correct: 1,
        explanation: "Buah bibir adalah ungkapan yang berarti bahan pembicaraan atau pergunjingan."
      },
      {
        context: "Kemajuan teknologi telah memberikan dampak positif. Namun, penggunaan yang berlebihan dapat menimbulkan masalah.",
        question: "Makna kata <strong>berlebihan</strong> dalam paragraf tersebut adalah ....",
        options: ["secukupnya", "melampaui batas", "sederhana", "sedikit", "ringan"],
        correct: 1,
        explanation: "Berlebihan berarti melampaui batas wajar atau tidak sewajarnya."
      },
      {
        context: "Pemerintah terus berupaya meningkatkan kualitas pendidikan di daerah terpencil.",
        question: "Makna kata <strong>berupaya</strong> adalah ....",
        options: ["berhenti", "berusaha", "bekerja", "belajar", "mengatur"],
        correct: 1,
        explanation: "Berupaya berarti berusaha atau melakukan usaha untuk mencapai sesuatu."
      },
      {
        context: "Banyak siswa mulai menyadari pentingnya menjaga kesehatan tubuh.",
        question: "Padanan kata <strong>menyadari</strong> yang tepat adalah ....",
        options: ["memahami", "melupakan", "membenci", "mengabaikan", "menolak"],
        correct: 0,
        explanation: "Menyadari berarti memahami atau menginsafi. Padanan yang paling pas adalah 'memahami'."
      },
      {
        context: "Para atlet harus menjaga kondisi fisik agar tetap prima selama pertandingan.",
        question: "Padanan kata <strong>prima</strong> adalah ....",
        options: ["lemah", "terbaik", "buruk", "rusak", "biasa"],
        correct: 1,
        explanation: "Prima berarti kondisi terbaik atau sangat baik. Sinonim tepatnya 'terbaik'."
      },
      {
        context: "Tim peneliti berhasil menemukan metode baru yang lebih efektif dalam mengolah limbah plastik.",
        question: "Padanan kata <strong>efektif</strong> adalah ....",
        options: ["berhasil guna", "rumit", "lambat", "sederhana", "biasa"],
        correct: 0,
        explanation: "Efektif berarti tepat guna atau berhasil guna. Pilihan A adalah padanan yang benar."
      },
      {
        context: "Perkembangan teknologi telah mendorong lahirnya berbagai inovasi.",
        question: "Makna kata <strong>mendorong</strong> pada kalimat tersebut adalah ....",
        options: ["menekan", "menyebabkan", "mengangkat", "menghalangi", "menghentikan"],
        correct: 1,
        explanation: "Mendorong di sini bermakna menyebabkan atau memicu lahirnya inovasi."
      },
      {
        context: "Presiden mengangkat menteri baru dalam kabinet.",
        question: "Sinonim kata <strong>mengangkat</strong> yang paling sesuai konteks adalah ....",
        options: ["memindahkan", "menunjuk", "membawa", "menaikkan", "memperbaiki"],
        correct: 1,
        explanation: "Mengangkat menteri berarti menunjuk atau meresmikan seseorang untuk jabatan."
      },
      {
        context: "Pemerintah berupaya menggenjot pertumbuhan ekonomi di kuartal ketiga.",
        question: "Padanan kata <strong>menggenjot</strong> dalam kalimat tersebut adalah ....",
        options: ["menekan", "memacu", "menambah", "memperluas", "menaikkan"],
        correct: 1,
        explanation: "Menggenjot secara kontekstual berarti memacu atau mendorong lebih cepat."
      },
      {
        context: "UMKM harus bertahan di tengah badai inflasi yang melanda global.",
        question: "Kata <strong>badai</strong> dalam kalimat di atas bermakna ....",
        options: ["angin kencang", "cuaca ekstrem", "situasi menyulitkan (konotatif)", "bencana alam", "hujan deras"],
        correct: 2,
        explanation: "Badai di sini adalah makna konotatif yang menggambarkan situasi ekonomi yang sulit."
      },
      {
        context: "Para peserta diminta mengumpulkan laporan sebelum pukul 12.00.",
        question: "Makna gramatikal pada kata <strong>mengumpulkan</strong> muncul karena ....",
        options: ["perubahan bunyi", "penggunaan kata asing", "penambahan imbuhan", "perubahan ejaan", "majas"],
        correct: 2,
        explanation: "Kata 'mengumpulkan' berasal dari dasar 'kumpul' dengan imbuhan me- dan -kan. Makna gramatikalnya hadir karena proses afiksasi."
      },
      {
        context: "Pengawasan yang ketat diperlukan agar bantuan tepat sasaran.",
        question: "Imbuhan <strong>pe-an</strong> pada kata pengawasan menyatakan makna ....",
        options: ["tempat", "alat", "hasil", "kumpulan", "proses"],
        correct: 4,
        explanation: "Pengawasan berarti proses mengawasi. Imbuhan pe-an di sini menyatakan makna proses."
      },
      {
        context: "Ekosistem hutan tropis menyimpan keanekaragaman hayati. Perilaku serakah segelintir pihak membuat bumi kehilangan paru-parunya.",
        question: "Sinonim <strong>serakah</strong> yang tepat sesuai konteks adalah ....",
        options: ["pelit", "tamak", "egois", "hemat", "rakus"],
        correct: 1,
        explanation: "Serakah dalam konteks eksploitasi hutan berarti tamak (ingin mengambil banyak tanpa peduli)."
      },
      {
        context: "Bumi kehilangan paru-parunya akibat pembalakan liar.",
        question: "Kata <strong>paru-paru</strong> pada kalimat tersebut bermakna ....",
        options: ["organ pernapasan", "kawasan hijau (konotatif)", "alat bantu napas", "bagian tubuh vital", "oksigen"],
        correct: 1,
        explanation: "Paru-paru di sini adalah majas untuk hutan sebagai penghasil oksigen, jadi bermakna konotatif."
      },
      {
        context: "Upaya reboisasi harus digencarkan sebagai wujud kepedulian.",
        question: "Antonim dari kata <strong>digencarkan</strong> yang sesuai konteks adalah ....",
        options: ["dihentikan", "dikurangi", "dilambatkan", "dipercepat", "dilalaikan"],
        correct: 0,
        explanation: "Digencarkan berarti dilakukan lebih giat. Lawan yang paling logis adalah 'dihentikan'."
      },
      {
        context: "Banyak pemuda ingin sukses dengan cara instan, enggan berlelah-lelah.",
        question: "Makna kata <strong>instan</strong> dalam paragraf tersebut adalah ....",
        options: ["langsung jadi (denotatif)", "serba cepat tanpa usaha (konotatif negatif)", "praktis dan efisien", "dalam waktu singkat", "siap pakai"],
        correct: 1,
        explanation: "Instan di sini berkonotasi negatif: menginginkan hasil tanpa proses dan kerja keras."
      }
    ];

    // --- State variables ---
    let currentIndex = 0;             // 0-based index
    let userAnswers = new Array(questions.length).fill(null); // menyimpan jawaban terpilih (index opsi)
    let submittedQuestions = new Array(questions.length).fill(false); // sudah dikunci jawabannya?
    let score = 0;

    // DOM elements
    const quizContainer = document.getElementById('quizContainer');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const questionCounter = document.getElementById('questionCounter');
    const progressFill = document.getElementById('progressFill');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const finalSummary = document.getElementById('finalSummary');

    // --- Render current question ---
    function renderQuestion() {
      const q = questions[currentIndex];
      const selected = userAnswers[currentIndex];
      const isSubmitted = submittedQuestions[currentIndex];

      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        let optionClass = 'option-item';
        if (selected === idx) {
          optionClass += ' selected-option';
        }
        // Jika sudah disubmit, tambahkan feedback warna
        if (isSubmitted) {
          if (idx === q.correct) {
            optionClass += ' correct-feedback';
          } else if (selected === idx && idx !== q.correct) {
            optionClass += ' incorrect-feedback';
          }
        }

        const checkedAttr = (selected === idx) ? 'checked' : '';
        const disabledAttr = isSubmitted ? 'disabled' : '';
        optionsHtml += `
          <label class="${optionClass}">
            <input type="radio" name="questionOption" value="${idx}" ${checkedAttr} ${disabledAttr}>
            <span>${String.fromCharCode(65 + idx)}. ${opt}</span>
          </label>
        `;
      });

      const explanationDisplay = isSubmitted ? 'show' : '';

      const html = `
        <div class="question-header">
          <span>📌 Soal ${currentIndex + 1} / ${questions.length}</span>
          <span>${isSubmitted ? '✅ Terjawab' : '⏳ Pilih jawaban'}</span>
        </div>
        <div class="context-text">
          📖 ${q.context}
        </div>
        <div class="question-text">
          ${q.question}
        </div>
        <div class="options-grid" id="optionsGrid">
          ${optionsHtml}
        </div>
        <div class="action-buttons">
          <button class="btn" id="submitAnswerBtn" ${isSubmitted ? 'disabled' : ''}>🔒 Kunci Jawaban</button>
        </div>
        <div class="explanation-box ${explanationDisplay}" id="explanationBox">
          <strong>💡 Pembahasan:</strong> ${q.explanation}
        </div>
      `;

      quizContainer.innerHTML = html;

      // Update UI elements
      updateProgress();

      // Attach event listeners untuk radio buttons (hanya jika belum disubmit)
      if (!isSubmitted) {
        const radioButtons = document.querySelectorAll('input[name="questionOption"]');
        radioButtons.forEach(radio => {
          radio.addEventListener('change', function(e) {
            const val = parseInt(e.target.value, 10);
            userAnswers[currentIndex] = val;
            renderQuestion(); // re-render untuk memperbarui selected style
          });
        });

        const submitBtn = document.getElementById('submitAnswerBtn');
        if (submitBtn) {
          submitBtn.addEventListener('click', function() {
            if (userAnswers[currentIndex] === null) {
              alert('Silakan pilih salah satu jawaban terlebih dahulu.');
              return;
            }
            // Kunci jawaban
            submittedQuestions[currentIndex] = true;
            // Update skor jika jawaban benar dan baru pertama dikunci
            if (userAnswers[currentIndex] === questions[currentIndex].correct) {
              score++;
            }
            // Render ulang untuk menampilkan feedback
            renderQuestion();
            updateProgress();
            // Cek apakah semua soal sudah terjawab
            checkCompletion();
          });
        }
      }

      // Update tombol Next
      if (isSubmitted) {
        nextBtn.disabled = false;
      } else {
        nextBtn.disabled = true;
      }

      // Sembunyikan final summary jika belum selesai semua
      finalSummary.style.display = 'none';
    }

    function updateProgress() {
      const total = questions.length;
      const answeredCount = submittedQuestions.filter(v => v === true).length;
      const progressPercent = (answeredCount / total) * 100;
      progressFill.style.width = progressPercent + '%';
      questionCounter.textContent = `Soal ${currentIndex + 1}/${total}`;
      scoreDisplay.textContent = `Skor: ${score}`;
      
      // Jika semua terjawab, tampilkan ringkasan
      if (answeredCount === total) {
        showFinalSummary();
      }
    }

    function checkCompletion() {
      const allAnswered = submittedQuestions.every(v => v === true);
      if (allAnswered) {
        nextBtn.disabled = true; // bisa juga tidak perlu next
        showFinalSummary();
      } else {
        // aktifkan next kalau soal sekarang sudah terjawab
        nextBtn.disabled = !submittedQuestions[currentIndex];
      }
    }

    function showFinalSummary() {
      const total = questions.length;
      finalSummary.style.display = 'block';
      finalSummary.innerHTML = `
        🎉 Latihan Selesai! <br>
        Skor Akhir: <strong>${score} / ${total}</strong> 
        (${Math.round((score/total)*100)}%)<br>
        <span style="font-size:1rem;">Kamu bisa mengulang latihan atau meninjau kembali setiap soal.</span>
      `;
    }

    function goToNextQuestion() {
      if (!submittedQuestions[currentIndex]) {
        // seharusnya tombol disabled, tapi sebagai pengaman
        return;
      }
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        // sudah di soal terakhir
        if (submittedQuestions.every(v => v === true)) {
          showFinalSummary();
        }
        nextBtn.disabled = true;
      }
      // Scroll ke atas
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetQuiz() {
      if (confirm('Apakah kamu yakin ingin mengulang latihan? Semua jawaban akan dihapus.')) {
        currentIndex = 0;
        userAnswers = new Array(questions.length).fill(null);
        submittedQuestions = new Array(questions.length).fill(false);
        score = 0;
        renderQuestion();
        finalSummary.style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // Event Listeners untuk navigasi
    nextBtn.addEventListener('click', goToNextQuestion);
    resetBtn.addEventListener('click', resetQuiz);

    // Inisialisasi render pertama
    renderQuestion();

    // Memastikan tombol next sesuai kondisi awal
    nextBtn.disabled = true;
  })();
</script>
</body>
</html>
