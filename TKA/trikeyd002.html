<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
  <title>🔍 Latihan Identifikasi Kalimat EYD | 5 Trik Jitu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', 'Poppins', Roboto, system-ui, sans-serif;
      background: linear-gradient(145deg, #0b1120 0%, #1a2333 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #e2e8f0;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
      padding: 1.8rem 1.5rem 2rem;
      border: 1px solid rgba(255,255,255,0.15);
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fbbf24;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #fbbf24, #f59e0b);
      border-radius: 10px;
      transition: width 0.3s;
    }
    .sentence-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .sentence-text {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.5;
      word-break: break-word;
      margin-bottom: 20px;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }
    .btn-true {
      background: #22c55e;
      color: #fff;
    }
    .btn-true:hover {
      background: #16a34a;
    }
    .btn-false {
      background: #ef4444;
      color: #fff;
    }
    .btn-false:hover {
      background: #dc2626;
    }
    .btn-next {
      background: #fbbf24;
      color: #0f172a;
    }
    .btn-next:hover {
      background: #fcd34d;
    }
    .analysis-box {
      margin-top: 20px;
      animation: fadeSlide 0.3s ease;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .verdict {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .verdict.correct {
      color: #4ade80;
    }
    .verdict.incorrect {
      color: #f87171;
    }
    .feedback {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    th {
      background: rgba(251,191,36,0.2);
      color: #fcd34d;
      padding: 10px 8px;
      text-align: left;
    }
    td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .status-icon {
      font-weight: bold;
    }
    .pass {
      color: #4ade80;
    }
    .fail {
      color: #f87171;
    }
    .perbaikan-box {
      background: rgba(251,191,36,0.1);
      border-left: 4px solid #fbbf24;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #fcd34d;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .btn-outline {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.2);
    }
    @media (max-width: 500px) {
      .sentence-text {
        font-size: 1.1rem;
      }
      th, td {
        font-size: 0.75rem;
        padding: 8px 4px;
      }
    }
  </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
  (function() {
    // Data soal – sudah termasuk perbaikan
    const exercises = [
      {
        kalimat: "presiden jokowi meresmikan gedung baru.",
        trik: [
          { nama: "Huruf pertama kapital", status: false, detail: "Huruf 'p' kecil, harusnya kapital." },
          { nama: "Huruf kapital lain", status: false, detail: "Nama 'jokowi' harus kapital (Jokowi)." },
          { nama: "Tanda koma", status: true, detail: "Tidak ada masalah koma." },
          { nama: "Penulisan \"di\"", status: true, detail: "Tidak ada kata 'di'." },
          { nama: "Kata baku", status: true, detail: "Semua kata baku." }
        ],
        kesimpulan: false, // SALAH
        alasan: "Awal kalimat tidak kapital, nama orang tidak kapital.",
        perbaikan: "Presiden Jokowi meresmikan gedung baru."
      },
      {
        kalimat: "Presiden Jokowi meresmikan gedung di jakarta.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: false, detail: "'jakarta' harus kapital (Jakarta)." },
          { nama: "Tanda koma", status: true, detail: "Tidak ada." },
          { nama: "Penulisan \"di\"", status: true, detail: "'di jakarta' terpisah, benar sebagai kata depan." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: false,
        alasan: "Nama geografi 'jakarta' kurang kapital.",
        perbaikan: "Presiden Jokowi meresmikan gedung di Jakarta."
      },
      {
        kalimat: "Ibu membeli sayur, ikan dan buah.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "Tidak ada yang perlu kapital." },
          { nama: "Tanda koma", status: true, detail: "Pemerincian tiga unsur, koma sebelum 'dan' opsional. Tidak salah." },
          { nama: "Penulisan \"di\"", status: true, detail: "Tidak ada." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: true,
        alasan: "Tidak melanggar aturan EYD.",
        perbaikan: "Kalimat sudah benar."
      },
      {
        kalimat: "Dia mengatakan, bahwa dia sakit.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "Tidak ada." },
          { nama: "Tanda koma", status: false, detail: "Koma sebelum 'bahwa' tidak diperlukan." },
          { nama: "Penulisan \"di\"", status: true, detail: "Tidak ada." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: false,
        alasan: "Koma sebelum 'bahwa' di tengah kalimat salah.",
        perbaikan: "Dia mengatakan bahwa dia sakit."
      },
      {
        kalimat: "Buku itu ada dimeja.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "Tidak ada." },
          { nama: "Tanda koma", status: true, detail: "Tidak ada." },
          { nama: "Penulisan \"di\"", status: false, detail: "'dimeja' menunjukkan tempat, harus ditulis terpisah: di meja." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: false,
        alasan: "Kata depan 'di' tempat ditulis serangkai.",
        perbaikan: "Buku itu ada di meja."
      },
      {
        kalimat: "Dia seorang atlit yang berprestasi.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "Tidak ada." },
          { nama: "Tanda koma", status: true, detail: "Tidak ada." },
          { nama: "Penulisan \"di\"", status: true, detail: "Tidak ada." },
          { nama: "Kata baku", status: false, detail: "'atlit' tidak baku, seharusnya 'atlet'." }
        ],
        kesimpulan: false,
        alasan: "Mengandung kata tidak baku 'atlit'.",
        perbaikan: "Dia seorang atlet yang berprestasi."
      },
      {
        kalimat: "Saya tinggal di Jakarta Selatan.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "'Jakarta Selatan' kapital semua." },
          { nama: "Tanda koma", status: true, detail: "Tidak ada." },
          { nama: "Penulisan \"di\"", status: true, detail: "'di Jakarta' terpisah, benar." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: true,
        alasan: "Memenuhi semua kaidah EYD.",
        perbaikan: "Kalimat sudah benar."
      },
      {
        kalimat: "Karena hujan deras, kami batal pergi.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "Tidak ada." },
          { nama: "Tanda koma", status: true, detail: "Koma setelah anak kalimat di depan, tepat." },
          { nama: "Penulisan \"di\"", status: true, detail: "Tidak ada." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: true,
        alasan: "Tidak ada kesalahan.",
        perbaikan: "Kalimat sudah benar."
      },
      {
        kalimat: "Dia tidak datang, karena hujan deras.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "Tidak ada." },
          { nama: "Tanda koma", status: false, detail: "Koma sebelum 'karena' di belakang induk kalimat tidak tepat." },
          { nama: "Penulisan \"di\"", status: true, detail: "Tidak ada." },
          { nama: "Kata baku", status: true, detail: "Semua baku." }
        ],
        kesimpulan: false,
        alasan: "Koma sebelum 'karena' di akhir kalimat salah.",
        perbaikan: "Dia tidak datang karena hujan deras."
      },
      {
        kalimat: "Ibu membeli coklat di apotik.",
        trik: [
          { nama: "Huruf pertama kapital", status: true, detail: "Sudah kapital." },
          { nama: "Huruf kapital lain", status: true, detail: "Tidak ada." },
          { nama: "Tanda koma", status: true, detail: "Tidak ada." },
          { nama: "Penulisan \"di\"", status: true, detail: "'di apotik' terpisah, benar." },
          { nama: "Kata baku", status: false, detail: "'coklat' → cokelat, 'apotik' → apotek." }
        ],
        kesimpulan: false,
        alasan: "Terdapat dua kata tidak baku.",
        perbaikan: "Ibu membeli cokelat di apotek."
      }
    ];

    const app = document.getElementById('app');
    let currentIndex = 0;
    let userAnswer = null; // 'true' or 'false' setelah dijawab

    function renderSoal(index) {
      const item = exercises[index];
      const total = exercises.length;
      const progressPercent = ((index) / total) * 100;

      // Reset jawaban user
      userAnswer = null;

      // Buat HTML
      let html = `
        <h1>🔎 Identifikasi Kalimat EYD</h1>
        <div class="subtitle">Gunakan 5 Trik Jitu: Kapital Awal · Kapital Lain · Tanda Koma · Penulisan "di" · Kata Baku</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${progressPercent}%;"></div></div>
        <div class="progress">Soal ${index+1} dari ${total}</div>
        <div class="sentence-card" id="sentenceCard">
          <div class="sentence-text">${index+1}. ${item.kalimat}</div>
          <div id="actionArea">
            <div class="action-buttons">
              <button class="btn btn-true" id="btnBenar">✅ Benar</button>
              <button class="btn btn-false" id="btnSalah">❌ Salah</button>
            </div>
          </div>
          <div id="analysisArea" style="display:none;"></div>
        </div>
        <div class="nav-buttons" id="navButtons">
          <button class="btn-outline" id="prevBtn" ${index === 0 ? 'disabled' : ''}>◀ Sebelumnya</button>
          <span style="color:#94a3b8;">${index+1}/${total}</span>
          <button class="btn-outline" id="nextBtn" disabled>Selanjutnya ▶</button>
        </div>
      `;

      app.innerHTML = html;

      // Event listener tombol Benar/Salah
      document.getElementById('btnBenar')?.addEventListener('click', () => handleAnswer(true));
      document.getElementById('btnSalah')?.addEventListener('click', () => handleAnswer(false));
      document.getElementById('prevBtn')?.addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex--;
          renderSoal(currentIndex);
        }
      });
      document.getElementById('nextBtn')?.addEventListener('click', goToNext);
    }

    function handleAnswer(userChoice) {
      const item = exercises[currentIndex];
      const sebenarnya = item.kesimpulan; // true jika kalimat benar
      userAnswer = userChoice;

      // Sembunyikan tombol aksi
      document.getElementById('actionArea').style.display = 'none';

      // Tampilkan analisis
      const analysisArea = document.getElementById('analysisArea');
      analysisArea.style.display = 'block';

      // Tentukan apakah jawaban user tepat
      const isCorrect = (userChoice === sebenarnya);
      const feedbackText = isCorrect ? 
        "✅ Jawaban Anda tepat!" : 
        "❌ Jawaban Anda kurang tepat.";

      // Bangun tabel analisis
      let trikRows = '';
      item.trik.forEach(t => {
        trikRows += `
          <tr>
            <td>${t.nama}</td>
            <td class="status-icon ${t.status ? 'pass' : 'fail'}">${t.status ? '✔' : '✘'}</td>
            <td>${t.detail}</td>
          </tr>
        `;
      });

      // Kesimpulan sebenarnya
      const kesimpulanText = sebenarnya ? 
        "<span class='correct'>BENAR</span>" : 
        "<span class='incorrect'>SALAH</span>";
      const alasanText = item.alasan;

      // Perbaikan
      const perbaikanText = item.perbaikan;

      analysisArea.innerHTML = `
        <div class="feedback">${feedbackText} Kalimat ini seharusnya dinilai <strong>${kesimpulanText}</strong>.</div>
        <div class="verdict ${sebenarnya ? 'correct' : 'incorrect'}">
          Status: ${sebenarnya ? '✅ BENAR' : '❌ SALAH'} — ${alasanText}
        </div>
        <table>
          <thead><tr><th>Trik</th><th>Status</th><th>Keterangan</th></tr></thead>
          <tbody>${trikRows}</tbody>
        </table>
        <div class="perbaikan-box">
          <strong>📝 Perbaikan:</strong> ${perbaikanText}
        </div>
      `;

      // Aktifkan tombol Next
      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        nextBtn.disabled = false;
      }
    }

    function goToNext() {
      if (currentIndex < exercises.length - 1) {
        currentIndex++;
        renderSoal(currentIndex);
      } else {
        // Selesai, tampilkan pesan
        app.innerHTML = `
          <div style="text-align:center; padding:2rem 1rem;">
            <div style="font-size:4rem;">🎉</div>
            <h2 style="margin:16px 0; color:#fbbf24;">Latihan Selesai!</h2>
            <p style="color:#cbd5e1; margin-bottom:24px;">Kamu telah mengecek ${exercises.length} kalimat dengan 5 Trik EYD.</p>
            <button class="btn btn-next" id="restartBtn">🔄 Ulangi Latihan</button>
          </div>
        `;
        document.getElementById('restartBtn')?.addEventListener('click', () => {
          currentIndex = 0;
          renderSoal(currentIndex);
        });
      }
    }

    // Mulai
    renderSoal(0);
  })();
</script>
</body>
</html>
