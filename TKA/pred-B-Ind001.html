<script>
    // ─────────────────────────────────────────────
    //  DATA SOAL dengan teks bacaan (bacaan)

    const soalData = [];

    // --- BACAAN untuk soal 1-3 ---
    const bacaan1 = `Modernisasi Bus Lokal Harus Berjalan Beriringan dengan Keselamatan

Transportasi umum memiliki peran penting dalam mendukung mobilitas masyarakat. Dalam beberapa tahun terakhir, industri bus di Indonesia mengalami perkembangan yang cukup pesat. Banyak perusahaan otobus dan karoseri mulai melakukan modernisasi armada dengan menghadirkan bus yang lebih nyaman, berteknologi maju, serta memiliki tampilan menarik. Modernisasi tersebut menunjukkan bahwa industri transportasi terus berupaya meningkatkan kualitas pelayanan kepada masyarakat. Akan tetapi, perkembangan itu tidak boleh hanya berorientasi pada aspek estetika dan persaingan pasar, tetapi juga harus disertai peningkatan standar keselamatan.

Kementerian Perhubungan menegaskan bahwa keselamatan penumpang harus menjadi prioritas utama dalam proses modernisasi bus lokal. Setiap kendaraan wajib memenuhi persyaratan teknis dan kelayakan jalan sebelum dioperasikan. Selain itu, perusahaan transportasi perlu memastikan bahwa sistem keamanan kendaraan berfungsi dengan baik, mulai dari struktur bodi, sabuk pengaman, hingga prosedur pemeriksaan rutin. Dengan demikian, modernisasi tidak hanya menghasilkan kendaraan yang nyaman digunakan, tetapi juga mampu memberikan perlindungan maksimal bagi penumpang.

Di sisi lain, penerapan standar keselamatan masih menghadapi berbagai tantangan. Sebagian perusahaan dinilai lebih menonjolkan desain interior ataupun fasilitas hiburan dibandingkan penguatan aspek keamanan. Padahal, tingginya angka kecelakaan lalu lintas menunjukkan bahwa keselamatan harus menjadi perhatian utama dalam industri transportasi darat. Oleh sebab itu, pemerintah, perusahaan karoseri, dan operator bus perlu bekerja sama untuk membangun budaya keselamatan yang lebih kuat. Kesadaran tersebut penting agar masyarakat memperoleh layanan transportasi yang aman, nyaman, dan berkualitas.

Dengan demikian, modernisasi bus lokal merupakan langkah positif dalam meningkatkan kualitas transportasi umum di Indonesia. Namun, modernisasi harus berjalan beriringan dengan penerapan standar keselamatan yang ketat. Dengan demikian, masyarakat memperoleh layanan transportasi yang tidak hanya modern, tetapi juga aman dan terpercaya.

Sumber: Muhammad Fathan Radityasani dan Agung Kurniawan, Kompas.com, 2026`;

    soalData.push({
        id: 1, tipe: 'Pilihan Ganda', bacaan: bacaan1,
        teks: 'Apa gagasan yang paling ditekankan dalam teks tersebut?',
        opsi: [
            'A. Pentingnya hiburan dalam kendaraan umum.',
            'B. Kebebasan perusahaan menentukan desain bus.',
            'C. Persaingan ekonomi dalam industri transportasi.',
            'D. Tanggung jawab terhadap keselamatan penumpang.',
            'E. Pentingnya faktor estetika dalam peningkatan pelayanan.'

        penjelasan: 'Gagasan utama teks adalah bahwa modernisasi bus harus diiringi dengan peningkatan standar keselamatan. Penulis menekankan tanggung jawab terhadap keselamatan penumpang sebagai prioritas utama, bukan sekadar estetika atau persaingan pasar.'
    });

    soalData.push({
        id: 2, tipe: 'Pilihan Ganda', bacaan: bacaan1,
        teks: 'Kata serapan yang digunakan secara tepat sesuai maknanya dalam teks tersebut adalah ...',
        opsi: [
            'A. Kata "modern" bermakna teknologi dari luar negeri.',
            'B. Kata "bodi" bermakna mesin utama penggerak kendaraan.',
            'C. Kata "karoseri" bermakna perusahaan perakit bodi kendaraan.',
            'D. Kata "estetika" bermakna aturan keselamatan dalam berkendara.',
            'E. Kata "operator" bermakna penumpang kendaraan umum.'
        ],
        jawaban: [2],
        penjelasan: 'Karoseri adalah istilah yang merujuk pada perusahaan atau bengkel yang merakit dan membuat bodi kendaraan. Makna ini tepat digunakan dalam konteks industri bus. Opsi lain keliru: modern ≠ teknologi luar negeri, bodi ≠ mesin, estetika ≠ aturan keselamatan, operator ≠ penumpang.'
    });

    soalData.push({
        id: 3, tipe: 'Pilihan Ganda', bacaan: bacaan1,
        teks: 'Hubungan sebab akibat yang terdapat pada paragraf ketiga adalah ...',
        opsi: [
            'A. Tingginya angka kecelakaan menyebabkan perusahaan mengurangi fasilitas hiburan.',
            'B. Perusahaan lebih mengutamakan desain sehingga aspek keselamatan kurang diperhatikan.',
            'C. Penguatan aspek keamanan menyebabkan desain interior bus menjadi sederhana.',
            'D. Tingginya angka kecelakaan terjadi karena masyarakat lebih menyukai bus modern.',

        ],
        jawaban: [1],
        penjelasan: 'Pada paragraf ketiga dijelaskan bahwa perusahaan lebih menonjolkan desain dan fasilitas hiburan dibandingkan aspek keamanan. Akibatnya (sebab-akibat), keselamatan kurang diperhatikan, yang tercermin dari tingginya angka kecelakaan.'

    // --- BACAAN untuk soal 4-7 ---
    const bacaan2 = `Kopi Hitam Diprediksi Menjadi Tren pada 2026

Berdasarkan laporan dari industri kopi melalui laman nibble.id, kopi hitam tanpa gula diprediksi menjadi tren minuman utama pada 2026. Tren ini muncul sebagai akibat dari meningkatnya kesadaran masyarakat terhadap gaya hidup sehat. Padahal, selama beberapa tahun terakhir, kopi susu mendominasi menu berbagai kedai kopi di Indonesia. Akan tetapi, dominasi tersebut mulai menunjukkan tanda-tanda kejenuhan di kalangan konsumen.

Fenomena pergeseran ini tidak terjadi secara tiba-tiba. Sebab, ada beberapa faktor yang saling berkaitan. Pertama, tren kopi susu mulai terasa membosankan karena variasinya cenderung monoton. Kedua, kesadaran terhadap bahaya konsumsi gula berlebih makin menguat. Lantaran hal itu, banyak orang beralih ke kopi hitam tanpa tambahan gula atau susu. Ketiga, perubahan gaya hidup masyarakat urban mendorong kembalinya kebiasaan minum kopi secara tradisional. Di Indonesia, menyuguhkan kopi hitam untuk tamu merupakan lambang keramahan tuan rumah. Oleh karena itu, pilihan terhadap kopi hitam sebenarnya tidak sepenuhnya baru. Kebiasaan ini justru menggembalikan kedekatan dengan akar budaya bangsa.

Faktor pendukung tren kopi hitam lainnya adalah ketersediaan produk. Produk kopi hitam bubuk kini makin mudah dijumpai. Mulai dari produk bermerek dagang terkenal sampai produk lokal di pasar tradisional, semuanya masih bertahan puluhan tahun. Artinya, akses masyarakat terhadap kopi hitam sangat luas dan murah. Hal ini berbeda dengan kopi susu yang memerlukan bahan tambahan seperti susu dan gula.

Dengan adanya perubahan gaya hidup serta upaya mengembalikan tradisi minum kopi, kopi hitam dinilai sebagai pilihan yang lebih sederhana dan autentik. Pilihan ini juga sesuai dengan kesadaran masyarakat terhadap pola konsumsi sehat. Dengan demikian, para pengamat industri kopi memprediksi kopi hitam akan menjadi tren utama pada 2026.

Sumber: Aldy Riantito, RRI, 2026`;

    soalData.push({
        id: 4, tipe: 'Pilihan Ganda', bacaan: bacaan2,
        teks: 'Kerangka tulisan yang tepat berdasarkan teks tersebut adalah ...',
        opsi: [
            'A. 1) prediksi tren, 2) produk mudah dijumpai, 3) sederhana & autentik, 4) kopi susu membosankan.',
            'B. 1) kopi susu membosankan, 2) prediksi tren, 3) tradisi suguhan, 4) pola sehat.',
            'C. 1) prediksi tren, 2) faktor pergeseran (kopi susu membosankan, kesadaran gula, tradisi), 3) ketersediaan produk, 4) simpulan.',
            'D. 1) ketersediaan produk, 2) sederhana & autentik, 3) kopi susu monoton, 4) prediksi tren.',
            'E. 1) tradisi suguhan, 2) prediksi tren, 3) produk mudah dijumpai, 4) lebih sederhana.'
        ],
        jawaban: [2],
        penjelasan: 'Kerangka C paling tepat karena mengikuti alur teks: (1) prediksi awal, (2) faktor-faktor penyebab pergeseran (kopi susu membosankan, kesadaran gula, tradisi), (3) faktor pendukung (ketersediaan produk), dan (4) simpulan bahwa kopi hitam menjadi tren.'
    });

    soalData.push({
        id: 5, tipe: 'Pilihan Ganda', bacaan: bacaan2,
        teks: 'Apa isi teks tersebut?',
        opsi: [
            'A. Cara menyeduh kopi hitam yang autentik dan sederhana.',
            'B. Sejarah panjang industri kopi hitam di Indonesia.',
            'C. Perbandingan harga antara kopi hitam dan kopi susu.',
            'D. Panduan memilih produk kopi hitam bubuk yang berkualitas.',
            'E. Faktor penyebab kopi hitam diprediksi menjadi tren tahun 2026 serta interpretasinya.'
        ],
        jawaban: [4],
        penjelasan: 'Teks membahas prediksi bahwa kopi hitam menjadi tren pada 2026, serta memaparkan faktor-faktor penyebabnya (kejenuhan kopi susu, kesadaran kesehatan, tradisi, ketersediaan produk) dan interpretasi terhadap fenomena tersebut.'
    });

    // soal 6 tabel
    soalData.push({
        id: 6, tipe: 'Tabel', bacaan: bacaan2,
        teks: 'Tentukan Sesuai atau Tidak Sesuai untuk setiap pernyataan berikut:',
        tabel: {
            header: ['Pernyataan', 'Sesuai', 'Tidak Sesuai'],
            rows: [
                { pernyataan: 'Paragraf pertama termasuk struktur pernyataan umum karena memuat gambaran awal mengenai fenomena tren kopi hitam pada 2026.',
                    benar: 0 },
                { pernyataan: 'Paragraf kedua termasuk struktur interpretasi karena berisi penjelasan faktor penyebab meningkatnya minat terhadap kopi hitam.',

                    benar: 0 }
            ]
        },
        jawaban: [0, 0, 0],
        penjelasan: 'Paragraf pertama memang merupakan pernyataan umum (gambaran awal). Paragraf kedua berisi interpretasi/penjelasan faktor penyebab. Paragraf terakhir merupakan interpretasi/simpulan. Ketiga pernyataan tersebut SESUAI dengan struktur teks.'

    soalData.push({
        id: 7, tipe: 'Tabel', bacaan: bacaan2,
        teks: 'Tentukan Benar atau Salah untuk setiap pernyataan mengenai hubungan makna antarparagraf berikut:',
        tabel: {

    const bacaan13 = `Harga Tanah Mahal Membuat Rumah Subsidi di DIY Sulit Terjangkau

Program rumah subsidi melalui skema Kredit Pemilikan Rumah (KPR) Fasilitas Likuiditas Pembiayaan Perumahan (FLPP) seharusnya menjadi solusi bagi Masyarakat Berpenghasilan Rendah (MBR) untuk memperoleh hunian layak. Akan tetapi, pelaksanaan program tersebut di Daerah Istimewa Yogyakarta (DIY) masih menghadapi hambatan besar. Tingginya harga tanah di wilayah tersebut menyebabkan pembangunan rumah subsidi masih sulit dilakukan.

Harga tanah di DIY yang terus meningkat membuat pengembangan kesulitan membangun rumah subsidi sesuai ketentuan pemerintah. Harga rumah subsidi di Pulau Jawa masih dibatasi sekitar Rp166 juta per unit, sedangkan harga tanah di DIY rata-rata telah melampaui Rp500.000,- per meter persegi. Kondisi tersebut menyebabkan banyak pengembangan tidak mampu menekan biaya pembangunan. Akibatnya, pembangunan rumah subsidi lebih banyak dilakukan di daerah seperti Gunungkidul dan Kulonprogo yang harga tanahnya masih relatif murah.

Selain mahalnya harga tanah, keterbatasan lahan perkotaan juga memperburuk keadaan. Pengembangan kawasan perbukitan tidak dapat dilakukan secara bebas karena harus mempertimbangkan dampak lingkungan. Hal tersebut membuktikan bahwa penyediaan rumah subsidi di DIY tidak hanya persoalan pembiayaan, tetapi juga berkaitan dengan ketersediaan lahan yang layak.

Pemerintah tidak dapat hanya mengandalkan pembangunan rumah tapak di atas lahan swasta. Pengembangan hunian vertikal di atas tanah milik negara perlu diprioritaskan karena dinilai lebih realistik untuk wilayah perkotaan dengan harga tanah tinggi. Selain itu, kerja sama antara pemerintah dan pengembang juga harus diperkuat agar program rumah subsidi tetap berjalan secara berkelanjutan. Pemerintah perlu menerapkan kebijakan yang lebih inovatif agar masyarakat berpenghasilan rendah tetap memiliki kesempatan memperoleh hunian yang layak, murah, dan terjangkau.

Sumber: Maya Herawati, Harian Jogja, 2026`;

    // --- BACAAN untuk soal 24-25 (puisi) ---
    const bacaan24 = `DOA ORANG SIBUK YANG 24 JAM SEHARI BERKANTOR DI PONSELNYA

        opsi: [

            rows: [

                    benar: 0 },

                    benar: 0 }

        },
        jawaban: [0, 1, 0],
        penjelasan: 'Respons "tersindir" dan "tersentuh" MUNGKIN karena puisi mengkritik kesibukan dengan ponsel dan mengajak menjaga hubungan spiritual. Respons "bangga" TIDAK MUNGKIN karena tokoh justru digambarkan lalai dalam beribadah (nomor Tuhan tak pernah disapa).'
    });

    // ─────────────────────────────────────────────
    //  RENDER ENGINE (dengan tampilan bacaan)
    // ─────────────────────────────────────────────

    let jawabanPengguna = {};
    let sudahDiperiksa = {};
    let currentIndex = 0;

    const container = document.getElementById('soalContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const periksaBtn = document.getElementById('periksaBtn');
    const resetBtn = document.getElementById('resetBtn');

    function renderSoal(index) {
        const soal = soalData[index];
        if (!soal) return;

        let html = `<div class="soal aktif" id="soal-${soal.id}">`;
        html += `<div class="soal-header">
                    <span class="soal-nomor">Soal ${soal.id}</span>
                    <span class="soal-tipe">${soal.tipe}</span>
                </div>`;

        // Tampilkan bacaan jika ada
        if (soal.bacaan) {
            html += `<div class="bacaan">${soal.bacaan.replace(/\n/g, '<br>')}</div>`;
        }

        html += `<div class="soal-teks">${soal.teks}</div>`;

        if (soal.tipe === 'Pilihan Ganda' || soal.tipe === 'Multiple') {
            const isMultiple = soal.tipe === 'Multiple';
            const inputType = isMultiple ? 'checkbox' : 'radio';
            const nameAttr = `q${soal.id}`;
            html += `<div class="opsi">`;
            soal.opsi.forEach((op, idx) => {
                const checked = (jawabanPengguna[soal.id] || []).includes(idx) ? 'checked' : '';
                const disabled = sudahDiperiksa[soal.id] ? 'disabled' : '';
                const kelasTambahan = sudahDiperiksa[soal.id] ? getKelasOpsi(soal, idx) : '';
                html += `<label class="${kelasTambahan} ${sudahDiperiksa[soal.id] ? 'disabled' : ''}">
                            <input type="${inputType}" name="${nameAttr}" value="${idx}" ${checked} ${disabled}>
                            <span>${op}</span>
                        </label>`;
            });
            html += `</div>`;
        } else if (soal.tipe === 'Tabel') {
            html += `<div class="tabel-container"><table>`;
            html += `<thead><tr><th>${soal.tabel.header[0]}</th>`;
            for (let i = 1; i < soal.tabel.header.length; i++) {
                html += `<th style="text-align:center;min-width:80px;">${soal.tabel.header[i]}</th>`;
            }
            html += `</tr></thead><tbody>`;
            const rows = soal.tabel.rows;
            rows.forEach((row, rowIdx) => {
                html += `<tr><td class="pernyataan">${row.pernyataan}</td>`;
                const cols = soal.tabel.header.length - 1;
                for (let c = 0; c < cols; c++) {
                    const isChecked = (jawabanPengguna[soal.id] || [])[rowIdx] === c;
                    const disabled = sudahDiperiksa[soal.id] ? 'disabled' : '';
                    html += `<td style="text-align:center;">
                                <label style="cursor:${sudahDiperiksa[soal.id]?'default':'pointer'};">
                                    <input type="radio" name="tbl_${soal.id}_${rowIdx}" value="${c}" 
                                           ${isChecked?'checked':''} ${disabled}
                                           style="accent-color:#3b82f6;width:16px;height:16px;">
                                </label>
                            </td>`;
                }
                html += `</tr>`;
            });
            html += `</tbody></table></div>`;
        }

        // jawaban box
        const showJawaban = sudahDiperiksa[soal.id] || false;
        html += `<div class="jawaban-box ${showJawaban ? 'muncul' : ''}" id="jawabanBox-${soal.id}">`;
        html += `<div class="j-kunci">🔑 Kunci Jawaban: <span>${formatJawaban(soal)}</span></div>`;
        html += `<div class="j-penjelasan">${soal.penjelasan || '—'}</div>`;
        html += `</div>`;

        html += `</div>`;
        container.innerHTML = html;

        // event listener untuk radio/checkbox
        if (soal.tipe === 'Pilihan Ganda' || soal.tipe === 'Multiple') {
            const inputs = container.querySelectorAll(`input[name="q${soal.id}"]`);
            inputs.forEach(inp => {
                inp.addEventListener('change', function() {
                    if (sudahDiperiksa[soal.id]) return;
                    const key = soal.id;
                    if (soal.tipe === 'Multiple') {
                        const checked = [...container.querySelectorAll(`input[name="q${key}"]:checked`)].map(
                            el => parseInt(el.value));
                        jawabanPengguna[key] = checked;
                    } else {
                        const val = parseInt(this.value);
                        jawabanPengguna[key] = [val];
                    }
                    updateProgress();
                });
            });
        } else if (soal.tipe === 'Tabel') {
            const radios = container.querySelectorAll('input[type="radio"]');
            radios.forEach(r => {
                r.addEventListener('change', function() {
                    if (sudahDiperiksa[soal.id]) return;
                    const key = soal.id;
                    const name = this.name;
                    const rowIdx = parseInt(name.split('_')[2]);
                    const val = parseInt(this.value);
                    if (!jawabanPengguna[key]) jawabanPengguna[key] = [];
                    jawabanPengguna[key][rowIdx] = val;
                    updateProgress();
                });
            });
        }

        if (sudahDiperiksa[soal.id]) {
            container.querySelectorAll('input').forEach(el => el.disabled = true);
            container.querySelectorAll('.opsi label').forEach((label, idx) => {
                const kelas = getKelasOpsi(soal, idx);
                if (kelas) label.classList.add(kelas);
            });
        }

        updateProgress();
        updateNavButtons(index);
    }

    function getKelasOpsi(soal, idx) {
        if (!sudahDiperiksa[soal.id]) return '';
        const benar = soal.jawaban || [];
        const user = jawabanPengguna[soal.id] || [];
        const isBenar = benar.includes(idx);
        const isDipilih = user.includes(idx);
        if (isBenar) return 'benar';
        if (isDipilih && !isBenar) return 'salah';
        return 'tidak-dipilih';
    }

    function formatJawaban(soal) {
        if (soal.tipe === 'Pilihan Ganda') {
            const idx = soal.jawaban[0];
            return soal.opsi[idx] ? soal.opsi[idx].substring(0, 3) : '—';
        } else if (soal.tipe === 'Multiple') {
            return soal.jawaban.map(i => soal.opsi[i] ? soal.opsi[i].substring(0, 3) : '').join(', ');
        } else if (soal.tipe === 'Tabel') {
            const header = soal.tabel.header.slice(1);
            return soal.jawaban.map(v => header[v] || '—').join(' | ');
        }
        return '—';
    }

    function updateProgress() {
        let terjawab = 0;
        soalData.forEach(s => {
            const user = jawabanPengguna[s.id] || [];
            if (s.tipe === 'Tabel') {
                const totalRow = s.tabel.rows.length;
                let filled = 0;
                for (let i = 0; i < totalRow; i++) {
                    if (user[i] !== undefined && user[i] !== null && user[i] !== '') filled++;
                }
                if (filled === totalRow) terjawab++;
            } else {
                if (user.length > 0) terjawab++;
            }
        });
        const total = soalData.length;
        const pct = Math.round((terjawab / total) * 100);
        progressBar.style.width = pct + '%';
        progressText.textContent = `${terjawab} / ${total} terjawab`;
    }

    function updateNavButtons(index) {
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === soalData.length - 1;
    }

    function goTo(index) {
        if (index < 0 || index >= soalData.length) return;
        currentIndex = index;
        renderSoal(index);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
    nextBtn.addEventListener('click', () => goTo(currentIndex + 1));

    periksaBtn.addEventListener('click', function() {
        const soal = soalData[currentIndex];
        if (!soal) return;
        const user = jawabanPengguna[soal.id] || [];
        if (soal.tipe === 'Tabel') {
            const totalRow = soal.tabel.rows.length;
            let filled = 0;
            for (let i = 0; i < totalRow; i++) {
                if (user[i] !== undefined && user[i] !== null && user[i] !== '') filled++;
            }
            if (filled < totalRow) {
                alert('Silakan isi semua pilihan pada tabel terlebih dahulu.');
                return;
            }
        } else {
            if (user.length === 0) {
                alert('Silakan pilih jawaban terlebih dahulu.');
                return;
            }
        }
        sudahDiperiksa[soal.id] = true;
        renderSoal(currentIndex);
        const box = document.getElementById(`jawabanBox-${soal.id}`);
        if (box) box.classList.add('muncul');
        updateProgress();
    });

    resetBtn.addEventListener('click', function() {
        if (!confirm('Reset semua jawaban untuk soal ini?')) return;
        const soal = soalData[currentIndex];
        delete jawabanPengguna[soal.id];
        delete sudahDiperiksa[soal.id];
        renderSoal(currentIndex);
        updateProgress();
    });

    renderSoal(0);
    updateProgress();
</script>
</body>
</html>
