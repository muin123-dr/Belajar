<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz TKA Bahasa Inggris - Pemahaman Teks (Pusmendik)</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --success: #10b981;
    --success-bg: #d1fae5;
    --error: #ef4444;
    --error-bg: #fee2e2;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #1f2937;
    --text-light: #6b7280;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  
  body {
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 20px;
    min-height: 100vh;
  }

  .container {
    max-width: 850px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    padding: 30px 20px;
    text-align: center;
  }

  .header h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .header p { opacity: 0.9; font-size: 0.95rem; }

  .progress-container {
    background: #e5e7eb;
    height: 8px;
    width: 100%;
  }

  .progress-bar {
    background: var(--success);
    height: 100%;
    width: 0%;
    transition: width 0.4s ease;
  }

  .quiz-body { padding: 25px; }

  .passage-box {
    background: #f8fafc;
    border-left: 4px solid var(--primary);
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 25px;
    font-size: 0.95rem;
    color: #334155;
    max-height: 400px;
    overflow-y: auto;
    line-height: 1.7;
    position: sticky;
    top: 10px;
    z-index: 10;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }

  .passage-box h3 {
    font-size: 1.1rem;
    color: var(--primary-dark);
    margin-bottom: 15px;
    position: sticky;
    top: 0;
    background: #f8fafc;
    padding-bottom: 10px;
    border-bottom: 1px solid #e2e8f0;
    z-index: 11;
  }

  .passage-box img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
    border: 1px solid #e2e8f0;
  }

  .question-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .q-number {
    background: var(--primary);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .q-type {
    font-size: 0.8rem;
    color: var(--text-light);
    font-style: italic;
    background: #eef2ff;
    padding: 4px 10px;
    border-radius: 12px;
  }

  .question-text {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--text);
  }

  .options { display: flex; flex-direction: column; gap: 12px; }

  .option {
    background: white;
    border: 2px solid #e2e8f0;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 0.95rem;
  }

  .option:hover:not(.disabled) {
    border-color: var(--primary);
    background: #eef2ff;
  }

  .option.selected {
    border-color: var(--primary);
    background: #eef2ff;
    box-shadow: 0 0 0 1px var(--primary);
  }

  .option .letter {
    background: #e2e8f0;
    color: var(--text);
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 0.85rem;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .option.selected .letter {
    background: var(--primary);
    color: white;
  }

  .option.correct {
    background: var(--success-bg);
    border-color: var(--success);
    color: #065f46;
  }
  .option.correct .letter { background: var(--success); color: white; }

  .option.wrong {
    background: var(--error-bg);
    border-color: var(--error);
    color: #991b1b;
  }
  .option.wrong .letter { background: var(--error); color: white; }

  .option.disabled { cursor: default; opacity: 0.9; }

  .feedback {
    margin-top: 25px;
    padding: 20px;
    border-radius: 10px;
    display: none;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback.correct { background: var(--success-bg); border-left: 5px solid var(--success); }
  .feedback.wrong { background: var(--error-bg); border-left: 5px solid var(--error); }

  .feedback-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; }
  .feedback.correct .feedback-title { color: #065f46; }
  .feedback.wrong .feedback-title { color: #991b1b; }

  .explanation {
    background: white;
    padding: 15px;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: #374151;
  }

  .explanation strong { color: var(--primary-dark); }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; }

  .result-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }

  .score-circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: conic-gradient(var(--primary) 0deg, #e5e7eb 0deg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px auto;
    position: relative;
  }

  .score-inner {
    width: 120px;
    height: 120px;
    background: white;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .score-value { font-size: 2.5rem; font-weight: bold; color: var(--primary); }
  .score-label { font-size: 0.9rem; color: var(--text-light); }

  .result-message {
    background: #f8fafc;
    padding: 20px;
    border-radius: 10px;
    margin: 20px 0;
    color: var(--text);
    line-height: 1.6;
  }

  @media (max-width: 600px) {
    .quiz-body { padding: 15px; }
    .passage-box { max-height: 300px; font-size: 0.9rem; padding: 15px; }
    .question-text { font-size: 1rem; }
    .option { padding: 12px; font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="container">

  </div>

      </div>

    <button class="btn" onclick="restartQuiz()" style="max-width: 300px; margin: 0 auto;">🔄 Ulangi Quiz</button>
  </div>
</div>

<script>
const texts = {
  teks1: `<h3>TEKS 1 — King Hung Vuong VI</h3>King Hung Vuong VI had a beautiful daughter. He did not want her to marry just any prince. So, he made an announcement that he was looking for the right husband for her. Many princes came from faraway lands, but none of them was a good match for the princess.<br><br>Son Tinh was the Spirit of the Mountain, and Thuy Tinh was the Spirit of the Waters. One day, they both appeared as young noblemen and asked to marry the princess. They were equally talented, powerful, and respected. The King found it hard to choose, so he decided to give them a test. He said that the one who brought the proper wedding gifts first the next morning would marry his daughter.<br><br>The next day, Son Tinh arrived early with his gifts. The King kept his promise and gave the princess to him. Thuy Tinh was angry about losing. He challenged Son Tinh to fight for the princess. But Son Tinh refused, believing he had already won fairly. Furious, Thuy Tinh used his power to call the rivers and streams to rise. Soon, the land was covered with floods that destroyed crops and homes.<br><br>Son Tinh stayed calm in his mountain palace. Whenever the water rose, he made his mountains higher. After many days of fighting, Thuy Tinh grew tired and ordered the waters to retreat. Still, he never accepted his defeat. Every year, he tried again to attack, and this is how monsoons came to Vietnam.`,
  
  teks2: `<h3>TEKS 2 — Infografik Perpustakaan</h3><img src="https://muin123-dr.github.io/Belajar/TKA/gbr/B-Ing004.png" alt="Infografik Perpustakaan" style="width: 100%; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #e2e8f0;">`,
  
  teks3: `<h3>TEKS 3 — Exploring Bali's Natural Wonders</h3>Bali, a beautiful island in Indonesia, is known for its stunning landscapes and rich culture. While many come for the beaches and temples, the island also offers natural attractions that amaze nature lovers from around the world. From national parks and waterfalls to terraced rice fields, Bali is full of natural beauty.<br><br>In the west lies West Bali National Park, a peaceful area filled with green forests, calm mangrove swamps, and colorful coral reefs along the sea. The air is fresh, and the scenery feels untouched. One of the park’s most special sights is the Bali Starling—a rare white bird with bright blue around its eyes. Its soft song adds magic to the quiet forest. Visitors can walk along clear paths and enjoy the rich variety of plants and animals in this protected area.<br><br>Heading north, travelers find the scenic Munduk Waterfall, surrounded by green hills and forests. Water flows gently over rocky cliffs into a cool clear pool. Mist rises into the air, mixing with the calming sound of falling water. The walk to the waterfall passes through narrow paths lined with coffee and clove trees. Their fresh scent fills the air, offering a pleasant and peaceful experience. Munduk is the perfect place to relax and enjoy Bali’s natural charm.<br><br>Near the cultural center Ubud, the famous Tegalalang rice terraces stretch across the hills in green steps. These terraces are shaped by generations of farmers who work the land by hand. In the morning, mist rises above the fields, and sunlight reflects off the water in the paddies. Farmers in wide-brimmed hats plant rice carefully, their feet sinking into the soft earth. Water flows gently through small canals, keeping the fields healthy and green. The quiet surroundings and slow rhythm of farm life create a peaceful and inspiring scene.<br><br>These natural wonders highlight Bali's dedication in preserving its environmental and cultural treasures. By exploring these sites, tourists not only experience the island's scenic beauty but also support ongoing conservation efforts, helping to ensure that Bali's wonders last for future generations.`,
  
  teks4: `<h3>TEKS 4 — My Experience as an Intern at a Sports Club</h3>Last summer, I had the opportunity to work as an intern at a local sports club. It was my first time working in a professional sports environment, and I was both nervous and excited. The internship went through a few phases, starting from orientation until finally jumping in to help during practices and games.<br><br>On my first day, I met the head coach, who welcomed me and explained my tasks. I had to set up cones for drills, bring water for the players, and check the training schedules. The first few days were challenging because I was not used to the morning routine. Every morning I had to wake up early, arrive on time, and follow instructions carefully. I worried about making mistakes, but the coaches were kind and guided me.<br><br>In the second month of my internship, I was trained to handle emergency situations. I got the chance to put that knowledge into practice when something unexpected happened. During football practice, a player fell and hurt his ankle. Everyone stopped, and I quickly ran to get the first aid kit. I helped the coach assess the injury and ensured the player stayed calm while we got him seated safely. Luckily, it wasn’t serious, but the experience reinforced an important lesson: staying alert and prepared during emergencies can make a big difference.<br><br>At the end of my internship, the coaches held an evaluation and reflection session where they shared the results of their feedback. They highlighted my strengths in teamwork, responsibility, and communication, and even gave me a club T-shirt as a gift. I felt proud because I had improved in these areas. It was a great experience, and I hope to work in a sports club again in the future.`,
  
  teks5: `<h3>TEKS 5 — Social Media Harms Teen Mental Health</h3>In today’s world, social media is a big part of many teenagers’ daily lives. While it has some benefits, such as staying connected with friends, meeting new people, and learning about interesting topics, it also brings serious problems. I strongly believe that social media harms teen mental health, and we must pay more attention to this issue before it becomes even worse.<br><br>First, social media often makes teenagers compare themselves to others in an unhealthy way. When teens see pictures of people who seem perfect, they feel that they are not good enough. These feelings can lower self-esteem and lead to sadness, anxiety, or even depression. The problem is that many of these online posts are edited, filtered, or fake, but teens still feel pressure to look or live the same way. They may think that their own life is boring or not successful, which is simply not true.<br><br>Second, too much time on social media affects sleep and study habits. Many teenagers use their phones late at night, checking messages or watching videos, which reduces sleep time and quality. Without enough sleep, teens cannot focus well in class, and their grades may suffer. This can increase stress and worry about the future, making them feel overwhelmed.<br><br>Finally, online bullying, or cyberbullying, is another serious danger. Unlike face-to-face bullying, it can happen at any time and be shared with many people. Victims of cyberbullying often feel alone, scared, and helpless, and in some cases, it leads to serious mental health problems.<br><br>In conclusion, although social media has some good uses, its harm to teen mental health is much greater. Teenagers need support from parents, teachers, and society to use it wisely. Schools should teach students how to use social media in healthy ways, and parents should guide their children to take breaks and spend time offline. By doing this, we can help protect young people’s mental health in this digital age.`
};

let currentQuestion = 0;
let score = 0;
let selectedOptions = [];

function renderQuestion() {
  const q = questions[currentQuestion];
  const quizBody = document.getElementById('quizBody');
  
  let passageHTML = '';
  if (q.passage) {
    passageHTML = `<div class="passage-box">${q.passage}</div>`;
  }

  let optionsHTML = '';
  const letters = ['A', 'B', 'C', 'D', 'E'];
  
  q.options.forEach((opt, idx) => {
    optionsHTML += `
      <div class="option" onclick="toggleOption(${idx})" data-idx="${idx}">
        <span class="letter">${letters[idx]}</span>
        <span>${opt}</span>
      </div>
    `;
  });

  const typeText = q.isMultiple ? '📌 Pilih semua jawaban yang benar (PGK)' : '📌 Pilih satu jawaban yang paling tepat';

  quizBody.innerHTML = `
    ${passageHTML}
    <div class="question-meta">
      <span class="q-number">Soal ${currentQuestion + 1} / ${questions.length}</span>
      <span class="q-type">${typeText}</span>
    </div>
    <div class="question-text">${q.question}</div>
    <div class="options" id="optionsContainer">
      ${optionsHTML}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="btn" id="checkBtn" onclick="checkAnswer()" disabled>✅ Cek Jawaban</button>
    <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display: none; background: #10b981;">➡️ Soal Berikutnya</button>
  `;

  document.getElementById('progressBar').style.width = `${((currentQuestion) / questions.length) * 100}%`;
  selectedOptions = [];
}

function toggleOption(idx) {
  const q = questions[currentQuestion];
  const options = document.querySelectorAll('.option');
  
  if (document.getElementById('checkBtn').disabled === false) return; // Sudah di-check

  if (!q.isMultiple) {
    selectedOptions = [idx];
    options.forEach(opt => opt.classList.remove('selected'));
    options[idx].classList.add('selected');
  } else {
    if (selectedOptions.includes(idx)) {
      selectedOptions = selectedOptions.filter(i => i !== idx);
      options[idx].classList.remove('selected');
    } else {
      selectedOptions.push(idx);
      options[idx].classList.add('selected');
    }
  }

  document.getElementById('checkBtn').disabled = selectedOptions.length === 0;
}

function checkAnswer() {
  const q = questions[currentQuestion];
  const options = document.querySelectorAll('.option');
  const feedback = document.getElementById('feedback');
  const letters = ['A', 'B', 'C', 'D', 'E'];

  // Disable further clicks
  options.forEach(opt => opt.classList.add('disabled'));
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'block';

  // Check correctness
  const isCorrect = q.isMultiple 
    ? (q.correct.length === selectedOptions.length && q.correct.every(val => selectedOptions.includes(val)))
    : (q.correct[0] === selectedOptions[0]);

  if (isCorrect) {
    score++;
    feedback.className = 'feedback correct';
    feedback.innerHTML = `<div class="feedback-title">✅ Benar! Hebat!</div>`;
  } else {
    feedback.className = 'feedback wrong';
    feedback.innerHTML = `<div class="feedback-title">❌ Kurang Tepat</div>`;
  }

  // Highlight correct and wrong
  options.forEach((opt, idx) => {
    if (q.correct.includes(idx)) {
      opt.classList.add('correct');
    } else if (selectedOptions.includes(idx) && !q.correct.includes(idx)) {
      opt.classList.add('wrong');
    }
  });

  const correctText = q.correct.map(i => `${letters[i]}. ${q.options[i]}`).join('<br>');
  
  feedback.innerHTML += `
    <div class="explanation">
      <strong>Kunci Jawaban:</strong><br>${correctText}<br><br>
      <strong>Pembahasan:</strong><br>${q.explanation}
    </div>
  `;
  
  feedback.style.display = 'block';
  
  // Scroll to feedback
  setTimeout(() => {
    feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= questions.length) {
    showResult();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showResult() {
  document.getElementById('quizBody').style.display = 'none';
  document.querySelector('.progress-container').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  
  const percentage = (score / questions.length) * 100;
  const degrees = (percentage / 100) * 360;
  
  document.getElementById('finalScore').textContent = score;
  document.getElementById('scoreCircle').style.background = `conic-gradient(var(--primary) ${degrees}deg, #e5e7eb ${degrees}deg)`;
  
  let message = '';
  if (percentage >= 85) message = "🌟 <strong>Luar Biasa!</strong> Pemahaman membaca kamu sangat baik. Kamu siap menghadapi soal TKA level tinggi!";
  else if (percentage >= 70) message = "👏 <strong>Bagus Sekali!</strong> Kamu sudah menguasai sebagian besar konsep. Tingkatkan lagi ketelitian dalam membaca detail teks.";
  else if (percentage >= 50) message = "💪 <strong>Cukup Baik.</strong> Terus berlatih! Fokus pada strategi skimming, scanning, dan inferensi untuk meningkatkan skor.";
  else message = "📚 <strong>Perlu Latihan Lagi.</strong> Jangan menyerah! Pelajari kembali cara menemukan ide pokok, detail spesifik, dan makna tersirat dalam teks.";
  
  document.getElementById('resultMessage').innerHTML = `
    <strong>Skor Kamu: ${score} / ${questions.length} (${percentage.toFixed(0)}%)</strong><br><br>
    ${message}
  `;
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
  currentQuestion = 0;
  score = 0;
  document.getElementById('quizBody').style.display = 'block';
  document.querySelector('.progress-container').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize
renderQuestion();
</script>
