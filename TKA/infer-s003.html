                    "Adapting to community needs can help traditional businesses survive competition.",
                    "Book clubs are the only way to attract customers.",
                    "The owner was lucky that the strategy worked."
                ],
                correct: 2,
                explanation: "Strategi: menghadapi kompetisi online → transformasi menjadi community hub → hasil: foot traffic naik 200%, profitable again. Inferensi: adapting to community needs → survive competition. Ini menunjukkan adaptasi sebagai kunci keberhasilan."
            }
        ];

        let score = 0;
        let totalAnswered = 0;
        const totalQuestions = quizData.length;

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${item.id}`;

                let optionsHTML = '';
                const letters = ['A', 'B', 'C', 'D', 'E'];
                item.options.forEach((opt, optIndex) => {
                    optionsHTML += `
                        <li class="option" data-question="${item.id}" data-option="${optIndex}" onclick="selectAnswer(${item.id}, ${optIndex})">
                            <span class="option-letter">${letters[optIndex]}</span>
                            <span>${opt}</span>
                        </li>
                    `;
                });

                card.innerHTML = `
                    <span class="question-number">Soal ${index + 1}</span>
                    <span class="question-type">${item.type}</span>
                    <div class="passage">${item.passage}</div>
                    <div class="question-text">${item.question}</div>
                    <ul class="options">
                        ${optionsHTML}
                    </ul>
                    <div class="notification" id="notification-${item.id}"></div>
                    <div class="explanation" id="explanation-${item.id}">
                        <h4>📖 Kunci Jawaban & Penjelasan:</h4>
                        <p><strong>Jawaban: <span class="key-answer">${letters[item.correct]}. ${item.options[item.correct]}</span></strong></p>
                        <p style="margin-top: 10px;">${item.explanation}</p>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function selectAnswer(questionId, selectedOption) {
            const question = quizData.find(q => q.id === questionId);
            const options = document.querySelectorAll(`[data-question="${questionId}"]`);
            const notification = document.getElementById(`notification-${questionId}`);
            const explanation = document.getElementById(`explanation-${questionId}`);

            // Check if already answered
            if (options[0].classList.contains('disabled')) return;

            // Disable all options
            options.forEach(opt => opt.classList.add('disabled'));

            // Mark correct and wrong
            const correctIndex = question.correct;
            options[correctIndex].classList.add('correct');

            if (selectedOption === correctIndex) {
                // Correct answer
                score++;
                notification.className = 'notification correct';
                notification.innerHTML = '✅ BENAR! Hebat!';
            } else {
                // Wrong answer
                options[selectedOption].classList.add('wrong');
                notification.className = 'notification wrong';
                notification.innerHTML = '❌ SALAH! Lihat penjelasan di bawah.';
            }

            // Show explanation
            explanation.classList.add('show');

            // Update score
            totalAnswered++;
            updateScore();
        }

        function updateScore() {
            document.getElementById('currentScore').textContent = score;
            document.getElementById('totalAnswered').textContent = totalAnswered;
            const progress = (totalAnswered / totalQuestions) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function resetQuiz() {
            score = 0;
            totalAnswered = 0;
            updateScore();
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize quiz
        renderQuiz();
    </script>
</body>
</html>
