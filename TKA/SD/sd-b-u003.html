<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan TKA 2026 ke-3 - TKA Bahasa Indonesia SD</title>
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-light: #a29bfe;
            --secondary: #fd79a8;
            --success: #00b894;
            --success-bg: #e0f7f1;
            --danger: #e17055;
            --danger-bg: #fdf0ed;
            --warning: #fdcb6e;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #2d3436;
            --text-light: #636e72;
            --border: #dfe6e9;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --radius-sm: 12px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Poppins', 'Comic Sans MS', 'Arial Rounded MT Bold', system-ui, sans-serif;
            background: linear-gradient(135deg, #dfe6e9 0%, #f8f9fa 30%, #e8e0f0 60%, #fce4ec 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text);
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
        }
        .quiz-container {
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }
        .quiz-header {
            background: linear-gradient(135deg, #6C5CE7 0%, #a29bfe 50%, #fd79a8 100%);
            border-radius: var(--radius);
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .quiz-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            animation: float-bg 8s ease-in-out infinite;
        }
        @keyframes float-bg {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(10%, 10%);
            }
        }
        .quiz-header h1 {
            font-size: 1.6rem;
            color: #fff;
            position: relative;
            z-index: 1;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .quiz-header .subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 1;
            font-weight: 500;
        }
        .header-emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
            animation: bounce-emoji 2s ease-in-out infinite;
        }
        @keyframes bounce-emoji {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            box-shadow: var(--shadow);
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
            flex: 1;
            justify-content: center;
            min-width: 80px;
            border: 2px solid var(--border);
        }
        .stat-item .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }
        .progress-container {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 10px 15px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 2px solid var(--border);
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 6px;
        }
        .progress-bar {
            height: 10px;
            background: #e9ecef;
            border-radius: 50px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6C5CE7, #a29bfe, #fd79a8);
            border-radius: 50px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .question-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 25px 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 2px solid var(--border);
            animation: fadeInUp 0.35s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 50px;
            margin-bottom: 10px;
        }
        .reading-text {
            background: #f8f9fa;
            border-left: 4px solid var(--primary-light);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 15px;
            font-style: italic;
            font-size: 0.9rem;
            color: #4a5568;
            line-height: 1.7;
            max-height: 220px;
            overflow-y: auto;
            position: relative;
        }
        .reading-text::before {
            content: '📖';
            position: absolute;
            top: -10px;
            left: -8px;
            font-size: 1.2rem;
            font-style: normal;
        }
        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text);
            line-height: 1.6;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-radius: var(--radius-sm);
            border: 3px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: left;
            transition: all 0.25s ease;
            color: var(--text);
            font-family: inherit;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .option-btn:hover {
            border-color: var(--primary-light);
            background: #f8f0ff;
            transform: translateX(3px);
        }
        .option-btn .option-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.95rem;
            background: #f1f2f6;
            color: var(--text);
            transition: all 0.25s;
        }
        .option-btn.selected {
            border-color: var(--primary);
            background: #f0edff;
        }
        .option-btn.selected .option-letter {
            background: var(--primary);
            color: #fff;
        }
        .option-btn.correct-reveal {
            border-color: var(--success);
            background: var(--success-bg);
        }
        .option-btn.correct-reveal .option-letter {
            background: var(--success);
            color: #fff;
        }
        .option-btn.wrong-reveal {
            border-color: var(--danger);
            background: var(--danger-bg);
        }
        .option-btn.wrong-reveal .option-letter {
            background: var(--danger);
            color: #fff;
        }
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .bs-statement {
            background: #fafafa;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-bottom: 10px;
        }
        .bs-statement p {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .bs-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .bs-btn {
            padding: 6px 16px;
            border-radius: 50px;
            border: 2px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.25s;
            font-family: inherit;
        }
        .bs-btn.selected {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .bs-btn.correct-reveal {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .bs-btn.wrong-reveal {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .bs-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .check-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: #fff;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        .check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.3);
        }
        .check-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .feedback {
            margin-top: 15px;
            padding: 15px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            display: none;
            animation: fadeInUp 0.3s ease;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background: var(--success-bg);
            border: 3px solid var(--success);
            color: #008f6b;
        }
        .feedback.wrong {
            background: var(--danger-bg);
            border: 3px solid var(--danger);
            color: #c0392b;
        }
        .answer-key {
            margin-top: 10px;
            padding: 15px 18px;
            background: #fff8e1;
            border: 3px dashed #fdcb6e;
            border-radius: var(--radius-sm);
            display: none;
            animation: fadeInUp 0.3s ease;
        }
        .answer-key.show {
            display: block;
        }
        .answer-key .ak-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: #6d4c41;
            margin-bottom: 6px;
        }
        .answer-key .ak-content {
            font-size: 0.88rem;
            color: #4a5568;
            line-height: 1.7;
        }
        .answer-key .ak-content strong {
            color: var(--primary);
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 11px 22px;
            border-radius: 50px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn.prev {
            background: #f1f2f6;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .nav-btn.next {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: #fff;
            border: 2px solid var(--primary);
            display: none;
        }
        .nav-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .result-screen {
            text-align: center;
            padding: 30px 20px;
            animation: fadeInUp 0.5s ease;
        }
        .result-emoji {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce-emoji 1.5s ease-in-out infinite;
        }
        .result-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .result-message {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .wa-btn {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 50px;
            background: #25D366;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s;
            font-family: inherit;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .wa-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4);
        }
        .retry-btn {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 50px;
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .retry-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
        }
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
            display: none;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confetti-fall 3s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .quiz-header h1 {
                font-size: 1.2rem;
            }
            .question-card {
                padding: 18px 14px;
            }
            .question-text {
                font-size: 0.95rem;
            }
            .option-btn {
                padding: 11px 13px;
                font-size: 0.88rem;
                gap: 8px;
            }
            .option-btn .option-letter {
                width: 28px;
                height: 28px;
                min-width: 28px;
                font-size: 0.85rem;
            }
            .reading-text {
                font-size: 0.82rem;
                padding: 10px 12px;
            }
            .check-btn {
                padding: 12px 16px;
                font-size: 0.9rem;
            }
            .nav-btn {
                padding: 9px 16px;
                font-size: 0.82rem;
            }
            .stat-item {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
            .stat-item .stat-value {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="confetti-container" id="confetti-container"></div>
    <div class="quiz-container" id="quiz-container">
        <div class="quiz-header">
            <span class="header-emoji">📝🏆🌟</span>
            <h1>Latihan TKA 2026 ke-3</h1>
            <p class="subtitle">50 Soal • TKA Bahasa Indonesia SD</p>
        </div>
        <div class="stats-bar">
            <div class="stat-item">📝 Soal: <span class="stat-value" id="current-q-num">1</span>/50</div>
            <div class="stat-item">✅ Benar: <span class="stat-value" id="correct-count">0</span></div>
            <div class="stat-item">❌ Salah: <span class="stat-value" id="wrong-count">0</span></div>
            <div class="stat-item">⭐ Skor: <span class="stat-value" id="score-val">0</span></div>
        </div>
        <div class="progress-container">
            <div class="progress-label"><span>📊 Progres</span><span id="progress-pct">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <div class="question-card" id="question-card">
            <span class="question-number" id="q-number">Soal No. 1</span>
            <div class="reading-text" id="q-reading" style="display:none;"></div>
            <div class="question-text" id="q-text"></div>
            <div class="options-container" id="options-container"></div>
            <button class="check-btn" id="check-btn" disabled>Cek Jawaban ✅</button>
            <div class="feedback" id="feedback"></div>
            <div class="answer-key" id="answer-key"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" id="btn-prev" disabled>⬅️ Sebelumnya</button>
                <button class="nav-btn next" id="btn-next">Soal Berikutnya ➡️</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                type: 'benarsalah',
                reading: 'Suatu hari, seekor merpati melihat ada seekor semut yang terjatuh ke sungai. Semut itu berjuang sangat keras untuk berenang supaya tidak tenggelam, namun ia nampaknya akan segera tenggelam. Merpati segera memetik sehelai daun dari pohon yang ada di dekatnya dan menjatuhkannya ke sungai, dekat dengan si semut. Semut pun merangkak ke atas daun tersebut. Daun itu kemudian terbawa arus dan mendarat di tepian sungai. Semut pun selamat. Beberapa waktu kemudian, seorang pemburu burung datang ke hutan dan hendak menangkap merpati tersebut. Semut yang melihat itu segera merayap ke arah kaki pemburu dan menggigitnya dengan keras. Pemburu merasa kesakitan dan berteriak, yang membuat merpati terkejut dan segera terbang menyelamatkan diri. Merpati pun selamat dari ancaman pemburu berkat bantuan semut.',
                question: 'Berdasarkan bacaan di atas, pelajaran apa yang bisa kita terapkan dalam kehidupan sehari-hari? Tentukan sesuai atau tidak sesuai!',
                statements: [
                    { text: 'Kita harus saling tolong menolong tanpa mengharapkan balasan', correct: true },
                    { text: 'Kita boleh membiarkan teman kesulitan agar ia belajar mandiri', correct: false },
                    { text: 'Kebaikan akan dibalas dengan kebaikan', correct: true }
                ],
                explanation: 'Cerita semut dan merpati mengajarkan kita untuk saling tolong-menolong. Merpati menolong semut, lalu semut menolong merpati. Kita tidak boleh membiarkan teman kesulitan karena kebaikan akan dibalas dengan kebaikan.'
            },
            {
                type: 'multi',
                reading: 'Berdasarkan teks persahabatan semut dan merpati, latar tempat cerita teks tersebut ada di mana saja?',
                question: 'Pilih semua jawaban yang benar!',
                options: ['Di sungai', 'Di dalam rumah pemburu', 'Di hutan', 'Di atas pohon'],
                correct: [0, 2],
                explanation: 'Latar tempat dalam cerita adalah di sungai (semut terjatuh) dan di hutan (pemburu datang). Di dalam rumah pemburu tidak disebutkan, dan di atas pohon hanya disebutkan merpati memetik daun.'
            },
            {
                type: 'multi',
                reading: 'Dokter Dara sedang memeriksa pasien di ruang praktiknya. Ia menggunakan stetoskop untuk mendengarkan detak jantung pasien. Setelah itu, ia menulis resep obat dan menjelaskan cara minumnya. Pasien pun mengucapkan terima kasih dan pulang.',
                question: 'Berdasarkan bacaan di atas, pilihlah semua kosakata yang sering digunakan pada bidang kesehatan!',
                options: ['Stetoskop', 'Pasien', 'Menulis', 'Resep obat'],
                correct: [0, 1, 3],
                explanation: 'Kosakata bidang kesehatan meliputi stetoskop, pasien, dan resep obat. "Menulis" adalah kata umum, bukan kosakata khusus bidang kesehatan.'
            },
            {
                type: 'benarsalah',
                reading: 'Hewan Pemakan Daun, Apa itu?\nHewan pemakan tumbuhan sering disebut herbivora. Namun, ada pengelompokan yang lebih khusus. Hewan pemakan daging disebut karnivora, sedangkan hewan pemakan segala disebut omnivora. Ternyata ada pula hewan yang hanya memakan daun saja. Hewan pemakan daun disebut sebagai folivora. Folivora umumnya memiliki usus yang sangat panjang dan proses metabolisme yang lambat. Hal ini dikarenakan daun seringkali sulit untuk dicerna. Karena metabolisme yang lambat, folivora merupakan hewan yang tidak aktif atau malas bergerak.',
                question: 'Berdasarkan teks di atas, hewan folivora memiliki beberapa ciri khusus. Tentukan sesuai atau tidak sesuai!',
                statements: [
                    { text: 'Folivora merupakan hewan yang geraknya sangat aktif', correct: false },
                    { text: 'Folivora memiliki usus yang panjang', correct: true },
                    { text: 'Folivora hanya memakan daging', correct: false }
                ],
                explanation: 'Folivora adalah hewan pemakan daun yang memiliki usus panjang dan metabolisme lambat sehingga malas bergerak. Folivora tidak aktif dan tidak makan daging.'
            },
            {
                type: 'benarsalah',
                reading: 'Humus si Penyubur Tanah\nHumus berasal dari tumbuhan dan hewan yang membusuk. Humus merupakan jenis tanah yang paling subur. Tanah ini berwarna gelap dan bertekstur gembur. Humus dapat kita buat sendiri. Caranya dengan menimbun daun-daun atau sampah organik ke dalam lubang tanah. Udara lembab akan mempercepat pembusukan. Oleh karena itu, lubang sebaiknya dibuat di bawah pohon yang rindang. Pohon yang rindang akan menahan sinar matahari sehingga lubang menjadi tetap lembab.',
                question: 'Mengapa lubang untuk membuat humus sebaiknya dibuat di bawah pohon yang rindang?',
                statements: [
                    { text: 'Karena udara lembab mempercepat pembusukan', correct: true },
                    { text: 'Karena pohon rindang menahan air hujan agar tidak membasahi daun', correct: false },
                    { text: 'Karena pohon rindang menghalangi sinar matahari langsung', correct: true }
                ],
                explanation: 'Lubang dibuat di bawah pohon rindang karena pohon rindang menghalangi sinar matahari langsung sehingga lubang tetap lembab, dan udara lembab mempercepat pembusukan. Bukan untuk menahan air hujan.'
            },
            {
                type: 'single',
                reading: 'Humus si Penyubur Tanah\n(Humas berasal dari tumbuhan dan hewan yang membusuk ...)',
                question: 'Bagan mana yang sesuai untuk menggambarkan informasi pada teks tersebut?',
                options: [
                    'Sampah organik → Pembusukan → Humus → Tanah Gembur',

        function loadQuestion(index) {
            const q = questions[index];
            const saved = userAnswers[index];
            qNumberEl.textContent = `Soal No. ${index + 1}`;
            qTextEl.textContent = q.question;
            if (q.reading && q.reading.trim() !== '') {
                qReadingEl.style.display = 'block';
                qReadingEl.textContent = q.reading;
            } else {
                qReadingEl.style.display = 'none';
            }
            optionsContainer.innerHTML = '';
            feedbackEl.className = 'feedback';
            feedbackEl.innerHTML = '';
            answerKeyEl.className = 'answer-key';
            answerKeyEl.innerHTML = '';
            checkBtn.style.display = 'block';
            btnNext.style.display = 'none';
            checkBtn.disabled = true;

            if (q.type === 'single') {
                q.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.setAttribute('data-opt-index', i);
                    btn.innerHTML = `<span class="option-letter">${optionLabels[i]}</span><span>${opt}</span>`;
                    if (saved && saved.selected === i) btn.classList.add('selected');
                    if (saved && saved.checked) {
                        btn.classList.add('disabled');
                        if (i === q.correct) btn.classList.add('correct-reveal');
                        if (saved.selected === i && !saved.correct) btn.classList.add('wrong-reveal');
                    }
                    btn.addEventListener('click', function() {
                        if (saved && saved.checked) return;
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        checkBtn.disabled = false;
                    });
                    optionsContainer.appendChild(btn);
                });
            } else if (q.type === 'multi') {
                q.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.setAttribute('data-opt-index', i);
                    btn.innerHTML = `<span class="option-letter">${optionLabels[i]}</span><span>${opt}</span>`;
                    if (saved && saved.selected.includes(i)) btn.classList.add('selected');
                    if (saved && saved.checked) {
                        btn.classList.add('disabled');
                        if (q.correct.includes(i)) btn.classList.add('correct-reveal');
                        if (saved.selected.includes(i) && !q.correct.includes(i)) btn.classList.add('wrong-reveal');
                    }
                    btn.addEventListener('click', function() {
                        if (saved && saved.checked) return;
                        btn.classList.toggle('selected');
                        checkBtn.disabled = false;
                    });
                    optionsContainer.appendChild(btn);
                });
            } else if (q.type === 'benarsalah') {
                q.statements.forEach((stmt, i) => {
                    const div = document.createElement('div');
                    div.className = 'bs-statement';
                    div.innerHTML = `
                        <p>${i + 1}. ${stmt.text}</p>
                        <div class="bs-options">
                            <button class="bs-btn bs-true" data-stmt-index="${i}" data-value="true">Benar/Sesuai</button>
                            <button class="bs-btn bs-false" data-stmt-index="${i}" data-value="false">Salah/Tidak</button>
                        </div>
                    `;
                    optionsContainer.appendChild(div);
                });
                if (saved && saved.selected) {
                    q.statements.forEach((stmt, i) => {
                        const trueBtn = optionsContainer.querySelector(`.bs-true[data-stmt-index="${i}"]`);
                        const falseBtn = optionsContainer.querySelector(`.bs-false[data-stmt-index="${i}"]`);
                        if (saved.selected[i] === true) trueBtn.classList.add('selected');
                        if (saved.selected[i] === false) falseBtn.classList.add('selected');
                    });
                }
                if (saved && saved.checked) {
                    q.statements.forEach((stmt, i) => {
                        const trueBtn = optionsContainer.querySelector(`.bs-true[data-stmt-index="${i}"]`);
                        const falseBtn = optionsContainer.querySelector(`.bs-false[data-stmt-index="${i}"]`);
                        trueBtn.classList.add('disabled');
                        falseBtn.classList.add('disabled');
                        if (stmt.correct === true) trueBtn.classList.add('correct-reveal');
                        if (stmt.correct === false) falseBtn.classList.add('correct-reveal');
                        if (saved.selected[i] === true && stmt.correct === false) trueBtn.classList.add('wrong-reveal');
                        if (saved.selected[i] === false && stmt.correct === true) falseBtn.classList.add('wrong-reveal');
                    });
                }
                optionsContainer.querySelectorAll('.bs-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (saved && saved.checked) return;
                        const stmtIdx = parseInt(this.getAttribute('data-stmt-index'));
                        const val = this.getAttribute('data-value') === 'true';
                        const siblings = optionsContainer.querySelectorAll(
                            `.bs-btn[data-stmt-index="${stmtIdx}"]`);
                        siblings.forEach(s => s.classList.remove('selected'));
                        this.classList.add('selected');
                        checkBtn.disabled = false;
                    });
                });
            }

            btnPrev.disabled = (index === 0);
            if (index === totalQuestions - 1) {
                btnNext.textContent = '🏁 Selesai & Lihat Skor';
            } else {
                btnNext.textContent = 'Soal Berikutnya ➡️';
            }
            if (saved && saved.checked) {
                checkBtn.style.display = 'none';
                btnNext.style.display = 'flex';
                if (saved.correct) {
                    feedbackEl.className = 'feedback show correct';
                    feedbackEl.innerHTML = '<span>🎉 Jawaban Anda BENAR!</span>';
                } else {
                    feedbackEl.className = 'feedback show wrong';
                    feedbackEl.innerHTML = '<span>😅 Jawaban Anda SALAH!</span>';
                }
                answerKeyEl.className = 'answer-key show';
                let correctAnswerText = '';
                if (q.type === 'single') {
                    correctAnswerText = `${optionLabels[q.correct]}. ${q.options[q.correct]}`;
                } else if (q.type === 'multi') {
                    correctAnswerText = q.correct.map(c => `${optionLabels[c]}. ${q.options[c]}`).join(' & ');
                } else if (q.type === 'benarsalah') {
                    correctAnswerText = q.statements.map((s, i) => `${i + 1}. ${s.correct ? 'Sesuai/Benar' : 'Tidak/Salah'}`).join(' | ');
                }
                answerKeyEl.innerHTML = `<div class="ak-title">🔑 Kunci Jawaban & Pembahasan:</div><div class="ak-content"><strong>Jawaban Benar:</strong> ${correctAnswerText}<br><strong>Pembahasan:</strong> ${q.explanation}</div>`;
            }
            updateStats();
            updateProgress();
        }

        function checkAnswer() {
            const q = questions[currentQuestion];
            if (userAnswers[currentQuestion] && userAnswers[currentQuestion].checked) return;
            let selected;
            let isCorrect = false;
            if (q.type === 'single') {
                const selBtn = document.querySelector('.option-btn.selected');
                if (!selBtn) return;
                selected = parseInt(selBtn.getAttribute('data-opt-index'));
                isCorrect = selected === q.correct;
                userAnswers[currentQuestion] = { selected, checked: true, correct: isCorrect };
            } else if (q.type === 'multi') {
                const selBtns = document.querySelectorAll('.option-btn.selected');
                selected = Array.from(selBtns).map(b => parseInt(b.getAttribute('data-opt-index')));
                isCorrect = selected.length === q.correct.length && selected.every(s => q.correct.includes(s));
                userAnswers[currentQuestion] = { selected, checked: true, correct: isCorrect };
            } else if (q.type === 'benarsalah') {
                selected = [];
                q.statements.forEach((stmt, i) => {
                    const selBtn = document.querySelector(`.bs-btn.selected[data-stmt-index="${i}"]`);
                    if (selBtn) selected.push(selBtn.getAttribute('data-value') === 'true');
                    else selected.push(null);
                });
                isCorrect = selected.every((s, i) => s === q.statements[i].correct);
                userAnswers[currentQuestion] = { selected, checked: true, correct: isCorrect };
            }
            if (isCorrect) score++;
            updateStats();

            if (q.type === 'single' || q.type === 'multi') {
                const allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(b => {
                    b.classList.add('disabled');
                    const idx = parseInt(b.getAttribute('data-opt-index'));
                    if (q.type === 'single' ? idx === q.correct : q.correct.includes(idx)) b.classList.add('correct-reveal');
                    if (selected.includes(idx) && !(q.type === 'single' ? idx === q.correct : q.correct.includes(idx))) b.classList.add('wrong-reveal');
                });
            } else if (q.type === 'benarsalah') {
                q.statements.forEach((stmt, i) => {
                    const trueBtn = document.querySelector(`.bs-true[data-stmt-index="${i}"]`);
                    const falseBtn = document.querySelector(`.bs-false[data-stmt-index="${i}"]`);
                    trueBtn.classList.add('disabled');
                    falseBtn.classList.add('disabled');
                    if (stmt.correct === true) trueBtn.classList.add('correct-reveal');
                    if (stmt.correct === false) falseBtn.classList.add('correct-reveal');
                    if (selected[i] === true && stmt.correct === false) trueBtn.classList.add('wrong-reveal');
                    if (selected[i] === false && stmt.correct === true) falseBtn.classList.add('wrong-reveal');
                });
            }

            if (isCorrect) {
                feedbackEl.className = 'feedback show correct';
                feedbackEl.innerHTML = '<span>🎉 Jawaban Anda BENAR! Hebat!</span>';
            } else {
                feedbackEl.className = 'feedback show wrong';
                feedbackEl.innerHTML = '<span>😅 Jawaban Anda SALAH! Jangan menyerah!</span>';
            }
            answerKeyEl.className = 'answer-key show';
            let correctAnswerText = '';
            if (q.type === 'single') {
                correctAnswerText = `${optionLabels[q.correct]}. ${q.options[q.correct]}`;
            } else if (q.type === 'multi') {
                correctAnswerText = q.correct.map(c => `${optionLabels[c]}. ${q.options[c]}`).join(' & ');
            } else if (q.type === 'benarsalah') {
                correctAnswerText = q.statements.map((s, i) => `${i + 1}. ${s.correct ? 'Sesuai/Benar' : 'Tidak/Salah'}`).join(' | ');
            }
            answerKeyEl.innerHTML = `<div class="ak-title">🔑 Kunci Jawaban & Pembahasan:</div><div class="ak-content"><strong>Jawaban Benar:</strong> ${correctAnswerText}<br><strong>Pembahasan:</strong> ${q.explanation}</div>`;
            checkBtn.style.display = 'none';
            btnNext.style.display = 'flex';
        }

        function updateStats() {
            currentQNumEl.textContent = currentQuestion + 1;
            let correct = 0,
                wrong = 0;
            Object.values(userAnswers).forEach(ans => {
                if (ans.checked) { if (ans.correct) correct++;
                    else wrong++; }
            });
            correctCountEl.textContent = correct;
            wrongCountEl.textContent = wrong;
            scoreValEl.textContent = score;
        }

        function updateProgress() {
            const pct = Math.round((currentQuestion / totalQuestions) * 100);
            progressFill.style.width = pct + '%';
            progressPct.textContent = pct + '%';
        }

        function goToNext() {
            if (currentQuestion < totalQuestions - 1) { currentQuestion++;
                loadQuestion(currentQuestion);
                window.scrollTo({ top: 0, behavior: 'smooth' }); } else { showResult(); }
        }

        function goToPrev() {
            if (currentQuestion > 0) { currentQuestion--;
                loadQuestion(currentQuestion);
                window.scrollTo({ top: 0, behavior: 'smooth' }); }
        }

        function showResult() {
            quizCompleted = true;
            const totalChecked = Object.keys(userAnswers).length;
            const correctTotal = score;
            const wrongTotal = totalChecked - correctTotal;
            const finalScore = totalQuestions > 0 ? Math.round((correctTotal / totalQuestions) * 100) : 0;
            qNumberEl.textContent = '📋 Hasil Akhir';
            qTextEl.textContent = '';
            qReadingEl.style.display = 'none';
            optionsContainer.innerHTML = '';
            checkBtn.style.display = 'none';
            btnNext.style.display = 'none';
            btnPrev.style.display = 'none';

            const resultScreen = document.createElement('div');
            resultScreen.className = 'result-screen';
            let emoji = '',
                message = '';
            if (finalScore === 100) { emoji = '🏆🎉🌟';
                message = 'LUAR BIASA! SEMPURNA!'; } else if (finalScore >= 80) { emoji = '🌟👏';
                message = 'HEBAT! Nilaimu sangat bagus!'; } else if (finalScore >= 60) { emoji = '👍😊';
                message = 'CUKUP BAIK! Terus berlatih ya!'; } else { emoji = '💪📚';
                message = 'TETAP SEMANGAT! Yuk belajar lagi!'; }
            resultScreen.innerHTML = `<div class="result-emoji">${emoji}</div><div class="result-score">${finalScore}</div><div class="result-message">${message}</div><p>Kamu menjawab <strong>${correctTotal}</strong> benar dari <strong>${totalQuestions}</strong> soal.</p><p>Benar: ${correctTotal} | Salah: ${wrongTotal}</p>`;
            quizContainer.appendChild(resultScreen);
            if (finalScore === 100) { triggerConfetti();
                const waBtn = document.createElement('button');
                waBtn.className = 'wa-btn';
                waBtn.textContent = '🎁 Klaim Hadiah 5.000 via WhatsApp';
                waBtn.addEventListener('click', function() { const phone = '6281234567890';
                    const text = 'Alhamdulillah aku berhasil dapat 100 & Mendapatkan HADIAH 5.000!';
                    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank'); });
                resultScreen.appendChild(waBtn); } else { const retryBtn = document.createElement('button');
                retryBtn.className = 'retry-btn';
                retryBtn.textContent = '🔄 ULANGI TES';
                retryBtn.addEventListener('click', function() { restartQuiz(); });
                resultScreen.appendChild(retryBtn); }
            progressFill.style.width = '100%';
            progressPct.textContent = '100%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function restartQuiz() { currentQuestion = 0;
            userAnswers = {};
            score = 0;
            quizCompleted = false;
            btnNext.style.display = 'none';
            btnNext.textContent = 'Soal Berikutnya ➡️';
            btnPrev.style.display = 'flex';
            btnPrev.disabled = true;
            loadQuestion(0);
            updateStats();
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function triggerConfetti() { confettiContainer.style.display = 'block';
            const colors = ['#6C5CE7', '#a29bfe', '#fd79a8', '#fdcb6e', '#00b894', '#e17055', '#74b9ff']; for (let i =
                    0; i < 80; i++) { const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + '%';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (Math.random() * 2 + 2) + 's';
                c.style.animationDelay = Math.random() * 3 + 's';
                confettiContainer.appendChild(c); }
            setTimeout(() => { confettiContainer.style.display = 'none';
                confettiContainer.innerHTML = ''; }, 6000); }
        checkBtn.addEventListener('click', checkAnswer);
        btnNext.addEventListener('click', goToNext);
        btnPrev.addEventListener('click', goToPrev);
        loadQuestion(0);
        updateStats();
        updateProgress();
    </script>
</body>
</html>
