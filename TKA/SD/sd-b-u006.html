<script>
    const textKuePancong = `<b>Lezatnya Kue Pancong Tradisional</b><br>Kue pancong adalah salah satu jajanan pasar tradisional yang sangat digemari di Indonesia. Kue ini terbuat dari adonan campuran tepung beras, santan kelapa, gula pasir, dan garam secukupnya.<br>Cara memasaknya menggunakan cetakan khusus berbentuk setengah lingkaran yang dipanaskan di atas kompor. Sebelum adonan dituang, cetakan biasanya diolesi sedikit minyak agar tidak lengket. Setelah setengah matang, kue ditutup rapat agar matangnya merata. Ciri khas kue pancong adalah teksturnya yang empuk di bagian dalam namun memiliki pinggiran yang gurih dan sedikit garing karena bersentuhan langsung dengan cetakan panas.<br>Biasanya, saat disajikan di piring, kue pancong diberi taburan gula pasir putih di atasnya untuk menambah rasa manis. Rasanya yang gurih dari santan berpadu sempurna dengan manisnya gula.`;

    const textEkosistem = `<b>Pentingnya Menjaga Ekosistem Mangrove</b><br>Hutan mangrove atau biasa disebut hutan bakau tumbuh di sepanjang garis pantai daerah tropis. Hutan ini memiliki fungsi yang sangat vital bagi bumi kita.<br>Pertama, akar pohon mangrove yang rimbun dan berlapis-lapis berfungsi sebagai penahan alami abrasi. Ombak besar dari laut yang menghantam pantai akan dipecah kekuatannya oleh akar bakau sehingga daratan aman dari pengikisan.<br>Kedua, hutan mangrove menjadi tempat tinggal dan tempat berkembang biak yang sangat aman bagi berbagai jenis hewan air, seperti kepiting bakau, udang, dan ikan kecil. Oleh karena itu, jika hutan mangrove rusak, hasil tangkapan nelayan di sekitar pantai juga akan ikut menurun drastis.`;

    const textBudi = `<b>Kejujuran di Kantin Sekolah</b><br>Jam istirahat berbunyi nyaring. Rian segera berlari menuju kantin sekolah untuk membeli sebotol air mineral dan sepotong roti cokelat. Saat membayar di kasir, Ibu Penjaga Kantin sedang melayani banyak sekali anak yang berdesakan.<br>Karena terburu-buru ingin segera bermain dengan teman-temannya di lapangan, Rian menerima uang kembalian yang ternyata terlalu banyak. Seharusnya ia hanya menerima kembalian dua ribu rupiah, tetapi Ibu Kasir memberinya sepuluh ribu rupiah.<br>Sesampainya di lapangan, Rian baru menyadari kesalahan hitung tersebut. Ia terdiam sejenak, menatap uang di telapak tangannya, lalu memikirkan apa yang harus ia lakukan. Tanpa berpikir panjang, ia berbalik arah dan berjalan cepat kembali ke kasir kantin.<br>"Bu, uang kembalian saya tadi kelebihan. Ini saya kembalikan," kata Rian sambil menyerahkan uang delapan ribu rupiah tersebut dengan senyuman ramah.<br>Ibu penjaga kantin tersenyum lebar dan memuji kejujuran Rian. Hati Rian terasa sangat lega dan bahagia.`;

    const textLumba = `<b>Lumba-Lumba, Mamalia Laut yang Cerdas</b><br>Meskipun hidup di dalam air dan bentuk tubuhnya mirip ikan, lumba-lumba sebenarnya bukanlah kelompok ikan. Lumba-lumba adalah hewan mamalia yang bernapas menggunakan paru-paru. Oleh karena itu, mereka harus secara berkala muncul ke permukaan air untuk mengambil udara segar melalui lubang di atas kepalanya.<br>Lumba-lumba dikenal sebagai salah satu hewan paling cerdas di lautan. Mereka hidup secara berkelompok yang disebut koloni. Dalam kelompoknya, mereka sangat kompak dan saling melindungi jika ada bahaya dari hiu atau hewan pemangsa lainnya. Hewan ini juga berkomunikasi menggunakan suara klik dan peluit yang khas.`;

    const textSuratAyah = `<b>Surat untuk Ayah di Perantauan</b><br>Malang, 12 Oktober 2026<br><br>Ayah tercinta,<br>Bagaimana kabar Ayah di Surabaya? Semoga Ayah selalu sehat dan dimudahkan dalam pekerjaannya, ya.<br><br>Ibu dan aku di rumah baik-baik saja. Minggu lalu, aku berhasil menjadi juara pertama lomba pidato tingkat kecamatan, Yah! Aku mendapatkan piala dan piagam penghargaan. Nanti kalau Ayah pulang ke Malang, piala itu akan kuperlihatkan pertama kali kepada Ayah.<br>Ibu berpesan agar Ayah tidak terlalu lelah bekerja dan jangan lupa menjaga kesehatan makan tepat waktu.<br><br>Kutunggu kepulangan Ayah dengan rindu.<br><br>Anakmu, <br>Dika`;

    const textPantun = `<b>Nasihat Bijak Berbalas Pantun</b><br>Pergi ke kebun memetik tomat,<br>Jangan lupa membawa wadah.<br>Jadilah anak yang berbakti dan hemat,<br>Agar hidupmu kelak bahagia dan mudah.<br><br>Buah durian kulitnya berduri,<br>Manis rasanya di dalam belanga.<br>Janganlah suka beriri hati,<br>Mari berteman dengan sesama warga.`;

    const questions = [
        // Variasi 1: Teks Prosedur/Makanan (Kue Pancong)
        {
            id: 1, type: "pg", context: textKuePancong,
            q: "Bahan apa saja yang digunakan untuk membuat adonan kue pancong?",
            options: ["Tepung terigu, mentega, dan cokelat.", "Tepung beras, santan kelapa, gula pasir, dan garam.", "Tepung tapioka, air, dan pewarna makanan.", "Susu segar, telur, dan keju parut."],
            answer: 1,
            explanation: "Berdasarkan paragraf pertama, kue pancong terbuat dari adonan campuran tepung beras, santan kelapa, gula pasir, dan garam."
        },
        {
            id: 2, type: "pg", context: textKuePancong,

            answer: 1,

        },
        {

        {
            id: 4, type: "kategori", context: textKuePancong,

        // Variasi 2: Teks Lingkungan/Informasi (Ekosistem Mangrove)
        {
            id: 6, type: "pg", context: textEkosistem,

        {

            answer: 0,

        },
        {
            id: 8, type: "mcma", context: textEkosistem,
            q: "Hewan apa saja yang disebutkan hidup dan berkembang biak di hutan mangrove? (Pilih lebih dari satu)",

            answer: [1, 2],

        {

            q: "Apa akibatnya jika hutan mangrove mengalami kerusakan parah?<br>Tentukan Benar atau Salah!",
            cats: ["Benar", "Salah"],
            statements: [
                { text: "Hasil tangkapan nelayan di sekitar pantai akan ikut menurun drastis.", answer: 0 },
                { text: "Pantai akan lebih rentan mengalami abrasi atau pengikisan.", answer: 0 },
                { text: "Air laut di pantai akan berubah menjadi air tawar yang manis.", answer: 1 }

            explanation: "Kerusakan mangrove menyebabkan hasil nelayan turun (karena tempat ikan rusak) dan abrasi meningkat (Pernyataan A & B Benar). Air laut tidak berubah jadi manis (Salah)."

        {

        // Variasi 3: Cerita Anak / Fiksi Nilai Moral (Kejujuran Rian)
        {

            answer: 1,
            explanation: "Teks menyatakan: 'Rian segera berlari menuju kantin sekolah untuk membeli sebotol air mineral dan sepotong roti cokelat.'"

        {
            id: 12, type: "pg", context: textBudi,
            q: "Berapa jumlah uang kembalian yang seharusnya diterima Rian?",
            options: ["Sepuluh ribu rupiah.", "Dua ribu rupiah.", "Delapan ribu rupiah.", "Lima puluh ribu rupiah."],

        },
        {
            id: 13, type: "mcma", context: textBudi,
            q: "Sikap atau sifat apa saja yang ditunjukkan oleh Rian dalam cerita tersebut? (Pilih lebih dari satu)",

    let currentQ = 0;
    let correctCount = 0;
    const quizContainer = document.getElementById('quiz-container');
    const scoreScreen = document.getElementById('score-screen');

    function renderQuestion() {
        quizContainer.innerHTML = '';
        if (currentQ >= questions.length) {
            showScore();
            return;
        }

        const qData = questions[currentQ];
        const card = document.createElement('div');
        card.className = 'question-card active';

        // Header & Context
        let html = `<div class="question-number">Soal ${currentQ + 1} / 30</div>`;
        if (qData.context) {
            html += `<div class="context-box">${qData.context}</div>`;
        }
        html += `<div class="question-text">${qData.q}</div>`;

        // Render Options based on type
        html += `<div class="options-container" id="options-${currentQ}">`;
        
        if (qData.type === 'pg') {
            qData.options.forEach((opt, idx) => {
                html += `
                    <label class="option-label">
                        <input type="radio" name="q${currentQ}" value="${idx}">
                        <span>${opt}</span>
                    </label>`;
            });
        } 
        else if (qData.type === 'mcma') {
            qData.options.forEach((opt, idx) => {
                html += `
                    <label class="option-label">
                        <input type="checkbox" name="q${currentQ}" value="${idx}">
                        <span>${opt}</span>
                    </label>`;
            });
        }
        else if (qData.type === 'kategori') {
            html += `<table class="kategori-table">
                        <tr><th>Pernyataan</th><th>${qData.cats[0]}</th><th>${qData.cats[1]}</th></tr>`;
            qData.statements.forEach((stmt, idx) => {
                html += `<tr>
                            <td class="statement">${stmt.text}</td>
                            <td><input type="radio" name="cat${currentQ}_${idx}" value="0"></td>
                            <td><input type="radio" name="cat${currentQ}_${idx}" value="1"></td>
                         </tr>`;
            });
            html += `</table>`;
        }
        html += `</div>`; // end options-container

        // Submit Button
        html += `<button class="btn-submit" id="btn-submit-${currentQ}" onclick="checkAnswer()">Kirim Jawaban</button>`;

        // Feedback Box
        html += `
            <div class="feedback" id="feedback-${currentQ}">
                <div class="status" id="status-${currentQ}"></div>
                <div class="explanation"><b>Penjelasan:</b> <span id="expl-${currentQ}"></span></div>
            </div>
        `;

        // Next Button
        html += `<button class="btn-next" id="btn-next-${currentQ}" onclick="nextQuestion()">Selanjutnya ➡️</button>`;

        card.innerHTML = html;
        quizContainer.appendChild(card);
    }

    function checkAnswer() {
        const qData = questions[currentQ];
        let isCorrect = false;
        let isAnswered = false;

        if (qData.type === 'pg') {
            const selected = document.querySelector(`input[name="q${currentQ}"]:checked`);
            if (!selected) return alert("Pilih jawabanmu dulu ya!");
            isAnswered = true;
            if (parseInt(selected.value) === qData.answer) isCorrect = true;
        } 
        else if (qData.type === 'mcma') {
            const selectedBoxes = document.querySelectorAll(`input[name="q${currentQ}"]:checked`);
            if (selectedBoxes.length === 0) return alert("Pilih minimal satu jawaban!");
            isAnswered = true;
            let vals = Array.from(selectedBoxes).map(cb => parseInt(cb.value)).sort();
            let ans = qData.answer.slice().sort();
            isCorrect = (JSON.stringify(vals) === JSON.stringify(ans));
        }
        else if (qData.type === 'kategori') {
            let allAnswered = true;
            let correctRows = 0;
            qData.statements.forEach((stmt, idx) => {
                const sel = document.querySelector(`input[name="cat${currentQ}_${idx}"]:checked`);
                if (!sel) allAnswered = false;
                else if (parseInt(sel.value) === stmt.answer) correctRows++;
            });
            if (!allAnswered) return alert("Tentukan pilihan untuk SEMUA baris pernyataan ya!");
            isAnswered = true;
            if (correctRows === qData.statements.length) isCorrect = true;
        }

        if (isAnswered) {
            // Disable inputs
            const inputs = document.querySelectorAll(`input`);
            inputs.forEach(i => i.disabled = true);
            const labels = document.querySelectorAll('.option-label');
            labels.forEach(l => l.classList.add('disabled'));

            // Show feedback
            document.getElementById(`btn-submit-${currentQ}`).style.display = 'none';
            const feedbackBox = document.getElementById(`feedback-${currentQ}`);
            const statusText = document.getElementById(`status-${currentQ}`);
            document.getElementById(`expl-${currentQ}`).innerHTML = qData.explanation;

            feedbackBox.style.display = 'block';
            if (isCorrect) {
                correctCount++;
                feedbackBox.classList.add('correct-bg');
                statusText.innerHTML = '🎉 HEBAT, JAWABANMU BENAR!';
                statusText.className = 'status correct-text';
            } else {
                feedbackBox.classList.add('wrong-bg');
                statusText.innerHTML = '❌ YAAH, MASIH KURANG TEPAT!';
                statusText.className = 'status wrong-text';
            }

            document.getElementById(`btn-next-${currentQ}`).style.display = 'block';
        }
    }

    function nextQuestion() {
        currentQ++;
        renderQuestion();
    }

    function showScore() {
        document.getElementById('quiz-header').style.display = 'none';
        scoreScreen.style.display = 'block';
        
        // Capping float numbers
        const score = Math.round((correctCount / questions.length) * 100);
        document.getElementById('final-score').innerText = score;

        if (score === 100) {
            document.getElementById('score-message').innerText = "LUAR BIASA! Kamu dapat nilai Sempurna!";
            document.getElementById('champion-icon').style.display = 'block';
            
            // Show WA Button
            const waBtn = document.getElementById('btn-wa');
            waBtn.style.display = 'inline-block';
            const waText = encodeURIComponent("Alhamdulillah aku berhasil dapat 100 & Mendapatkan HADIAH 5.000!");
            waBtn.href = `https://wa.me/?text=${waText}`;

            // Trigger Confetti
            fireConfetti();
        } else {
            document.getElementById('score-message').innerText = "Tetap semangat! Yuk coba lagi supaya dapat 100!";
            document.getElementById('btn-retry').style.display = 'inline-block';
        }
    }

    function fireConfetti() {
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 5,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#ff9800', '#4caf50', '#00bcd4']
            });
            confetti({
                particleCount: 5,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#ff9800', '#4caf50', '#00bcd4']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    // Start Quiz
    window.onload = renderQuestion;
</script>
