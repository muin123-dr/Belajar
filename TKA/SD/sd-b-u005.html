            font-family: 'Nunito', sans-serif;
            background-color: #e8eaf6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }
        h1 {
            text-align: center;
            color: #3f51b5;
            font-size: 28px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #5c6bc0;
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .context-box {
            background: #e3f2fd;
            border-left: 5px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }
        .question-card {
            background: #f3e5f5;
            border: 2px solid #ce93d8;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        .question-card.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        .question-number {
            display: inline-block;
            background: #ab47bc;
            color: white;
            font-weight: 900;
            padding: 5px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .question-text {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            background: #ffffff;
            border: 2px solid #9c27b0;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .option-label:hover {
            background: #f3e5f5;
        }
        .option-label.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        input[type="radio"], input[type="checkbox"] {
            transform: scale(1.5);
            margin-right: 10px;
        }
        
        /* Kategori Table Styling */
        .kategori-table {
            width: 100%;

            margin-top: 10px;
            background: white;
            border-radius: 10px;
            overflow: hidden;

            border: 2px solid #ce93d8;
            padding: 12px;
            text-align: center;
        }
        .kategori-table th { background: #e1bee7; }
        .kategori-table td.statement { text-align: left; font-weight: bold; }
        
        .btn-submit {
            background: #00bcd4;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn-submit:hover { background: #0097a7; }
        .btn-submit:disabled { background: #b2ebf2; cursor: not-allowed; }
        
        .btn-next {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: none;
        }
        .btn-next:hover { background: #388e3c; }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.5s;
        }
        .feedback.correct-bg { background: #e8f5e9; border: 2px solid #4caf50; }
        .feedback.wrong-bg { background: #ffebee; border: 2px solid #f44336; }
        .status { font-size: 20px; font-weight: 900; margin-bottom: 5px; }
        .correct-text { color: #4caf50; }
        .wrong-text { color: #f44336; }
        .explanation { font-size: 15px; line-height: 1.5; color: #37474f; margin-top: 10px; }

        /* Score Screen */
        #score-screen {
            text-align: center;
            display: none;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            background: #ffca28;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: 900;
            color: white;
            margin: 0 auto 20px auto;
            border: 8px solid #ff9800;
        }
        .champion-anim {
            font-size: 80px;
            margin-bottom: 10px;
            animation: bounce 1s infinite alternate;
        }
        .btn-wa {
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 15px;
            display: inline-block;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }
        .btn-wa:hover { background: #1ebe5d; }
        .btn-retry {
            background: #f44336;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-retry:hover { background: #d32f2f; }

        /* ==================== ANIMASI JUARA (OVERLAY) ==================== */
        .champion-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(63, 81, 181, 0.97) 0%, rgba(15, 10, 50, 0.99) 70%);
            z-index: 9990;
            opacity: 0;
            transition: opacity 0.45s ease;
            overflow: hidden;
        }
        .champion-overlay.show { opacity: 1; }
        .champion-overlay.hide { opacity: 0; }
        .champion-rays {
            position: absolute;
            width: 200vmax;
            height: 200vmax;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg,
                rgba(255, 255, 255, 0.15) 0deg 7deg,
                transparent 7deg 15deg);
            animation: spin-rays 14s linear infinite;
        }
        @keyframes spin-rays { to { transform: rotate(360deg); } }
        .champion-glow {
            position: absolute;
            width: 70vmin;
            height: 70vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 202, 40, 0.55) 0%, transparent 65%);
            animation: glow-pulse 1.6s ease-in-out infinite;
        }
        @keyframes glow-pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .champion-trophy {
            font-size: 7rem;
            line-height: 1;
            z-index: 2;
            filter: drop-shadow(0 0 28px rgba(255, 202, 40, 0.95));
            animation: trophy-pop 0.9s cubic-bezier(0.2, 1.6, 0.4, 1) both,
                       trophy-float 2s ease-in-out 0.9s infinite;
        }
        @keyframes trophy-pop {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            70% { transform: scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes trophy-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-16px) scale(1.06); }
        }
        .champion-text {
            margin-top: 14px;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ffca28;
            text-shadow: 0 0 22px rgba(255, 202, 40, 0.9), 0 5px 0 rgba(0, 0, 0, 0.25);
            z-index: 2;
            text-align: center;
            animation: text-pop 0.7s 0.45s both;
        }
        @keyframes text-pop {
            from { transform: scale(0.2); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .champion-sub {
            margin-top: 10px;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
            padding: 0 24px;
            z-index: 2;
            animation: fadeIn 0.6s 1s both;
        }
        .champion-stars {
            margin-top: 16px;
            font-size: 1.8rem;
            z-index: 2;
            letter-spacing: 8px;
            animation: fadeIn 0.6s 1.2s both;
        }

        .prize-screen {

            padding: 26px 18px 22px;
            border-radius: 20px;
            background: linear-gradient(160deg, #ffffff 0%, #f3e5f5 45%, #fff8e1 100%);
            border: 3px solid #ffca28;
            box-shadow: 0 14px 40px rgba(63, 81, 181, 0.22);
            animation: prize-in 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both;
            position: relative;
            overflow: hidden;
        }
        @keyframes prize-in {
            0% { transform: scale(0.75) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .prize-screen::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: conic-gradient(from 0deg, transparent 0deg 12deg, rgba(255, 202, 40, 0.16) 12deg 18deg);
            animation: spin-rays 20s linear infinite;
            pointer-events: none;
        }
        .prize-logo {
            width: 132px;
            height: 132px;
            object-fit: contain;
            position: relative;
            z-index: 1;
            animation: bounce 2.2s ease-in-out infinite alternate;
            filter: drop-shadow(0 10px 22px rgba(63, 81, 181, 0.35));
        }
        .prize-title {
            position: relative;
            z-index: 1;
            margin: 12px 0 6px;
            font-size: 1.3rem;
            font-weight: 900;
            line-height: 1.5;
            letter-spacing: 0.5px;
            color: #333;
            text-transform: uppercase;
        }
        .prize-title .prize-highlight {
            display: inline-block;
            font-size: 2.4rem;
            background: linear-gradient(90deg, #3f51b5, #9c27b0, #ff9800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.05);
            animation: bounce 1.8s ease-in-out infinite alternate;
        }
        .prize-note {
            position: relative;
            z-index: 1;
            font-size: 0.9rem;
            color: #5c6bc0;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .claim-btn {
            position: relative;
            z-index: 1;
            display: inline-block;
            padding: 17px 42px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            background: linear-gradient(135deg, #25D366, #128C7E);
            box-shadow: 0 12px 28px rgba(37, 211, 102, 0.45);
            margin-top: 18px;
            animation: pulse-claim 1.7s ease-in-out infinite;
        }
        @keyframes pulse-claim {
            0%, 100% { transform: scale(1); box-shadow: 0 12px 28px rgba(37, 211, 102, 0.45); }
            50% { transform: scale(1.06); box-shadow: 0 16px 36px rgba(37, 211, 102, 0.65); }
        }
        .claim-btn:hover {
            background: linear-gradient(135deg, #2ee06f, #17a085);
        }
        .claim-btn:active { transform: scale(0.97); }
        .retry-secondary {
            position: relative;
            z-index: 1;
            display: block;
            margin: 14px auto 0;
            padding: 12px 26px;
            font-size: 0.9rem;
            background: #f1f2f6;
            color: #333;
            border: 2px solid #cfd8dc;
            box-shadow: none;
        }
        .retry-secondary:hover { background: #e9ecef; box-shadow: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            h1 { font-size: 24px; }
            .question-text { font-size: 16px; }
            .kategori-table th, .kategori-table td { padding: 8px; font-size: 14px; }
            .champion-trophy { font-size: 5rem; }
            .champion-text { font-size: 1.5rem; letter-spacing: 2px; }
            .champion-sub { font-size: 0.88rem; }
            .prize-title { font-size: 1rem; }
            .prize-title .prize-highlight { font-size: 1.9rem; }
            .prize-logo { width: 108px; height: 108px; }
            .claim-btn { padding: 15px 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-header">
        <h1>🌟 Uji Kemampuan TKA Bahasa Indonesia ke-5 🌟</h1>
        <p class="subtitle">Persiapan Juara TKA SD</p>
    </div>
    <div id="quiz-container"></div>
    
    <div id="score-screen">

        <div class="score-circle" id="final-score">100</div>
        <p id="score-message" style="font-size: 18px; font-weight: bold; color: #555;"></p>
        
        <div id="prize-container"></div>

        <button id="btn-retry" class="btn-retry" style="display: none;" onclick="location.reload()">
            🔄 ULANGI TES

</div>

<script>
    // ==================== KONFIGURASI HADIAH ====================
    const HADIAH = {
        logo: 'https://muin123-dr.github.io/Belajar/LOGOstcm.png',
        nominal: '5.000',

        waText: '⭐ ALHAMDULILLAH ⭐ \nSaya dapat hadiah 5.000\n\n    - ⭐ -'

    const textFabel = `<b>Penyesalan Ciko si Tupai</b><br>Kiki si semut selalu ramah dan suka berbagi makanan dengan serangga lain. Sebaliknya, Ciko si tupai sangat sombong. Ia sering mengejek Kiki. "Hahaha, tubuhmu kecil sekali, Kiki! Angin bertiup sedikit saja kau pasti terbang!" ejek Ciko sambil memakan kacangnya.<br>Suatu sore, terdengar suara minta tolong dari pinggir hutan. Ternyata, Ciko terjebak di dalam jaring perangkap pemburu! Ia meronta-ronta namun jaring itu terlalu kuat.<br>Mendengar teriakan itu, Kiki segera memanggil kawan-kawan semutnya. Ratusan semut merayap ke jaring dan mulai menggigiti tali jaring itu dengan rahang mereka yang tajam. Lama-kelamaan, jaring itu putus dan Ciko berhasil bebas.<br>"Terima kasih, Kiki. Maafkan aku karena sering mengejekmu. Ternyata tubuh kecilmu menyimpan kekuatan dan hati yang besar," ucap Ciko dengan wajah tertunduk malu.`;

    const textInfo = `<b>Manfaat Tidur Siang bagi Anak SD</b><br>Banyak orang mengira tidur siang hanya dibutuhkan oleh bayi atau balita. Padahal, anak usia Sekolah Dasar (SD) juga sangat dianjurkan untuk tidur siang. <br>Durasi tidur siang yang paling baik adalah sekitar 20 hingga 30 menit saja. Jika terlalu lama, anak justru bisa terbangun dengan kepala pusing dan kesulitan tidur di malam hari.<br>Tidur siang memiliki banyak manfaat yang luar biasa. Pertama, tidur siang dapat memulihkan energi setelah lelah belajar di sekolah. Kedua, tidur siang terbukti dapat meningkatkan daya ingat dan konsentrasi. Saat kita tidur, otak merapikan informasi baru yang kita pelajari. Selain itu, anak yang cukup istirahat tubuhnya tidak akan mudah terserang penyakit.`;

    const textProsedur = `<b>Cara Menanam Biji Bunga Matahari</b><br>Ingin halaman rumahmu dihiasi bunga kuning yang cantik? Yuk, ikuti langkah-langkah menanam biji bunga matahari berikut ini!<br>1. Siapkan pot berukuran sedang yang sudah diisi dengan tanah subur dan gembur.<br>2. Buatlah lubang kecil di tengah tanah dengan kedalaman sekitar 2 sentimeter.<br>3. Masukkan satu atau dua biji bunga matahari ke dalam lubang tersebut, lalu tutup kembali dengan tanah tipis-tipis.<br>4. Siramlah tanah dengan air secukupnya agar lembap. Ingat, jangan sampai tanahnya tergenang air (banjir).<br>5. Letakkan pot di tempat yang terkena sinar matahari langsung, karena bunga matahari sangat membutuhkan cahaya untuk tumbuh besar dan mekar.`;

    const textHematEnergi = `<b>Ayo, Hemat Energi dari Sekarang!</b><br>Listrik adalah energi yang sangat penting. Namun, pemborosan listrik dapat merusak lingkungan bumi kita. Kita bisa mulai berhemat dengan langkah kecil di rumah.<br>Biasakan untuk mematikan lampu kamar saat siang hari karena matahari sudah cukup menerangi ruangan. Selain itu, jangan lupa mencabut kabel televisi atau kipas angin dari stopkontak jika sudah tidak digunakan. Jika kamu ingin pergi ke tempat yang dekat, lebih baik menggunakan sepeda daripada naik sepeda motor. Tindakan sederhana ini tidak hanya menghemat biaya listrik bulanan, tetapi juga mengurangi polusi udara.`;

    const textPuisi = `<b>Guruku, Cahaya Masa Depanku</b><br>Setiap pagi kau menyapa dengan senyum tulus<br>Mengajarkanku mengeja huruf dan dunia<br>Menuntunku di kala gelap ketidaktahuan<br>Tak pernah kulihat keluh kesah di wajahmu<br><br>Keringatmu adalah cahaya bagi masa depanku<br>Teguranmu adalah kasih sayang yang tak terucap<br>Terima kasih, pahlawan tanpa tanda jasa<br>Namamu akan selalu mekar di hatiku`;

    const textSurat = `<b>Surat dari Desa</b><br>Halo Bima, apa kabar?<br>Semoga kamu dan keluargamu di Jakarta sehat selalu, ya!<br><br>Aku sedang berada di desa rumah Nenek sekarang. Kemarin, aku ikut Kakek pergi ke kebun untuk panen jagung manis. Seru sekali, Bim! Kami membakar jagung di pinggir sawah sambil merasakan angin yang sejuk. Sayang sekali kamu tidak ada di sini untuk ikut makan bersama.<br><br>Liburan semester depan kamu harus berkunjung ke desaku, ya! Nanti kita main di sungai dan memetik buah mangga langsung dari pohonnya. <br>Kutunggu balasan suratmu!<br><br>Sahabatmu,<br>Rio`;

    const questions = [
        // Teks Fabel
        {
            id: 1, type: "pg", context: textFabel,
            q: "Siapa yang terjebak di dalam jaring perangkap pemburu?",
            options: ["Kiki si semut.", "Ciko si tupai.", "Pemilik kebun.", "Sekawanan burung."],
            answer: 1,
            explanation: "Di paragraf kedua tertulis jelas: 'Ternyata, Ciko terjebak di dalam jaring perangkap pemburu!'"

        {
            id: 2, type: "pg", context: textFabel,
            q: "Pada kalimat 'Ia sering mengejek Kiki', makna kata <b>mengejek</b> adalah...",
            options: ["Memberikan hadiah atau makanan", "Menolong teman yang kesulitan", "Menghina atau menertawakan kekurangan orang lain", "Minta tolong karena ketakutan"],

        {

            q: "Nilai kehidupan apa saja yang relevan (sesuai) dengan isi fabel tersebut?<br>Tentukan Sesuai atau Tidak Sesuai!",
            cats: ["Sesuai", "Tidak Sesuai"],
            statements: [
                { text: "Berani mengakui kesalahan dan meminta maaf.", answer: 0 },
                { text: "Membalas dendam kepada teman yang menyebalkan.", answer: 1 },
                { text: "Bergotong royong saat menolong orang lain.", answer: 0 }
            ],
            explanation: "Ciko meminta maaf (Sesuai), Semut bekerja sama menggigit jaring (Sesuai). Kiki tidak membalas dendam, sehingga pernyataan B Tidak Sesuai."

        {
            id: 5, type: "pg", context: textFabel,
            q: "Bagaimana respons emosional (perasaan) pembaca saat melihat Ciko diselamatkan dan akhirnya meminta maaf?",
            options: ["Sangat marah pada Kiki.", "Merasa terharu dan lega karena mereka berbaikan.", "Ketakutan melihat jaring pemburu.", "Kecewa karena ceritanya membosankan."],
            answer: 1,

        // Teks Info Tidur Siang
        {
            id: 6, type: "pg", context: textInfo,

        },
        {

    let currentQ = 0;
    let correctCount = 0;
    const quizContainer = document.getElementById('quiz-container');
    const scoreScreen = document.getElementById('score-screen');

    function renderQuestion() {
        quizContainer.innerHTML = '';
        if (currentQ >= questions.length) {
            showScore();
            return;
        }

        const qData = questions[currentQ];
        const card = document.createElement('div');
        card.className = 'question-card active';

        // Header & Context
        let html = `<div class="question-number">Soal ${currentQ + 1} / 30</div>`;
        if (qData.context) {
            html += `<div class="context-box">${qData.context}</div>`;
        }
        html += `<div class="question-text">${qData.q}</div>`;

        // Render Options based on type
        html += `<div class="options-container" id="options-${currentQ}">`;
        
        if (qData.type === 'pg') {
            qData.options.forEach((opt, idx) => {
                html += `
                    <label class="option-label">
                        <input type="radio" name="q${currentQ}" value="${idx}">
                        <span>${opt}</span>
                    </label>`;
            });
        } 
        else if (qData.type === 'mcma') {
            qData.options.forEach((opt, idx) => {
                html += `
                    <label class="option-label">
                        <input type="checkbox" name="q${currentQ}" value="${idx}">
                        <span>${opt}</span>
                    </label>`;
            });
        }
        else if (qData.type === 'kategori') {
            html += `<table class="kategori-table">
                        <tr><th>Pernyataan</th><th>${qData.cats[0]}</th><th>${qData.cats[1]}</th></tr>`;
            qData.statements.forEach((stmt, idx) => {
                html += `<tr>
                            <td class="statement">${stmt.text}</td>
                            <td><input type="radio" name="cat${currentQ}_${idx}" value="0"></td>
                            <td><input type="radio" name="cat${currentQ}_${idx}" value="1"></td>
                         </tr>`;
            });
            html += `</table>`;
        }
        html += `</div>`; // end options-container

        // Submit Button
        html += `<button class="btn-submit" id="btn-submit-${currentQ}" onclick="checkAnswer()">Kirim Jawaban</button>`;

        // Feedback Box
        html += `
            <div class="feedback" id="feedback-${currentQ}">
                <div class="status" id="status-${currentQ}"></div>
                <div class="explanation"><b>Penjelasan:</b> <span id="expl-${currentQ}"></span></div>
            </div>
        `;

        // Next Button
        html += `<button class="btn-next" id="btn-next-${currentQ}" onclick="nextQuestion()">Selanjutnya ➡️</button>`;

        card.innerHTML = html;
        quizContainer.appendChild(card);
    }

    function checkAnswer() {
        const qData = questions[currentQ];
        let isCorrect = false;
        let isAnswered = false;

        if (qData.type === 'pg') {
            const selected = document.querySelector(`input[name="q${currentQ}"]:checked`);
            if (!selected) return alert("Pilih jawabanmu dulu ya!");
            isAnswered = true;
            if (parseInt(selected.value) === qData.answer) isCorrect = true;
        } 
        else if (qData.type === 'mcma') {
            const selectedBoxes = document.querySelectorAll(`input[name="q${currentQ}"]:checked`);
            if (selectedBoxes.length === 0) return alert("Pilih minimal satu jawaban!");
            isAnswered = true;
            let vals = Array.from(selectedBoxes).map(cb => parseInt(cb.value)).sort();
            let ans = qData.answer.slice().sort();
            isCorrect = (JSON.stringify(vals) === JSON.stringify(ans));
        }
        else if (qData.type === 'kategori') {
            let allAnswered = true;
            let correctRows = 0;
            qData.statements.forEach((stmt, idx) => {
                const sel = document.querySelector(`input[name="cat${currentQ}_${idx}"]:checked`);
                if (!sel) allAnswered = false;
                else if (parseInt(sel.value) === stmt.answer) correctRows++;
            });
            if (!allAnswered) return alert("Tentukan pilihan untuk SEMUA baris pernyataan ya!");
            isAnswered = true;
            if (correctRows === qData.statements.length) isCorrect = true;
        }

        if (isAnswered) {
            // Disable inputs
            const inputs = document.querySelectorAll(`input`);
            inputs.forEach(i => i.disabled = true);
            const labels = document.querySelectorAll('.option-label');
            labels.forEach(l => l.classList.add('disabled'));

            // Show feedback
            document.getElementById(`btn-submit-${currentQ}`).style.display = 'none';
            const feedbackBox = document.getElementById(`feedback-${currentQ}`);
            const statusText = document.getElementById(`status-${currentQ}`);
            document.getElementById(`expl-${currentQ}`).innerHTML = qData.explanation;

            feedbackBox.style.display = 'block';
            if (isCorrect) {
                correctCount++;
                feedbackBox.classList.add('correct-bg');
                statusText.innerHTML = '🎉 HEBAT, JAWABANMU BENAR!';
                statusText.className = 'status correct-text';
            } else {
                feedbackBox.classList.add('wrong-bg');
                statusText.innerHTML = '❌ YAAH, MASIH KURANG TEPAT!';
                statusText.className = 'status wrong-text';
            }

            document.getElementById(`btn-next-${currentQ}`).style.display = 'block';
        }
    }

    function nextQuestion() {
        currentQ++;
        renderQuestion();
    }

    function showScore() {
        document.getElementById('quiz-header').style.display = 'none';
        scoreScreen.style.display = 'block';
        
        // Capping float numbers
        const score = Math.round((correctCount / questions.length) * 100);
        document.getElementById('final-score').innerText = score;

        if (score === 100) {
            document.getElementById('score-message').innerText = "LUAR BIASA! Kamu dapat nilai Sempurna!";
            document.getElementById('champion-icon').style.display = 'block';
            document.getElementById('btn-retry').style.display = 'none';

            // Tampilkan animasi juara dulu, baru halaman hadiah
            showChampionAnimation(function() {
                renderPrizeScreen();
            });

            // Trigger Confetti
            fireConfetti();
        } else {
            document.getElementById('score-message').innerText = "Tetap semangat! Yuk coba lagi supaya dapat 100!";
            document.getElementById('champion-icon').style.display = 'none';
            document.getElementById('btn-retry').style.display = 'inline-block';
        }
    }

    // ==================== ANIMASI JUARA ====================
    function showChampionAnimation(onFinish) {
        const overlay = document.createElement('div');
        overlay.className = 'champion-overlay';
        overlay.innerHTML = `
            <div class="champion-rays"></div>
            <div class="champion-glow"></div>
            <div class="champion-trophy">🏆</div>
            <div class="champion-text">JUARA!</div>
            <div class="champion-sub">Kamu menjawab SEMUA soal dengan BENAR!<br>Skor Sempurna: 100</div>
            <div class="champion-stars">⭐ ⭐ ⭐</div>
        `;
        document.body.appendChild(overlay);
        document.body.style.overflow = 'hidden';

        requestAnimationFrame(() => overlay.classList.add('show'));

        setTimeout(() => {
            overlay.classList.add('hide');
            setTimeout(() => {
                overlay.remove();
                document.body.style.overflow = '';
                if (typeof onFinish === 'function') onFinish();
            }, 500);
        }, 3600);
    }

    // ==================== HALAMAN HADIAH ====================
    function renderPrizeScreen() {
        const prizeContainer = document.getElementById('prize-container');
        if (prizeContainer.querySelector('.prize-screen')) return; // sudah ada

        const prize = document.createElement('div');
        prize.className = 'prize-screen';
        prize.innerHTML = `
            <img class="prize-logo" src="${HADIAH.logo}" alt="Logo">
            <div class="prize-title">
                ALHAMDULILLAH<br>
                KAMU DAPAT HADIAH<br>
                <span class="prize-highlight">${HADIAH.nominal}</span>
            </div>
            <p class="prize-note">🎁 Selamat! Kamu menjawab semua soal dengan benar!</p>
            <button class="claim-btn" id="claim-btn">🎁 Klaim Hadiah</button>
            <button class="btn-retry retry-secondary" id="retry-btn-100" onclick="location.reload()">🔄 Ulangi Tes</button>
        `;
        prizeContainer.appendChild(prize);

        // Tombol klaim hadiah -> WhatsApp nomor tujuan
        prize.querySelector('#claim-btn').addEventListener('click', function() {
            const url = `https://wa.me/${HADIAH.waNumber}?text=${encodeURIComponent(HADIAH.waText)}`;
            window.open(url, '_blank');
        });

        // Scroll ke halaman hadiah
        setTimeout(() => prize.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);
    }

    function fireConfetti() {
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 5,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#ff9800', '#4caf50', '#00bcd4', '#3f51b5', '#9c27b0']
            });
            confetti({
                particleCount: 5,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#ff9800', '#4caf50', '#00bcd4', '#3f51b5', '#9c27b0']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    // Start Quiz
    window.onload = renderQuestion;
</script>
