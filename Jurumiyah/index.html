<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal - Syarah Jurumiyah Syeikh Utsaimin</title>
    <style>
        :root {
            --bg: #f8f5f0;
            --card-bg: #ffffff;
            --text: #3e3a35;
            --primary: #5b7b5e;
            --primary-hover: #4a6a4d;
            --gold: #b49450;
            --border: #e0d8cc;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 14px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', 'Amiri', serif;
            background: linear-gradient(170deg, #faf7f2 0%, #f1ece1 40%, #e8e0d3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-attachment: fixed;
        }

        /* Pola dekoratif latar belakang */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04;
            background-image:
                radial-gradient(circle at 20% 30%, #5b7b5e 1px, transparent 1px),
                radial-gradient(circle at 60% 70%, #b49450 1px, transparent 1px),
                radial-gradient(circle at 80% 20%, #5b7b5e 1px, transparent 1px),
                radial-gradient(circle at 40% 85%, #b49450 1px, transparent 1px);
            background-size: 80px 80px, 100px 100px, 90px 90px, 70px 70px;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow), 0 0 0 1px rgba(180, 148, 80, 0.08);
            padding: 40px 32px 36px;
            text-align: center;
            border: 1px solid var(--border);
        }

        /* Ornamen sudut */
        .container::before {
            content: '❦';
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: var(--gold);
            background: var(--card-bg);
            padding: 0 16px;
            line-height: 1;
        }

        .header-icon {
            font-size: 42px;
            margin-bottom: 8px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            color: #2c2a25;
            margin-bottom: 4px;
            letter-spacing: -0.01em;
            line-height: 1.4;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #7a6f5d;
            margin-bottom: 6px;
            font-style: italic;
            letter-spacing: 0.02em;
        }

        .divider {
            width: 70px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 16px auto 24px;
            border-radius: 1px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 13px 18px;
            background: linear-gradient(180deg, #ffffff 0%, #f9f7f3 100%);
            color: #3e3a35;
            text-decoration: none;
            border: 1.5px solid #d9d0bd;
            border-radius: 10px;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(91, 123, 94, 0.06) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 10px;
        }

        .btn:hover {
            background: linear-gradient(180deg, #f5f2ea 0%, #ede7d9 100%);
            border-color: var(--gold);
            color: #2c2a25;
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:active {
            transform: scale(0.97);
            transition: transform 0.1s ease;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .btn-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            font-size: 0.78rem;
            font-weight: 700;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .btn:hover .btn-number {
            background: #3f5a42;
            box-shadow: 0 2px 8px rgba(91, 123, 94, 0.35);
        }

        .closing {
            margin-top: 8px;
            color: #6b6252;
            font-size: 0.95rem;
            line-height: 1.7;
            font-style: italic;
        }

        .closing .dua {
            display: block;
            font-weight: 700;
            font-size: 1.15rem;
            color: #4a4030;
            margin-top: 2px;
            letter-spacing: 0.04em;
            font-style: normal;
        }

        .closing .aamiin {
            display: block;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary);
            margin-top: 4px;
            letter-spacing: 0.06em;
            font-style: normal;
            animation: pulseAamiin 2s ease-in-out infinite;
        }

        @keyframes pulseAamiin {
            0%,
            100% {
                opacity: 0.85;
            }
            50% {
                opacity: 1;
            }
        }

        /* Responsif */
        @media (max-width: 500px) {
            .container {
                padding: 30px 18px 28px;
                border-radius: 16px;
            }
            .container::before {
                font-size: 26px;
                top: -15px;
                padding: 0 12px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .button-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
            .btn {
                padding: 11px 12px;
                font-size: 0.85rem;
                border-radius: 8px;
            }
            .btn-number {
                width: 22px;
                height: 22px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 370px) {
            .button-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .btn {
                padding: 10px 8px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
