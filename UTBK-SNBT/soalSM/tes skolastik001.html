    soalData.push({ nomor:48, teks:"32 − 26 + 38 × 4 =", gambar:null, pilihan:["158","164","184","220","224"], jawaban:"A", pembahasan:"32-26=6, 38×4=152, 6+152=158" });
    soalData.push({ nomor:49, teks:"Setiap 2 jam minum 500 ml air & 3 cokelat. Hari ini minum 2000 ml. Berapa cokelat?", gambar:null, pilihan:["4","5","8","12","14"], jawaban:"D", pembahasan:"2000/500=4 sesi, 4×3=12 cokelat." });
    soalData.push({ nomor:50, teks:"Warna biru 1/6, merah 1/2, sisa hijau. Bagian hijau?", gambar:null, pilihan:["1/2","1/3","1/4","1/5","1/6"], jawaban:"B", pembahasan:"1 - 1/6 - 1/2 = 1/3." });
    
    // Soal gambar 51-60 (dengan link gambar)
    const gambarLinks = {
        51:"https://muin123-dr.github.io/Belajar/UTBK-SNBT/gbr/skl008.png",
        52:"https://muin123-dr.github.io/Belajar/UTBK-SNBT/gbr/skl009.png",
        53:"https://muin123-dr.github.io/Belajar/UTBK-SNBT/gbr/skl0010.png",
        54:"https://muin123-dr.github.io/Belajar/UTBK-SNBT/gbr/skl001.png",
        55:"https://muin123-dr.github.io/Belajar/UTBK-SNBT/gbr/skl002.png",
        56:"https://muin123-dr.github.io/Belajar/UTBK-SNBT/gbr/skl003.png",
        57:"https://muin123-dr.github.io/Belajar/UTBK-SNBT/gbr/skl004.png",
        58:"https://muin123-dr.github.io/Belajar/UTBK-SNBT/gbr/skl005.png",
        59:"https://muin123-dr.github.io/Belajar/UTBK-SNBT/gbr/skl006.png",
        60:"https://muin123-dr.github.io/Belajar/UTBK-SNBT/gbr/skl007.png"
    };
    const jawabanGambar = {51:"D",52:"B",53:"D",54:"D",55:"B",56:"A",57:"E",58:"B",59:"A",60:"B"};
    const pembahasanGambar = {
        51:"Opsi D memiliki arsiran tegak, berbeda dari yang lain.",
        52:"Opsi B hanya memiliki satu arsiran.",
        53:"Opsi D tidak memiliki sudut.",
        54:"Jika opsi D diputar, posisi putih terletak di bawah, berbeda.",
        55:"Kotak berikutnya adalah opsi B.",
        56:"Gambar berikutnya adalah opsi A.",
        57:"Lanjutan gambar yang tepat adalah opsi E.",
        58:"Lanjutan gambar yang tepat adalah opsi B.",
        59:"Gambar tepat untuk mengisi bagian kosong adalah A.",
        60:"Gambar tepat untuk mengisi bagian kosong adalah B."
    };
    
    // Perubahan: untuk nomor 51-54, teks soal diganti menjadi "Pilihlah gambar yang paling berbeda!"
    for (let i=51; i<=60; i++) {
        let teksSoal;
        if (i >= 51 && i <= 54) {
            teksSoal = "Pilihlah gambar yang paling berbeda!";
        } else {
            teksSoal = `Pilih jawaban yang tepat berdasarkan gambar di bawah. (Soal nomor ${i})`;
        }
        soalData.push({
            nomor:i,
            teks:teksSoal,
            gambar:gambarLinks[i],
            pilihan:["A","B","C","D","E"],
            jawaban:jawabanGambar[i],
            pembahasan:pembahasanGambar[i]
        });
    }
    
    // Render semua soal ke dalam div
    const container = document.getElementById("soal-list");
    function renderSoal() {
        container.innerHTML = "";
        soalData.forEach(soal => {
            const card = document.createElement("div");
            card.className = "card";
            card.id = `soal-${soal.nomor}`;
            // nomor
            const nomorSpan = document.createElement("div");
            nomorSpan.className = "soal-nomor";
            nomorSpan.innerText = `Soal ${soal.nomor}`;
            card.appendChild(nomorSpan);
            // teks soal
            const teksDiv = document.createElement("div");
            teksDiv.className = "soal-teks";
            teksDiv.innerText = soal.teks;
            card.appendChild(teksDiv);
            // gambar jika ada
            if (soal.gambar) {
                const imgDiv = document.createElement("div");
                imgDiv.className = "soal-gambar";
                const img = document.createElement("img");
                img.src = soal.gambar;
                img.alt = `Gambar soal ${soal.nomor}`;
                img.loading = "lazy";
                imgDiv.appendChild(img);
                card.appendChild(imgDiv);
            }
            // options
            const optionsDiv = document.createElement("div");
            optionsDiv.className = "options";
            const nameAttr = `q${soal.nomor}`;
            soal.pilihan.forEach((pil, idx) => {
                const letter = String.fromCharCode(65+idx); // A,B,C,D,E
                const optionDiv = document.createElement("div");
                optionDiv.className = "option";
                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = nameAttr;
                radio.value = letter;
                const label = document.createElement("label");
                label.innerText = `${letter}. ${pil}`;
                optionDiv.appendChild(radio);
                optionDiv.appendChild(label);
                optionsDiv.appendChild(optionDiv);
            });
            card.appendChild(optionsDiv);
            // button group
            const btnGroup = document.createElement("div");
            btnGroup.className = "btn-group";
            const checkBtn = document.createElement("button");
            checkBtn.innerText = "✅ Cek Jawaban";
            checkBtn.classList.add("check-btn");
            const pembahasanBtn = document.createElement("button");
            pembahasanBtn.innerText = "📖 Pembahasan";
            pembahasanBtn.classList.add("pembahasan-btn");
            btnGroup.appendChild(checkBtn);
            btnGroup.appendChild(pembahasanBtn);
            card.appendChild(btnGroup);
            // feedback area
            const feedbackDiv = document.createElement("div");
            feedbackDiv.className = "feedback";
            const pembahasanDiv = document.createElement("div");
            pembahasanDiv.className = "pembahasan-text";
            pembahasanDiv.innerHTML = `<strong>📘 Pembahasan:</strong> ${soal.pembahasan}`;
            card.appendChild(feedbackDiv);
            card.appendChild(pembahasanDiv);
            // event listeners
            checkBtn.addEventListener("click", () => {
                const selected = document.querySelector(`input[name="${nameAttr}"]:checked`);
                if (!selected) {
                    feedbackDiv.innerHTML = "⚠️ Pilih jawaban terlebih dahulu!";
                    feedbackDiv.classList.add("show");
                    feedbackDiv.classList.remove("correct","wrong");
                    return;
                }
                const jawabanUser = selected.value;
                const benar = (jawabanUser === soal.jawaban);
                if (benar) {
                    feedbackDiv.innerHTML = "✅ Jawaban Anda BENAR!";
                    feedbackDiv.classList.add("correct","show");
                    feedbackDiv.classList.remove("wrong");
                } else {
                    feedbackDiv.innerHTML = `❌ Jawaban Anda SALAH. Jawaban benar: ${soal.jawaban}.`;
                    feedbackDiv.classList.add("wrong","show");
                    feedbackDiv.classList.remove("correct");
                }
            });
            pembahasanBtn.addEventListener("click", () => {
                pembahasanDiv.classList.toggle("show");
                if (pembahasanDiv.classList.contains("show")) {
                    pembahasanBtn.innerText = "🙈 Tutup Pembahasan";
                } else {
                    pembahasanBtn.innerText = "📖 Pembahasan";
                }
            });
            container.appendChild(card);
        });
    }
    renderSoal();
</script>
</body>
</html>
