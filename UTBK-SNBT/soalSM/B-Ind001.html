            teks: "Berdasarkan informasi pada teks (soal mandiri): tarif parkir mobil 2 jam pertama Rp2.000, selanjutnya per jam. Jika uang Rp6.500 dapat parkir selama lima jam, maka tarif parkir setelah 2 jam pertama adalah...",
            pilihan: {
                A: "Rp500,00",
                B: "Rp1.000,00",
                C: "Rp1.500,00",
                D: "Rp2.000,00",
                E: "Rp2.500,00"
            },
            jawaban: "C",
            pembahasan: "Biaya 2 jam pertama = Rp2.000. Sisa 3 jam = Rp6.500 - Rp2.000 = Rp4.500. Tarif per jam = Rp4.500 / 3 = Rp1.500."
        }
    ];

    // Render seluruh soal ke DOM
    const container = document.getElementById("quizContainer");
    function renderQuiz() {
        let html = '';
        soalData.forEach((soal, idx) => {
            const nomor = idx + 1;
            html += `<div class="soal-card" data-soal-idx="${idx}">`;
            html += `<div class="soal-nomor">Soal ${nomor}</div>`;
            html += `<div class="soal-teks">${soal.teks}</div>`;
            // Jika ada gambar, tampilkan
            if (soal.gambar) {
                html += `<div class="gambar-soal">
                            <img src="${soal.gambar}" alt="Grafik telur ayam ras" onerror="this.onerror=null; this.src=''; this.alt='Gambar tidak dapat dimuat';">
                         </div>`;
            }
            html += `<div class="options">`;
            const letters = ['A', 'B', 'C', 'D', 'E'];
            letters.forEach(letter => {
                const optionText = soal.pilihan[letter];
                if (optionText) {
                    html += `<div class="option">
                                <input type="radio" name="q${nomor}" value="${letter}" id="q${nomor}_${letter}">
                                <label for="q${nomor}_${letter}"><strong>${letter}.</strong> ${optionText}</label>
                             </div>`;
                }
            });
            html += `</div></div>`;
        });
        container.innerHTML = html;
    }

    renderQuiz();

    // Ambil jawaban user & hitung skor
    const submitBtn = document.getElementById("submitBtn");
    const scoreDiv = document.getElementById("scoreDisplay");
    const discussionBtn = document.getElementById("showDiscussionBtn");
    const discussionPanel = document.getElementById("discussionPanel");

    let currentScore = null;

    function calculateScore() {
        let correct = 0;
        for (let i = 0; i < soalData.length; i++) {
            const nomor = i + 1;
            const selected = document.querySelector(`input[name="q${nomor}"]:checked`);
            if (selected && selected.value === soalData[i].jawaban) {
                correct++;
            }
        }
        return correct;
    }

    submitBtn.addEventListener("click", () => {
        const correctCount = calculateScore();
        const total = soalData.length;
        const scoreValue = (correctCount / total) * 100;
        currentScore = scoreValue;
        scoreDiv.style.display = "block";
        scoreDiv.innerHTML = `🎯 SKOR ANDA: ${Math.round(scoreValue)} / 100  (${correctCount} dari ${total} soal benar) 🎯`;
        // Aktifkan tombol pembahasan
        discussionBtn.disabled = false;
        // Sembunyikan pembahasan lama saat submit ulang
        discussionPanel.style.display = "none";
        // Scroll ke score
        scoreDiv.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    // Tampilkan pembahasan lengkap
    function showFullDiscussion() {
        if (currentScore === null && calculateScore() === 0) {
            // jika belum kumpul, beri peringatan tapi tetap bisa tampilkan? lebih baik minta kumpul dulu
            alert("Silakan klik 'Selesai dan Kumpulkan' terlebih dahulu untuk melihat skor, kemudian pembahasan bisa diakses.");
            return;
        }
        let discussionHtml = `<div class="pembahasan-title">📚 Pembahasan Lengkap Soal</div>
                              <div class="pembahasan-list">`;
        for (let i = 0; i < soalData.length; i++) {
            const soal = soalData[i];
            const nomor = i + 1;
            const userSelected = document.querySelector(`input[name="q${nomor}"]:checked`);
            const userAnswer = userSelected ? userSelected.value : "(tidak dijawab)";
            const correctAnswer = soal.jawaban;
            const isCorrect = (userAnswer === correctAnswer);
            const statusIcon = isCorrect ? "✅" : "❌";
            discussionHtml += `<div class="pembahasan-item">
                                <strong>${statusIcon} Soal ${nomor}</strong> <br>
                                <span style="font-size:0.85rem">Jawaban Anda: ${userAnswer} | Kunci: ${correctAnswer}</span>
                                <p style="margin-top: 8px; color: #2c3e2f;">📖 ${soal.pembahasan}</p>
                               </div>`;
        }
        discussionHtml += `</div>`;
        discussionPanel.innerHTML = discussionHtml;
        discussionPanel.style.display = "block";
        discussionPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    discussionBtn.addEventListener("click", showFullDiscussion);
</script>
</body>
</html>
