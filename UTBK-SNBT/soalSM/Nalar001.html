<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Tes Kemampuan Penalaran (Visual) - Paket 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: auto;
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #5f6368;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            background: #e8f0fe;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-weight: bold;
            border: 1px solid #d2e3fc;
        }
        .timer {
            color: #d93025;
            font-size: 1.2em;
        }
        .section-title {
            background: #f8f9fa;
            padding: 10px 15px;
            border-left: 5px solid #1a73e8;
            margin: 40px 0 20px 0;
            font-weight: bold;
            font-size: 1.2em;
        }
        .question {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
        }
        .question-text {
            font-size: 1.15em;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .context-text {
            background: #fdf6e3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-style: italic;
            border: 1px solid #eee8d5;
        }
        .figural-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }
        .fig-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .fig-label { font-size: 0.9em; color: #666; font-weight: bold; }
        .fig-svg { background: white; border: 1px solid #ccc; border-radius: 4px; }
        .options {
            display: grid;
            gap: 12px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: #fff;
        }
        .option:hover {
            background-color: #f1f3f4;
            border-color: #1a73e8;
        }
        .option.selected {
            background-color: #e8f0fe;
            color: #1967d2;
            border-color: #1a73e8;
            font-weight: bold;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.3s, transform 0.2s;
        }
        .btn:hover {
            background-color: #174ea6;
            transform: translateY(-2px);
        }
        #result-screen {
            display: none;
            text-align: center;
            padding: 40px 0;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            line-height: 150px;
            border-radius: 50%;
            background: #fbbc04;
            color: #fff;
            font-size: 3em;
            margin: 30px auto;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(251, 188, 4, 0.4);
        }
        .pembahasan-container {
            display: none;
            margin-top: 40px;
            text-align: left;
        }
        .pembahasan-item {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        .pembahasan-item.correct { border-left: 6px solid #34a853; }
        .pembahasan-item.wrong { border-left: 6px solid #ea4335; }
        .hidden { display: none; }
        svg { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-header">

        <div class="info-bar">
            <span>Waktu: 15 Menit</span>
            <span class="timer" id="timer">Sisa Waktu: 15:00</span>

    </div>

    <div id="quiz-content">
        <!-- Questions injected by JS -->
    </div>

    <button id="submit-btn" class="btn" onclick="submitQuiz()">Selesai dan Kumpulkan</button>

    <div id="result-screen">

        <button class="btn" onclick="showPembahasan()">Lihat Pembahasan Lengkap</button>
    </div>

    <div id="pembahasan" class="pembahasan-container">
        <h2 style="border-bottom: 2px solid #1a73e8; padding-bottom: 10px;">Pembahasan Soal</h2>
        <div id="pembahasan-list"></div>
    </div>
</div>

    const questions = [
        // ... (Logical and Analytical questions remain the same as previous version)
        {
            section: "PENALARAN LOGIS",
            q: "Semua siswa rajin belajar akan lulus ujian. Beberapa siswa yang lulus ujian mendapatkan beasiswa.",
            options: ["Semua siswa rajin belajar mendapatkan beasiswa.", "Beberapa siswa rajin belajar mendapatkan beasiswa.", "Beberapa siswa yang tidak rajin belajar mendapatkan beasiswa.", "Semua siswa yang mendapatkan beasiswa adalah siswa rajin belajar.", "Tidak dapat ditarik kesimpulan."],

            answer: 0,

        },
        {
            q: "Sebagian mahasiswa adalah aktivis. Semua aktivis adalah orator yang baik.",
            options: ["Semua mahasiswa adalah orator yang baik.", "Sebagian mahasiswa adalah orator yang baik.", "Semua orator yang baik adalah mahasiswa.", "Sebagian orator yang baik bukan mahasiswa.", "Tidak dapat ditarik kesimpulan."],
            answer: 1,
            explanation: "Karena sebagian mahasiswa adalah aktivis, dan aktivis pasti orator, maka sebagian mahasiswa itu adalah orator."
        },
        {
            q: "Tidak ada ikan yang bisa berbicara. Lumba-lumba bukan ikan.",
            options: ["Lumba-lumba bisa berbicara.", "Lumba-lumba tidak bisa berbicara.", "Beberapa lumba-lumba bisa berbicara.", "Lumba-lumba mungkin bisa berbicara.", "Tidak dapat ditarik kesimpulan."],
            answer: 3,

    let userAnswers = new Array(questions.length).fill(null);
    let timeLeft = 15 * 60;
    let timerInterval;

    function initQuiz() {
        const quizContent = document.getElementById('quiz-content');
        let currentSection = "";

        questions.forEach((q, index) => {
            if (q.section && q.section !== currentSection) {
                currentSection = q.section;
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section-title';
                sectionDiv.innerText = currentSection;
                quizContent.appendChild(sectionDiv);
            }

            const questionDiv = document.createElement('div');
            questionDiv.className = 'question';
            
            let html = '';
            if (q.context) html += `<div class="context-text">${q.context}</div>`;
            html += `<div class="question-text">${index + 1}. ${q.q}</div>`;
            
            if (q.isFigural) {
                html += `<div class="figural-container">
                    <div class="fig-box"><span class="fig-label">Gbr 1</span>${q.visuals[0]}</div>
                    <div style="font-size: 2em;">:</div>
                    <div class="fig-box"><span class="fig-label">Gbr 2</span>${q.visuals[1]}</div>
                    <div style="font-size: 2em; margin: 0 10px;">=</div>
                    <div class="fig-box"><span class="fig-label">Gbr 3</span>${q.visuals[2]}</div>
                    <div style="font-size: 2em;">:</div>
                    <div class="fig-box"><span class="fig-label">Gbr 4</span><div class="fig-svg" style="width:80px; height:80px; display:flex; align-items:center; justify-content:center; font-size:2em; font-weight:bold; color:#1a73e8;">?</div></div>
                </div>`;
            }

            html += `<div class="options">`;
            q.options.forEach((opt, optIndex) => {
                const label = String.fromCharCode(65 + optIndex);
                html += `<div class="option" onclick="selectOption(${index}, ${optIndex})" id="q${index}-o${optIndex}">
                    <span style="min-width:25px; font-weight:bold;">${label}.</span>
                    <div style="display:flex; align-items:center; gap:10px;">${opt}</div>
                </div>`;
            });
            html += `</div>`;
            
            questionDiv.innerHTML = html;
            quizContent.appendChild(questionDiv);
        });
        startTimer();
    }

    function selectOption(qIndex, optIndex) {
        userAnswers[qIndex] = optIndex;
        for (let i = 0; i < 5; i++) {
            const el = document.getElementById(`q${qIndex}-o${i}`);
            if (el) el.classList.remove('selected');
        }
        document.getElementById(`q${qIndex}-o${optIndex}`).classList.add('selected');
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            const min = Math.floor(timeLeft / 60);
            const sec = timeLeft % 60;
            document.getElementById('timer').innerText = `Sisa Waktu: ${min}:${sec < 10 ? '0' : ''}${sec}`;
            if (timeLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
        }, 1000);
    }

    function submitQuiz() {
        clearInterval(timerInterval);
        let correct = 0;
        userAnswers.forEach((ans, i) => { if (ans === questions[i].answer) correct++; });
        document.getElementById('score-display').innerText = Math.round((correct / questions.length) * 100);
        document.getElementById('quiz-header').classList.add('hidden');
        document.getElementById('quiz-content').classList.add('hidden');
        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('result-screen').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function showPembahasan() {
        const list = document.getElementById('pembahasan-list');
        list.innerHTML = '';
        questions.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.answer;
            const item = document.createElement('div');
            item.className = `pembahasan-item ${isCorrect ? 'correct' : 'wrong'}`;
            const userAns = userAnswers[i] !== null ? String.fromCharCode(65 + userAnswers[i]) : '---';
            item.innerHTML = `
                <p><strong>Soal ${i + 1}:</strong> ${q.q}</p>
                <p>Jawaban Anda: <strong>${userAns}</strong> ${isCorrect ? '[BENAR]' : '[SALAH]'}</p>
                <p>Kunci: <strong>${String.fromCharCode(65 + q.answer)}</strong></p>
                <p><strong>Penjelasan:</strong> ${q.explanation}</p>
            `;
            list.appendChild(item);
        });
        document.getElementById('pembahasan').style.display = 'block';
        window.scrollTo(0, document.getElementById('pembahasan').offsetTop);
    }
    window.onload = initQuiz;
</script>
</body>
